ost liczby osób mających możliwość zgłoszenia potrzeb i udziału w porównaniu ze scenariuszem A0.","feedback":"To przyrost rezultatu według wspólnej definicji możliwości. Mniejszy koszt jednostki dodatniego efektu jest pożądany."}],"hint":"Porównaj cel pytania z zakresem każdej odpowiedzi. Ustal, co mierzy lub zakłada każda propozycja."},"third":{"title":"Kryterium: równość możliwości osób z ograniczoną mobilnością i pozostałych. Który miernik zastosujesz?","correct":"b","options":[{"id":"a","text":"Minimalizować bezwzględną różnicę odsetka głosujących między mieszkańcami z ograniczoną mobilnością i pozostałymi.","feedback":"Frekwencja zależy od możliwości, zainteresowania i decyzji o udziale. Nie jest bezpośrednią miarą różnicy samych możliwości."},{"id":"b","text":"Minimalizować bezwzględną różnicę odsetka osób z możliwością udziału między mieszkańcami z ograniczoną mobilnością i pozostałymi.","feedback":"Luka możliwości wymaga tej samej definicji dla obu grup. Sprawdzaj również poziom dostępu, aby zmniejszenie luki nie wynikało z pogorszenia."},{"id":"c","text":"Minimalizować bezwzględną różnicę liczby osób z możliwością udziału między mieszkańcami z ograniczoną mobilnością i pozostałymi.","feedback":"Równa liczba przy różnej wielkości grup nie oznacza równości możliwości. Potrzebne są udziały w odpowiednich populacjach."}],"hint":"Porównaj cel pytania z zakresem każdej odpowiedzi. Ustal, co mierzy lub zakłada każda propozycja."},"revision":{"title":"Który element projektu najlepiej odpowiada wskazanym w nowej wiadomości barierom udziału?","correct":"c","options":[{"id":"a","text":"Rozszerzenie liczby wysyłanych instrukcji oraz zwiększenie częstotliwości przypominania terminów głosowania mieszkańcom objętym działaniem.","feedback":"To odpowiada niewiedzy o zasadach i terminach. Wiadomość wskazuje także wiarygodność realizacji i dostępność pomocy."},{"id":"b","text":"Zwiększenie liczby kanałów publikacji zasad oraz ujednolicenie treści komunikatów kierowanych do mieszkańców objętych działaniem.","feedback":"To może poprawiać komunikację zasad, ale nie odpowiada wprost obu ujawnionym barierom."},{"id":"c","text":"Wyjaśnienie stanu realizacji wcześniejszych projektów oraz zapewnienie dostępnego miejsca pomocy mieszkańcom objętym działaniem.","feedback":"To odpowiada wiarygodności realizacji i dostępności pomocy. Zakres i efekt nadal wymagają sprawdzenia."}],"hint":"Porównaj cel pytania z zakresem każdej odpowiedzi. Ustal, co mierzy lub zakłada każda propozycja."},"constraint":{"title":"Która propozycja mieści się w zakresie pilotażu CKS?","correct":"a","options":[{"id":"a","text":"Uruchomienie uzgodnionych z dzielnicami dyżurów pomocy oraz informacji o realizacji projektów wybranych wcześniej przez mieszkańców.","feedback":"To wsparcie i koordynacja w przyjętym mandacie, bez ustanawiania innych zasad głosowania."},{"id":"b","text":"Uruchomienie dodatkowego tygodnia głosowania dla mieszkańców, którzy potrzebują osobistej pomocy przy dokonaniu wyboru projektów.","feedback":"Wydłużenie terminu dla części osób zmienia zasady głosowania. Rozpoznana bariera nie rozszerza mandatu pilotażu."},{"id":"c","text":"Uruchomienie osobnego głosowania dla słabiej reprezentowanych mieszkańców z wydzieloną pulą środków na wybrane projekty.","feedback":"Wydzielenie głosowania i puli zmienia zasady procesu. Taki pomysł wymaga odrębnej propozycji i właściwych decyzji."}],"hint":"Porównaj cel pytania z zakresem każdej odpowiedzi. Ustal, co mierzy lub zakłada każda propozycja."}}},"BO_b":{"task":"Przygotuj sposoby usprawnienia realizacji projektów przydzielonych dzielnicy, ze szczególnym uwzględnieniem etapów przed podpisaniem umowy.","horizon":"realizacja jednej kolejnej edycji","baseline":"Obecne harmonogramy, podział odpowiedzialności i rozpoczęte uzgodnienia projektów.","trend":"Czas uzgodnień, dostępność wykonawców i koszty realizacji mogą zmieniać się także przy obecnej organizacji.","options":[["early","Wczesny przegląd zakresu i zależności projektu","Rozpoznanie niejasnego zakresu lub prawa do terenu może ujawnić przeszkody przed planowaną umową."],["owner","Koordynator z terminami uzgodnień","Jawna odpowiedzialność i harmonogram zależności mogą ograniczać oczekiwanie między jednostkami."],["track","Monitoring etapów z informacją dla autorów","Widoczny stan spraw i opóźnień może ułatwić reakcję i rozliczalność."],["package","Przegląd przygotowania z koordynacją uzgodnień","Pakiet łączy rozpoznanie przeszkód z organizacją ich rozwiązywania."]],"scale":["Pilotaż dla sześciu projektów","Pilotaż dla dwunastu projektów"],"newInfo":"W planie kolejnej edycji cztery z sześciu projektów wymagają uzgodnień z innymi jednostkami. W dwóch harmonogram zakłada ich odpowiedź przed terminem, którego te jednostki nie potwierdziły. Nie ustalono jeszcze terminów dla wszystkich zależności.","limit":"Pilotaż może zmieniać koordynację i harmonogramowanie, lecz nie może pomijać wymaganych uzgodnień ani ograniczać wybranego zakresu projektu wyłącznie dla poprawy terminowości.","adaptations":["Dodać wcześniejsze uzgodnienie zakresu projektu","Dodać harmonogram zależności z innymi jednostkami","Zachować projekt i sprawdzić jego zakres"],"criteria":["Terminowość rezultatu: maksymalizować odsetek projektów oddanych do użytkowania w uzgodnionym zakresie do pierwotnie przyjętego terminu.","Efektywność kosztowa: minimalizować dodatkowy koszt na dodatkowy projekt oddany w terminie i uzgodnionym zakresie względem A0.","Rozliczalność: maksymalizować odsetek projektów z aktualną i zrozumiałą informacją o etapie, przyczynie opóźnienia oraz odpowiedzialności za kolejny krok."],"questions":{"scope":{"title":"Który rezultat odpowiada zleceniu burmistrza dzielnicy?","correct":"b","options":[{"id":"a","text":"Większa liczba mieszkańców uczestniczących w głosowaniu nad projektami kolejnej edycji budżetu obywatelskiego.","feedback":"To inny problem: uczestnictwo w wyborze, a nie realizacja przydzielonych projektów."},{"id":"b","text":"Więcej wybranych projektów dostępnych do użytkowania w uzgodnionym zakresie i planowanym terminie.","feedback":"To rezultat dla mieszkańców. Podpisanie umowy lub przesunięcie harmonogramu go nie zastępuje."},{"id":"c","text":"Krótsze przygotowanie umów wykonawczych przy zachowaniu dotychczasowej terminowości oddania projektów do użytkowania.","feedback":"Umowa jest etapem wymagającym usprawnienia, lecz docelowym rezultatem jest dostępny projekt w uzgodnionym zakresie i terminie."}],"hint":"Porównaj cel pytania z zakresem każdej odpowiedzi. Ustal, co mierzy lub zakłada każda propozycja."},"effect":{"title":"Kryterium: terminowe udostępnienie uzgodnionego projektu. Który miernik zastosujesz?","correct":"c","options":[{"id":"a","text":"Maksymalizować odsetek projektów oddanych do użytkowania w uzgodnionym zakresie do ostatnio zaktualizowanego terminu realizacji.","feedback":"Aktualizacja terminu jest użyteczna w zarządzaniu, lecz nie zachowuje pierwotnego punktu odniesienia. Samo przesunięcie daty mogłoby poprawić wynik."},{"id":"b","text":"Maksymalizować odsetek projektów z podpisaną umową na uzgodniony zakres do pierwotnie przyjętego terminu realizacji.","feedback":"To miernik ważnego etapu, a nie oddania projektu mieszkańcom. Pozostaje do sprawdzenia wykonanie umowy i udostępnienie rezultatu."},{"id":"c","text":"Maksymalizować odsetek projektów oddanych do użytkowania w uzgodnionym zakresie do pierwotnie przyjętego terminu realizacji.","feedback":"Zachowane są rezultat, zakres i wspólny punkt odniesienia. Uzasadnione aktualizacje harmonogramu można opisywać dodatkowo."}],"hint":"Porównaj cel pytania z zakresem każdej odpowiedzi. Ustal, co mierzy lub zakłada każda propozycja."},"cost":{"title":"Liczysz dodatkowy koszt realizacji względem A0. Który mianownik odpowiada terminowemu rezultatowi, przy wspólnym okresie i porównywalnej złożoności projektów?","correct":"a","options":[{"id":"a","text":"Przyrost liczby projektów oddanych w uzgodnionym zakresie do pierwotnego terminu, w porównaniu ze scenariuszem A0.","feedback":"To dodatkowy rezultat spełniający warunek zakresu i stałego terminu. Złożoność projektów trzeba uwzględnić w interpretacji kosztu jednostki."},{"id":"b","text":"Liczba projektów oddanych w uzgodnionym zakresie do pierwotnego terminu, osiągnięta w ocenianej alternatywie.","feedback":"Łączna liczba obejmuje też projekty oddane w A0. Nie jest liczbą dodatkowych terminowych realizacji."},{"id":"c","text":"Przyrost liczby projektów oddanych w uzgodnionym zakresie do zaktualizowanego terminu, w porównaniu ze scenariuszem A0.","feedback":"Zmiana terminu zmienia jednostkę rezultatu. Pozorne polepszenie wskaźnika może wynikać z aktualizacji harmonogramu, nie szybszej realizacji."}],"hint":"Porównaj cel pytania z zakresem każdej odpowiedzi. Ustal, co mierzy lub zakłada każda propozycja."},"third":{"title":"Kryterium: rozliczalność wobec autorów i mieszkańców. Który miernik najlepiej odpowiada temu kryterium?","correct":"b","options":[{"id":"a","text":"Maksymalizować odsetek projektów z regularną informacją o postępach i terminie, publikowaną co miesiąc w trakcie realizacji.","feedback":"Regularność i termin nie zapewniają informacji o przeszkodzie oraz odpowiedzialności za następny krok. To niepełny zakres rozliczalności."},{"id":"b","text":"Maksymalizować odsetek projektów z aktualną, zrozumiałą informacją o etapie, przeszkodzie i odpowiedzialnym za kolejny krok.","feedback":"Treść pozwala ustalić stan sprawy i odpowiedzialność. Dla projektu bez opóźnienia jawnie zaznacz brak przeszkody zamiast wymagać jej istnienia."},{"id":"c","text":"Maksymalizować odsetek projektów z aktualną informacją o etapie i przeszkodzie, przesłaną autorowi po złożeniu zapytania.","feedback":"Odpowiedź wyłącznie po zapytaniu nie daje pozostałym mieszkańcom stałej informacji i nie wskazuje odpowiedzialności za kolejny krok."}],"hint":"Porównaj cel pytania z zakresem każdej odpowiedzi. Ustal, co mierzy lub zakłada każda propozycja."},"revision":{"title":"Który element projektu najlepiej odpowiada nowej wiadomości o zależnościach realizacji?","correct":"a","options":[{"id":"a","text":"Uzgodnienie terminów z odpowiedzialnymi jednostkami oraz wskazanie zależności przed przyjęciem harmonogramu realizacji projektów.","feedback":"To odpowiada niepotwierdzonym terminom zewnętrznych uzgodnień. Sam plan wewnętrzny nie zapewnia ich wykonania."},{"id":"b","text":"Zwiększenie częstotliwości raportowania wykonawców oraz wskazanie terminów odbioru robót w harmonogramie realizacji projektów.","feedback":"To dotyczy wykonania po umowie; nie rozwiązuje ujawnionej niepewności terminów uzgodnień innych jednostek."},{"id":"c","text":"Ujednolicenie opisów projektów dla mieszkańców oraz wskazanie dat publikacji komunikatów w harmonogramie realizacji projektów.","feedback":"To poprawa informacji. Nie zastępuje uzgodnienia terminów, od których zależy realizacja."}],"hint":"Porównaj cel pytania z zakresem każdej odpowiedzi. Ustal, co mierzy lub zakłada każda propozycja."},"constraint":{"title":"Która propozycja respektuje podane warunki usprawnienia?","correct":"c","options":[{"id":"a","text":"Przesunięcie części wybranych prac do kolejnej edycji oraz rozliczenie obecnego projektu według mniejszego zakresu.","feedback":"Rozliczenie okrojonego projektu zmienia zakres wybrany przez mieszkańców, żeby poprawić terminowość. Narusza warunek zlecenia."},{"id":"b","text":"Przesunięcie uzgodnień dotyczących terenu na etap odbioru oraz rozpoczęcie robót według przygotowanej dokumentacji projektu.","feedback":"Przeniesienie wymaganych uzgodnień na odbiór nie pozwala oprzeć rozpoczęcia robót na ich wyniku."},{"id":"c","text":"Przesunięcie przeglądu dokumentacji na początek przygotowania oraz uzgodnienie terminów odpowiedzi jednostek przed planowanym rozpoczęciem robót.","feedback":"Zmienia się kolejność przygotowania i koordynacja, a nie zakres projektu czy wymagania uzgodnień."}],"hint":"Porównaj cel pytania z zakresem każdej odpowiedzi. Ustal, co mierzy lub zakłada każda propozycja."}}}},"measurementNotes":{"GPA_a":"Standard z poprzedniej gry: potrzebny dojazd i powrót, do 60 minut w jedną stronę i koszt do 10% dziennego dochodu. To umowa ćwiczenia. Jednostka dostępności to podróż, a jednostka efektu w kryterium kosztowym to osoba; tej samej osoby nie liczymy wielokrotnie.","GPA_b":"Prognozy porównujemy przy tej samej dacie przygotowania i tych samych jednostkach pieniężnych. Średni błąd bezwzględny liczymy z porównywalnego zestawu kwartałów; błędy ze znakiem nie mogą się wzajemnie znosić.","CP_a":"Poziom T jest umowny. Model PM2,5 obejmuje mieszkańców gminy, także nieuczestniczących w programie. Te same sezony i założenia modelu stosujemy do A0, A1 i A2 w trzyletnim horyzoncie.","CP_b":"Próg 30 dni jest umowny. Mianownik obejmuje sprawy z danego okresu wpływu, dla których minęło co najmniej 30 dni obserwacji. Licznik obejmuje zakończone po progu i nadal otwarte po progu. Nowsze sprawy analizujemy osobno, zamiast liczyć je jako terminowe.","BK2_a":"Grupę docelową, standard nadmiernego obciążenia i sposób liczenia dochodu oraz wydatków ustalamy przed porównaniem. Poprawę sytuacji i jej podział odnosimy do A0. Mniejszą lukę oceniamy łącznie z poprawą dostępności, aby nie wyrównywać przez pogorszenie.","BK2_b":"Próg 12 miesięcy jest umowny. Porównujemy gospodarstwa z tego samego okresu wpisania na listę i z co najmniej roczną obserwacją. Liczymy przekroczenia przy późnych przydziałach oraz w sprawach nadal otwartych. Odpowiedniość lokalu wynika z jawnie ustalonych potrzeb.","SCT_a":"Poziom T jest umowny. Model NO₂ obejmuje mieszkańców ulic wewnątrz strefy i poza nią, przy wspólnych okresach i założeniach. Spadek ruchu lub średniego stężenia nie jest tożsamy ze spadkiem liczby mieszkańców ponad T.","SCT_b":"Próg 10 dni jest umowny. Czas liczymy od pierwszego złożenia; mianownik to sprawy z tego samego okresu wpływu z co najmniej dziesięciodniową obserwacją. Liczymy późno zakończone i nadal otwarte. Osobno mierzymy możliwość złożenia wniosku wśród podejmujących próbę osób z barierą cyfrową.","BO_a":"Możliwość udziału obejmuje zgłoszenie potrzeby i przewidziane sposoby uczestnictwa. Nie wymaga faktycznego oddania głosu. Lukę między grupami liczymy jako wartość bezwzględną różnicy udziałów i czytamy razem z ich poziomem.","BO_b":"Termin oznacza datę przyjętą przed porównaniem, a zakres uzgodniony projekt dostępny do użytkowania. Aktualizacje harmonogramu opisujemy osobno. Informacja o projekcie bez opóźnienia powinna jawnie wskazywać ten stan zamiast fikcyjnej przeszkody."},"costNote":"Efektywność kosztowa odnosi dodatkowe koszty do dodatkowego rezultatu względem A0 w tym samym okresie. Uwzględnij wskazany zakres kosztów instytucji i odbiorców, bez podwójnego liczenia transferów. Przy dodatnim przyroście efektu niższy koszt jego jednostki jest pożądany. Dla A0 nie licz 0/0; zerowy lub ujemny przyrost efektu wymaga osobnego omówienia.","revision":"2.1.0"};</script><script>window.B34ContentV22={"common":{"evidence":{"title":"Bardach opisuje alternatywy przed kryteriami, a Patton, Sawicki i Clark odwrotnie. Zespół zna cel klienta i limit zasobów, lecz odkrywa ważny skutek nieobjęty kryteriami. Który plan pracy jest uzasadniony?","correct":"c","options":[{"id":"a","text":"Zbudować listę działań na podstawie mechanizmów, a znane cele i limit wprowadzić przy porównaniu ich przewidywanych skutków.","feedback":"Znane cele i wiążący limit są istotne już przy tworzeniu działań. Numeracja kroków Bardacha nie uzasadnia odłożenia tych ustaleń do późniejszej oceny."},{"id":"b","text":"Wyprowadzić kryteria ze znanych celów i limitu, a odkryty skutek opisać przy działaniach według ustalonego wcześniej zestawu.","feedback":"Wcześniejsze ustalenie kryteriów jest dopuszczalne. W tym przypadku zestaw pomija jednak ważny skutek. Sam opis przy działaniach nie uzupełnia wspólnej podstawy ich oceny."},{"id":"c","text":"Uwzględnić znane cele i limit w projektowaniu działań, a odkryty skutek wykorzystać do przeglądu wspólnych kryteriów oceny.","feedback":"Znane wartości i warunki pomagają tworzyć alternatywy. Nowy skutek może wymagać rewizji kryteriów dla wszystkich opcji. Bardach dopuszcza zmianę kolejności i powroty między krokami."}],"hint":"Oddziel warunki znane od początku od ustaleń powstałych podczas rozpoznawania skutków."},"baseline":{"title":"Jak zbudować A0 na przyjęty okres porównania?","correct":"b","options":[{"id":"a","text":"Zachować obecne działania i przyjąć wyniki na poziomie z ostatniego pomiaru.","feedback":"To zamraża rezultaty. Mogą się one zmieniać nawet bez nowej decyzji klienta."},{"id":"b","text":"Uwzględnić obecne działania oraz przewidywane zmiany otoczenia bez nowej decyzji klienta.","feedback":"A0 jest dynamiczną kontynuacją. Dzięki temu nie przypisujemy nowej alternatywie całej przyszłej zmiany."},{"id":"c","text":"Ograniczyć działania do zadań niezbędnych, uwzględniając przewidywane zmiany ich otoczenia.","feedback":"Ograniczenie działań jest odrębną decyzją. Może być alternatywą, ale nie zastępuje opisanej kontynuacji."}],"hint":"Co zmienia się samo lub wynika z już podjętych decyzji, a co wymaga nowej decyzji?"},"variant":{"title":"W poniższym przykładzie szkoleniowym która para przedstawia warianty skali jednego instrumentu?","correct":"a","options":[{"id":"a","text":"Dyżury doradcy dwa albo cztery razy miesięcznie, przy tym samym zakresie udzielanej pomocy.","feedback":"Zmienia się częstotliwość tego samego działania. Nie ustalamy jeszcze, która skala jest korzystniejsza."},{"id":"b","text":"Dyżury doradcy albo automatyczne pobieranie danych, przy tym samym miesięcznym budżecie obsługi spraw.","feedback":"Pomoc człowieka i wymiana danych działają przez odmienne mechanizmy. Wspólny budżet nie czyni ich wariantami skali."},{"id":"c","text":"Dyżury doradcy z dopłatą albo z przewozem, przy tej samej liczbie objętych wsparciem osób.","feedback":"Zmienia się skład pakietu instrumentów. Liczba odbiorców jest wspólna, lecz nie tożsamy sposób działania."}],"hint":"Porównaj wykonawcę, mechanizm, skład pakietu i parametr ilościowy."},"transfer":{"title":"W szkicu zespołu miernik obejmuje osoby rozpoczynające formularz internetowy. Po dodaniu zapisu telefonicznego zespół chce porównać dostępność zapisu we wszystkich kanałach. Co zrobić z miernikiem dla A0, A1 i A2?","correct":"a","options":[{"id":"a","text":"Dla wszystkich opcji uwzględnić próby w dostępnych kanałach, stosując wspólną definicję zakończenia zapisu i ten sam okres.","feedback":"Definicja obejmuje dostępne kanały każdej opcji, także A0. Po zmianie miernika trzeba ponownie oszacować wartości dla wszystkich opcji. Nadal pomijamy osoby, które nie podejmują próby; to ograniczenie wymaga ujawnienia."},{"id":"b","text":"Dla wszystkich opcji zachować próby przez internet, a skutki pozostałych kanałów opisać oddzielnie przy nowych działaniach w tym okresie.","feedback":"Zachowanie wcześniejszej definicji ułatwia ciągłość danych, ale nie odpowiada nowemu pytaniu o dostępność we wszystkich kanałach. Oddzielny opis telefonu nie uzupełnia wspólnego miernika."},{"id":"c","text":"Dla każdej opcji uwzględnić próby w jej głównym kanale, stosując wspólną definicję zakończenia zapisu i ten sam okres.","feedback":"Wspólny okres i definicja ukończenia nie wystarczą, gdy wybór głównego kanału zmienia zakres miernika między opcjami. Pozostałe kanały i trudności ich użytkowników znikają z porównania."}],"hint":"Sprawdź, czy definicja odpowiada pytaniu o wszystkie kanały i obejmuje A0 na tej samej zasadzie co nowe opcje."}},"cases":{"GPA_a":{"task":"Przygotuj alternatywy korekty oferty, które ułatwią potrzebne podróże i powroty osobom bez auta. Ustal kryteria przed szacowaniem skutków.","horizon":"kolejny rok","baseline":"Obecny rozkład, istniejące połączenia i uzgodnione finansowanie.","trend":"Godziny zmian w zakładach pracy i zapotrzebowanie na podróże mogą się zmieniać także bez korekty rozkładu.","options":[["hours","Przesunięcie godzin wybranych kursów","Dopasowanie odjazdów do zakończenia zmian może umożliwić powroty bez zwiększania liczby kursów."],["connections","Koordynacja przesiadek między liniami","Uzgodnione przesiadki mogą połączyć istniejące odcinki w użyteczną podróż."],["late","Dodatkowy kurs po późnej zmianie","Dodatkowy odjazd może wypełnić lukę czasową, ale wymaga zasobów."],["package","Korekta godzin z uzgodnieniem przesiadek","Pakiet może usuwać dwie bariery; zależy od współpracy organizatorów."]],"scale":["Na dwóch wybranych liniach przez kwartał","Na pięciu wybranych liniach przez kwartał"],"newInfo":"Przegląd dwunastu wskazanych podróży pokazuje, że w pięciu powrót jest możliwy po przesunięciu odjazdu, a w czterech wymaga także uzgodnienia przesiadki. Część podróży należy do obu grup. Nie jest to próba wszystkich podróży.","limit":"W pierwszym kwartale pilotażu dostępna liczba wozogodzin pozostaje na obecnym poziomie. Zmiany między liniami wymagają uzgodnienia z operatorem.","adaptations":["Uzgodnić godziny z połączeniem przesiadkowym","Przesunąć istniejące kursy w ramach zasobów","Zachować projekt i sprawdzić jego zakres"],"criteria":["Dostępność: maksymalizować odsetek potrzebnych podróży osób bez auta z wykonalnym dojazdem i powrotem w przyjętym standardzie.","Efektywność kosztowa: minimalizować dodatkowy koszt publiczny i prywatny na dodatkową osobę z wykonalną potrzebną podróżą względem A0.","Równość dostępu: minimalizować bezwzględną różnicę odsetka wykonalnych podróży między obszarami peryferyjnymi a centralnymi."],"questions":{"scope":{"title":"Który rezultat odpowiada zleceniu zarządu GPA?","correct":"b","options":[{"id":"a","text":"Mniej rozbieżności między prognozą wkładu gminy a jego kwartalnym rozliczeniem.","feedback":"To rezultat istotny dla drugiego klienta, który planuje wkład gminy."},{"id":"b","text":"Więcej potrzebnych podróży osób bez auta z wykonalnym dojazdem i powrotem.","feedback":"To rezultat dotyczący dostępności. Sam wzrost przejazdów nie obejmuje osób dotąd wykluczonych."},{"id":"c","text":"Większe zadowolenie obecnych pasażerów z komfortu przejazdów na liniach obsługujących zakłady pracy.","feedback":"Komfort obecnych pasażerów jest ważny, ale zlecenie koncentruje się na możliwości potrzebnej podróży, także dla osób dziś niekorzystających."}],"hint":"Porównaj cel pytania z zakresem każdej odpowiedzi. Ustal, co mierzy lub zakłada każda propozycja."},"effect":{"title":"GPA ocenia dostępność potrzebnych podróży osób bez auta. Który miernik obejmuje ten rezultat?","correct":"a","options":[{"id":"a","text":"Maksymalizować udział potrzebnych podróży z wykonalnym dojazdem i powrotem według przyjętego standardu czasu i kosztu.","feedback":"Mianownik obejmuje potrzebne podróże, także dotąd niewykonalne. Dla każdej trzeba sprawdzić dojazd i powrót według wspólnego standardu."},{"id":"b","text":"Maksymalizować udział wykonanych przejazdów z dojazdem i powrotem ocenionym pozytywnie przez obecnych pasażerów badanych linii.","feedback":"Ocena obecnych pasażerów pomija osoby bez wykonalnej podróży. Zadowolenie może rosnąć, choć dostęp wykluczonych osób się nie zmieni."},{"id":"c","text":"Maksymalizować udział potrzebnych podróży z wykonalnym dojazdem do celu według przyjętego standardu czasu i kosztu.","feedback":"Dojazd do celu nie wystarcza, jeżeli nie można wrócić. Pominięcie powrotu zmienia definicję dostępności przyjętą w zleceniu."}],"hint":"Porównaj cel pytania z zakresem każdej odpowiedzi. Ustal, co mierzy lub zakłada każda propozycja."},"cost":{"title":"GPA porównuje dodatkowy koszt publiczny i prywatny z dodatkową dostępnością względem A0. Dla wspólnego okresu i dodatniego efektu którą relację należy minimalizować?","correct":"c","options":[{"id":"a","text":"Przyrost kosztów podzielony przez liczbę wszystkich osób z wykonalną potrzebną podróżą w danej alternatywie.","feedback":"Mianownik obejmuje także dostępność występującą w A0. Iloraz nie określa kosztu dodatkowej poprawy."},{"id":"b","text":"Łączne koszty podzielone przez przyrost liczby osób z wykonalną potrzebną podróżą względem A0.","feedback":"Licznik obejmuje również koszty scenariusza A0. Dla kosztu dodatkowego trzeba odjąć koszty kontynuacji."},{"id":"c","text":"Przyrost kosztów podzielony przez przyrost liczby osób z wykonalną potrzebną podróżą względem A0.","feedback":"Licznik i mianownik opisują zmianę wobec tej samej bazy. Uwzględnij koszty publiczne i prywatne oraz nie licz jednej osoby kilka razy."}],"hint":"Porównaj cel pytania z zakresem każdej odpowiedzi. Ustal, co mierzy lub zakłada każda propozycja."},"third":{"title":"Kryterium: wyrównanie dostępu peryferii i centrum. Który miernik bezpośrednio pokazuje różnicę możliwości?","correct":"b","options":[{"id":"a","text":"Minimalizować bezwzględną różnicę liczby wykonalnych podróży między obszarami peryferyjnymi i centralnymi w tym samym okresie.","feedback":"Liczebności i potrzeby obu obszarów mogą być różne. Równa liczba podróży nie oznacza równego udziału zaspokojonych potrzeb."},{"id":"b","text":"Minimalizować bezwzględną różnicę odsetka wykonalnych podróży między obszarami peryferyjnymi i centralnymi w tym samym okresie.","feedback":"Porównanie udziałów według wspólnego standardu pokazuje lukę możliwości. Czytaj ją razem z ogólną dostępnością, aby nie wyrównywać przez pogorszenie."},{"id":"c","text":"Minimalizować bezwzględną różnicę średniego czasu wykonanych podróży między obszarami peryferyjnymi i centralnymi w tym samym okresie.","feedback":"Średnia wśród wykonanych podróży pomija podróże niewykonalne. Wskazuje inny aspekt niż luka możliwości dojazdu i powrotu."}],"hint":"Porównaj cel pytania z zakresem każdej odpowiedzi. Ustal, co mierzy lub zakłada każda propozycja."},"revision":{"title":"Które sprawdzenie projektu najlepiej odpowiada nowej wiadomości o wskazanych podróżach?","correct":"c","options":[{"id":"a","text":"Sprawdzić rozpoznawalność rozkładu i czytelność informacji o kursach wśród osób objętych przeglądem podróży.","feedback":"To może być wartościowe, lecz wiadomość wskazuje przede wszystkim godziny i przesiadki, a nie brak znajomości oferty."},{"id":"b","text":"Sprawdzić wykorzystanie miejsc i wielkość pojazdów na liniach obsługujących osoby objęte przeglądem podróży.","feedback":"To odpowiada problemowi pojemności. Nowa wiadomość nie wskazuje przepełnienia jako bariery tych podróży."},{"id":"c","text":"Sprawdzić dopasowanie odjazdów i możliwość przesiadek dla tych samych osób objętych przeglądem podróży.","feedback":"To odpowiada obu wskazanym mechanizmom; identyfikacja tych samych podróży zapobiega podwójnemu liczeniu."}],"hint":"Porównaj cel pytania z zakresem każdej odpowiedzi. Ustal, co mierzy lub zakłada każda propozycja."},"constraint":{"title":"Która propozycja respektuje podany limit zasobów pilotażu?","correct":"a","options":[{"id":"a","text":"Uzgodnienie przesunięcia dziesięciu wozogodzin z poranków na wieczory oraz nowych godzin przesiadek między liniami.","feedback":"Przesunięcie nie zwiększa łącznej liczby wozogodzin. Trzeba sprawdzić dostępność pojazdów i skutki dla pasażerów porannych kursów."},{"id":"b","text":"Uzgodnienie dziesięciu dodatkowych wozogodzin wieczornych oraz zmniejszenia wydatków gminy na informację o rozkładach jazdy.","feedback":"Oszczędność pieniędzy nie zwiększa dostępnej liczby wozogodzin. To inny rodzaj ograniczenia zasobów."},{"id":"c","text":"Uzgodnienie dziesięciu dodatkowych wozogodzin weekendowych oraz utrzymania obecnej stawki operatora za realizację przewozów autobusowych.","feedback":"Utrzymanie stawki nie oznacza utrzymania łącznej liczby wozogodzin."}],"hint":"Porównaj cel pytania z zakresem każdej odpowiedzi. Ustal, co mierzy lub zakłada każda propozycja."}}},"GPA_b":{"task":"Przygotuj sposoby poprawy podstaw planowania wkładu gminy w przewozy, z uwzględnieniem ciągłości potrzebnych usług.","horizon":"cztery kolejne kwartały","baseline":"Obecny obieg danych, używane arkusze i harmonogram przygotowania prognoz.","trend":"Stawki, przychody i uzgodniona oferta mogą się zmieniać bez nowej procedury planowania.","options":[["version","Kontrola wersji arkusza przed prognozą","Sprawdzenie daty stawek i źródła danych może ograniczać błędy własnych obliczeń."],["calendar","Uzgodniony kalendarz przekazywania danych","Terminy uzgodnione ze związkiem mogą zmniejszyć liczbę prognoz opartych na niepełnych danych."],["ranges","Prognozy przedziałowe z aktualizacją założeń","Scenariusze przychodów i kosztów mogą ujawnić niepewność zanim zostanie przyjęta kwota."],["package","Kontrola wersji z kalendarzem danych","Pakiet łączy poprawę pracy urzędu i współpracę ze związkiem."]],"scale":["Pilotaż przez dwa kwartały","Pilotaż przez cztery kwartały"],"newInfo":"Audyt dwóch nowych prognoz wskazuje różne mechanizmy rozbieżności: w jednej użyto starej stawki mimo otrzymania aktualnej, w drugiej brakowało danych o przychodach. Nie ustalono udziału tych mechanizmów w całym roku.","limit":"Pilotaż musi zmieścić się w obecnej obsadzie urzędu i nie może samodzielnie zmieniać uzgodnionej oferty przewozowej.","adaptations":["Dodać kontrolę wersji danych","Uzgodnić termin aktualizacji i przedział prognozy","Zachować projekt i sprawdzić jego zakres"],"criteria":["Trafność prognoz: minimalizować średnią bezwzględną różnicę prognozowanego wkładu i rozliczenia, przy tej samej dacie przygotowania prognoz.","Efektywność kosztowa: minimalizować dodatkowy koszt przygotowania na jednostkę zmniejszenia średniego bezwzględnego błędu prognoz względem A0.","Ciągłość usług: maksymalizować odsetek potrzebnych podróży nadal wykonalnych podczas zmian planowania."],"questions":{"scope":{"title":"Który rezultat odpowiada zleceniu wójta w tej ścieżce?","correct":"a","options":[{"id":"a","text":"Mniejsze rozbieżności prognozy wkładu i rozliczenia przy zachowaniu potrzebnych usług przewozowych.","feedback":"Zlecenie dotyczy podstaw planowania, nie automatycznego zmniejszenia dopłat."},{"id":"b","text":"Mniejsze wydatki na wkład gminy dzięki ograniczeniu kursów o niskim napełnieniu.","feedback":"To propozycja redukcji usług i kosztów, która nie wynika z samej diagnozy błędów prognozy."},{"id":"c","text":"Mniejsze trudności powrotu z pracy dzięki przesunięciu godzin kursowania wybranych autobusów.","feedback":"To rezultat dotyczący zlecenia zarządu GPA o dostępności, a nie głównego problemu tego klienta."}],"hint":"Porównaj cel pytania z zakresem każdej odpowiedzi. Ustal, co mierzy lub zakłada każda propozycja."},"effect":{"title":"Kryterium: trafność prognoz wkładu. Który miernik odpowiada temu kryterium?","correct":"b","options":[{"id":"a","text":"Minimalizować średnią różnicę ze znakiem między prognozą a rozliczeniem dla prognoz przygotowanych na ten sam dzień.","feedback":"Dodatnie i ujemne błędy mogą się znieść. Średnia bliska zeru nie oznacza małych rozbieżności poszczególnych prognoz."},{"id":"b","text":"Minimalizować średnią bezwzględną różnicę między prognozą a rozliczeniem dla prognoz przygotowanych na ten sam dzień.","feedback":"Wartość bezwzględna ujmuje wielkość błędu bez znoszenia niedoszacowań i przeszacowań. Wspólna data zachowuje porównywalną dostępność informacji."},{"id":"c","text":"Minimalizować średnią bezwzględną różnicę między ostatnią aktualizacją prognozy a rozliczeniem, niezależnie od daty jej przygotowania.","feedback":"Późniejsza aktualizacja korzysta z dodatkowej wiedzy. Różne daty nie pozwalają uczciwie porównać trafności prognoz potrzebnych przy przygotowaniu budżetu."}],"hint":"Porównaj cel pytania z zakresem każdej odpowiedzi. Ustal, co mierzy lub zakłada każda propozycja."},"cost":{"title":"Wspólny okres i data prognoz są ustalone. Chcesz określić koszt dodatkowego zmniejszenia błędu względem A0. Którą relację zastosujesz przy dodatniej poprawie?","correct":"a","options":[{"id":"a","text":"Przyrost kosztów przygotowania prognoz podzielony przez spadek ich średniego bezwzględnego błędu względem A0.","feedback":"To koszt dodatkowej poprawy, przy błędzie liczonym dla porównywalnych prognoz. Jednostki błędu i kosztu muszą być jawne."},{"id":"b","text":"Przyrost kosztów przygotowania prognoz podzielony przez spadek kwoty prognozowanego wkładu gminy względem A0.","feedback":"Niższa prognozowana kwota nie oznacza mniejszego błędu. Może zwiększać niedoszacowanie wkładu."},{"id":"c","text":"Przyrost kosztów przygotowania prognoz podzielony przez spadek liczby aktualizacji prognozowanego wkładu względem A0.","feedback":"Rzadsza aktualizacja nie jest trafnością. Może wynikać z pomijania nowych informacji, choć błąd wobec rozliczenia rośnie."}],"hint":"Porównaj cel pytania z zakresem każdej odpowiedzi. Ustal, co mierzy lub zakłada każda propozycja."},"third":{"title":"Kryterium: ciągłość potrzebnych usług w trakcie zmian planowania. Który miernik zastosujesz?","correct":"c","options":[{"id":"a","text":"Maksymalizować odsetek linii utrzymanych w rozkładzie podczas zmiany sposobu przygotowania prognoz wkładu gminy.","feedback":"Utrzymana linia może mieć zmienione godziny lub przesiadki. Sama obecność w rozkładzie nie zapewnia ciągłości potrzebnych podróży."},{"id":"b","text":"Maksymalizować odsetek zachowanych wozogodzin podczas zmiany sposobu przygotowania prognoz wkładu gminy.","feedback":"Ta sama liczba wozogodzin może być rozłożona inaczej. Chroni wielkość zasobu, lecz nie konkretną możliwość potrzebnej podróży."},{"id":"c","text":"Maksymalizować odsetek potrzebnych podróży nadal wykonalnych podczas zmiany sposobu przygotowania prognoz wkładu gminy.","feedback":"Miernik odnosi ciągłość do sytuacji mieszkańców. Populacja podróży i standard wykonalności muszą pozostać wspólne."}],"hint":"Porównaj cel pytania z zakresem każdej odpowiedzi. Ustal, co mierzy lub zakłada każda propozycja."},"revision":{"title":"Który element kontroli projektu odpowiada różnicy między dwiema nowymi prognozami?","correct":"b","options":[{"id":"a","text":"Osobne sprawdzenie terminów wysyłki pisma i potwierdzenia odbioru przez urząd przed każdą prognozą.","feedback":"To usprawnia obieg, ale nie sprawdza, czy urząd użył otrzymanej stawki, ani czy ma komplet danych o przychodach."},{"id":"b","text":"Osobne sprawdzenie użytej wersji stawek i kompletności danych o przychodach przed każdą prognozą.","feedback":"Te dwa sprawdzenia odpowiadają różnym mechanizmom wykrytym w audycie."},{"id":"c","text":"Osobne sprawdzenie podpisu pod arkuszem i daty zatwierdzenia wersji prognozy przez upoważnioną osobę.","feedback":"Formalne zatwierdzenie nie zastępuje sprawdzenia źródeł i kompletności danych."}],"hint":"Porównaj cel pytania z zakresem każdej odpowiedzi. Ustal, co mierzy lub zakłada każda propozycja."},"constraint":{"title":"Która propozycja respektuje warunki pilotażu?","correct":"c","options":[{"id":"a","text":"Przeznaczenie oszczędności z kontroli arkuszy na pół etatu analityka odpowiedzialnego za dane o przewozach.","feedback":"Finansowanie stanowiska z oszczędności nadal zwiększa obsadę, której pilotaż nie może powiększyć."},{"id":"b","text":"Przeznaczenie środków z czasowego zawieszenia kursów przez gminę na uporządkowanie danych potrzebnych do prognoz.","feedback":"Samodzielne zawieszenie kursów zmienia uzgodnioną ofertę, a pilotaż dotyczy organizacji prognozowania."},{"id":"c","text":"Przeznaczenie dwóch obecnych dyżurów na wspólną kontrolę arkuszy i uzgodnienie kalendarza danych o przewozach.","feedback":"To reorganizacja pracy obecnej obsady. Trzeba sprawdzić obciążenie pracowników i skutki zmiany przeznaczenia dyżurów."}],"hint":"Porównaj cel pytania z zakresem każdej odpowiedzi. Ustal, co mierzy lub zakłada każda propozycja."}}},"CP_a":{"task":"Przygotuj lokalne alternatywy ograniczania narażenia i barier inwestycji. Oddziel możliwości gminy od zmian wymagających współpracy poza nią.","horizon":"trzy kolejne lata","baseline":"Obecny punkt wsparcia, współpraca operatorska i rozpoczęte działania lokalne.","trend":"Inwestycje rozpoczęte wcześniej, pogoda i napływ zanieczyszczeń mogą zmieniać narażenie bez nowej decyzji gminy.","options":[["advisor","Wsparcie od rozpoznania bariery do rozliczenia","Towarzyszenie gospodarstwu może ograniczyć trudności proceduralne na kilku etapach."],["coord","Uzgodnienie działań z sąsiednimi gminami","Współpraca może objąć źródła, których pojedyncza gmina nie kontroluje."],["target","Docieranie do gospodarstw z barierami udziału","Pomoc kierowana według rozpoznanych potrzeb może objąć osoby pomijane przez zwykły punkt wsparcia."],["package","Wsparcie gospodarstw z koordynacją między gminami","Pakiet łączy bariery inwestycji z zanieczyszczeniami napływającymi spoza obszaru."]],"scale":["Pilotaż w dwóch sołectwach przez rok","Pilotaż w czterech sołectwach przez rok"],"newInfo":"W ośmiu z dwunastu celowo dobranych rozmów zgłoszono brak pieniędzy przed refundacją. Model źródeł wskazuje też istotny, lecz nieprecyzyjnie oszacowany udział napływu. Nie wyznaczono częstości bariery w całej gminie.","limit":"W tym zleceniu gmina może reorganizować lokalne wsparcie i proponować współpracę, ale nie zmienia samodzielnie krajowych warunków wypłaty dotacji.","adaptations":["Dodać rozpoznanie dostępnych osłon finansowych","Dodać uzgodnienia z sąsiednimi gminami","Zachować projekt i sprawdzić jego zakres"],"criteria":["Ograniczenie narażenia: minimalizować liczbę mieszkańców przypisanych przez model do obszarów ponad umowny poziom T dla PM2,5.","Efektywność kosztowa: minimalizować dodatkowy koszt publiczny i prywatny na osobę mniej na obszarach ponad T względem A0.","Równość dostępu do wsparcia: maksymalizować udział uprawnionych gospodarstw o niskich dochodach, które mogą przejść cały proces bez nieosłoniętej bariery finansowej."],"questions":{"scope":{"title":"Który rezultat odpowiada lokalnemu zleceniu wójta?","correct":"c","options":[{"id":"a","text":"Krótszy czas rozpatrywania płatności przez fundusz przy zachowaniu poprawności ich kontroli.","feedback":"To zlecenie drugiego klienta. Wójt nie organizuje pracy zespołu płatności funduszu."},{"id":"b","text":"Większy udział właścicieli domów otrzymujących dotację oraz większa liczba inwestycji zakończonych w kolejnym sezonie.","feedback":"Uczestnictwo jest ważnym etapem, lecz zlecenie obejmuje także narażenie. Sam wzrost udziału nie przesądza poprawy tego rezultatu."},{"id":"c","text":"Mniejsze narażenie mieszkańców oraz ograniczenie barier inwestycji możliwych do objęcia działaniem gminy.","feedback":"To łączy rezultat z zakresem działania klienta, zachowując problem źródeł spoza gminy."}],"hint":"Porównaj cel pytania z zakresem każdej odpowiedzi. Ustal, co mierzy lub zakłada każda propozycja."},"effect":{"title":"Gmina ocenia narażenie mieszkańców według modelu PM2,5 i wspólnego progu T. Który miernik zachowuje przedmiot tej diagnozy?","correct":"b","options":[{"id":"a","text":"Minimalizować udział powierzchni gminy przypisanej przez model do stężenia PM2,5 ponad poziom T w badanym sezonie.","feedback":"Powierzchnia nie uwzględnia rozmieszczenia ludności. Spadek na rozległym niezamieszkanym obszarze nie oznacza odpowiedniej poprawy dla mieszkańców."},{"id":"b","text":"Minimalizować liczbę mieszkańców przypisanych przez model do stężenia PM2,5 ponad poziom T w badanym sezonie.","feedback":"Miernik łączy model stężeń z rozmieszczeniem mieszkańców. Nadal jest przybliżeniem narażenia, a nie pomiarem osobistej ekspozycji każdej osoby."},{"id":"c","text":"Minimalizować liczbę mieszkańców korzystających ze wsparcia i przypisanych do stężenia PM2,5 ponad T w badanym sezonie.","feedback":"Ograniczenie do odbiorców wsparcia pomija innych narażonych mieszkańców. Zakres diagnozy obejmuje gminę, nie tylko uczestników programu."}],"hint":"Porównaj cel pytania z zakresem każdej odpowiedzi. Ustal, co mierzy lub zakłada każda propozycja."},"cost":{"title":"Dla dodatniego spadku narażenia względem A0 porównujesz koszty publiczne i prywatne w tym samym okresie. Którą jednostkę kosztu wybierzesz?","correct":"c","options":[{"id":"a","text":"Przyrost kosztów na mieszkańca objętego inwestycją, przypisanego przez model do obszaru ponad T przed pilotażem.","feedback":"Objęcie inwestycją nie potwierdza, że modelowane narażenie spadło poniżej T. Brakuje przyrostu rezultatu wobec A0."},{"id":"b","text":"Przyrost kosztów na mieszkańca mniej na obszarach ponad T w porównaniu z pomiarem przed pilotażem.","feedback":"Zmiana względem wcześniejszego pomiaru obejmuje również trendy i inne działania. Kontrfaktycznym punktem odniesienia w zadaniu jest A0."},{"id":"c","text":"Przyrost kosztów na mieszkańca mniej na obszarach ponad T w porównaniu ze scenariuszem A0.","feedback":"Jednostka odnosi się do dodatkowego rezultatu modelowanego wobec A0. Mniejszy koszt jednostki efektu jest pożądany; transferów nie liczymy podwójnie."}],"hint":"Porównaj cel pytania z zakresem każdej odpowiedzi. Ustal, co mierzy lub zakłada każda propozycja."},"third":{"title":"Kryterium: dostęp do wsparcia gospodarstw o niskich dochodach. Który miernik dotyczy ich możliwości udziału?","correct":"a","options":[{"id":"a","text":"Maksymalizować odsetek uprawnionych gospodarstw o niskich dochodach mogących przejść cały proces mimo bariery finansowej.","feedback":"Osłona musi umożliwiać przejście całego procesu, także poniesienie wydatku przed refundacją. Same formalne uprawnienia nie wystarczają."},{"id":"b","text":"Maksymalizować odsetek uprawnionych gospodarstw o niskich dochodach mogących złożyć kompletny wniosek o wsparcie.","feedback":"Możliwość złożenia wniosku nie usuwa braku środków na etap inwestycji. To wcześniejszy i węższy rezultat."},{"id":"c","text":"Maksymalizować odsetek inwestujących gospodarstw o niskich dochodach otrzymujących zwrot po zakończeniu inwestycji.","feedback":"Zwrot wśród realizujących inwestycję nie pokazuje możliwości tych, którzy nie mogą wcześniej sfinansować wydatku. Pomija barierę wejścia."}],"hint":"Porównaj cel pytania z zakresem każdej odpowiedzi. Ustal, co mierzy lub zakłada każda propozycja."},"revision":{"title":"Który zestaw sprawdzeń najlepiej odpowiada obu elementom nowej wiadomości?","correct":"a","options":[{"id":"a","text":"Dostępność osłon wydatku przed refundacją oraz możliwość współpracy dotyczącej źródeł napływu zanieczyszczeń.","feedback":"To odpowiada barierze płynności i zakresowi oddziaływania spoza gminy, bez zakładania gotowej wielkości efektu."},{"id":"b","text":"Dostępność refundacji po zakończeniu inwestycji oraz możliwość ograniczenia źródeł zanieczyszczeń na terenie gminy.","feedback":"Refundacja po inwestycji nie rozwiązuje braku środków przed nią. Sprawdzenie samych lokalnych źródeł pomija wskazany napływ z zewnątrz."},{"id":"c","text":"Dostępność instrukcji rozliczenia inwestycji oraz możliwość współpracy dotyczącej źródeł napływu zanieczyszczeń.","feedback":"Współpraca odpowiada napływowi, lecz instrukcja rozliczenia nie jest osłoną braku pieniędzy przed refundacją. Taki przegląd obejmuje tylko jeden z dwóch mechanizmów."}],"hint":"Porównaj cel pytania z zakresem każdej odpowiedzi. Ustal, co mierzy lub zakłada każda propozycja."},"constraint":{"title":"Która propozycja pozostaje w zakresie podanego zlecenia gminy?","correct":"b","options":[{"id":"a","text":"Uruchomienie gminnego punktu, który zatwierdza koszt do wypłaty na podstawie wstępnego kosztorysu inwestycji.","feedback":"Zatwierdzenie wypłaty na zmienionej podstawie ingeruje w warunki dotacji. Utworzenie punktu nie nadaje gminie takiej kompetencji."},{"id":"b","text":"Uruchomienie gminnego punktu, który pomaga przygotować dokumenty i sprawdza dostępne źródła finansowania inwestycji.","feedback":"To lokalne wsparcie. Pomoc nie przesądza o uprawnieniu do dotacji ani dostępności konkretnego źródła finansowania."},{"id":"c","text":"Uruchomienie gminnego punktu, który nadaje lokalnym wnioskom pierwszeństwo wypłaty w kolejce instytucji programu.","feedback":"Nadanie pierwszeństwa w cudzej kolejce zmienia warunki wypłaty; reorganizacja lokalnego wsparcia tego nie upoważnia."}],"hint":"Porównaj cel pytania z zakresem każdej odpowiedzi. Ustal, co mierzy lub zakłada każda propozycja."}}},"CP_b":{"task":"Przygotuj alternatywy organizacji obsługi płatności, które ograniczą czas i uciążliwość przy zachowaniu poprawności rozliczeń.","horizon":"kolejne dwanaście miesięcy","baseline":"Obecny podział spraw, sposób formułowania wezwań i wymagane kontrole.","trend":"Napływ i złożoność spraw oraz terminy dostarczania dokumentów mogą się zmieniać przy obecnej organizacji.","options":[["clear","Przegląd jasności i kompletności wezwań","Zrozumiałe, zbiorcze wezwanie może zmniejszyć liczbę powtórnych uzupełnień."],["flow","Podział spraw według rodzaju trudności","Kierowanie spraw do odpowiednich zespołów może ograniczyć kolejki na wybranych etapach."],["contact","Kontakt wyjaśniający przed ponownym wezwaniem","Krótki kontakt może rozpoznać barierę, zanim zostanie powtórzone to samo żądanie."],["package","Jasne wezwania z kontaktem wyjaśniającym","Pakiet łączy jakość pisma z pomocą przy konkretnych trudnościach."]],"scale":["Pilotaż w jednym zespole przez trzy miesiące","Pilotaż w trzech zespołach przez trzy miesiące"],"newInfo":"Przegląd dwudziestu celowo wybranych długich spraw wykazał w jedenastu powtarzane żądania podobnych dokumentów. W siedmiu oczekiwano na dokument z innej instytucji; cztery sprawy należą do obu grup.","limit":"Organizacja obsługi może się zmienić, ale wymagane sprawdzenie prawidłowości rozliczenia pozostaje obowiązkowe.","adaptations":["Dodać przegląd treści ponownych wezwań","Dodać uzgodnienie pozyskiwania dokumentów","Zachować projekt i sprawdzić jego zakres"],"criteria":["Terminowość: minimalizować odsetek spraw trwających ponad umowne 30 dni od wpływu do wyniku weryfikacji; uwzględniać także sprawy otwarte.","Efektywność kosztowa: minimalizować dodatkowy koszt funduszu i beneficjenta na dodatkową prawidłowo zakończoną sprawę w umownym czasie względem A0.","Rzetelność: maksymalizować odsetek rozliczeń uznanych za poprawne w niezależnej kontroli próby spraw."],"questions":{"scope":{"title":"Który rezultat odpowiada zleceniu zarządu funduszu?","correct":"b","options":[{"id":"a","text":"Większa kwota wypłat dla beneficjentów oraz większa wartość inwestycji rozliczonych przez fundusz w danym kwartale.","feedback":"Większa kwota nie oznacza krótszej ani mniej uciążliwej obsługi. Może wynikać ze zmiany wartości inwestycji."},{"id":"b","text":"Krótsza i mniej uciążliwa obsługa płatności przy zachowaniu wymaganej poprawności rozliczeń.","feedback":"To wąskie, uzasadnione zlecenie dotyczące obsługi, bez potrzeby redefiniowania go jako całego smogu."},{"id":"c","text":"Mniej mieszkańców na obszarach ponad T w modelu stężeń badanego sezonu grzewczego.","feedback":"To rezultat środowiskowy istotny w innej ścieżce; nie jest bezpośrednią miarą obsługi płatności."}],"hint":"Porównaj cel pytania z zakresem każdej odpowiedzi. Ustal, co mierzy lub zakłada każda propozycja."},"effect":{"title":"Próg wynosi umowne 30 dni od wpływu do wyniku weryfikacji. Porównujesz sprawy, które wpłynęły co najmniej 30 dni przed pomiarem. Który miernik obejmuje też nadal otwarte?","correct":"c","options":[{"id":"a","text":"Minimalizować odsetek spraw z wynikiem po trzydziestu dniach, odnosząc go do wszystkich spraw zakończonych w tej grupie.","feedback":"Mianownik zakończonych spraw pomija nadal otwarte. Pozostawienie trudnych spraw bez wyniku mogłoby pozornie poprawić ten wskaźnik."},{"id":"b","text":"Minimalizować odsetek spraw otwartych ponad trzydzieści dni, odnosząc go do wszystkich spraw, które wpłynęły w tej grupie.","feedback":"To obejmuje bieżące zaległości, lecz pomija sprawy zakończone po przekroczeniu progu. Zlecenie dotyczy wszystkich przekroczeń."},{"id":"c","text":"Minimalizować odsetek spraw przekraczających trzydzieści dni, odnosząc go do wszystkich spraw, które wpłynęły w tej grupie.","feedback":"Licznik obejmuje zakończone po progu i nadal otwarte po progu, a mianownik tę samą grupę wpływu. Sprawy bez pełnego okresu obserwacji trzeba analizować osobno."}],"hint":"Porównaj cel pytania z zakresem każdej odpowiedzi. Ustal, co mierzy lub zakłada każda propozycja."},"cost":{"title":"Dla wspólnego okresu liczysz przyrost kosztów funduszu i beneficjentów względem A0. Który mianownik da koszt dodatkowej terminowej i prawidłowej obsługi?","correct":"a","options":[{"id":"a","text":"Przyrost liczby prawidłowo zakończonych spraw w umownym czasie obsługi względem scenariusza A0.","feedback":"Mianownik obejmuje dodatkowy rezultat spełniający warunek czasu i jakości. Przy zerowym lub ujemnym przyroście iloraz wymaga odrębnego omówienia."},{"id":"b","text":"Przyrost liczby zakończonych spraw w umownym czasie obsługi względem scenariusza A0.","feedback":"Samo zakończenie w czasie nie spełnia warunku poprawności. Szybkie błędne rozliczenia nie są tym samym rezultatem."},{"id":"c","text":"Liczba prawidłowo zakończonych spraw w umownym czasie obsługi w ocenianej alternatywie.","feedback":"Łączna liczba obejmuje sprawy, które byłyby obsłużone także w A0. Nie jest dodatkową poprawą."}],"hint":"Porównaj cel pytania z zakresem każdej odpowiedzi. Ustal, co mierzy lub zakłada każda propozycja."},"third":{"title":"Kryterium: rzetelność rozliczeń. Który miernik pozwala ocenić ten rezultat?","correct":"b","options":[{"id":"a","text":"Maksymalizować odsetek spraw, w których wykonano wymagany komplet czynności kontrolnych zapisanych w procedurze.","feedback":"To miara wykonania procedury. Jej odhaczenie samo nie potwierdza poprawności ustalenia."},{"id":"b","text":"Maksymalizować odsetek spraw, w których niezależny przegląd potwierdził poprawność dokonanych ustaleń i rozliczenia.","feedback":"To sprawdzenie wyniku kontroli; dobór próby musi obejmować różne rodzaje rozstrzygnięć."},{"id":"c","text":"Maksymalizować odsetek spraw, w których beneficjent nie zwrócił się o wyjaśnienie wyniku przeprowadzonej kontroli.","feedback":"Brak pytania może wynikać z wielu powodów. Nie jest potwierdzeniem poprawności."}],"hint":"Porównaj cel pytania z zakresem każdej odpowiedzi. Ustal, co mierzy lub zakłada każda propozycja."},"revision":{"title":"Który przegląd projektu najlepiej odpowiada nowej wiadomości o długich sprawach?","correct":"c","options":[{"id":"a","text":"Zestawienie liczby przyjętych dokumentów z liczbą pracowników oraz określenie docelowej liczby spraw na osobę.","feedback":"To badanie obciążenia. Bez treści wezwań i zależności zewnętrznych nie rozpoznaje ujawnionych mechanizmów."},{"id":"b","text":"Zestawienie terminów wysyłki wezwań z terminami odbioru oraz określenie docelowej częstotliwości wysyłania przypomnień.","feedback":"Częstsze przypomnienia mogą powtarzać niejasne żądanie lub dotyczyć dokumentu niedostępnego w danym terminie."},{"id":"c","text":"Zestawienie treści ponownych wezwań z zależnościami od innych instytucji oraz rozpoznanie spraw z obiema barierami.","feedback":"To pozwala dopasować organizację do jakości komunikacji i dokumentów zewnętrznych, bez dublowania spraw."}],"hint":"Porównaj cel pytania z zakresem każdej odpowiedzi. Ustal, co mierzy lub zakłada każda propozycja."},"constraint":{"title":"Która zmiana respektuje warunek dotyczący kontroli rozliczenia?","correct":"a","options":[{"id":"a","text":"Weryfikacja kompletności i treści dokumentów w każdej sprawie przed wysłaniem jednego zbiorczego wezwania.","feedback":"Kontrola obejmuje każdą sprawę, a zmiana dotyczy organizacji wezwania. Trzeba sprawdzić, czy zebranie uwag jest wykonalne."},{"id":"b","text":"Weryfikacja kompletności dokumentów w każdej sprawie oraz kontrola ich treści w losowanej próbie rozliczeń.","feedback":"Kontrola próby może służyć innym celom, ale nie zastępuje obowiązkowej weryfikacji prawidłowości każdego rozliczenia."},{"id":"c","text":"Weryfikacja oświadczenia o zgodności rozliczenia oraz kierowanie spraw do kontroli po otrzymaniu sygnału błędu.","feedback":"Oświadczenie i kontrola po sygnale nie zapewniają wymaganego sprawdzenia prawidłowości każdego rozliczenia."}],"hint":"Porównaj cel pytania z zakresem każdej odpowiedzi. Ustal, co mierzy lub zakłada każda propozycja."}}},"BK2_a":{"task":"Nowe zlecenie po diagnozie: przygotuj alternatywy przyszłego wsparcia dostępności mieszkania oraz kryteria ich oceny. Historyczne doświadczenia BK2 pozostają przesłanką z ograniczeniami; nie zakładamy wznowienia naboru.","horizon":"pięć kolejnych lat","baseline":"Obsługa wcześniejszych zobowiązań i istniejących instrumentów, bez wprowadzania nowego instrumentu z tego zlecenia.","trend":"Dochody, ceny i podaż mieszkań zmieniają się także bez nowego wsparcia. Trzeba uwzględnić te zmiany w porównaniu.","options":[["target","Wsparcie kosztów mieszkania kierowane według potrzeb","Wsparcie grup o wysokim obciążeniu kosztami może poprawić ich sytuację, lecz zależy też od reakcji cen."],["rental","Wsparcie zwiększania podaży mieszkań na dostępny najem","Zwiększenie dostępnej oferty może ograniczać bariery także gospodarstw bez możliwości uzyskania kredytu."],["supply","Wsparcie przygotowania terenów i infrastruktury mieszkaniowej","Usunięcie barier podaży może zwiększyć możliwości budowy; efekty wymagają czasu i współpracy."],["package","Ukierunkowane wsparcie z działaniem po stronie podaży","Pakiet łączy doraźne obciążenia kosztami z warunkami tworzenia mieszkań."]],"scale":["Projekt pilotażu w dwóch miastach","Projekt pilotażu w pięciu miastach"],"newInfo":"Analiza wariantowa dla dwóch rynków wskazuje: przy wolnej reakcji podaży część wzrostu zdolności do płacenia może przełożyć się na ceny. Wielkość zjawiska zależy od założeń; nie oszacowano efektu konkretnego nowego instrumentu.","limit":"Zlecenie dotyczy przygotowania propozycji i warunków pilotażu. Przyjęcie nowego instrumentu i środków wymaga odrębnych decyzji właściwych organów.","adaptations":["Dodać warunek sprawdzenia reakcji podaży","Dodać wariant dla gospodarstw poza kredytem","Zachować projekt i sprawdzić jego zakres"],"criteria":["Dostępność finansowa: minimalizować odsetek gospodarstw w grupie docelowej z nadmiernymi kosztami mieszkania według jawnego standardu.","Efektywność kosztowa: minimalizować dodatkowy koszt społeczny na dodatkowe gospodarstwo wychodzące z nadmiernego obciążenia względem A0.","Sprawiedliwość: minimalizować bezwzględną różnicę poprawy względem A0 między gospodarstwami o podobnych potrzebach z dostępem do kredytu i bez niego."],"questions":{"scope":{"title":"Jaki materiał ma powstać w nowym zleceniu ministra po poprzedniej diagnozie ewaluacyjnej?","correct":"a","options":[{"id":"a","text":"Propozycje różnych sposobów przyszłego wsparcia oraz wspólne kryteria ich oceny, oparte na rozpoznanych potrzebach.","feedback":"Nowe zlecenie dotyczy alternatyw i kryteriów. Historyczne doświadczenia pozostają przesłanką o ograniczonej mocy, a nie rozstrzygnięciem skutków przyszłego instrumentu."},{"id":"b","text":"Propozycja wysokości przyszłej dopłaty oraz kryteria jej przyznania, wyprowadzone z różnicy deklaracji badanych grup.","feedback":"To z góry zawęża instrument i myli kryteria oceny alternatyw z zasadami przyznania. Różnica deklaracji nie identyfikuje efektu dopłaty."},{"id":"c","text":"Propozycja dodatkowego badania dawnego programu oraz kryteria doboru próby, oparte na lukach historycznej diagnozy.","feedback":"To możliwy kierunek dalszej ewaluacji, lecz nie wykonuje nowego zlecenia przygotowania alternatyw przyszłego wsparcia i kryteriów ich porównania."}],"hint":"Porównaj cel pytania z zakresem każdej odpowiedzi. Ustal, co mierzy lub zakłada każda propozycja."},"effect":{"title":"Kryterium: ograniczenie nadmiernego obciążenia kosztami mieszkania. Który miernik odnosi się do tego rezultatu?","correct":"c","options":[{"id":"a","text":"Minimalizować średni udział wydatków mieszkaniowych w dochodzie gospodarstw z grupy docelowej, objętych wspólnym okresem oceny.","feedback":"Średnia może maleć dzięki poprawie u najmniej obciążonych, bez zmniejszenia odsetka gospodarstw ponad przyjętym progiem."},{"id":"b","text":"Minimalizować odsetek gospodarstw ponad ustalonym udziałem wydatków mieszkaniowych w dochodzie wśród odbiorców nowego wsparcia.","feedback":"Odbiorcy wsparcia są tylko częścią grupy docelowej. Zmiana tego, kto zostanie zakwalifikowany, może pozornie poprawić wynik."},{"id":"c","text":"Minimalizować odsetek gospodarstw ponad ustalonym udziałem wydatków mieszkaniowych w dochodzie w całej grupie docelowej.","feedback":"Przed porównaniem ustal próg, koszty, dochód, grupę i okres. Kryterium obejmuje również gospodarstwa, do których wsparcie nie dotrze."}],"hint":"Porównaj cel pytania z zakresem każdej odpowiedzi. Ustal, co mierzy lub zakłada każda propozycja."},"cost":{"title":"Dodatkowy koszt społeczny odnosisz do poprawy względem A0 w tym samym okresie. Który mianownik odpowiada wyjściu z nadmiernego obciążenia mieszkaniem?","correct":"b","options":[{"id":"a","text":"Przyrost liczby gospodarstw otrzymujących wsparcie przeznaczone na zmniejszenie nadmiernych kosztów mieszkania względem A0.","feedback":"Otrzymanie wsparcia nie zapewnia wyjścia z nadmiernego obciążenia, np. przy wzroście cen. Mianownik powinien odpowiadać rezultatowi."},{"id":"b","text":"Przyrost liczby gospodarstw wychodzących z nadmiernego obciążenia kosztami mieszkania względem scenariusza A0.","feedback":"To dodatkowy rezultat dla gospodarstw. Próg obciążenia, grupa docelowa i okres muszą być jednakowe w porównaniu."},{"id":"c","text":"Przyrost liczby gospodarstw zmniejszających udział wydatków mieszkaniowych w dochodzie względem scenariusza A0.","feedback":"Niewielki spadek udziału może pozostawić gospodarstwo ponad progiem. To inna jednostka efektu niż wyjście z nadmiernego obciążenia."}],"hint":"Porównaj cel pytania z zakresem każdej odpowiedzi. Ustal, co mierzy lub zakłada każda propozycja."},"third":{"title":"Kryterium: sprawiedliwość wobec podobnych potrzeb mieszkaniowych. Które porównanie najlepiej ujawnia pominięcie gospodarstw poza kredytem?","correct":"a","options":[{"id":"a","text":"Porównanie poprawy sytuacji gospodarstw z podobnymi potrzebami, mających i niemających dostępu do kredytu.","feedback":"Pozwala badać lukę w poprawie dla podobnych potrzeb; przyjęta interpretacja sprawiedliwości wymaga uzasadnienia."},{"id":"b","text":"Porównanie kwoty przyznanego wsparcia gospodarstwom z podobnymi potrzebami, mającym i niemającym dostępu do kredytu.","feedback":"Równe wsparcie pieniężne nie musi dawać równej poprawy, np. przy różnych kosztach i reakcji cen. Kryterium dotyczy sytuacji mieszkaniowej."},{"id":"c","text":"Porównanie końcowego obciążenia mieszkaniem gospodarstw z podobnymi potrzebami, mających i niemających dostępu do kredytu.","feedback":"Końcowy poziom łączy stan początkowy z poprawą. Sam nie pokazuje, jak rozłożyła się zmiana sytuacji wobec A0."}],"hint":"Porównaj cel pytania z zakresem każdej odpowiedzi. Ustal, co mierzy lub zakłada każda propozycja."},"revision":{"title":"Które sprawdzenie projektu najlepiej odpowiada nowej analizie wariantowej rynków?","correct":"c","options":[{"id":"a","text":"Wrażliwość zainteresowania wsparciem na wysokość dopłaty przy zachowaniu stałych cen i liczby dostępnych mieszkań.","feedback":"Założenie stałych cen i podaży usuwa z analizy mechanizm właśnie wskazany w wiadomości."},{"id":"b","text":"Wrażliwość wydatków budżetowych na liczbę odbiorców przy zachowaniu stałych cen i liczby dostępnych mieszkań.","feedback":"To ważne dla budżetu, ale stałe ceny i podaż nie pozwalają zbadać ujawnionego ryzyka przełożenia wsparcia na ceny."},{"id":"c","text":"Wrażliwość dostępności mieszkań na tempo wzrostu podaży przy różnych założeniach dotyczących reakcji cen na wsparcie.","feedback":"To sprawdza warunki działania mechanizmu. Nadal nie daje pewnego efektu konkretnego przyszłego instrumentu."}],"hint":"Porównaj cel pytania z zakresem każdej odpowiedzi. Ustal, co mierzy lub zakłada każda propozycja."},"constraint":{"title":"Który zapis odpowiada mandatowi przygotowania propozycji?","correct":"b","options":[{"id":"a","text":"Przekazanie uczestnikom zatwierdzonej listy naboru pilotażowego wraz z harmonogramem uruchomienia wypłat nowego wspar m","Dostępna alternatywa podróży może ograniczać zależność od samochodu i obciążenia części grup."],["traffic","Propozycja zmian organizacji ruchu przy wybranych ulicach","Zmiana tras i warunków ruchu może wpływać na emisję i jej rozkład przestrzenny."],["package","Prace nad regułami z usprawnieniem dojazdu","Pakiet łączy ograniczenie emisji z warunkami utrzymania potrzebnych podróży."]],"scale":["Analiza pilotażu dla dwóch korytarzy podróży","Analiza pilotażu dla czterech korytarzy podróży"],"newInfo":"Model dwóch wariantów organizacji ruchu wskazuje możliwość przeniesienia części ruchu na ulice poza strefą. Wynik jest wrażliwy na założenia o wyborze tras. Nie ustalono jeszcze skutku netto dla narażenia mieszkańców.","limit":"Klient przygotowuje propozycje. Zmiany uchwały i zasad wymagają właściwej procedury i decyzji rady; granica strefy nie wyznacza granicy analizy narażenia.","adaptations":["Rozszerzyć ocenę na ulice poza strefą","Dodać wariant usprawnień potrzebnych podróży","Zachować projekt i sprawdzić jego zakres"],"criteria":["Ograniczenie narażenia: minimalizować liczbę mieszkańców przy ulicach przypisanych przez model do poziomu NO₂ ponad T, wewnątrz i poza strefą.","Efektywność kosztowa: minimalizować dodatkowy koszt publiczny i prywatny na osobę mniej na obszarach ponad T względem A0.","Sprawiedliwość obciążeń: minimalizować odsetek osób o niskich dochodach tracących możliwość potrzebnej podróży bez dostępnej alternatywy."],"questions":{"scope":{"title":"Który rezultat odpowiada temu zleceniu prezydenta?","correct":"b","options":[{"id":"a","text":"Sprawniejsze potwierdzanie wyłączeń dla osób składających wnioski w miejskim punkcie obsługi.","feedback":"To główny rezultat drugiego klienta, który organizuje obsługę wyłączeń."},{"id":"b","text":"Mniejsze narażenie mieszkańców przy uwzględnieniu potrzebnych podróży oraz obszarów poza strefą.","feedback":"To rezultat publiczny z odpowiednio szerokim zakresem przestrzennym."},{"id":"c","text":"Mniejsze narażenie mieszkańców na NO₂ przy ulicach objętych kontrolą wjazdu w granicach strefy.","feedback":"To poprawa w zawężonym obszarze. Zlecenie obejmuje także otoczenie strefy i potrzebne podróże, więc trzeba uwzględnić możliwe przeniesienie narażenia."}],"hint":"Porównaj cel pytania z zakresem każdej odpowiedzi. Ustal, co mierzy lub zakłada każda propozycja."},"effect":{"title":"Kryterium: ograniczenie narażenia według modelu NO₂. Który miernik odpowiada diagnozie?","correct":"c","options":[{"id":"a","text":"Minimalizować liczbę mieszkańców przy ulicach ponad T według modelu obejmującego obszar wewnątrz przyjętych granic strefy.","feedback":"Ten zakres pomija mieszkańców ulic poza strefą, na które może przenieść się ruch. W zleceniu granica strefy nie jest granicą analizy."},{"id":"b","text":"Minimalizować średnie stężenie NO₂ przy ulicach według modelu obejmującego strefę i otoczenie, bez ważenia liczbą mieszkańców.","feedback":"Średnia stężeń bez rozmieszczenia mieszkańców nie mierzy liczby osób na obszarach ponad T. Może zmieniać się inaczej niż narażenie populacji."},{"id":"c","text":"Minimalizować liczbę mieszkańców przy ulicach ponad T według modelu obejmującego obszar wewnątrz i poza granicami strefy.","feedback":"To zachowuje jednostkę rezultatu i zakres przestrzenny. Model jest przybliżeniem narażenia i wymaga wspólnych założeń dla porównywanych alternatyw."}],"hint":"Porównaj cel pytania z zakresem każdej odpowiedzi. Ustal, co mierzy lub zakłada każda propozycja."},"cost":{"title":"Wspólny okres oraz przyrost kosztów publicznych i prywatnych są ustalone. Który mianownik odpowiada dodatkowemu ograniczeniu narażenia względem A0?","correct":"a","options":[{"id":"a","text":"Spadek liczby mieszkańców przy ulicach ponad T w strefie i jej otoczeniu względem A0.","feedback":"Mianownik obejmuje dodatkową poprawę w całym zakresie przestrzennym. Przy braku dodatniej poprawy nie porównujemy mechanicznie ilorazów."},{"id":"b","text":"Spadek liczby mieszkańców przy ulicach ponad T wewnątrz granic strefy względem A0.","feedback":"Pominięcie otoczenia może ukryć przeniesienie narażenia. Koszt jednostki tak zawężonej poprawy nie odpowiada zleceniu."},{"id":"c","text":"Spadek liczby mieszkańców przy ulicach ponad T w strefie i otoczeniu względem stanu początkowego.","feedback":"Zmiana względem stanu początkowego obejmuje też trendy floty, pogody i ruchu. W zadaniu porównujemy z dynamicznym A0."}],"hint":"Porównaj cel pytania z zakresem każdej odpowiedzi. Ustal, co mierzy lub zakłada każda propozycja."},"third":{"title":"Kryterium: osłona potrzebnych podróży osób o niskich dochodach. Który miernik odnosi się do obciążenia?","correct":"b","options":[{"id":"a","text":"Minimalizować odsetek osób o niskich dochodach używających pojazdów niezgodnych z przyjętymi warunkami wjazdu.","feedback":"Zgodność pojazdu jest cechą zasobu. Nie pokazuje, czy osoba może odbyć potrzebną podróż innym sposobem."},{"id":"b","text":"Minimalizować odsetek osób o niskich dochodach tracących potrzebną podróż bez dostępnej alternatywy.","feedback":"Trzeba określić potrzebną podróż, dostępność i grupę; miernik dotyczy skutku dla ludzi."},{"id":"c","text":"Minimalizować odsetek osób o niskich dochodach korzystających z przesiadek podczas potrzebnych podróży.","feedback":"Przesiadka może być wygodna albo uciążliwa. Jej wystąpienie nie oznacza utraty możliwości podróży."}],"hint":"Porównaj cel pytania z zakresem każdej odpowiedzi. Ustal, co mierzy lub zakłada każda propozycja."},"revision":{"title":"Który sposób sprawdzenia projektu odpowiada informacji o możliwym przeniesieniu ruchu?","correct":"c","options":[{"id":"a","text":"Porównać liczbę wjazdów do strefy w obu wariantach przy różnych założeniach o wyborze tras.","feedback":"To nie obejmuje pełnego narażenia poza strefą. Spadek wjazdów nie wystarcza do wniosku o skutku netto."},{"id":"b","text":"Porównać narażenie przy ulicach wewnątrz strefy w obu wariantach przy różnych założeniach o wyborze tras.","feedback":"Wrażliwość założeń jest uwzględniona, lecz pominięto obszary, na które problem może się przenieść."},{"id":"c","text":"Porównać narażenie w strefie i jej otoczeniu w obu wariantach przy różnych założeniach o wyborze tras.","feedback":"To obejmuje możliwe przemieszczenie problemu i sprawdza wrażliwość wyniku na zachowania kierowców."}],"hint":"Porównaj cel pytania z zakresem każdej odpowiedzi. Ustal, co mierzy lub zakłada każda propozycja."},"constraint":{"title":"Które działanie odpowiada roli klienta opisanej w zleceniu?","correct":"a","options":[{"id":"a","text":"Przekazanie radzie projektu zmiany granic strefy wraz z oceną warunków i skutków wariantów.","feedback":"To przygotowanie propozycji do decyzji rady; projekt nie ustanawia sam nowych granic."},{"id":"b","text":"Przekazanie operatorowi nowej mapy granic strefy jako załącznika do zaktualizowanej instrukcji obsługi wniosków.","feedback":"Instrukcja obsługi nie zastępuje procedury zmiany uchwały i decyzji rady o granicach."},{"id":"c","text":"Przekazanie służbom nowej mapy granic strefy do pilotażowego stosowania na czas oceny wariantów.","feedback":"Pilotażowe stosowanie także zmienia zasady w praktyce. Wymaga właściwej procedury, a nie samej analizy."}],"hint":"Porównaj cel pytania z zakresem każdej odpowiedzi. Ustal, co mierzy lub zakłada każda propozycja."}}},"SCT_b":{"task":"Przygotuj sposoby ograniczenia czasu i barier obsługi wniosków o potwierdzenie wyłączenia, zachowując rzetelną weryfikację przy obecnych zasadach.","horizon":"kolejne dwanaście miesięcy","baseline":"Obecny podział pracy, kanały kontaktu i reguły sprawdzania wniosków.","trend":"Napływ spraw i dostępność dokumentów z innych instytucji mogą się zmieniać przy obecnej organizacji.","options":[["help","Pomoc w przygotowaniu dokumentów przed złożeniem","Wyjaśnienie wymagań może ograniczyć powtórne uzupełnienia i przerwane próby."],["triage","Podział obsługi według rodzaju braków","Właściwy przydział spraw może ograniczyć oczekiwanie na specjalistyczne wyjaśnienie."],["offline","Dostępny kontakt osobisty i telefoniczny","Alternatywa dla kanału elektronicznego może zmniejszyć bariery części wnioskodawców."],["package","Jasne wezwania z dostępnym kontaktem","Pakiet łączy jakość komunikacji i możliwość uzyskania pomocy."]],"scale":["Pilotaż w jednym punkcie przez trzy miesiące","Pilotaż w trzech punktach przez trzy miesiące"],"newInfo":"W rejestrze zakończonych spraw nie ma osób, które przerwały próbę złożenia. W sześciu z dziesięciu celowo dobranych rozmów z takimi osobami wskazano trudność przesłania dokumentu elektronicznego.","limit":"Zmiana organizacji obsługi nie może zmieniać uprawnień do wyłączenia ani pomijać wymaganej weryfikacji.","adaptations":["Dodać wsparcie przed złożeniem wniosku","Dodać śledzenie spraw przerwanych i otwartych","Zachować projekt i sprawdzić jego zakres"],"criteria":["Terminowość: minimalizować odsetek spraw trwających ponad umowne 10 dni od złożenia do wyniku weryfikacji, z uwzględnieniem spraw otwartych.","Efektywność kosztowa: minimalizować dodatkowy koszt instytucji i wnioskodawcy na dodatkową prawidłowo zakończoną sprawę w umownym czasie względem A0.","Dostępność obsługi: maksymalizować odsetek podejmujących próbę osób z barierą cyfrową, które mogą złożyć kompletny wniosek."],"questions":{"scope":{"title":"Który rezultat odpowiada zleceniu dyrektora ZDM?","correct":"a","options":[{"id":"a","text":"Krótsza i dostępna obsługa wniosków przy zachowaniu rzetelnej weryfikacji uprawnień do wyłączenia.","feedback":"To rezultat organizacyjny w zadanym zakresie. Nie wymaga zmiany zasad uprawnień."},{"id":"b","text":"Mniejsze stężenie NO₂ przy ulicach poza strefą dzięki zmianie zasad uprawnień do wyłączenia.","feedback":"To cel i rodzaj decyzji wykraczające poza zleconą organizację obsługi."},{"id":"c","text":"Krótsze rozpatrywanie kompletnych wniosków składanych elektronicznie oraz mniejsze obciążenie zespołu ponowną weryfikacją dokumentów.","feedback":"To poprawa tylko dla części osób. Zlecenie obejmuje ograniczanie barier, także przed formalnym złożeniem wniosku."}],"hint":"Porównaj cel pytania z zakresem każdej odpowiedzi. Ustal, co mierzy lub zakłada każda propozycja."},"effect":{"title":"Próg to umowne 10 dni od pierwszego złożenia do wyniku weryfikacji. W grupie spraw z pełnym okresem obserwacji który miernik zachowuje ten standard?","correct":"b","options":[{"id":"a","text":"Minimalizować odsetek spraw trwających ponad dziesięć dni od uzupełnienia dokumentów, wliczając zakończone oraz nadal otwarte.","feedback":"Przesunięcie początku na uzupełnienie dokumentów usuwa z pomiaru część czasu obsługi. Standard zaczyna się przy pierwszym złożeniu."},{"id":"b","text":"Minimalizować odsetek spraw trwających ponad dziesięć dni od pierwszego złożenia, wliczając zakończone oraz nadal otwarte.","feedback":"Licznik obejmuje późno zakończone i nadal otwarte po progu. Mianownik to ta sama grupa wpływu z co najmniej dziesięciodniową obserwacją."},{"id":"c","text":"Minimalizować odsetek spraw trwających ponad dziesięć dni od pierwszego złożenia, wliczając zakończone wynikiem weryfikacji.","feedback":"Ograniczenie zbioru do zakończonych spraw pomija aktualne zaległości. Czas tych osób także należy do rezultatu zlecenia."}],"hint":"Porównaj cel pytania z zakresem każdej odpowiedzi. Ustal, co mierzy lub zakłada każda propozycja."},"cost":{"title":"Porównujesz dodatkowe koszty instytucji i wnioskodawców w tym samym okresie. Który mianownik odpowiada dodatkowemu rezultatowi tej obsługi?","correct":"c","options":[{"id":"a","text":"Przyrost liczby spraw zakończonych w umownym czasie obsługi względem scenariusza A0.","feedback":"To pomija prawidłowość weryfikacji. Zakończona szybko, lecz błędnie sprawa nie spełnia warunków zlecenia."},{"id":"b","text":"Liczba spraw prawidłowo zakończonych w umownym czasie obsługi w ocenianej alternatywie.","feedback":"Łączny rezultat obejmuje też sprawy obsłużone w A0. Dla kosztu dodatkowego potrzebny jest przyrost rezultatu."},{"id":"c","text":"Przyrost liczby spraw prawidłowo zakończonych w umownym czasie obsługi względem A0.","feedback":"Licznik kosztu i mianownik efektu odnoszą się do tej samej zmiany. Zerowy lub ujemny przyrost efektu wymaga osobnej oceny."}],"hint":"Porównaj cel pytania z zakresem każdej odpowiedzi. Ustal, co mierzy lub zakłada każda propozycja."},"third":{"title":"Oceniasz dostępność złożenia wniosku przez osoby z barierą cyfrową, które podejmują próbę. Który miernik zachowuje tę grupę?","correct":"a","options":[{"id":"a","text":"Maksymalizować odsetek mogących złożyć kompletny wniosek, wśród osób z barierą cyfrową podejmujących próbę.","feedback":"Uwzględniamy także osoby, które przerwały próbę przed formalnym złożeniem. W całej definicji chodzi o podejmujących próbę z barierą cyfrową."},{"id":"b","text":"Maksymalizować odsetek mogących złożyć kompletny wniosek, wśród osób z barierą cyfrową korzystających z dyżuru pomocy.","feedback":"Osoby, które nie dotrą na dyżur, pozostają poza mianownikiem. Ocena dotyczyłaby wybranego kanału, nie całej wskazanej grupy."},{"id":"c","text":"Maksymalizować odsetek otrzymujących potwierdzenie wyłączenia, wśród osób z barierą cyfrową podejmujących próbę.","feedback":"Dostępna obsługa pozwala złożyć wniosek także osobie, która nie spełnia warunków wyłączenia. Wynik merytoryczny nie jest dostępnością złożenia."}],"hint":"Porównaj cel pytania z zakresem każdej odpowiedzi. Ustal, co mierzy lub zakłada każda propozycja."},"revision":{"title":"Które rozszerzenie oceny projektu odpowiada osobom ujawnionym przez nową wiadomość?","correct":"b","options":[{"id":"a","text":"Uzupełnić ocenę o rodzaje braków w dokumentach osób, których sprawy zakończono w badanym okresie.","feedback":"To nadal ogranicza zbiór do zakończonych spraw i pomija przerwane próby sprzed złożenia."},{"id":"b","text":"Uzupełnić ocenę o bariery przygotowania dokumentów osób, które przerwały próbę przed formalnym złożeniem wniosku.","feedback":"To obejmuje osoby pomijane w rejestrze i pozwala rozważyć wsparcie na wcześniejszym etapie."},{"id":"c","text":"Uzupełnić ocenę o czas otrzymania wezwania przez osoby, które złożyły wniosek i oczekują na wynik.","feedback":"To poszerza analizę o sprawy otwarte, ale nadal pomija osoby, które nie dotarły do formalnego złożenia."}],"hint":"Porównaj cel pytania z zakresem każdej odpowiedzi. Ustal, co mierzy lub zakłada każda propozycja."},"constraint":{"title":"Która propozycja pozostaje w granicach reorganizacji obsługi?","correct":"c","options":[{"id":"a","text":"Wyznaczenie krótszej ścieżki potwierdzania wyłączeń na podstawie deklaracji, z kontrolą dokumentów w losowanej próbie.","feedback":"Kontrola próby nie zastępuje wymaganej weryfikacji uprawnień każdej osoby ubiegającej się o wyłączenie."},{"id":"b","text":"Wyznaczenie dodatkowej kategorii uprawnionych do wyłączenia, obejmującej osoby oczekujące na wydanie dokumentów potwierdzających uprawnienie.","feedback":"To tworzy kategorię uprawnionych. Zespół obsługi może pomagać w uzyskaniu dokumentów, lecz nie zmienia zasad uprawnień."},{"id":"c","text":"Wyznaczenie dyżuru przygotowania dokumentów przed ich przekazaniem do zespołu sprawdzającego uprawnienia w danej sprawie.","feedback":"Wsparcie poprzedza weryfikację i nie zastępuje jej. Trzeba sprawdzić zasoby i dostępność dyżuru."}],"hint":"Porównaj cel pytania z zakresem każdej odpowiedzi. Ustal, co mierzy lub zakłada każda propozycja."}}},"BO_a":{"task":"Przygotuj alternatywy poprawy możliwości wpływu mieszkańców i ograniczenia barier udziału w kolejnej edycji BO. Uwzględnij grupy pomijane przez dotychczasowe działania.","horizon":"dwie kolejne edycje","baseline":"Obecne zasady udziału, kanały informacji i już zaplanowane działania wsparcia.","trend":"Skład uczestników, zainteresowanie tematami i doświadczenia z realizacją projektów mogą się zmieniać także przy obecnych zasadach.","options":[["accessible","Dostępne dyżury pomocy w zgłaszaniu potrzeb","Dostosowanie miejsca i sposobu wsparcia może ograniczyć bariery udziału."],["outreach","Docieranie do grup słabiej obecnych w BO","Współpraca z lokalnymi organizacjami może ułatwić rozpoznanie pomijanych potrzeb."],["follow","Czytelna informacja o dalszym losie projektów","Wyjaśnienie statusu i przeszkód może pomagać ocenić możliwość wpływu i odpowiedzialność za realizację."],["package","Dostępne wsparcie z informacją o realizacji","Pakiet łączy barierę udziału z wiarygodnością procesu."]],"scale":["Pilotaż w dwóch dzielnicach","Pilotaż w czterech dzielnicach"],"newInfo":"W ośmiu z dwunastu celowo dobranych rozmów osoby znały zasady BO, lecz wskazywały niewiarę w wykonanie projektów. Pięć z tych ośmiu potrzebowało także dostępnego miejsca pomocy. Nie zbadano częstości tych barier w mieście.","limit":"Pilotaż nie zmienia samodzielnie zasad głosowania. CKS może przygotować wsparcie i propozycje oraz uzgodnić działania z dzielnicami.","adaptations":["Dodać informację o realizacji i odpowiedzialności","Dodać dostępny kanał pomocy dla pomijanych grup","Zachować projekt i sprawdzić jego zakres"],"criteria":["Możliwość wpływu: maksymalizować odsetek mieszkańców mogących zgłosić potrzebę i skorzystać z przewidzianych sposobów udziału.","Efektywność kosztowa: minimalizować dodatkowy koszt publiczny i prywatny na dodatkową osobę uzyskującą możliwość udziału względem A0.","Równość możliwości: minimalizować bezwzględną różnicę odsetka osób z możliwością udziału między mieszkańcami z ograniczoną mobilnością a pozostałymi."],"questions":{"scope":{"title":"Który rezultat odpowiada zleceniu dyrektora CKS?","correct":"c","options":[{"id":"a","text":"Krótsza realizacja projektów przydzielonych dzielnicy dzięki wcześniejszemu uzgodnieniu zakresu prac wykonawczych.","feedback":"To centralny rezultat drugiego klienta. Może wpływać na wiarygodność BO, ale nie zastępuje problemu możliwości udziału."},{"id":"b","text":"Większa frekwencja dotychczasowych uczestników oraz częstszy udział autorów wcześniejszych projektów w kolejnej
