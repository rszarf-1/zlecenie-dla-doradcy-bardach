,"text":"Liczba osób mających możliwość zgłoszenia potrzeb i udziału w kolejnej edycji przy danej alternatywie.","feedback":"To łączna możliwość udziału, także istniejąca w A0. Dla kosztu dodatkowej poprawy potrzebna jest różnica rezultatów."},{"id":"c","text":"Przyrost liczby osób mających możliwość zgłoszenia potrzeb i udziału w porównaniu ze scenariuszem A0.","feedback":"To przyrost rezultatu według wspólnej definicji możliwości. Mniejszy koszt jednostki dodatniego efektu jest pożądany."}],"hint":"Porównaj cel pytania z zakresem każdej odpowiedzi. Ustal, co mierzy lub zakłada każda propozycja."},"third":{"title":"Kryterium: równość możliwości osób z ograniczoną mobilnością i pozostałych. Który miernik zastosujesz?","correct":"b","options":[{"id":"a","text":"Minimalizować bezwzględną różnicę odsetka głosujących między mieszkańcami z ograniczoną mobilnością i pozostałymi.","feedback":"Frekwencja zależy od możliwości, zainteresowania i decyzji o udziale. Nie jest bezpośrednią miarą różnicy samych możliwości."},{"id":"b","text":"Minimalizować bezwzględną różnicę odsetka osób z możliwością udziału między mieszkańcami z ograniczoną mobilnością i pozostałymi.","feedback":"Luka możliwości wymaga tej samej definicji dla obu grup. Sprawdzaj również poziom dostępu, aby zmniejszenie luki nie wynikało z pogorszenia."},{"id":"c","text":"Minimalizować bezwzględną różnicę liczby osób z możliwością udziału między mieszkańcami z ograniczoną mobilnością i pozostałymi.","feedback":"Równa liczba przy różnej wielkości grup nie oznacza równości możliwości. Potrzebne są udziały w odpowiednich populacjach."}],"hint":"Porównaj cel pytania z zakresem każdej odpowiedzi. Ustal, co mierzy lub zakłada każda propozycja."},"revision":{"title":"Który element projektu najlepiej odpowiada wskazanym w nowej wiadomości barierom udziału?","correct":"c","options":[{"id":"a","text":"Rozszerzenie liczby wysyłanych instrukcji oraz zwiększenie częstotliwości przypominania terminów głosowania mieszkańcom objętym działaniem.","feedback":"To odpowiada niewiedzy o zasadach i terminach. Wiadomość wskazuje także wiarygodność realizacji i dostępność pomocy."},{"id":"b","text":"Zwiększenie liczby kanałów publikacji zasad oraz ujednolicenie treści komunikatów kierowanych do mieszkańców objętych działaniem.","feedback":"To może poprawiać komunikację zasad, ale nie odpowiada wprost obu ujawnionym barierom."},{"id":"c","text":"Wyjaśnienie stanu realizacji wcześniejszych projektów oraz zapewnienie dostępnego miejsca pomocy mieszkańcom objętym działaniem.","feedback":"To odpowiada wiarygodności realizacji i dostępności pomocy. Zakres i efekt nadal wymagają sprawdzenia."}],"hint":"Porównaj cel pytania z zakresem każdej odpowiedzi. Ustal, co mierzy lub zakłada każda propozycja."},"constraint":{"title":"Która propozycja mieści się w zakresie pilotażu CKS?","correct":"a","options":[{"id":"a","text":"Uruchomienie uzgodnionych z dzielnicami dyżurów pomocy oraz informacji o realizacji projektów wybranych wcześniej przez mieszkańców.","feedback":"To wsparcie i koordynacja w przyjętym mandacie, bez ustanawiania innych zasad głosowania."},{"id":"b","text":"Uruchomienie dodatkowego tygodnia głosowania dla mieszkańców, którzy potrzebują osobistej pomocy przy dokonaniu wyboru projektów.","feedback":"Wydłużenie terminu dla części osób zmienia zasady głosowania. Rozpoznana bariera nie rozszerza mandatu pilotażu."},{"id":"c","text":"Uruchomienie osobnego głosowania dla słabiej reprezentowanych mieszkańców z wydzieloną pulą środków na wybrane projekty.","feedback":"Wydzielenie głosowania i puli zmienia zasady procesu. Taki pomysł wymaga odrębnej propozycji i właściwych decyzji."}],"hint":"Porównaj cel pytania z zakresem każdej odpowiedzi. Ustal, co mierzy lub zakłada każda propozycja."}}},"BO_b":{"task":"Przygotuj sposoby usprawnienia realizacji projektów przydzielonych dzielnicy, ze szczególnym uwzględnieniem etapów przed podpisaniem umowy.","horizon":"realizacja jednej kolejnej edycji","baseline":"Obecne harmonogramy, podział odpowiedzialności i rozpoczęte uzgodnienia projektów.","trend":"Czas uzgodnień, dostępność wykonawców i koszty realizacji mogą zmieniać się także przy obecnej organizacji.","options":[["early","Wczesny przegląd zakresu i zależności projektu","Rozpoznanie niejasnego zakresu lub prawa do terenu może ujawnić przeszkody przed planowaną umową."],["owner","Koordynator z terminami uzgodnień","Jawna odpowiedzialność i harmonogram zależności mogą ograniczać oczekiwanie między jednostkami."],["track","Monitoring etapów z informacją dla autorów","Widoczny stan spraw i opóźnień może ułatwić reakcję i rozliczalność."],["package","Przegląd przygotowania z koordynacją uzgodnień","Pakiet łączy rozpoznanie przeszkód z organizacją ich rozwiązywania."]],"scale":["Pilotaż dla sześciu projektów","Pilotaż dla dwunastu projektów"],"newInfo":"W planie kolejnej edycji cztery z sześciu projektów wymagają uzgodnień z innymi jednostkami. W dwóch harmonogram zakłada ich odpowiedź przed terminem, którego te jednostki nie potwierdziły. Nie ustalono jeszcze terminów dla wszystkich zależności.","limit":"Pilotaż może zmieniać koordynację i harmonogramowanie, lecz nie może pomijać wymaganych uzgodnień ani ograniczać wybranego zakresu projektu wyłącznie dla poprawy terminowości.","adaptations":["Dodać wcześniejsze uzgodnienie zakresu projektu","Dodać harmonogram zależności z innymi jednostkami","Zachować projekt i sprawdzić jego zakres"],"criteria":["Terminowość rezultatu: maksymalizować odsetek projektów oddanych do użytkowania w uzgodnionym zakresie do pierwotnie przyjętego terminu.","Efektywność kosztowa: minimalizować dodatkowy koszt na dodatkowy projekt oddany w terminie i uzgodnionym zakresie względem A0.","Rozliczalność: maksymalizować odsetek projektów z aktualną i zrozumiałą informacją o etapie, przyczynie opóźnienia oraz odpowiedzialności za kolejny krok."],"questions":{"scope":{"title":"Który rezultat odpowiada zleceniu burmistrza dzielnicy?","correct":"b","options":[{"id":"a","text":"Większa liczba mieszkańców uczestniczących w głosowaniu nad projektami kolejnej edycji budżetu obywatelskiego.","feedback":"To inny problem: uczestnictwo w wyborze, a nie realizacja przydzielonych projektów."},{"id":"b","text":"Więcej wybranych projektów dostępnych do użytkowania w uzgodnionym zakresie i planowanym terminie.","feedback":"To rezultat dla mieszkańców. Podpisanie umowy lub przesunięcie harmonogramu go nie zastępuje."},{"id":"c","text":"Krótsze przygotowanie umów wykonawczych oraz sprawniejsze uzgadnianie dokumentacji z wykonawcami wybranych projektów.","feedback":"Umowa jest etapem wymagającym usprawnienia, lecz docelowym rezultatem jest dostępny projekt w uzgodnionym zakresie i terminie."}],"hint":"Porównaj cel pytania z zakresem każdej odpowiedzi. Ustal, co mierzy lub zakłada każda propozycja."},"effect":{"title":"Kryterium: terminowe udostępnienie uzgodnionego projektu. Który miernik zastosujesz?","correct":"c","options":[{"id":"a","text":"Maksymalizować odsetek projektów oddanych do użytkowania w uzgodnionym zakresie do ostatnio zaktualizowanego terminu realizacji.","feedback":"Aktualizacja terminu jest użyteczna w zarządzaniu, lecz nie zachowuje pierwotnego punktu odniesienia. Samo przesunięcie daty mogłoby poprawić wynik."},{"id":"b","text":"Maksymalizować odsetek projektów z podpisaną umową na uzgodniony zakres do pierwotnie przyjętego terminu realizacji.","feedback":"To miernik ważnego etapu, a nie oddania projektu mieszkańcom. Pozostaje do sprawdzenia wykonanie umowy i udostępnienie rezultatu."},{"id":"c","text":"Maksymalizować odsetek projektów oddanych do użytkowania w uzgodnionym zakresie do pierwotnie przyjętego terminu realizacji.","feedback":"Zachowane są rezultat, zakres i wspólny punkt odniesienia. Uzasadnione aktualizacje harmonogramu można opisywać dodatkowo."}],"hint":"Porównaj cel pytania z zakresem każdej odpowiedzi. Ustal, co mierzy lub zakłada każda propozycja."},"cost":{"title":"Liczysz dodatkowy koszt realizacji względem A0. Który mianownik odpowiada terminowemu rezultatowi, przy wspólnym okresie i porównywalnej złożoności projektów?","correct":"a","options":[{"id":"a","text":"Przyrost liczby projektów oddanych w uzgodnionym zakresie do pierwotnego terminu, w porównaniu ze scenariuszem A0.","feedback":"To dodatkowy rezultat spełniający warunek zakresu i stałego terminu. Złożoność projektów trzeba uwzględnić w interpretacji kosztu jednostki."},{"id":"b","text":"Liczba projektów oddanych w uzgodnionym zakresie do pierwotnego terminu, osiągnięta w ocenianej alternatywie.","feedback":"Łączna liczba obejmuje też projekty oddane w A0. Nie jest liczbą dodatkowych terminowych realizacji."},{"id":"c","text":"Przyrost liczby projektów oddanych w uzgodnionym zakresie do zaktualizowanego terminu, w porównaniu ze scenariuszem A0.","feedback":"Zmiana terminu zmienia jednostkę rezultatu. Pozorne polepszenie wskaźnika może wynikać z aktualizacji harmonogramu, nie szybszej realizacji."}],"hint":"Porównaj cel pytania z zakresem każdej odpowiedzi. Ustal, co mierzy lub zakłada każda propozycja."},"third":{"title":"Kryterium: rozliczalność wobec autorów i mieszkańców. Który miernik najlepiej odpowiada temu kryterium?","correct":"b","options":[{"id":"a","text":"Maksymalizować odsetek projektów z regularną informacją o postępach i terminie, publikowaną co miesiąc w trakcie realizacji.","feedback":"Regularność i termin nie zapewniają informacji o przeszkodzie oraz odpowiedzialności za następny krok. To niepełny zakres rozliczalności."},{"id":"b","text":"Maksymalizować odsetek projektów z aktualną, zrozumiałą informacją o etapie, przeszkodzie i odpowiedzialnym za kolejny krok.","feedback":"Treść pozwala ustalić stan sprawy i odpowiedzialność. Dla projektu bez opóźnienia jawnie zaznacz brak przeszkody zamiast wymagać jej istnienia."},{"id":"c","text":"Maksymalizować odsetek projektów z aktualną informacją o etapie i przeszkodzie, przesłaną autorowi po złożeniu zapytania.","feedback":"Odpowiedź wyłącznie po zapytaniu nie daje pozostałym mieszkańcom stałej informacji i nie wskazuje odpowiedzialności za kolejny krok."}],"hint":"Porównaj cel pytania z zakresem każdej odpowiedzi. Ustal, co mierzy lub zakłada każda propozycja."},"revision":{"title":"Który element projektu najlepiej odpowiada nowej wiadomości o zależnościach realizacji?","correct":"a","options":[{"id":"a","text":"Uzgodnienie terminów z odpowiedzialnymi jednostkami oraz wskazanie zależności przed przyjęciem harmonogramu realizacji projektów.","feedback":"To odpowiada niepotwierdzonym terminom zewnętrznych uzgodnień. Sam plan wewnętrzny nie zapewnia ich wykonania."},{"id":"b","text":"Zwiększenie częstotliwości raportowania wykonawców oraz wskazanie terminów odbioru robót w harmonogramie realizacji projektów.","feedback":"To dotyczy wykonania po umowie; nie rozwiązuje ujawnionej niepewności terminów uzgodnień innych jednostek."},{"id":"c","text":"Ujednolicenie opisów projektów dla mieszkańców oraz wskazanie dat publikacji komunikatów w harmonogramie realizacji projektów.","feedback":"To poprawa informacji. Nie zastępuje uzgodnienia terminów, od których zależy realizacja."}],"hint":"Porównaj cel pytania z zakresem każdej odpowiedzi. Ustal, co mierzy lub zakłada każda propozycja."},"constraint":{"title":"Która propozycja respektuje podane warunki usprawnienia?","correct":"c","options":[{"id":"a","text":"Przesunięcie części wybranych prac do kolejnej edycji oraz rozliczenie obecnego projektu według mniejszego zakresu.","feedback":"Rozliczenie okrojonego projektu zmienia zakres wybrany przez mieszkańców, żeby poprawić terminowość. Narusza warunek zlecenia."},{"id":"b","text":"Przesunięcie uzgodnień dotyczących terenu na etap odbioru oraz rozpoczęcie robót według przygotowanej dokumentacji projektu.","feedback":"Przeniesienie wymaganych uzgodnień na odbiór nie pozwala oprzeć rozpoczęcia robót na ich wyniku."},{"id":"c","text":"Przesunięcie przeglądu dokumentacji na początek przygotowania oraz uzgodnienie terminów odpowiedzi jednostek przed planowanym rozpoczęciem robót.","feedback":"Zmienia się kolejność przygotowania i koordynacja, a nie zakres projektu czy wymagania uzgodnień."}],"hint":"Porównaj cel pytania z zakresem każdej odpowiedzi. Ustal, co mierzy lub zakłada każda propozycja."}}}},"measurementNotes":{"GPA_a":"Standard z poprzedniej gry: potrzebny dojazd i powrót, do 60 minut w jedną stronę i koszt do 10% dziennego dochodu. To umowa ćwiczenia. Jednostka dostępności to podróż, a jednostka efektu w kryterium kosztowym to osoba; tej samej osoby nie liczymy wielokrotnie.","GPA_b":"Prognozy porównujemy przy tej samej dacie przygotowania i tych samych jednostkach pieniężnych. Średni błąd bezwzględny liczymy z porównywalnego zestawu kwartałów; błędy ze znakiem nie mogą się wzajemnie znosić.","CP_a":"Poziom T jest umowny. Model PM2,5 obejmuje mieszkańców gminy, także nieuczestniczących w programie. Te same sezony i założenia modelu stosujemy do A0, A1 i A2 w trzyletnim horyzoncie.","CP_b":"Próg 30 dni jest umowny. Mianownik obejmuje sprawy z danego okresu wpływu, dla których minęło co najmniej 30 dni obserwacji. Licznik obejmuje zakończone po progu i nadal otwarte po progu. Nowsze sprawy analizujemy osobno, zamiast liczyć je jako terminowe.","BK2_a":"Grupę docelową, standard nadmiernego obciążenia i sposób liczenia dochodu oraz wydatków ustalamy przed porównaniem. Poprawę sytuacji i jej podział odnosimy do A0. Mniejszą lukę oceniamy łącznie z poprawą dostępności, aby nie wyrównywać przez pogorszenie.","BK2_b":"Próg 12 miesięcy jest umowny. Porównujemy gospodarstwa z tego samego okresu wpisania na listę i z co najmniej roczną obserwacją. Liczymy przekroczenia przy późnych przydziałach oraz w sprawach nadal otwartych. Odpowiedniość lokalu wynika z jawnie ustalonych potrzeb.","SCT_a":"Poziom T jest umowny. Model NO₂ obejmuje mieszkańców ulic wewnątrz strefy i poza nią, przy wspólnych okresach i założeniach. Spadek ruchu lub średniego stężenia nie jest tożsamy ze spadkiem liczby mieszkańców ponad T.","SCT_b":"Próg 10 dni jest umowny. Czas liczymy od pierwszego złożenia; mianownik to sprawy z tego samego okresu wpływu z co najmniej dziesięciodniową obserwacją. Liczymy późno zakończone i nadal otwarte. Osobno mierzymy możliwość złożenia wniosku wśród podejmujących próbę osób z barierą cyfrową.","BO_a":"Możliwość udziału obejmuje zgłoszenie potrzeby i przewidziane sposoby uczestnictwa. Nie wymaga faktycznego oddania głosu. Lukę między grupami liczymy jako wartość bezwzględną różnicy udziałów i czytamy razem z ich poziomem.","BO_b":"Termin oznacza datę przyjętą przed porównaniem, a zakres uzgodniony projekt dostępny do użytkowania. Aktualizacje harmonogramu opisujemy osobno. Informacja o projekcie bez opóźnienia powinna jawnie wskazywać ten stan zamiast fikcyjnej przeszkody."},"costNote":"Efektywność kosztowa odnosi dodatkowe koszty do dodatkowego rezultatu względem A0 w tym samym okresie. Uwzględnij wskazany zakres kosztów instytucji i odbiorców, bez podwójnego liczenia transferów. Przy dodatnim przyroście efektu niższy koszt jego jednostki jest pożądany. Dla A0 nie licz 0/0; zerowy lub ujemny przyrost efektu wymaga osobnego omówienia.","revision":{"version":"2.2.0","date":"2026-11-14","basis":"Wykład v3: kolejność i iteracyjność. Zmienione dwa pytania wspólne. Zlecenia, alternatywy, kryteria i pytania profilowe po audycie 2.1.0 zachowane."},"methodNote":"Kolejność pracy: znane wartości i warunki uwzględniamy od początku. Alternatywy i kryteria rozwijamy w toku analizy. Po uzasadnionej korekcie stosujemy wspólne definicje do wszystkich opcji. Bardach i Patashnik, Wprowadzenie, s. xvi–xvii; polski PDF, s. 16 i 22–23; wykład v3, slajdy 4–8. Inne sekwencje omawiają Patton, Sawicki i Clark; Keeney pokazuje rolę wartości w tworzeniu alternatyw."};</script><script>(function(root){'use strict';

function check(s,id){if(iterative(s)&&id==='transfer'&&!s.transferInitial)throw Error('Najpierw zapisz własny szkic nowego przypadku.');const value=s.choices[id];if(!ids.includes(id)||!['a','b','c'].includes(value))throw Error('Najpierw wybierz odpowiedź.');const a={value,correct:correct(s,id,value),at:stamp(),hinted:!!s.hints[id]};let r=s.checks[id];if(!r)r=s.checks[id]={first:clone(a),last:clone(a),count:0,history:[]};r.count++;r.last=clone(a);r.history.push(clone(a));r.history=r.history.slice(-8);touch(s);return a;}

masz pliku? Rozpoczniesz na przykładowej diagnozie znanego zlecenia.'}</p><p>${matched?'Dla obecnego wyboru użyjemy Twojej wczytanej diagnozy.':oldRecord?'Dla obecnego wyboru użyjemy przykładu dydaktycznego — wczytany plik nie zawiera tej ukończonej ścieżki.':''}</p></div></details><div class="start-settings"><fieldset class="mode"><legend>Jak pracujesz?</legend><label><input type="radio" name="start-mode" value="individual" ${prefs.mode==='individual'?'checked':''}> Indywidualnie</label><label><input type="radio" name="start-mode" value="team" ${prefs.mode==='team'?'checked':''}> W zespole</label></fieldset><label class="team-label" for="start-team">Oznaczenie zespołu (opcjonalne)<input id="start-team" maxlength="50" value="${esc(prefs.team)}" placeholder="np. grupa A"></label></div><div class="actions">${btn(matched?'Kontynuuję z własną diagnozą':'Rozpoczynam na przykładowej diagnozie','start','primary')}${btn('Wczytaj zapis tej gry','storage')}</div><p class="notice">Kolejność rund służy organizacji ćwiczenia. Nie oznacza jednej obowiązkowej kolejności alternatyw i kryteriów w analizie.</p>${FORM?'<p class="meta">Po ukończeniu pięciu rund skopiujesz kod B34.2 do formularza i dodasz indywidualną opinię. Zachowaj JSON jako kopię pracy.</p>':''}<p class="meta">Bez odliczania i rankingu. Możesz wracać do lektury i poprawiać odpowiedzi. Zapisujesz jedną ścieżkę; drugi klient jest dostępny w nowej rozgrywce.</p>${warning?`<p class="notice error">${esc(warning)}</p>`:''}</section><section class="intro-details"><div><h2>Rundy tego ćwiczenia</h2><ol>${E.rounds.map(r=>`<li>${r.title}</li>`).join('')}</ol></div><div><h2>Wspólna metoda, własne zlecenie</h2><p>Wykład pokazuje metodę na przykładach pięciu programów. Tutaj zastosujesz ją do programu i decyzji swojego klienta, a na końcu do krótkiego przypadku domu kultury.</p><p class="meta">Wybory mają wyjaśnienia. Własne argumenty omówisz z prowadzącym. JSON i kod wyniku zawierają także przebieg prób.</p></div></section>`;}
function aside(n){const p=E.context(S);return `<aside class="aside" aria-label="Kontekst zlecenia"><section><p class="eyebrow">${n===5?'Nowy przypadek':esc(p.program.short)}</p><h2>${n===5?'Dom kultury':esc(p.client.short)}</h2><p>${n===5?'Dostęp do zapisów na zajęcia. Warunek: bez nowych etatów.':esc(p.data.task)}</p><p class="meta">${n===5?'Poprzednie zlecenie pozostaje w zapisie. Tutaj stosujesz metodę do innego problemu.':'Horyzont: '+esc(p.data.horizon)+'.'}</p></section><section><h2>Twój postęp</h2><p><span class="big">${S.completed.filter(Boolean).length} / 5</span><br>zatwierdzonych rund</p>${btn('Zobacz zapis roboczy','report','text-button')}<p class="meta">Wypełnienie pola nie oznacza poprawnego uzasadnienia.</p></section><section><p class="meta">Dane i warunki są fikcyjne. Własną analizę K3 oprzyj na rzeczywistych źródłach.</p></section></aside>`;}
function end(n){return `<div id="round-errors" tabindex="-1" hidden></div><div class="end-round">${btn(n===5?'Zakończ grę i otwórz notatkę':'Zatwierdź rundę i przejdź dalej','next','primary',`data-n="${n}"`)}<p class="meta">Sprawdź wybory i zapisz krótkie uzasadnienie, jeśli jest wymagane. Gra nie ocenia automatycznie jakości własnego tekstu.</p></div>`;}
function stage1(){const p=E.context(S);return `<div class="brief"><p class="eyebrow">${esc(p.program.short)} · klient ${S.client.toUpperCase()}</p><h2>${esc(p.client.title)}</h2><p>${esc(p.data.task)}</p><p class="meta">Horyzont porównania: ${esc(p.data.horizon)}.</p></div><section class="doc"><span class="code">Punkt wyjścia z kroków 1–2</span><p class="tag">${S.prior.type==='import'?'Twoja diagnoza wczytana z JSON':'Przykładowa diagnoza dydaktyczna'}</p><p class="written">${esc(S.prior.problem)}</p>${p.key==='GPA_a'?`<p class="meta"><b>Standard podróży w ćwiczeniu:</b> ${esc(p.client.standard.reference)} Potrzebny jest wykonalny dojazd i powrót.</p>`:''}<p class="meta">To punkt wyjścia do sprawdzenia, nie automatycznie zatwierdzony wniosek. Fikcyjnych danych nie przenoś do K3 jako rzeczywistych ustaleń.</p></section><details><summary>Przypomnij możliwości klienta i granice zlecenia</summary><div class="inside"><p><b>Możliwości w symulacji:</b> ${esc(p.client.powers)}</p><p><b>Zależności:</b> ${esc(p.client.limits)}</p><p><b>Poprzednia decyzja:</b> ${esc(p.client.decision)}</p></div></details>${E.iterative(S)?`<div class="doc"><span class="code">Warunek znany od początku</span><p>${esc(p.data.limit)}</p></div>`:''}${question('scope')}${E.iterative(S)?'':`<div class="doc"><span class="code">Doświadczenie innego miejsca</span><p>Na etapie tworzenia alternatyw dociera raport o obszarze Y. Po kilku równoległych zmianach sytuacja się poprawiła. Raport nie oddziela skutków poszczególnych działań, a warunki w X i Y różnią się.</p></div>`}${question('evidence')}`;}
function planHtml(initial=false){return E.plan(S,initial).map((x,i)=>`<div class="plan"><strong>A${i}</strong><p>${esc(x.slice(4))}</p></div>`).join('');}
function optionCards(){const d=E.context(S).data;return `<div class="instrument-grid">${d.options.map(o=>`<section class="instrument"><h3>${esc(o[1])}</h3><p>${esc(o[2])}</p><div class="actions">${['alt1','alt2'].map((k,i)=>btn(S.params[k]===o[0]?`Wybrane A${i+1}`:`Użyj jako A${i+1}`,'alternative','small',`data-key="${k}" data-value="${o[0]}" aria-pressed="${S.params[k]===o[0]}"`)).join('')}</div></section>`).join('')}</div>`;}
function stage2(){const d=E.context(S).data;return `${E.explicitReview(S)?`<p class="notice">${esc(E.sequenceNote)}</p>`:''}<p class="lede">${E.iterative(S)?'Rozpoznaj mechanizmy i zbuduj roboczy zestaw A0, A1 i A2. Uwzględnij znany cel i warunek klienta.':'Najpierw rozpoznaj różne mechanizmy. Następnie zbuduj roboczy zestaw A0, A1 i A2.'}</p><div class="doc"><span class="code">Obecny sposób działania</span><p>${esc(d.baseline)}</p><p>${esc(d.trend)}</p></div>${question('baseline')}${question('variant')}<h2>Wybierz dwa sposoby działania</h2><p>To propozycje do rozwinięcia, nie ranking skuteczności. Możesz wybrać inne dwie z podanych czterech. Składniki pakietu mogą się uzupełniać.</p><div id="instrument-cards">${optionCards()}</div><fieldset class="question"><legend>Robocza skala obu propozycji</legend><div class="options">${d.scale.map((t,i)=>`<label class="option"><input type="radio" name="scale" data-param="scale" value="${i}" ${S.params.scale===String(i)?'checked':''}><span>${esc(t)}</span></label>`).join('')}</div></fieldset><p class="meta">Skala jest założeniem do sprawdzenia. Nie znamy jeszcze kosztów ani wyników; nie przypisujemy punktów za większy zakres.</p><div id="plan-preview">${planHtml()}</div>${field('mechanism','Wyjaśnij mechanizm obu opcji: działanie → zachowanie lub przebieg procesu → pożądany rezultat. Wskaż istotny warunek, jeśli jest potrzebny.')}`;}
function stage3(){return `${E.explicitReview(S)?'<p class="notice">Teraz zapisujesz robocze kryteria. Można je rozpoznawać przed alternatywami i rozwijać wraz z nimi; numer rundy oznacza miejsce zapisu w ćwiczeniu.</p>':''}<p class="lede">Ustal sposób porównania A0, A1 i A2 przed prognozowaniem wyników.</p><div class="notice"><strong>Kryterium → miernik → kierunek</strong><p>Kryterium wskazuje cenioną wartość. Miernik określa, co obserwujesz lub prognozujesz. Kierunek mówi, jaka zmiana jest pożądana.</p></div><p>Rozpoznaj mierniki trzech roboczych kryteriów tego zlecenia. W uzasadnieniu możesz wskazać brakującą wartość albo zastrzeżenie do zestawu.</p>${question('effect')}${question('cost')}${question('third')}${field('why',E.iterative(S)?'Powiąż kryteria z celem lub warunkiem znanym przed wyborem działań. Wskaż jedno ograniczenie miernika.':'Powiąż kryteria z problemem i decyzją klienta. Wskaż napięcie między wartościami lub ograniczenie jednego miernika.')}${E.iterative(S)?'<p class="meta">Przy zatwierdzeniu zachowasz pierwsze uzasadnienie kryteriów. Po nowej wiadomości wrócisz do niego wraz z alternatywami.</p>':''}<p class="meta">Uzasadnienia dotyczą wartości i jakości pomiaru. W tej grze nie nadajemy wag procentowych ani nie wybieramy zwycięskiej alternatywy.</p>`;}
function revisionWorkLegacy(){if(!E.supportVisible(S,'revision'))return '<p class="meta">Po sprawdzeniu pierwszego wyboru otworzysz własną aktualizację projektu.</p>';const d=E.context(S).data;return `<fieldset class="question"><legend>Robocza reakcja na wiadomość</legend><div class="options">${d.adaptations.map((t,i)=>`<label class="option"><input type="radio" name="adaptation" data-param="adaptation" value="${i}" ${S.params.adaptation===String(i)?'checked':''}><span>${esc(t)}</span></label>`).join('')}</div></fieldset><p class="meta">Każdy z tych wyborów wymaga własnego uzasadnienia. W tekście możesz zaproponować inne rozwiązanie lub wyjaśnić, do której alternatywy odnosi się zmiana.</p>${E.iterative(S)?`<fieldset class="question"><legend>Zakres Twojej rewizji</legend><div class="options">${Object.entries(E.reviewLabels).map(([id,label])=>`<label class="option"><input type="radio" name="review" data-param="review" value="${id}" ${S.params.review===id?'checked':''}><span>${label}</span></label>`).join('')}</div></fieldset><p class="meta">Ten wybór nie ma klucza ani punktów. Zmianę kryterium opisz w uzasadnieniu, odnosząc ją do A0, A1 i A2. Możesz podtrzymać zestaw, jeśli nadal obejmuje istotne skutki.</p>`:''}${field('revision',E.iterative(S)?'Na podstawie wiadomości uzasadnij wybrany zakres rewizji lub podtrzymanie. Podaj konkretną zmianę albo warunek do sprawdzenia; zmienione kryterium zastosuj do wszystkich opcji.':'Odwołaj się do nowej wiadomości, wskaż zmianę lub powód podtrzymania oraz jeden warunek wymagający sprawdzenia.')}`;}
function revisionWork(){if(!E.explicitReview(S))return revisionWorkLegacy();if(!E.supportVisible(S,'revision'))return '<p class="meta">Po sprawdzeniu pytania ocenisz własny projekt. Sprawdzenie przesłanki nie oznacza obowiązku zmiany.</p>';return `<fieldset class="question"><legend>Wynik przeglądu Twojego projektu</legend><div class="options">${Object.entries(E.reviewLabels).map(([id,label])=>`<label class="option"><input type="radio" name="review" data-param="review" value="${id}" ${S.params.review===id?'checked':''}><span>${label}</span></label>`).join('')}</div></fieldset><p class="meta">Zaznacz zakres zmiany albo podtrzymanie projektu. Żaden wybór nie jest domyślny ani punktowany. Jeśli projekt i kryteria już obejmują rozpoznany mechanizm, możesz je podtrzymać.</p>${field('revision','Wyjaśnij, co nowa wiadomość wnosi do Twojego projektu i dlaczego go zmieniasz albo podtrzymujesz. Wskaż konkretny powód lub warunek do sprawdzenia. Jeśli zmieniasz kryterium, zastosuj je do A0, A1 i A2.')}`;}
function criteriaHistory(){if(!E.iterative(S)||!S.initialCriteria)return '';return `<section class="first-plan"><h2>Pierwsze kryteria i uzasadnienie</h2>${S.initialCriteria.criteria.map(t=>`<p>${esc(t)}</p>`).join('')}<p class="written">${esc(S.initialCriteria.why)}</p>${S.texts.why!==S.initialCriteria.why?`<h3>Bieżące uzasadnienie po powrocie</h3><p class="written">${esc(S.texts.why)}</p>`:''}<p class="meta">Zestaw wyjściowy pozostaje zapisany. Uzasadnienie przeglądu może dotyczyć jego korekty albo podtrzymania.</p></section>`;}
function stage4(){const d=E.context(S).data;return `<p class="lede">Wróć do projektu po nowej informacji. Zmiana i uzasadnione podtrzymanie są dopuszczalne.</p><div class="brief"><p class="eyebrow">Nowa wiadomość</p><p>${esc(d.newInfo)}</p></div><section class="first-plan"><h2>Twój pierwszy projekt</h2>${E.plan(S,true).slice(1).map(x=>`<p>${esc(x)}</p>`).join('')}<p class="written">${esc(S.initialPlan.mechanism)}</p><p class="meta">Pierwsza wersja pozostaje zachowana w wyniku.</p></section>${criteriaHistory()}${E.explicitReview(S)?'<p class="notice">Pytanie poniżej dotyczy tego, co warto sprawdzić w świetle wiadomości. O tym, czy zmieniać własny projekt, rozstrzygniesz następnie na podstawie jego dotychczasowej treści.</p>':''}${question('revision')}<div id="revision-work">${revisionWork()}</div><div class="doc"><span class="code">Warunek tego zlecenia</span><p>${esc(d.limit)}</p></div>${question('constraint')}<details><summary>Cztery pytania o wykonalność</summary><div class="inside"><p><b>Legalność:</b> jakie są uprawnienia i reguły?<br><b>Akceptowalność polityczna:</b> kto poprze lub zablokuje zmianę?<br><b>Odporność administracyjna i podatność na ulepszenia:</b> czy projekt zniesie trudności i da się poprawiać?<br><b>Trwałość:</b> czy działanie utrzyma się w czasie?</p></div></details>`;}
function stage5Legacy(){return `<p class="lede">Krótka wspólna próba zastosowania metody w innym przypadku. Przykład odpowiedzi zobaczysz dopiero po zapisaniu własnego szkicu.</p><div class="brief"><p class="eyebrow">Dom kultury · dane fikcyjne</p><p>Zapisy odbywają się wyłącznie przez internet. Sześciu z dziesięciu celowo dobranych seniorów zgłasza trudność z zapisem. Nie przewidziano nowych etatów. Można zmienić organizację istniejących dyżurów.</p></div>${question('transfer')}${field('transferAction','Napisz, kto co zrobi, dla kogo i w jakim czasie. Uwzględnij ograniczenie etatów i nie wpisuj obietnicy sukcesu w nazwę działania.')}${field('transferMeasure','Nazwij ceniony rezultat, miernik i kierunek. Określ grupę lub okres; dodatkowy próg oznacz jako umowny.')}<div class="notice"><strong>Przed zatwierdzeniem</strong><p>Oddziel wykonane działanie od rezultatu. Sprawdź zakres danych i to, kogo Twój miernik pomija.</p></div>`;}
function stage5(){if(!E.iterative(S))return stage5Legacy();return `<p class="lede">Najpierw zapisz własny szkic. Następnie rozważ, jak nowa alternatywa wpływa na wspólny miernik.</p><div class="brief"><p class="eyebrow">Dom kultury · dane fikcyjne</p><p>Zapisy odbywają się wyłącznie przez internet. Sześciu z dziesięciu celowo dobranych seniorów zgłasza trudność z zapisem. Nie przewidziano nowych etatów. Można zmienić organizację istniejących dyżurów.</p><p class="meta">Rozmowy wskazują barierę. Nie określają jej częstości wśród wszystkich seniorów z obszaru.</p></div>${field('transferAction','Napisz, kto co zrobi, dla kogo i w jakim czasie. Uwzględnij ograniczenie etatów i nie wpisuj obietnicy sukcesu w nazwę działania.')}${field('transferMeasure','Nazwij ceniony rezultat, miernik i kierunek. Określ grupę lub okres; dodatkowy próg oznacz jako umowny.')}<div id="transfer-comparison">${S.transferInitial?`<p class="notice">Pierwszy szkic zachowano. Możesz później poprawić te same dwa pola. Zapis rozróżni wersję sprzed pytania i bieżącą.</p><h2>Porównanie w innym szkicu zespołu</h2><p class="meta">Poniższa sytuacja nie narzuca działania, które masz wybrać we własnym szkicu.</p>${question('transfer')}`:`<div class="actions">${btn('Zapisz szkic i otwórz pytanie','capture-transfer','primary')}</div><p class="meta">Pytanie i jego odpowiedzi pojawią się po zapisaniu obu fragmentów. Gra nie ocenia automatycznie jakości szkicu.</p>`}</div>`;}
function documentHtml(){const p=E.context(S);return `<div class="document"><p class="eyebrow">${esc(p.program.short)} · klient ${S.client.toUpperCase()}</p><h2>${esc(p.client.short)}</h2><p>${esc(p.data.task)}</p><p><b>Horyzont:</b> ${esc(p.data.horizon)}.</p><details><summary>Diagnoza wyjściowa (${S.prior.type==='import'?'wczytana':'przykład'})</summary><p class="written">${esc(S.prior.problem)}</p></details><h2>Alternatywy do porównania</h2>${planHtml()}<h3>Mechanizm</h3><p class="written">${esc(S.texts.mechanism)}</p><h2>Wspólne kryteria</h2>${p.data.criteria.map(t=>`<p>${esc(t)}</p>`).join('')}${E.measurementNotes(S)?`<p class="meta">${esc(E.measurementNotes(S))}</p>`:''}<h3>Uzasadnienie</h3><p class="written">${esc(S.texts.why)}</p>${criteriaHistory()}<h2>Aktualizacja projektu</h2>${E.iterative(S)?`<p><b>Zakres:</b> ${esc(E.reviewLabels[S.params.review])}.</p><p class="meta">Powyżej widzisz zestaw wyjściowy z gry. Uzasadnienie poniżej wyjaśnia zmianę albo podtrzymanie projektu.</p>`:''}${E.explicitReview(S)?'':`<p><b>Zaznaczona propozycja:</b> ${esc(p.data.adaptations[Number(S.params.adaptation)])}.</p><p class="meta">W tej starszej wersji propozycja mogła pozostać domyślna. O faktycznej decyzji mówi uzasadnienie.</p>`}<p class="written">${esc(S.texts.revision)}</p><p><b>Warunek:</b> ${esc(p.data.limit)}</p><h2>Nowy przypadek — dom kultury</h2><p class="written">${esc(S.texts.transferAction)}</p><p class="written">${esc(S.texts.transferMeasure)}</p><p class="source">Własne argumenty wymagają omówienia. Fikcyjnych danych gry nie traktuj jako rzeczywistych ustaleń o programie.</p></div>`;}
function safeCode(){const code=E.encode(S),r=E.decode(code);if(r.session!==S.session||r.program!==S.program||r.client!==S.client)throw Error('Kontrola kodu nie powiodła się. Pobierz JSON.');return code;}
function modelAnswer(){return `<div class="notice good"><p><b>Działanie:</b> dom kultury przeznacza dwa obecne dyżury tygodniowo przez trzy miesiące na osobistą i telefoniczną pomoc seniorom przy zapisie.</p><p><b>Kryterium i miernik:</b> zwiększać dostępność — maksymalizować odsetek seniorów podejmujących próbę zapisu, którzy kończą go w ciągu siedmiu dni.</p>${E.iterative(S)?'<p><b>Powrót do kryterium:</b> po dodaniu kanału kontaktu sprawdzamy, czy miernik obejmuje próby we wszystkich dostępnych kanałach. Jeśli miernik wymaga korekty, wspólną definicję stosujemy również do A0 i ponownie szacujemy wartości. Jeśli już obejmuje ważne kanały i grupy, można go podtrzymać.</p>':''}<p><b>Granica:</b> siedem dni to umowny próg. Trzeba rejestrować także nieudane próby; miernik pomija osoby, które w ogóle nie rozpoczną zapisu. Należy sprawdzić obciążenie pracowników. Inne uzasadnione rozwiązania są dopuszczalne.</p></div>`;}
function final(){const p=E.context(S),t=E.stats(S);return `<section class="report"><p class="eyebrow">Pięć rund zatwierdzonych</p><h1>Masz materiał do porównania.</h1><p class="lede">${esc(p.program.short)} · ${esc(p.client.short)}. Wybory zostały sprawdzone; jakość własnych argumentów omówisz z prowadzącym.</p>${documentHtml()}${FORM?'<section class="survey-section"><h2>Twoja opinia</h2><p>Czas pracy, jasność poleceń i ilość informacji ocenisz w formularzu przy oddawaniu kodu. Przy pracy zespołowej każda osoba przekazuje własną opinię.</p></section>':`<section class="survey-section"><h2>Krótka opinia — dobrowolnie</h2><p class="meta">Opinia trafi do kodu i pliku. W trybie zespołowym jest wspólna; indywidualne opinie można zebrać osobno.</p><div class="survey">${[['clarity','Jasność poleceń'],['load','Ilość informacji'],['time','Mój czas pracy']].map(([id,label])=>`<label for="survey-${id}">${label}<select id="survey-${id}" data-survey="${id}">${E.survey[id].map(v=>`<option value="${v}" ${S.feedback[id]===v?'selected':''}>${v||'Pomiń / nie odpowiadam'}</option>`).join('')}</select></label>`).join('')}<label class="full" for="survey-comment">Co warto poprawić lub zachować?<textarea id="survey-comment" data-survey="comment" maxlength="600">${esc(S.feedback.comment)}</textarea></label></div></section>`}<section class="export-panel"><h2>Zachowaj i oddaj pracę</h2><p>${FORM?'Pobierz JSON jako kopię. Skopiuj cały kod B34.2 i otwórz formularz, aby go wkleić oraz dodać własną opinię. Wysłanie następuje dopiero po użyciu „Prześlij” w formularzu i pojawieniu się potwierdzenia.':'Pobierz JSON albo skopiuj kod B34.2 do miejsca wskazanego przez prowadzącego. Samo zapisanie lub kopiowanie nie wysyła pracy.'}</p><div class="actions">${btn('Pobierz zapis JSON','json','primary')}${btn('Pobierz notatkę TXT','txt')}${btn('Drukuj notatkę / PDF','print')}</div><label for="result-code"><strong>Kod ukończonej gry · ${esc(p.program.short)} · klient ${S.client.toUpperCase()}</strong></label><textarea id="result-code" class="codebox" readonly spellcheck="false">${esc(safeCode())}</textarea><p id="code-status" class="meta">Kod odczytano kontrolnie: zawiera właściwy program, klienta i ukończoną grę.</p><div class="actions">${btn('Kopiuj cały kod','copy','primary')}${FORM?`<a class="button-link primary" href="${esc(FORM)}" target="_blank" rel="noopener noreferrer">Otwórz formularz wyniku i opinii</a>`:''}</div><p class="meta">Kod zawiera własne wypowiedzi i przebieg pracy. Nie wpisuj go ręcznie. ${FORM?'Każda osoba wysyła własne zgłoszenie z konta UW; kod zespołu może być wspólny. Program i klient są już w kodzie.':'Miejsce oddania wskaże prowadzący.'}</p></section><details class="no-print"><summary>Próby i podpowiedzi</summary><p>Pierwsze poprawne: ${t.firstCorrect}/${t.answered}. Pierwsze poprawne bez wcześniejszej podpowiedzi: ${t.firstCorrectWithoutHint}/${t.firstWithoutHint}. Ostatnie poprawne: ${t.finalCorrect}/${t.total}.</p><p>Podpowiedzi: ${t.hints}; próby: ${t.attempts}. To opis przebiegu, nie niezależny pomiar uczenia. „Bez podpowiedzi” dotyczy wyłącznie przycisku w grze.</p></details><section class="no-print"><h2>Omów próbę z domu kultury</h2>${S.modelSeenAt?modelAnswer():btn('Pokaż przykładową odpowiedź','model')}<p class="meta">Pierwszy szkic pozostaje zachowany także po późniejszej poprawce.</p></section><section><h2>Przejście do K3</h2><p>Część 3: alternatywy i trzy wspólne kryteria z miernikami oraz uzasadnieniem. Część 5: warunki wdrożenia. Prognozowanie wyników to kolejny krok Bardacha.</p><p class="meta">W K3 sprawdź zakres własnej diagnozy, kompetencje klienta, datę i źródło. Zestaw kryteriów z gry jest roboczym przykładem, który możesz w uzasadniony sposób zmienić.</p></section></section>`;}
function render(focus=true){progress();if(!S)$('#main').innerHTML=intro();else if(S.screen===6)$('#main').innerHTML=final();else{const n=S.screen,r=E.rounds[n-1];$('#main').innerHTML=`<div class="layout"><article><header class="stage-head" tabindex="-1"><p class="eyebrow">Runda ${n} / 5 · ${r.time}</p><h1>${r.title}</h1><p class="source">Polski PDF: s. ${r.pages} · wykład v4: slajdy ${r.slides}. Odsyłacze dotyczą metody; dane zlecenia są odrębną symulacją.</p></header>${[stage1,stage2,stage3,stage4,stage5][n-1]()}${end(n)}</article>${aside(n)}</div>`;}status();if(focus){window.scrollTo({top:0,behavior:'instant'});($('.stage-head')||$('#main h1'))?.focus?.({preventScroll:true});}}
function refreshCode(){if($('#result-code')){$('#result-code').value=safeCode();$('#code-status').textContent='Kod odświeżono i odczytano kontrolnie. Skopiuj aktualną wersję po zmianach.';}}
function download(name,text,type){const u=URL.createObjectURL(new Blob([text],{type})),a=document.createElement('a');a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),1500);tell('Plik przekazano do pobrania. Sprawdź folder pobranych plików.');}
function exportFile(kind){if(!S)throw Error('Najpierw rozpocznij grę lub wczytaj zapis.');save();const s=E.validate(S),name=`Bardach34_v2_${s.program}_${s.client}_${s.submissionStage}_${s.session.slice(0,8)}`;download(name+(kind==='json'?'.json':'.txt'),kind==='json'?JSON.stringify(s,null,2):E.report(s),kind==='json'?'application/json;charset=utf-8':'text/plain;charset=utf-8');refreshCode();}
function storage(){modal('Zapis i odczyt pracy',`${S?`<p>${esc(E.context(S).program.short)} · klient ${S.client.toUpperCase()} · <b>${S.submissionStage==='final'?'ukończona gra':'zapis roboczy'}</b>, ${S.completed.filter(Boolean).length}/5 rund.</p><div class="actions">${btn('Pobierz JSON','json','primary')}${btn('Pobierz notatkę TXT','txt')}${btn('Pokaż kod','show-code')}</div>`:'<p>Wczytaj zapis tej gry B34.2. Diagnozę z kroków 1–2 wczytuje się na ekranie wyboru programu.</p>'}<label for="import-file">Plik JSON lub TXT z kodem B34.2</label><input id="import-file" type="file" accept=".json,.txt"><label for="import-code">Lub wklej kod B34.2</label><textarea id="import-code" spellcheck="false"></textarea><div class="actions">${btn('Sprawdź zapis do wczytania','import','primary')}${btn('Odczytaj zapis z przeglądarki','load-local')}${btn('Przywróć poprzednią kopię','backup')}</div><div id="import-error" role="status"></div><details><summary>Inny program lub nowa rozgrywka</summary><p>Zmiana klienta rozpoczyna osobną sesję. Najpierw pobierz obecną pracę.</p>${btn('Rozpocznij nową grę','reset','danger')}</details>`);}
function preview(text){pending=E.importText(text);const p=E.context(pending);modal('Sprawdzony zapis do wczytania',`<p><b>${esc(p.program.name)} · klient ${pending.client.toUpperCase()}</b></p><p>${esc(p.client.short)}. ${pending.completed.filter(Boolean).length}/5 rund; ${pending.submissionStage==='final'?'ukończona gra':'zapis roboczy'}.</p><p class="meta">Wersja pytań: ${esc(pending.version)}<br>Sesja: ${esc(pending.session)}<br>Zapis: ${esc(pending.savedAt)}</p><p>Wczytanie zastąpi pracę w tej karcie. Obecny zapis możesz wcześniej pobrać.</p><div class="actions">${S?btn('Pobierz obecną pracę','json'):''}${btn('Wczytaj ten zapis','confirm-import','primary')}${btn('Anuluj','close-dialog')}</div>`);}
function help(){modal('Pojęcia pod ręką',`<dl class="glossary"><dt>Alternatywa</dt><dd>Kto robi co, dla kogo i w jakiej skali (PDF s. 5–6, 17).</dd><dt>A0 — kontynuacja</dt><dd>Dotychczasowe działania wraz ze zmianami otoczenia, bez nowej decyzji zlecenia (s. 7–8).</dd><dt>Wariant i pakiet</dt><dd>Wariant zmienia parametr działania. Pakiet łączy działania, których mechanizmy mogą się uzupełniać (s. 14–19).</dd><dt>Kryterium, miernik, kierunek</dt><dd>Co cenisz; jak to obserwujesz lub prognozujesz; jaka zmiana jest pożądana (s. 22–23, 38–44).</dd><dt>Produkt i rezultat</dt><dd>Wykonana usługa oraz zmiana sytuacji, do której ma się przyczynić. Liczba usług sama nie dowodzi rezultatu (s. 24–25, 42–44).</dd><dt>Kolejność i powroty</dt><dd>Znane cele i warunki uwzględniamy przy tworzeniu działań. Nowy skutek może wymagać przeglądu kryteriów. Wspólna definicja obejmuje wszystkie alternatywy. Kolejność kroków porządkuje pracę, a uzasadniony powrót jest częścią analizy (wykład v4, slajdy 4–8).</dd><dt>Ograniczenie</dt><dd>Warunek dopuszczalności, np. limit zasobów, z jawnym źródłem (s. 38–41).</dd></dl>${S?`<p class="notice"><b>Twój przykład A0:</b> ${esc(E.context(S).data.baseline)} ${esc(E.context(S).data.trend)}</p>`:''}<p class="meta">Podstawa: polski PDF do kroków 3–4, 56 stron. Dalsze pytania: legalność, akceptowalność polityczna, odporność administracyjna i podatność na ulepszenia, trwałość (s. 32–38).</p>`);}
document.addEventListener('input',e=>{const el=e.target;try{if(el.id==='start-team')prefs.team=el.value;if(el.dataset.text){E.updateText(S,el.dataset.text,el.value);save();$('#'+el.dataset.text+'-count').textContent=el.value.length+' / '+E.fields[el.dataset.text].max;progress();}if(el.dataset.survey){S.feedback[el.dataset.survey]=el.value;save();refreshCode();}}catch(err){tell(err.message);}});
document.addEventListener('change',async e=>{const el=e.target;try{if(el.name==='start-client'){prefs.client=el.value;render(false);}if(el.name==='start-mode')prefs.mode=el.value;if(el.dataset.choice){E.choose(S,el.dataset.choice,el.value);save();refreshQuestion(el.dataset.choice);$('#'+el.id)?.focus({preventScroll:true});progress();}if(el.dataset.param){E.updateParam(S,el.dataset.param,el.value);save();if($('#plan-preview'))$('#plan-preview').innerHTML=planHtml();progress();}if(el.dataset.survey){S.feedback[el.dataset.survey]=el.value;save();refreshCode();}if(el.id==='previous-file'&&el.files[0]){if(el.files[0].size>350000)throw Error('Plik jest zbyt duży.');oldRecord=E.previousFile(await el.files[0].text());prefs.program=oldRecord.program;prefs.client=oldRecord.routes[prefs.client]?prefs.client:Object.keys(oldRecord.routes)[0];render(false);tell('Wczytano diagnozy poprzedniej gry. Sprawdź program i klienta przed rozpoczęciem.');}if(el.id==='import-file'&&el.files[0]){if(el.files[0].size>300000)throw Error('Plik jest zbyt duży.');preview(await el.files[0].text());}}catch(err){if($('#import-error'))$('#import-error').textContent=err.message;else if($('#previous-status'))$('#previous-status').textContent=err.message;tell(err.message);}});
document.addEventListener('click',async e=>{const b=e.target.closest('[data-action]');if(!b)return;try{const a=b.dataset.action;
 if(a==='capture-transfer'){E.captureTransfer(S);save();render(false);$('#transfer-comparison').scrollIntoView({block:'start'});tell('Pierwszy szkic zapisany. Teraz rozważ wspólny miernik.');}
 if(a==='program'){prefs.program=b.dataset.program;render(false);}
 if(a==='start'){S=E.fresh(prefs.program,prefs.client);S.mode=prefs.mode;S.team=prefs.team.trim();if(oldRecord?.program===S.program&&oldRecord.routes[S.client])E.usePrevious(S,oldRecord);save();render();}
 if(a==='nav'){const n=Number(b.dataset.n);if(n<=E.maxScreen(S)){S.screen=n;save();render();}}
 if(a==='check'){E.check(S,b.dataset.id);save();refreshQuestion(b.dataset.id,true);}
 if(a==='hint'){S.hints[b.dataset.id]=true;save();refreshQuestion(b.dataset.id);$('#q-'+b.dataset.id+' .hint')?.scrollIntoView({block:'nearest'});}
 if(a==='alternative'){E.updateParam(S,b.dataset.key,b.dataset.value);save();$('#instrument-cards').innerHTML=optionCards();$('#plan-preview').innerHTML=planHtml();progress();tell('Zmieniono '+(b.dataset.key==='alt1'?'A1':'A2')+'.');}
 if(a==='next'){try{E.finishRound(S,Number(b.dataset.n));save();render();}catch(err){const el=$('#round-errors');el.hidden=false;el.className='errors';el.innerHTML='<strong>Jeszcze chwila</strong><ul>'+err.message.split('\n').map(x=>`<li>${esc(x)}</li>`).join('')+'</ul>';el.focus();}}
 if(a==='help')help();if(a==='storage')storage();if(a==='close-dialog')close();if(a==='json'||a==='txt')exportFile(a);if(a==='print')window.print();
 if(a==='report')modal(S.submissionStage==='final'?'Notatka końcowa':'Zapis roboczy',`<pre class="written">${esc(E.report(S))}</pre>`);
 if(a==='show-code'){save();modal('Kod '+(S.submissionStage==='final'?'ukończonej gry':'zapisu roboczego'),`<p>${esc(E.context(S).program.short)} · klient ${S.client.toUpperCase()}. ${S.submissionStage==='final'?'Ukończona gra.':'Kopia postępu; nie jest ukończoną grą.'}</p><textarea id="dialog-code" class="codebox" readonly>${esc(safeCode())}</textarea><div class="actions">${btn('Kopiuj cały kod','copy','primary')}${btn('Pobierz kod TXT','code-file')}</div>`);}
 if(a==='copy'){const code=safeCode(),area=$('#dialog-code')||$('#result-code');if(area)area.value=code;try{if(!navigator.clipboard?.writeText)throw Error();await navigator.clipboard.writeText(code);tell('Skopiowano cały sprawdzony kod. Nic nie zostało wysłane.');}catch{if(area){area.focus();area.select();tell('Kod zaznaczono. Skopiuj ręcznie: Ctrl+C lub polecenie Kopiuj.');}else throw Error('Otwórz widok kodu, aby go skopiować.');}}
 if(a==='code-file')download(`Bardach34_${S.program}_${S.client}_${S.submissionStage}_kod.txt`,safeCode(),'text/plain;charset=utf-8');
 if(a==='import')preview($('#import-code').value);
 if(a==='confirm-import'){if(!pending)throw Error('Najpierw sprawdź zapis.');backup();S=pending;conflict=false;close();save();render();tell('Wczytano sprawdzony zapis.');}
 if(a==='load-local'||a==='backup'){const raw=localStorage.getItem(E.KEY+(a==='backup'?'-backup':''));if(!raw)throw Error('Brak takiego zapisu w tej przeglądarce.');preview(raw);}
 if(a==='reset')modal('Nowa rozgrywka',`<p>Nowa sesja pozwoli wybrać inny program i klienta. Zachowaj obecną pracę w JSON, zanim ją zastąpisz.</p><div class="actions">${S?btn('Pobierz obecną pracę','json'):''}${btn('Potwierdzam nową grę','confirm-reset','danger')}${btn('Anuluj','close-dialog')}</div>`);
 if(a==='confirm-reset'){backup();if(S){prefs.program=S.program;prefs.client=S.client;}S=null;oldRecord=null;conflict=false;try{localStorage.removeItem(E.KEY);}catch{}close();render();tell('Możesz wybrać program i klienta nowej sesji.');}
 if(a==='model'){S.modelSeenAt=S.modelSeenAt||E.stamp();save();const top=window.scrollY;render(false);window.scrollTo(0,top);tell('Pokazano przykład; pierwszy szkic pozostaje zachowany.');}
}catch(err){if($('#import-error'))$('#import-error').textContent=err.message;tell(err.message||'Nie udało się wykonać czynności.');}});
window.addEventListener('storage',e=>{if(e.key===E.KEY&&S&&e.newValue!==JSON.stringify(S)){conflict=true;status();}});render(false);
})();

</script></body></html>
