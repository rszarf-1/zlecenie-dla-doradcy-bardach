</style></head><body><a class="skip" href="#main">Przejdź do zadania</a><header class="topbar"><div class="wrap"><div class="brand">Pracownia decyzji<span>BARDACH · KROKI 3 I 4</span></div><div class="tools"><button type="button" class="small" data-action="help">Słowniczek</button><button type="button" class="small" data-action="storage">Zapis / odczyt</button></div></div></header><div class="wrap"><nav class="stepper" id="stepper" aria-label="Rundy gry" hidden></nav><main id="main"><p>Wczytywanie gry…</p></main></div><footer class="statusline"><div class="wrap"><span id="save-status" role="status"></span><span class="meta" id="version-label">Fikcyjne zlecenia dydaktyczne · v2.2.1</span></div></footer><div class="wrap footer-note">Podstawa: polski PDF do kroków 3–4 (56 stron) i prezentacja wykładowa. Materiały otrzymasz od prowadzącego.</div><dialog id="dialog"><header><h2 id="dialog-title"></h2><button type="button" class="small" data-action="close-dialog">Zamknij</button></header><div id="dialog-content" class="dialog-content"></div></dialog><div id="toast" class="toast" role="status" aria-live="polite"></div><noscript><p>Gra wymaga włączonego JavaScript. Samodzielny plik HTML działa bez internetu.</p></noscript><script>window.B34Previous=[{"id":"GPA","name":"Grodziskie Przewozy Autobusowe / FRPA","short":"GPA / FRPA","clients":[{"id":"a","title":"Zarząd Związku Powiatowo-Gminnego „Grodziskie Przewozy Autobusowe”","short":"Zarząd GPA","decision":"Jakie trudności podróży uwzględnić w przygotowaniu korekty oferty na kolejny kwartał?","powers":"Przygotowuje i organizuje zmiany oferty w ramach uzgodnionych zasobów.","limits":"Finansowanie i wykonanie wymagają uzgodnień z właściwymi organami, gminami i operatorem.","example":"W badanej próbie 80 z 200 osób nie mogło odbyć potrzebnej podróży i powrotu przy standardzie z D1. D2 uzasadnia skupienie części dalszej analizy na powrotach po późnej zmianie, bez uznania tej bariery za jedyną.","focus":"Dostępność potrzebnych podróży osób bez auta, powiązana z decyzją o korekcie oferty.","standard":{"value":"Dostępność potrzebnej podróży i powrotu.","reference":"W grze: nie więcej niż 60 minut w jedną stronę i koszt do 10% dziennego dochodu. To umowa ćwiczenia, którą w realnej analizie trzeba uzasadnić.","indicator":"Liczba i odsetek osób bez auta, których potrzebne podróże nie spełniają tych warunków."}},{"id":"b","title":"Wójt gminy X, członkowskiej gminy związku","short":"Wójt gminy X","decision":"Jaką podstawę planowania wkładu w przewozy przyjąć w projekcie budżetu gminy?","powers":"Przygotowuje projekt budżetu i stanowisko gminy w uzgodnieniach finansowania.","limits":"Budżet przyjmuje rada gminy; oferta i rozliczenia wymagają współpracy ze związkiem.","example":"W trzech z czterech kwartałów wkład przekroczył pierwszą prognozę o ponad 15%. To problem planowania, a nie dowód nadmiernej ceny przewozów. Rozpoznania wymagają obieg danych oraz własne kalkulacje gminy.","focus":"Niepewność i rozbieżności planowania wkładu gminy, z uwzględnieniem konsekwencji dla usług.","standard":{"value":"Przewidywalność wydatku gminy.","reference":"Porównujemy rozliczenie z prognozą budżetową. Różnica nie oznacza automatycznie przepłacania; pytamy o jej znaczenie dla planowania.","indicator":"Różnice kwot i liczba kwartałów z rozbieżnością."}}]},{"id":"CP","name":"Czyste Powietrze","short":"Czyste Powietrze","clients":[{"id":"a","title":"Wójt gminy X","short":"Wójt — narażenie mieszkańców","decision":"Które źródła narażenia i bariery uwzględnić w przygotowaniu lokalnych działań środowiskowych?","powers":"Przygotowuje lokalne działania i wykorzystanie istniejącej współpracy z programem.","limits":"Nie ustala krajowych zasad dotacji; napływ zanieczyszczeń wymaga współpracy poza gminą.","example":"W badanym sezonie 600 z 2000 mieszkańców mieszka na obszarach ze stężeniem przypisanym przez model powyżej T. To przybliżenie narażenia. W przygotowaniu działań gminy trzeba rozróżnić źródła lokalne i napływ oraz osobno sprawdzić bariery inwestycji. Nie znamy dokładnego udziału programu w zmianie stężeń.","focus":"Narażenie mieszkańców i zakres możliwego działania gminy.","standard":{"value":"Ochrona mieszkańców przed zanieczyszczeniem.","reference":"Poziom T jest umowną granicą ćwiczenia, nie aktualną normą prawną ani zaleceniem zdrowotnym.","indicator":"Liczba mieszkańców przypisana przez model do obszarów ponad T."}},{"id":"b","title":"Zarząd WFOŚiGW w Warszawie","short":"Fundusz — obsługa płatności","decision":"Jakie problemy obsługi uwzględnić w organizacji pracy zespołu rozpatrującego płatności?","powers":"Organizuje pracę funduszu i przygotowuje usprawnienia w granicach zasad programu.","limits":"Nie może dowolnie pominąć wymaganej kontroli; zmiana części zasad wymaga uzgodnień.","example":"W badanych zakończonych sprawach 60 ze 100 przekraczało umowne 30 dni. Podtrzymujemy problem czasu i uciążliwości obsługi; oczekiwanie na uzupełnienia oraz jakość wezwań są ważnymi kierunkami dalszego rozpoznania.","focus":"Czas i uciążliwość obsługi płatności przy zachowaniu poprawności kontroli.","standard":{"value":"Terminowa i rzetelna obsługa płatności.","reference":"30 dni to próg przyjęty w scenariuszu, nie ustawowy termin. Szybkość nie usprawiedliwia pomijania wymaganej kontroli.","indicator":"Odsetek spraw ponad 30 dni oraz czas poszczególnych etapów."}}]},{"id":"BK2","name":"Bezpieczny Kredyt 2%","short":"BK2%","clients":[{"id":"a","title":"Minister Rozwoju i Technologii — historyczny scenariusz ewaluacyjny","short":"Minister — doświadczenia dopłat","decision":"Jaką ocenę doświadczeń dopłat przyjąć przed pracami nad przyszłym instrumentem?","powers":"Zleca analizę i przygotowuje propozycje rozwiązań krajowych.","limits":"Nowy instrument wymaga właściwych decyzji politycznych i finansowych; analiza nie zakłada jego przyjęcia.","example":"Niepewność dotyczy dodatkowej poprawy warunków dzięki dopłatom, przy różnicach między beneficjentami a niebeneficjentami. D2 jej nie usuwa. D1 uzasadnia uwzględnienie także potrzeb gospodarstw poza programem.","focus":"Niepewność ewaluacyjna o skutkach dopłat istotna dla przyszłego projektowania wsparcia.","standard":{"value":"Wiedza wystarczająca do przygotowania przyszłego wsparcia.","reference":"Nie ma obowiązkowego liczbowego progu „dopuszczalnej niepewności”. Trzeba wskazać, jaki brak wiedzy może zmienić przyszłą decyzję.","indicator":"Zakres wiarygodnych ustaleń o dodatkowym skutku dopłat i o tym, czego porównanie nie rozstrzyga."}},{"id":"b","title":"Prezydent miasta X","short":"Prezydent — gospodarstwa poza kredytem","decision":"Jakie bariery uwzględnić w przygotowaniu lokalnego planu poprawy dostępu do odpowiedniego lokalu?","powers":"Przygotowuje działania dotyczące miejskiego zasobu i współpracy lokalnej.","limits":"Nie zmienia krajowych dopłat; zasady, budżet i wykonanie wymagają właściwych uchwał i współpracy jednostek.","example":"W rejestrze miasta X 30 ze 100 uprawnionych gospodarstw czeka ponad umowne 12 miesięcy. Wybrane sprawy wskazują bariery dopasowania lokali, remontów i dokumentów; nie znamy ich udziałów w całym rejestrze.","focus":"Dostęp do odpowiedniego lokalu w wybranej grupie objętej pomocą miejską.","standard":{"value":"Dostęp uprawnionych gospodarstw do odpowiedniego lokalu.","reference":"Ponad 12 miesięcy to umowny próg wymagający uwagi w tej grze, nie termin prawny.","indicator":"Liczba i odsetek gospodarstw z tego rejestru oczekujących ponad 12 miesięcy."}}]},{"id":"SCT","name":"Strefa Czystego Transportu w Warszawie","short":"SCT Warszawa","clients":[{"id":"a","title":"Prezydent m.st. Warszawy","short":"Prezydent — kierunek prac nad SCT","decision":"Czy i z jaką diagnozą skierować propozycję zmian SCT do dalszych prac?","powers":"Przygotowuje propozycje i organizuje prace po stronie władz wykonawczych miasta.","limits":"Zmiany uchwały wymagają właściwej procedury i decyzji rady; nie każdą emisję można ograniczyć regułami wjazdu.","example":"400 z 1200 mieszkańców badanego zespołu ulic mieszka przy ulicach ze stężeniem przypisanym przez model powyżej T. To przybliżenie narażenia, także poza strefą. Przed pracami nad zmianami trzeba sprawdzić źródła i warunki rozpraszania zanieczyszczeń; D1 i D2 nie przesądzają rozszerzenia strefy.","focus":"Narażenie mieszkańców i jego źródła istotne dla dalszych prac nad SCT.","standard":{"value":"Ochrona mieszkańców przed nadmiernym narażeniem.","reference":"Poziom T jest fikcyjnym punktem odniesienia. Granica strefy nie wyznacza granicy dopuszczalnego narażenia.","indicator":"Liczba mieszkańców i obszary przypisane przez model do poziomu ponad T."}},{"id":"b","title":"Dyrektor Zarządu Dróg Miejskich w Warszawie","short":"Dyrektor ZDM — obsługa wyłączeń","decision":"Jakie problemy uwzględnić w organizacji obsługi wniosków o potwierdzenie wyłączenia?","powers":"Przygotowuje organizację pracy i komunikację w ramach obsługi prowadzonej przez ZDM.","limits":"Nie zmienia samodzielnie zasad wyłączeń ani granic strefy; część danych pochodzi z innych instytucji.","example":"60 ze 100 zakończonych spraw przekraczało umowne 10 dni. Podtrzymujemy problem czasu i dostępności obsługi, ale oprócz personelu badamy komunikację i dokumenty. Sprawy otwarte oraz rezygnacje wymagają uzupełnienia.","focus":"Czas i dostępność rzetelnej obsługi, z poszanowaniem reguł wyłączeń.","standard":{"value":"Terminowa, dostępna i rzetelna obsługa wyłączeń.","reference":"10 dni to standard ćwiczenia, nie przepis. Nie rozstrzyga on uprawnienia konkretnej osoby do wyłączenia.","indicator":"Odsetek spraw ponad 10 dni i bariery napotykane w kolejnych etapach."}}]},{"id":"BO","name":"Warszawski budżet obywatelski","short":"BO Warszawa","clients":[{"id":"a","title":"Dyrektor Centrum Komunikacji Społecznej Urzędu m.st. Warszawy","short":"Dyrektor CKS — możliwości wpływu","decision":"Jakie bariery udziału uwzględnić w propozycjach przygotowania następnej edycji BO?","powers":"Koordynuje prace i przygotowuje propozycje dotyczące udziału mieszkańców.","limits":"Zmiany części zasad wymagają właściwych decyzji miasta; realizacja zależy też od dzielnic i innych jednostek.","example":"W próbie dzielnicy X brak możliwości wpływu deklaruje 90 z 200 osób, w tym 35 z 50 z ograniczoną mobilnością. D2 uzasadnia badanie barier i wiary w realizację; nie pozwala uznać braku zainteresowania za główną przyczynę.","focus":"Możliwości wpływu i bariery określonych grup, z ostrożnością wobec uogólnień miejskich.","standard":{"value":"Równość możliwości wpływu i uwzględnienie potrzeb.","reference":"To podstawa oceny, nie żądanie identycznej frekwencji wszystkich grup. Trzeba uzasadnić, jakie różnice możliwości uznajemy za niesprawiedliwe.","indicator":"Deklaracje wpływu i bariery udziału to częściowe wskaźniki; nie mierzą całej równości."}},{"id":"b","title":"Burmistrz dzielnicy X m.st. Warszawy","short":"Burmistrz — realizacja projektów","decision":"Jakie problemy organizacji uwzględnić w planie realizacji przydzielonych dzielnicy projektów BO?","powers":"Przygotowuje i koordynuje działania realizacyjne w zakresie zadań dzielnicy.","limits":"Nie ustala sam zasad całego BO; realizacja wymaga właściwych uzgodnień, środków i procedur.","example":"Pięć z 12 projektów przekroczyło harmonogram. W czterech zwłoka wystąpiła przed umową, więc analiza organizacji musi objąć przygotowanie zakresu i uzgodnienia, a także wykonanie jednego opóźnionego kontraktu.","focus":"Terminowa realizacja wybranych projektów i konkretne miejsca powstawania zwłoki.","standard":{"value":"Możliwość korzystania z wybranych projektów w zaplanowanym terminie.","reference":"Punktem odniesienia jest zatwierdzony wewnętrzny harmonogram, nie domniemany termin ustawowy.","indicator":"Liczba projektów opóźnionych i etap, na którym powstała zwłoka."}}]}];</script><script>window.B34Content={"common":{"evidence":{"title":"Bardach opisuje alternatywy przed kryteriami, a Patton, Sawicki i Clark odwrotnie. Zespół zna cel klienta i limit zasobów, lecz odkrywa ważny skutek nieobjęty kryteriami. Który plan pracy jest uzasadniony?","correct":"c","options":[{"id":"a","text":"Zbudować listę działań na podstawie mechanizmów, a znane cele i limit wprowadzić przy porównaniu ich przewidywanych skutków.","feedback":"Znane cele i wiążący limit są istotne już przy tworzeniu działań. Numeracja kroków Bardacha nie uzasadnia odłożenia tych ustaleń do późniejszej oceny."},{"id":"b","text":"Wyprowadzić kryteria ze znanych celów i limitu, a odkryty skutek opisać przy działaniach według ustalonego wcześniej zestawu.","feedback":"Wcześniejsze ustalenie kryteriów jest dopuszczalne. W tym przypadku zestaw pomija jednak ważny skutek. Sam opis przy działaniach nie uzupełnia wspólnej podstawy ich oceny."},{"id":"c","text":"Uwzględnić znane cele i limit w projektowaniu działań, a odkryty skutek wykorzystać do przeglądu wspólnych kryteriów oceny.","feedback":"Znane wartości i warunki pomagają tworzyć alternatywy. Nowy skutek może wymagać rewizji kryteriów dla wszystkich opcji. Bardach dopuszcza zmianę kolejności i powroty między krokami."}],"hint":"Oddziel warunki znane od początku od ustaleń powstałych podczas rozpoznawania skutków."},"baseline":{"title":"Jak zbudować A0 na przyjęty okres porównania?","correct":"b","options":[{"id":"a","text":"Zachować obecne działania i przyjąć wyniki na poziomie z ostatniego pomiaru.","feedback":"To zamraża rezultaty. Mogą się one zmieniać nawet bez nowej decyzji klienta."},{"id":"b","text":"Uwzględnić obecne działania oraz przewidywane zmiany otoczenia bez nowej decyzji klienta.","feedback":"A0 jest dynamiczną kontynuacją. Dzięki temu nie przypisujemy nowej alternatywie całej przyszłej zmiany."},{"id":"c","text":"Ograniczyć działania do zadań niezbędnych, uwzględniając przewidywane zmiany ich otoczenia.","feedback":"Ograniczenie działań jest odrębną decyzją. Może być alternatywą, ale nie zastępuje opisanej kontynuacji."}],"hint":"Co zmienia się samo lub wynika z już podjętych decyzji, a co wymaga nowej decyzji?"},"variant":{"title":"W poniższym przykładzie szkoleniowym która para przedstawia warianty skali jednego instrumentu?","correct":"a","options":[{"id":"a","text":"Dyżury doradcy dwa albo cztery razy miesięcznie, przy tym samym zakresie udzielanej pomocy.","feedback":"Zmienia się częstotliwość tego samego działania. Nie ustalamy jeszcze, która skala jest korzystniejsza."},{"id":"b","text":"Dyżury doradcy albo automatyczne pobieranie danych, przy tym samym miesięcznym budżecie obsługi spraw.","feedback":"Pomoc człowieka i wymiana danych działają przez odmienne mechanizmy. Wspólny budżet nie czyni ich wariantami skali."},{"id":"c","text":"Dyżury doradcy z dopłatą albo z przewozem, przy tej samej liczbie objętych wsparciem osób.","feedback":"Zmienia się skład pakietu instrumentów. Liczba odbiorców jest wspólna, lecz nie tożsamy sposób działania."}],"hint":"Porównaj wykonawcę, mechanizm, skład pakietu i parametr ilościowy."},"transfer":{"title":"W szkicu zespołu miernik obejmuje osoby rozpoczynające formularz internetowy. Po dodaniu zapisu telefonicznego zespół chce porównać dostępność zapisu we wszystkich kanałach. Co zrobić z miernikiem dla A0, A1 i A2?","correct":"a","options":[{"id":"a","text":"Dla wszystkich opcji uwzględnić próby w dostępnych kanałach, stosując wspólną definicję zakończenia zapisu i ten sam okres.","feedback":"Definicja obejmuje dostępne kanały każdej opcji, także A0. Po zmianie miernika trzeba ponownie oszacować wartości dla wszystkich opcji. Nadal pomijamy osoby, które nie podejmują próby; to ograniczenie wymaga ujawnienia."},{"id":"b","text":"Dla wszystkich opcji zachować próby przez internet, a skutki pozostałych kanałów opisać oddzielnie przy nowych działaniach w tym okresie.","feedback":"Zachowanie wcześniejszej definicji ułatwia ciągłość danych, ale nie odpowiada nowemu pytaniu o dostępność we wszystkich kanałach. Oddzielny opis telefonu nie uzupełnia wspólnego miernika."},{"id":"c","text":"Dla każdej opcji uwzględnić próby w jej głównym kanale, stosując wspólną definicję zakończenia zapisu i ten sam okres.","feedback":"Wspólny okres i definicja ukończenia nie wystarczą, gdy wybór głównego kanału zmienia zakres miernika między opcjami. Pozostałe kanały i trudności ich użytkowników znikają z porównania."}],"hint":"Sprawdź, czy definicja odpowiada pytaniu o wszystkie kanały i obejmuje A0 na tej samej zasadzie co nowe opcje."}},"cases":{"GPA_a":{"task":"Przygotuj alternatywy korekty oferty, które ułatwią potrzebne podróże i powroty osobom bez auta. Ustal kryteria przed szacowaniem skutków.","horizon":"kolejny rok","baseline":"Obecny rozkład, istniejące połączenia i uzgodnione finansowanie.","trend":"Godziny zmian w zakładach pracy i zapotrzebowanie na podróże mogą się zmieniać także bez korekty rozkładu.","options":[["hours","Przesunięcie godzin wybranych kursów","Dopasowanie odjazdów do zakończenia zmian może umożliwić powroty bez zwiększania liczby kursów."],["connections","Koordynacja przesiadek między liniami","Uzgodnione przesiadki mogą połączyć istniejące odcinki w użyteczną podróż."],["late","Dodatkowy kurs po późnej zmianie","Dodatkowy odjazd może wypełnić lukę czasową, ale wymaga zasobów."],["package","Korekta godzin z uzgodnieniem przesiadek","Pakiet może usuwać dwie bariery; zależy od współpracy organizatorów."]],"scale":["Na dwóch wybranych liniach przez kwartał","Na pięciu wybranych liniach przez kwartał"],"newInfo":"Przegląd dwunastu wskazanych podróży pokazuje, że w pięciu powrót jest możliwy po przesunięciu odjazdu, a w czterech wymaga także uzgodnienia przesiadki. Część podróży należy do obu grup. Nie jest to próba wszystkich podróży.","limit":"W pierwszym kwartale pilotażu dostępna liczba wozogodzin pozostaje na obecnym poziomie. Zmiany między liniami wymagają uzgodnienia z operatorem.","adaptations":["Uzgodnić godziny z połączeniem przesiadkowym","Przesunąć istniejące kursy w ramach zasobów","Zachować projekt i sprawdzić jego zakres"],"criteria":["Dostępność: maksymalizować odsetek potrzebnych podróży osób bez auta z wykonalnym dojazdem i powrotem w przyjętym standardzie.","Efektywność kosztowa: minimalizować dodatkowy koszt publiczny i prywatny na dodatkową osobę z wykonalną potrzebną podróżą względem A0.","Równość dostępu: minimalizować bezwzględną różnicę odsetka wykonalnych podróży między obszarami peryferyjnymi a centralnymi."],"questions":{"scope":{"title":"Który rezultat odpowiada zleceniu zarządu GPA?","correct":"b","options":[{"id":"a","text":"Mniej rozbieżności między prognozą wkładu gminy a jego kwartalnym rozliczeniem.","feedback":"To rezultat istotny dla drugiego klienta, który planuje wkład gminy."},{"id":"b","text":"Więcej potrzebnych podróży osób bez auta z wykonalnym dojazdem i powrotem.","feedback":"To rezultat dotyczący dostępności. Sam wzrost przejazdów nie obejmuje osób dotąd wykluczonych."},{"id":"c","text":"Większe zadowolenie obecnych pasażerów z komfortu przejazdów na liniach obsługujących zakłady pracy.","feedback":"Komfort obecnych pasażerów jest ważny, ale zlecenie koncentruje się na możliwości potrzebnej podróży, także dla osób dziś niekorzystających."}],"hint":"Porównaj cel pytania z zakresem każdej odpowiedzi. Ustal, co mierzy lub zakłada każda propozycja."},"effect":{"title":"GPA ocenia dostępność potrzebnych podróży osób bez auta. Który miernik obejmuje ten rezultat?","correct":"a","options":[{"id":"a","text":"Maksymalizować udział potrzebnych podróży z wykonalnym dojazdem i powrotem według przyjętego standardu czasu i kosztu.","feedback":"Mianownik obejmuje potrzebne podróże, także dotąd niewykonalne. Dla każdej trzeba sprawdzić dojazd i powrót według wspólnego standardu."},{"id":"b","text":"Maksymalizować udział wykonanych przejazdów z dojazdem i powrotem ocenionym pozytywnie przez obecnych pasażerów badanych linii.","feedback":"Ocena obecnych pasażerów pomija osoby bez wykonalnej podróży. Zadowolenie może rosnąć, choć dostęp wykluczonych osób się nie zmieni."},{"id":"c","text":"Maksymalizować udział potrzebnyc ą bezwzględną różnicę między ostatnią aktualizacją prognozy a rozliczeniem, niezależnie od daty jej przygotowania.","feedback":"Późniejsza aktualizacja korzysta z dodatkowej wiedzy. Różne daty nie pozwalają uczciwie porównać trafności prognoz potrzebnych przy przygotowaniu budżetu."}],"hint":"Porównaj cel pytania z zakresem każdej odpowiedzi. Ustal, co mierzy lub zakłada każda propozycja."},"cost":{"title":"Wspólny okres i data prognoz są ustalone. Chcesz określić koszt dodatkowego zmniejszenia błędu względem A0. Którą relację zastosujesz przy dodatniej poprawie?","correct":"a","options":[{"id":"a","text":"Przyrost kosztów przygotowania prognoz podzielony przez spadek ich średniego bezwzględnego błędu względem A0.","feedback":"To koszt dodatkowej poprawy, przy błędzie liczonym dla porównywalnych prognoz. Jednostki błędu i kosztu muszą być jawne."},{"id":"b","text":"Przyrost kosztów przygotowania prognoz podzielony przez spadek kwoty prognozowanego wkładu gminy względem A0.","feedback":"Niższa prognozowana kwota nie oznacza mniejszego błędu. Może zwiększać niedoszacowanie wkładu."},{"id":"c","text":"Przyrost kosztów przygotowania prognoz podzielony przez spadek liczby aktualizacji prognozowanego wkładu względem A0.","feedback":"Rzadsza aktualizacja nie jest trafnością. Może wynikać z pomijania nowych informacji, choć błąd wobec rozliczenia rośnie."}],"hint":"Porównaj cel pytania z zakresem każdej odpowiedzi. Ustal, co mierzy lub zakłada każda propozycja."},"third":{"title":"Kryterium: ciągłość potrzebnych usług w trakcie zmian planowania. Który miernik zastosujesz?","correct":"c","options":[{"id":"a","text":"Maksymalizować odsetek linii utrzymanych w rozkładzie podczas zmiany sposobu przygotowania prognoz wkładu gminy.","feedback":"Utrzymana linia może mieć zmienione godziny lub przesiadki. Sama obecność w rozkładzie nie zapewnia ciągłości potrzebnych podróży."},{"id":"b","text":"Maksymalizować odsetek zachowanych wozogodzin podczas zmiany sposobu przygotowania prognoz wkładu gminy.","feedback":"Ta sama liczba wozogodzin może być rozłożona inaczej. Chroni wielkość zasobu, lecz nie konkretną możliwość potrzebnej podróży."},{"id":"c","text":"Maksymalizować odsetek potrzebnych podróży nadal wykonalnych podczas zmiany sposobu przygotowania prognoz wkładu gminy.","feedback":"Miernik odnosi ciągłość do sytuacji mieszkańców. Populacja podróży i standard wykonalności muszą pozostać wspólne."}],"hint":"Porównaj cel pytania z zakresem każdej odpowiedzi. Ustal, co mierzy lub zakłada każda propozycja."},"revision":{"title":"Który element kontroli projektu odpowiada różnicy między dwiema nowymi prognozami?","correct":"b","options":[{"id":"a","text":"Osobne sprawdzenie terminów wysyłki pisma i potwierdzenia odbioru przez urząd przed każdą prognozą.","feedback":"To usprawnia obieg, ale nie sprawdza, czy urząd użył otrzymanej stawki, ani czy ma komplet danych o przychodach."},{"id":"b","text":"Osobne sprawdzenie użytej wersji stawek i kompletności danych o przychodach przed każdą prognozą.","feedback":"Te dwa sprawdzenia odpowiadają różnym mechanizmom wykrytym w audycie."},{"id":"c","text":"Osobne sprawdzenie podpisu pod arkuszem i daty zatwierdzenia wersji prognozy przez upoważnioną osobę.","feedback":"Formalne zatwierdzenie nie zastępuje sprawdzenia źródeł i kompletności danych."}],"hint":"Porównaj cel pytania z zakresem każdej odpowiedzi. Ustal, co mierzy lub zakłada każda propozycja."},"constraint":{"title":"Która propozycja respektuje warunki pilotażu?","correct":"c","options":[{"id":"a","text":"Przeznaczenie oszczędności z kontroli arkuszy na pół etatu analityka odpowiedzialnego za dane o przewozach.","feedback":"Finansowanie stanowiska z oszczędności nadal zwiększa obsadę, której pilotaż nie może powiększyć."},{"id":"b","text":"Przeznaczenie środków z czasowego zawieszenia kursów przez gminę na uporządkowanie danych potrzebnych do prognoz.","feedback":"Samodzielne zawieszenie kursów zmienia uzgodnioną ofertę, a pilotaż dotyczy organizacji prognozowania."},{"id":"c","text":"Przeznaczenie dwóch obecnych dyżurów na wspólną kontrolę arkuszy i uzgodnienie kalendarza danych o przewozach.","feedback":"To reorganizacja pracy obecnej obsady. Trzeba sprawdzić obciążenie pracowników i skutki zmiany przeznaczenia dyżurów."}],"hint":"Porównaj cel pytania z zakresem każdej odpowiedzi. Ustal, co mierzy lub zakłada każda propozycja."}}},"CP_a":{"task":"Przygotuj lokalne alternatywy ograniczania narażenia i barier inwestycji. Oddziel możliwości gminy od zmian wymagających współpracy poza nią.","horizon":"trzy kolejne lata","baseline":"Obecny punkt wsparcia, współpraca operatorska i rozpoczęte działania lokalne.","trend":"Inwestycje rozpoczęte wcześniej, pogoda i napływ zanieczyszczeń mogą zmieniać narażenie bez nowej decyzji gminy.","options":[["advisor","Wsparcie od rozpoznania bariery do rozliczenia","Towarzyszenie gospodarstwu może ograniczyć trudności proceduralne na kilku etapach."],["coord","Uzgodnienie działań z sąsiednimi gminami","Współpraca może objąć źródła, których pojedyncza gmina nie kontroluje."],["target","Docieranie do gospodarstw z barierami udziału","Pomoc kierowana według rozpoznanych potrzeb może objąć osoby pomijane przez zwykły punkt wsparcia."],["package","Wsparcie gospodarstw z koordynacją między gminami","Pakiet łączy bariery inwestycji z zanieczyszczeniami napływającymi spoza obszaru."]],"scale":["Pilotaż w dwóch sołectwach przez rok","Pilotaż w czterech sołectwach przez rok"],"newInfo":"W ośmiu z dwunastu celowo dobranych rozmów zgłoszono brak pieniędzy przed refundacją. Model źródeł wskazuje też istotny, lecz nieprecyzyjnie oszacowany udział napływu. Nie wyznaczono częstości bariery w całej gminie.","limit":"W tym zleceniu gmina może reorganizować lokalne wsparcie i proponować współpracę, ale nie zmienia samodzielnie krajowych warunków wypłaty dotacji.","adaptations":["Dodać rozpoznanie dostępnych osłon finansowych","Dodać uzgodnienia z sąsiednimi gminami","Zachować projekt i sprawdzić jego zakres"],"criteria":["Ograniczenie narażenia: minimalizować liczbę mieszkańców przypisanych przez model do obszarów ponad umowny poziom T dla PM2,5.","Efektywność kosztowa: minimalizować dodatkowy koszt publiczny i prywatny na osobę mniej na obszarach ponad T względem A0.","Równość dostępu do wsparcia: maksymalizować udział uprawnionych gospodarstw o niskich dochodach, które mogą przejść cały proces bez nieosłoniętej bariery finansowej."],"questions":{"scope":{"title":"Który rezultat odpowiada lokalnemu zleceniu wójta?","correct":"c","options":[{"id":"a","text":"Krótszy czas rozpatrywania płatności przez fundusz przy zachowaniu poprawności ich kontroli.","feedback":"To zlecenie drugiego klienta. Wójt nie organizuje pracy zespołu płatności funduszu."},{"id":"b","text":"Większy udział właścicieli domów otrzymujących dotację oraz większa liczba inwestycji zakończonych w kolejnym sezonie.","feedback":"Uczestnictwo jest ważnym etapem, lecz zlecenie obejmuje także narażenie. Sam wzrost udziału nie przesądza poprawy tego rezultatu."},{"id":"c","text":"Mniejsze narażenie mieszkańców oraz ograniczenie barier inwestycji możliwych do objęcia działaniem gminy.","feedback":"To łączy rezultat z zakresem działania klienta, zachowując problem źródeł spoza gminy."}],"hint":"Porównaj cel pytania z zakresem każdej odpowiedzi. Ustal, co mierzy lub zakłada każda propozycja."},"effect":{"title":"Gmina ocenia narażenie mieszkańców według modelu PM2,5 i wspólnego progu T. Który miernik zachowuje przedmiot tej diagnozy?","correct":"b","options":[{"id":"a","text":"Minimalizować udział powierzchni gminy przypisanej przez model do stężenia PM2,5 ponad poziom T w badanym sezonie.","feedback":"Powierzchnia nie uwzględnia rozmieszczenia ludności. Spadek na rozległym niezamieszkanym obszarze nie oznacza odpowiedniej poprawy dla mieszkańców."},{"id":"b","text":"Minimalizować liczbę mieszkańców przypisanych przez model do stężenia PM2,5 ponad poziom T w badanym sezonie.","feedback":"Miernik łączy model stężeń z rozmieszczeniem mieszkańców. Nadal jest przybliżeniem narażenia, a nie pomiarem osobistej ekspozycji każdej osoby."},{"id":"c","text":"Minimalizować liczbę mieszkańców korzystających ze wsparcia i przypisanych do stężenia PM2,5 ponad T w badanym sezonie.","feedback":"Ograniczenie do odbiorców wsparcia pomija innych narażonych mieszkańców. Zakres diagnozy obejmuje gminę, nie tylko uczestników programu."}],"hint":"Porównaj cel pytania z zakresem każdej odpowiedzi. Ustal, co mierzy lub zakłada każda propozycja."},"cost":{"title":"Dla dodatniego spadku narażenia względem A0 porównujesz koszty publiczne i prywatne w tym samym okresie. Którą jednostkę kosztu wybierzesz?","correct":"c","options":[{"id":"a","text":"Przyrost kosztów na mieszkańca objętego inwestycją, przypisanego przez model do obszaru ponad T przed pilotażem.","feedback":"Objęcie inwestycją nie potwierdza, że modelowane narażenie spadło poniżej T. Brakuje przyrostu rezultatu wobec A0."},{"id":"b","text":"Przyrost kosztów na mieszkańca mniej na obszarach ponad T w porównaniu z pomiarem przed pilotażem.","feedback":"Zmiana względem wcześniejszego pomiaru obejmuje również trendy i inne działania. Kontrfaktycznym punktem odniesienia w zadaniu jest A0."},{"id":"c","text":"Przyrost kosztów na mieszkańca mniej na obszarach ponad T w porównaniu ze scenariuszem A0.","feedback":"Jednostka odnosi się do dodatkowego rezultatu modelowanego wobec A0. Mniejszy koszt jednostki efektu jest pożądany; transferów nie liczymy podwójnie."}],"hint":"Porównaj cel pytania z zakresem każdej odpowiedzi. Ustal, co mierzy lub zakłada każda propozycja."},"third":{"title":"Kryterium: dostęp do wsparcia gospodarstw o niskich dochodach. Który miernik dotyczy ich możliwości udziału?","correct":"a","options":[{"id":"a","text":"Maksymalizować odsetek uprawnionych gospodarstw o niskich dochodach mogących przejść cały proces mimo bariery finansowej.","feedback":"Osłona musi umożliwiać przejście całego procesu, także poniesienie wydatku przed refundacją. Same formalne uprawnienia nie wystarczają."},{"id":"b","text":"Maksymalizować odsetek uprawnionych gospodarstw o niskich dochodach mogących złożyć kompletny wniosek o wsparcie.","feedback":"Możliwość złożenia wniosku nie usuwa braku środków na etap inwestycji. To wcześniejszy i węższy rezultat."},{"id":"c","text":"Maksymalizować odsetek inwestujących gospodarstw o niskich dochodach otrzymujących zwrot po zakończeniu inwestycji.","feedback":"Zwrot wśród realizujących inwestycję nie pokazuje możliwości tych, którzy nie mogą wcześniej sfinansować wydatku. Pomija barierę wejścia."}],"hint":"Porównaj cel pytania z zakresem każdej odpowiedzi. Ustal, co mierzy lub zakłada każda propozycja."},"revision":{"title":"Który zestaw sprawdzeń najlepiej odpowiada obu elementom nowej wiadomości?","correct":"a","options":[{"id":"a","text":"Dostępność osłon wydatku przed refundacją oraz możliwość współpracy dotyczącej źródeł napływu zanieczyszczeń.","feedback":"To odpowiada barierze płynności i zakresowi oddziaływania spoza gminy, bez zakładania gotowej wielkości efektu."},{"id":"b","text":"Dostępność refundacji po zakończeniu inwestycji oraz możliwość ograniczenia źródeł zanieczyszczeń na terenie gminy.","feedback":"Refundacja po inwestycji nie rozwiązuje braku środków przed nią. Sprawdzenie samych lokalnych źródeł pomija wskazany napływ z zewnątrz."},{"id":"c","text":"Dostępność instrukcji rozliczenia inwestycji oraz możliwość współpracy dotyczącej źródeł napływu zanieczyszczeń.","feedback":"Współpraca odpowiada napływowi, lecz instrukcja rozliczenia nie jest osłoną braku pieniędzy przed refundacją. Taki przegląd obejmuje tylko jeden z dwóch mechanizmów."}],"hint":"Porównaj cel pytania z zakresem każdej odpowiedzi. Ustal, co mierzy lub zakłada każda propozycja."},"constraint":{"title":"Która propozycja pozostaje w zakresie podanego zlecenia gminy?","correct":"b","options":[{"id":"a","text":"Uruchomienie gminnego punktu, który zatwierdza koszt do wypłaty na podstawie wstępnego kosztorysu inwestycji.","feedback":"Zatwierdzenie wypłaty na zmienionej podstawie ingeruje w warunki dotacji. Utworzenie punktu nie nadaje gminie takiej kompetencji."},{"id":"b","text":"Uruchomienie gminnego punktu, który pomaga przygotować dokumenty i sprawdza dostępne źródła finansowania inwestycji.","feedback":"To lokalne wsparcie. Pomoc nie przesądza o uprawnieniu do dotacji ani dostępności konkretnego źródła finansowania."},{"id":"c","text":"Uruchomienie gminnego punktu, który nadaje lokalnym wnioskom pierwszeństwo wypłaty w kolejce instytucji programu.","feedback":"Nadanie pierwszeństwa w cudzej kolejce zmienia warunki wypłaty; reorganizacja lokalnego wsparcia tego nie upoważnia."}],"hint":"Porównaj cel pytania z zakresem każdej odpowiedzi. Ustal, co mierzy lub zakłada każda propozycja."}}},"CP_b":{"task":"Przygotuj alternatywy organizacji obsługi płatności, które ograniczą czas i uciążliwość przy zachowaniu poprawności rozliczeń.","horizon":"kolejne dwanaście miesięcy","baseline":"Obecny podział spraw, sposób formułowania wezwań i wymagane kontrole.","trend":"Napływ i złożoność spraw oraz terminy dostarczania dokumentów mogą się zmieniać przy obecnej organizacji.","options":[["clear","Przegląd jasności i kompletności wezwań","Zrozumiałe, zbiorcze wezwanie może zmniejszyć liczbę powtórnych uzupełnień."],["flow","Podział spraw według rodzaju trudności","Kierowanie spraw do odpowiednich zespołów może ograniczyć kolejki na wybranych etapach."],["contact","Kontakt wyjaśniający przed ponownym wezwaniem","Krótki kontakt może rozpoznać barierę, zanim zostanie powtórzone to samo żądanie."],["package","Jasne wezwania z kontaktem wyjaśniającym","Pakiet łączy jakość pisma z pomocą przy konkretnych trudnościach."]],"scale":["Pilotaż w jednym zespole przez trzy miesiące","Pilotaż w trzech zespołach przez trzy miesiące"],"newInfo":"Przegląd dwudziestu celowo wybranych długich spraw wykazał w jedenastu powtarzane żądania podobnych dokumentów. W siedmiu oczekiwano na dokument z innej instytucji; cztery sprawy należą do obu grup.","limit":"Organizacja obsługi może się zmienić, ale wymagane sprawdzenie prawidłowości rozliczenia pozostaje obowiązkowe.","adaptations":["Dodać przegląd treści ponownych wezwań","Dodać uzgodnienie pozyskiwania dokumentów","Zachować projekt i sprawdzić jego zakres"],"criteria":["Terminowość: minimalizować odsetek spraw trwających ponad umowne 30 dni od wpływu do wyniku weryfikacji; uwzględniać także sprawy otwarte.","Efektywność kosztowa: minimalizować dodatkowy koszt funduszu i beneficjenta na dodatkową prawidłowo zakończoną sprawę w umownym czasie względem A0.","Rzetelność: maksymalizować odsetek rozliczeń uznanych za poprawne w niezależnej kontroli próby spraw."],"questions":{"scope":{"title":"Który rezultat odpowiada zleceniu zarządu funduszu?","correct":"b","options":[{"id":"a","text":"Większa kwota wypłat dla beneficjentów oraz większa wartość inwestycji rozliczonych przez fundusz w danym kwartale.","feedback":"Większa kwota nie oznacza krótszej ani mniej uciążliwej obsługi. Może wynikać ze zmiany wartości inwestycji."},{"id":"b","text":"Krótsza i mniej uciążliwa obsługa płatności przy zachowaniu wymaganej poprawności rozliczeń.","feedback":"To wąskie, uzasadnione zlecenie dotyczące obsługi, bez potrzeby redefiniowania go jako całego smogu."},{"id":"c","text":"Mniej mieszkańców na obszarach ponad T w modelu stężeń badanego sezonu grzewczego.","feedback":"To rezultat środowiskowy istotny w innej ścieżce; nie jest bezpośrednią miarą obsługi płatności."}],"hint":"Porównaj cel pytania z zakresem każdej odpowiedzi. Ustal, co mierzy lub zakłada każda propozycja."},"effect":{"title":"Próg wynosi umowne 30 dni od wpływu do wyniku weryfikacji. Porównujesz sprawy, które wpłynęły co najmniej 30 dni przed pomiarem. Który miernik obejmuje też nadal otwarte?","correct":"c","options":[{"id":"a","text":"Minimalizować odsetek spraw z wynikiem po trzydziestu dniach, odnosząc go do wszystkich spraw zak ytuację także bez nowego projektu.","options":[["repair","Uzgodniony harmonogram remontów dostępnego zasobu","Koordynacja etapów może skrócić czas przygotowania lokali nadających się do przydziału."],["match","Przegląd dopasowania lokali do potrzeb gospodarstw","Powiązanie wielkości i dostępności lokalu z potrzebami może ograniczać niedopasowanie."],["adapt","Dostosowanie wybranych lokali do ograniczeń mobilności","Adaptacja może udostępnić część zasobu gospodarstwom, dla których schody stanowią barierę."],["package","Remonty z przeglądem dopasowania i dostępności","Pakiet łączy przygotowanie lokali z ich przydatnością dla oczekujących."]],"scale":["Pilotaż obejmujący dziesięć lokali","Pilotaż obejmujący dwadzieścia lokali"],"newInfo":"W przeglądzie dziesięciu lokali planowanych do remontu cztery mają dostęp bez schodów. W wybranych długich sprawach część gospodarstw potrzebuje właśnie takiego dostępu. Nie zestawiono jeszcze całej listy potrzeb z całym zasobem.","limit":"Warianty mają wykorzystywać istniejący miejski zasób mieszkań i przyjęty budżet pilotażu. Zlecenie nie obejmuje zakupu nowego zasobu, zmiany krajowych dopłat ani kryteriów kredytowych banków.","adaptations":["Dodać dopasowanie kolejności remontów do potrzeb","Dodać sprawdzenie możliwości adaptacji lokali","Zachować projekt i sprawdzić jego zakres"],"criteria":["Dostęp do odpowiedniego lokalu: minimalizować odsetek uprawnionych gospodarstw oczekujących ponad umowne 12 miesięcy na lokal odpowiadający potrzebom.","Efektywność kosztowa: minimalizować dodatkowy koszt publiczny i prywatny na dodatkowe gospodarstwo uzyskujące odpowiedni lokal względem A0.","Równość dostępu: minimalizować bezwzględną różnicę udziału długiego oczekiwania między gospodarstwami wymagającymi lokalu bez schodów a pozostałymi."],"questions":{"scope":{"title":"Który rezultat odpowiada miejskiemu zleceniu tej ścieżki?","correct":"c","options":[{"id":"a","text":"Większa liczba udzielonych kredytów osobom oczekującym na lokal z miejskiego zasobu.","feedback":"To inny instrument i zakres decyzji; grupa może nie mieć możliwości uzyskania kredytu."},{"id":"b","text":"Krótsze remonty lokali z miejskiego zasobu oraz większa liczba mieszkań przygotowanych do przydziału.","feedback":"Szybszy remont jest ważnym etapem, lecz niedopasowany lokal może nadal nie odpowiadać potrzebom oczekujących gospodarstw."},{"id":"c","text":"Krótsze oczekiwanie uprawnionych gospodarstw na lokal odpowiadający ich potrzebom mieszkaniowym.","feedback":"To rezultat powiązany z problemem, grupą i zakresem działania klienta."}],"hint":"Porównaj cel pytania z zakresem każdej odpowiedzi. Ustal, co mierzy lub zakłada każda propozycja."},"effect":{"title":"Miasto bada przekroczenie umownych 12 miesięcy oczekiwania. Porównuje uprawnione gospodarstwa z co najmniej roczną obserwacją od wpisania na listę. Który miernik zachowuje pełny zakres?","correct":"a","options":[{"id":"a","text":"Minimalizować odsetek gospodarstw czekających ponad dwanaście miesięcy na odpowiedni lokal, uwzględniając przydziały i nadal oczekujących.","feedback":"Przekroczenie liczymy zarówno przy późnym przydziale, jak i w nadal otwartej sprawie. Odpowiedniość lokalu oceniamy według ustalonych potrzeb."},{"id":"b","text":"Minimalizować odsetek gospodarstw czekających ponad dwanaście miesięcy na odpowiedni lokal, uwzględniając sprawy zakończone przydziałem.","feedback":"Ograniczenie do przydziałów pomija nadal oczekujących. Poprawa wśród zakończonych spraw może współistnieć ze wzrostem zaległości."},{"id":"c","text":"Minimalizować odsetek gospodarstw czekających ponad dwanaście miesięcy na pierwszą ofertę lokalu, uwzględniając wszystkie zgłoszone propozycje.","feedback":"Pierwsza oferta może nie odpowiadać potrzebom. Jej złożenie nie jest uzyskaniem odpowiedniego lokalu i nie zamyka problemu dostępu."}],"hint":"Porównaj cel pytania z zakresem każdej odpowiedzi. Ustal, co mierzy lub zakłada każda propozycja."},"cost":{"title":"Wspólny okres i dodatkowe koszty publiczne oraz prywatne są ustalone. Przez co je podzielisz, aby opisać dodatkowe zaspokojenie potrzeb względem A0?","correct":"b","options":[{"id":"a","text":"Przyrost liczby gospodarstw otrzymujących propozycję przydziału lokalu z miejskiego zasobu względem scenariusza A0.","feedback":"Propozycja może nie pasować do potrzeb i nie zostać zrealizowana. Nie jest jeszcze uzyskaniem odpowiedniego lokalu."},{"id":"b","text":"Przyrost liczby gospodarstw uzyskujących lokal odpowiadający ustalonym potrzebom mieszkaniowym względem scenariusza A0.","feedback":"To dodatkowy rezultat dla gospodarstwa. Przy dodatniej poprawie mniejszy koszt jednostki rezultatu jest pożądany."},{"id":"c","text":"Przyrost liczby gospodarstw uzyskujących lokal z miejskiego zasobu, liczony względem roku przed pilotażem.","feedback":"Zmiana rok do roku obejmuje też trendy i wcześniejsze remonty. Ponadto sam przydział nie zapewnia odpowiedniości lokalu."}],"hint":"Porównaj cel pytania z zakresem każdej odpowiedzi. Ustal, co mierzy lub zakłada każda propozycja."},"third":{"title":"Kryterium: wyrównanie dostępu gospodarstw z ograniczoną mobilnością. Który miernik odpowiada temu kryterium?","correct":"c","options":[{"id":"a","text":"Minimalizować bezwzględną różnicę liczby długo oczekujących gospodarstw wymagających dostępu bez schodów i pozostałych.","feedback":"Różne liczebności grup mogą dawać różną liczbę oczekujących przy takich samych szansach. Potrzebne są porównywalne udziały."},{"id":"b","text":"Minimalizować bezwzględną różnicę odsetka odpowiednich ofert odrzuconych przez gospodarstwa wymagające dostępu bez schodów i pozostałe.","feedback":"Odrzucenia ofert nie obejmują gospodarstw, które oferty jeszcze nie otrzymały. To inny aspekt niż przekroczenie czasu oczekiwania."},{"id":"c","text":"Minimalizować bezwzględną różnicę odsetka długo oczekujących gospodarstw wymagających dostępu bez schodów i pozostałych.","feedback":"Udziały wyznaczamy przy wspólnym progu i populacji uprawnionych. Lukę czytamy razem z dostępem do odpowiedniego lokalu w obu grupach."}],"hint":"Porównaj cel pytania z zakresem każdej odpowiedzi. Ustal, co mierzy lub zakłada każda propozycja."},"revision":{"title":"Który przegląd kolejności remontów najlepiej odpowiada nowej wiadomości o zasobie?","correct":"a","options":[{"id":"a","text":"Zestawienie potrzeb oczekujących gospodarstw z wielkością i dostępnością lokali możliwych do przygotowania w pilotażu.","feedback":"To odpowiada kwestii dopasowania, bez utożsamienia liczby lokali z liczbą zaspokojonych potrzeb."},{"id":"b","text":"Zestawienie kosztów planowanych remontów z liczbą metrów powierzchni lokali możliwych do przygotowania w pilotażu.","feedback":"To ocena kosztów zasobu. Sama nie pokazuje dopasowania dostępności i wielkości do gospodarstw."},{"id":"c","text":"Zestawienie kolejności zgłoszeń do remontu z czasem pozostawania lokali poza użytkowaniem przed rozpoczęciem pilotażu.","feedback":"To może uzasadniać kolejność administracyjną, ale nie odpowiada nowej informacji o dostępie bez schodów i potrzebach."}],"hint":"Porównaj cel pytania z zakresem każdej odpowiedzi. Ustal, co mierzy lub zakłada każda propozycja."},"constraint":{"title":"Który wariant mieści się w przyjętym zakresie lokalnego pilotażu?","correct":"c","options":[{"id":"a","text":"Przeznaczenie budżetu pilotażu na dopłaty do rat kredytowych dla gospodarstw oczekujących na miejski lokal.","feedback":"Lokalna dopłata może być odrębnym pomysłem, ale ten pilotaż ma wykorzystywać miejski zasób. Samo zmieszczenie się w budżecie nie wystarcza."},{"id":"b","text":"Przeznaczenie budżetu pilotażu na zakup mieszkań od deweloperów dla gospodarstw oczekujących na miejski lokal.","feedback":"Zakup nowego zasobu jest inną strategią. W tym zadaniu pilotaż dotyczy wykorzystania istniejącego zasobu miasta."},{"id":"c","text":"Przeznaczenie budżetu pilotażu na remonty posiadanych mieszkań wybranych według potrzeb gospodarstw oczekujących na lokal.","feedback":"To wykorzystanie istniejącego zasobu. Koszty, dobór remontów i wykonalność pozostają do sprawdzenia."}],"hint":"Porównaj cel pytania z zakresem każdej odpowiedzi. Ustal, co mierzy lub zakłada każda propozycja."}}},"SCT_a":{"task":"Przygotuj alternatywy dalszych działań ograniczających narażenie przy ulicach, uwzględniając podróże i obszary poza strefą. Nie przesądzaj rozszerzenia jej granic.","horizon":"trzy kolejne lata","baseline":"Obecne reguły strefy, sposób ich realizacji i rozpoczęte działania transportowe.","trend":"Skład floty, ruch, pogoda i inwestycje transportowe zmieniają narażenie także przy obecnych regułach.","options":[["boundary","Propozycja korekty obszaru strefy do dalszych prac","Zmiana obszaru może objąć źródła przy kolejnych ulicach; wymaga procedury i oceny skutków poza granicą."],["public","Usprawnienie dojazdu transportem zbiorowym","Dostępna alternatywa podróży może ograniczać zależność od samochodu i obciążenia części grup."],["traffic","Propozycja zmian organizacji ruchu przy wybranych ulicach","Zmiana tras i warunków ruchu może wpływać na emisję i jej rozkład przestrzenny."],["package","Prace nad regułami z usprawnieniem dojazdu","Pakiet łączy ograniczenie emisji z warunkami utrzymania potrzebnych podróży."]],"scale":["Analiza pilotażu dla dwóch korytarzy podróży","Analiza pilotażu dla czterech korytarzy podróży"],"newInfo":"Model dwóch wariantów organizacji ruchu wskazuje możliwość przeniesienia części ruchu na ulice poza strefą. Wynik jest wrażliwy na założenia o wyborze tras. Nie ustalono jeszcze skutku netto dla narażenia mieszkańców.","limit":"Klient przygotowuje propozycje. Zmiany uchwały i zasad wymagają właściwej procedury i decyzji rady; granica strefy nie wyznacza granicy analizy narażenia.","adaptations":["Rozszerzyć ocenę na ulice poza strefą","Dodać wariant usprawnień potrzebnych podróży","Zachować projekt i sprawdzić jego zakres"],"criteria":["Ograniczenie narażenia: minimalizować liczbę mieszkańców przy ulicach przypisanych przez model do poziomu NO₂ ponad T, wewnątrz i poza strefą.","Efektywność kosztowa: minimalizować dodatkowy koszt publiczny i prywatny na osobę mniej na obszarach ponad T względem A0.","Sprawiedliwość obciążeń: minimalizować odsetek osób o niskich dochodach tracących możliwość potrzebnej podróży bez dostępnej alternatywy."],"questions":{"scope":{"title":"Który rezultat odpowiada temu zleceniu prezydenta?","correct":"b","options":[{"id":"a","text":"Sprawniejsze potwierdzanie wyłączeń dla osób składających wnioski w miejskim punkcie obsługi.","feedback":"To główny rezultat drugiego klienta, który organizuje obsługę wyłączeń."},{"id":"b","text":"Mniejsze narażenie mieszkańców przy uwzględnieniu potrzebnych podróży oraz obszarów poza strefą.","feedback":"To rezultat publiczny z odpowiednio szerokim zakresem przestrzennym."},{"id":"c","text":"Mniejsze narażenie mieszkańców na NO₂ przy ulicach objętych kontrolą wjazdu w granicach strefy.","feedback":"To poprawa w zawężonym obszarze. Zlecenie obejmuje także otoczenie strefy i potrzebne podróże, więc trzeba uwzględnić możliwe przeniesienie narażenia."}],"hint":"Porównaj cel pytania z zakresem każdej odpowiedzi. Ustal, co mierzy lub zakłada każda propozycja."},"effect":{"title":"Kryterium: ograniczenie narażenia według modelu NO₂. Który miernik odpowiada diagnozie?","correct":"c","options":[{"id":"a","text":"Minimalizować liczbę mieszkańców przy ulicach ponad T według modelu obejmującego obszar wewnątrz przyjętych granic strefy.","feedback":"Ten zakres pomija mieszkańców ulic poza strefą, na które może przenieść się ruch. W zleceniu granica strefy nie jest granicą analizy."},{"id":"b","text":"Minimalizować średnie stężenie NO₂ przy ulicach według modelu obejmującego strefę i otoczenie, bez ważenia liczbą mieszkańców.","feedback":"Średnia stężeń bez rozmieszczenia mieszkańców nie mierzy liczby osób na obszarach ponad T. Może zmieniać się inaczej niż narażenie populacji."},{"id":"c","text":"Minimalizować liczbę mieszkańców przy ulicach ponad T według modelu obejmującego obszar wewnątrz i poza granicami strefy.","feedback":"To zachowuje jednostkę rezultatu i zakres przestrzenny. Model jest przybliżeniem narażenia i wymaga wspólnych założeń dla porównywanych alternatyw."}],"hint":"Porównaj cel pytania z zakresem każdej odpowiedzi. Ustal, co mierzy lub zakłada każda propozycja."},"cost":{"title":"Wspólny okres oraz przyrost kosztów publicznych i prywatnych są ustalone. Który mianownik odpowiada dodatkowemu ograniczeniu narażenia względem A0?","correct":"a","options":[{"id":"a","text":"Spadek liczby mieszkańców przy ulicach ponad T w strefie i jej otoczeniu względem A0.","feedback":"Mianownik obejmuje dodatkową poprawę w całym zakresie przestrzennym. Przy braku dodatniej poprawy nie porównujemy mechanicznie ilorazów."},{"id":"b","text":"Spadek liczby mieszkańców przy ulicach ponad T wewnątrz granic strefy względem A0.","feedback":"Pominięcie otoczenia może ukryć przeniesienie narażenia. Koszt jednostki tak zawężonej poprawy nie odpowiada zleceniu."},{"id":"c","text":"Spadek liczby mieszkańców przy ulicach ponad T w strefie i otoczeniu względem stanu początkowego.","feedback":"Zmiana względem stanu początkowego obejmuje też trendy floty, pogody i ruchu. W zadaniu porównujemy z dynamicznym A0."}],"hint":"Porównaj cel pytania z zakresem każdej odpowiedzi. Ustal, co mierzy lub zakłada każda propozycja."},"third":{"title":"Kryterium: osłona potrzebnych podróży osób o niskich dochodach. Który miernik odnosi się do obciążenia?","correct":"b","options":[{"id":"a","text":"Minimalizować odsetek osób o niskich dochodach używających pojazdów niezgodnych z przyjętymi warunkami wjazdu.","feedback":"Zgodność pojazdu jest cechą zasobu. Nie pokazuje, czy osoba może odbyć potrzebną podróż innym sposobem."},{"id":"b","text":"Minimalizować odsetek osób o niskich dochodach tracących potrzebną podróż bez dostępnej alternatywy.","feedback":"Trzeba określić potrzebną podróż, dostępność i grupę; miernik dotyczy skutku dla ludzi."},{"id":"c","text":"Minimalizować odsetek osób o niskich dochodach korzystających z przesiadek podczas potrzebnych podróży.","feedback":"Przesiadka może być wygodna albo uciążliwa. Jej wystąpienie nie oznacza utraty możliwości podróży."}],"hint":"Porównaj cel pytania z zakresem każdej odpowiedzi. Ustal, co mierzy lub zakłada każda propozycja."},"revision":{"title":"Który sposób sprawdzenia projektu odpowiada informacji o możliwym przeniesieniu ruchu?","correct":"c","options":[{"id":"a","text":"Porównać liczbę wjazdów do strefy w obu wariantach przy różnych założeniach o wyborze tras.","feedback":"To nie obejmuje pełnego narażenia poza strefą. Spadek wjazdów nie wystarcza do wniosku o skutku netto."},{"id":"b","text":"Porównać narażenie przy ulicach wewnątrz strefy w obu wariantach przy różnych założeniach o wyborze tras.","feedback":"Wrażliwość założeń jest uwzględniona, lecz pominięto obszary, na które problem może się przenieść."},{"id":"c","text":"Porównać narażenie w strefie i jej otoczeniu w obu wariantach przy różnych założeniach o wyborze tras.","feedback":"To obejmuje możliwe przemieszczenie problemu i sprawdza wrażliwość wyniku na zachowania kierowców."}],"hint":"Porównaj cel pytania z zakresem każdej odpowiedzi. Ustal, co mierzy lub zakłada każda propozycja."},"constraint":{"title":"Które działanie odpowiada roli klienta opisanej w zleceniu?","correct":"a","options":[{"id":"a","text":"Przekazanie radzie projektu zmiany granic strefy wraz z oceną warunków i skutków wariantów.","feedback":"To przygotowanie propozycji do decyzji rady; projekt nie ustanawia sam nowych granic."},{"id":"b","text":"Przekazanie operatorowi nowej mapy granic strefy jako załącznika do zaktualizowanej instrukcji obsługi wniosków.","feedback":"Instrukcja obsługi nie zastępuje procedury zmiany uchwały i decyzji rady o granicach."},{"id":"c","text":"Przekazanie służbom nowej mapy granic strefy do pilotażowego stosowania na czas oceny wariantów.","feedback":"Pilotażowe stosowanie także zmienia z
