h."},{"id":"c","text":"Maksymalizować odsetek dotychczasowych uczestników mogących zgłosić potrzebę i skorzystać z przewidzianych sposobów udziału.","feedback":"Zakres dotychczasowych uczestników pomija grupy wcześniej nieobecne. Zlecenie wymaga rozpoznania ich możliwości i barier."}],"hint":"Porównaj cel pytania z zakresem każdej odpowiedzi. Ustal, co mierzy lub zakłada każda propozycja."},"cost":{"title":"Koszty publiczne i prywatne porównujesz z A0 w tym samym okresie. Który mianownik pasuje do kosztu dodatkowej możliwości udziału?","correct":"c","options":[{"id":"a","text":"Przyrost liczby osób korzystających z pomocy podczas zgłaszania potrzeb w porównaniu ze scenariuszem A0.","feedback":"Skorzystanie z pomocy nie przesądza możliwości przejścia przewidzianych etapów. Nie obejmuje też poprawy osiągniętej inną drogą."},{"id":"b","text":"Liczba osób mających możliwość zgłoszenia potrzeb i udziału w kolejnej edycji przy danej alternatywie.","feedback":"To łączna możliwość udziału, także istniejąca w A0. Dla kosztu dodatkowej poprawy potrzebna jest różnica rezultatów."},{"id":"c","text":"Przyrost liczby osób mających możliwość zgłoszenia potrzeb i udziału w porównaniu ze scenariuszem A0.","feedback":"To przyrost rezultatu według wspólnej definicji możliwości. Mniejszy koszt jednostki dodatniego efektu jest pożądany."}],"hint":"Porównaj cel pytania z zakresem każdej odpowiedzi. Ustal, co mierzy lub zakłada każda propozycja."},"third":{"title":"Kryterium: równość możliwości osób z ograniczoną mobilnością i pozostałych. Który miernik zastosujesz?","correct":"b","options":[{"id":"a","text":"Minimalizować bezwzględną różnicę odsetka głosujących między mieszkańcami z ograniczoną mobilnością i pozostałymi.","feedback":"Frekwencja zależy od możliwości, zainteresowania i decyzji o udziale. Nie jest bezpośrednią miarą różnicy samych możliwości."},{"id":"b","text":"Minimalizować bezwzględną różnicę odsetka osób z możliwością udziału między mieszkańcami z ograniczoną mobilnością i pozostałymi.","feedback":"Luka możliwości wymaga tej samej definicji dla obu grup. Sprawdzaj również poziom dostępu, aby zmniejszenie luki nie wynikało z pogorszenia."},{"id":"c","text":"Minimalizować bezwzględną różnicę liczby osób z możliwością udziału między mieszkańcami z ograniczoną mobilnością i pozostałymi.","feedback":"Równa liczba przy różnej wielkości grup nie oznacza równości możliwości. Potrzebne są udziały w odpowiednich populacjach."}],"hint":"Porównaj cel pytania z zakresem każdej odpowiedzi. Ustal, co mierzy lub zakłada każda propozycja."},"revision":{"title":"Który element projektu najlepiej odpowiada wskazanym w nowej wiadomości barierom udziału?","correct":"c","options":[{"id":"a","text":"Rozszerzenie liczby wysyłanych instrukcji oraz zwiększenie częstotliwości przypominania terminów głosowania mieszkańcom objętym działaniem.","feedback":"To odpowiada niewiedzy o zasadach i terminach. Wiadomość wskazuje także wiarygodność realizacji i dostępność pomocy."},{"id":"b","text":"Zwiększenie liczby kanałów publikacji zasad oraz ujednolicenie treści komunikatów kierowanych do mieszkańców objętych działaniem.","feedback":"To może poprawiać komunikację zasad, ale nie odpowiada wprost obu ujawnionym barierom."},{"id":"c","text":"Wyjaśnienie stanu realizacji wcześniejszych projektów oraz zapewnienie dostępnego miejsca pomocy mieszkańcom objętym działaniem.","feedback":"To odpowiada wiarygodności realizacji i dostępności pomocy. Zakres i efekt nadal wymagają sprawdzenia."}],"hint":"Porównaj cel pytania z zakresem każdej odpowiedzi. Ustal, co mierzy lub zakłada każda propozycja."},"constraint":{"title":"Która propozycja mieści się w zakresie pilotażu CKS?","correct":"a","options":[{"id":"a","text":"Uruchomienie uzgodnionych z dzielnicami dyżurów pomocy oraz informacji o realizacji projektów wybranych wcześniej przez mieszkańców.","feedback":"To wsparcie i koordynacja w przyjętym mandacie, bez ustanawiania innych zasad głosowania."},{"id":"b","text":"Uruchomienie dodatkowego tygodnia głosowania dla mieszkańców, którzy potrzebują osobistej pomocy przy dokonaniu wyboru projektów.","feedback":"Wydłużenie terminu dla części osób zmienia zasady głosowania. Rozpoznana bariera nie rozszerza mandatu pilotażu."},{"id":"c","text":"Uruchomienie osobnego głosowania dla słabiej reprezentowanych mieszkańców z wydzieloną pulą środków na wybrane projekty.","feedback":"Wydzielenie głosowania i puli zmienia zasady procesu. Taki pomysł wymaga odrębnej propozycji i właściwych decyzji."}],"hint":"Porównaj cel pytania z zakresem każdej odpowiedzi. Ustal, co mierzy lub zakłada każda propozycja."}}},"BO_b":{"task":"Przygotuj sposoby usprawnienia realizacji projektów przydzielonych dzielnicy, ze szczególnym uwzględnieniem etapów przed podpisaniem umowy.","horizon":"realizacja jednej kolejnej edycji","baseline":"Obecne harmonogramy, podział odpowiedzialności i rozpoczęte uzgodnienia projektów.","trend":"Czas uzgodnień, dostępność wykonawców i koszty realizacji mogą zmieniać się także przy obecnej organizacji.","options":[["early","Wczesny przegląd zakresu i zależności projektu","Rozpoznanie niejasnego zakresu lub prawa do terenu może ujawnić przeszkody przed planowaną umową."],["owner","Koordynator z terminami uzgodnień","Jawna odpowiedzialność i harmonogram zależności mogą ograniczać oczekiwanie między jednostkami."],["track","Monitoring etapów z informacją dla autorów","Widoczny stan spraw i opóźnień może ułatwić reakcję i rozliczalność."],["package","Przegląd przygotowania z koordynacją uzgodnień","Pakiet łączy rozpoznanie przeszkód z organizacją ich rozwiązywania."]],"scale":["Pilotaż dla sześciu projektów","Pilotaż dla dwunastu projektów"],"newInfo":"W planie kolejnej edycji cztery z sześciu projektów wymagają uzgodnień z innymi jednostkami. W dwóch harmonogram zakłada ich odpowiedź przed terminem, którego te jednostki nie potwierdziły. Nie ustalono jeszcze terminów dla wszystkich zależności.","limit":"Pilotaż może zmieniać koordynację i harmonogramowanie, lecz nie może pomijać wymaganych uzgodnień ani ograniczać wybranego zakresu projektu wyłącznie dla poprawy terminowości.","adaptations":["Dodać wcześniejsze uzgodnienie zakresu projektu","Dodać harmonogram zależności z innymi jednostkami","Zachować projekt i sprawdzić jego zakres"],"criteria":["Terminowość rezultatu: maksymalizować odsetek projektów oddanych do użytkowania w uzgodnionym zakresie do pierwotnie przyjętego terminu.","Efektywność kosztowa: minimalizować dodatkowy koszt na dodatkowy projekt oddany w terminie i uzgodnionym zakresie względem A0.","Rozliczalność: maksymalizować odsetek projektów z aktualną i zrozumiałą informacją o etapie, przyczynie opóźnienia oraz odpowiedzialności za kolejny krok."],"questions":{"scope":{"title":"Który rezultat odpowiada zleceniu burmistrza dzielnicy?","correct":"b","options":[{"id":"a","text":"Większa liczba mieszkańców uczestniczących w głosowaniu nad projektami kolejnej edycji budżetu obywatelskiego.","feedback":"To inny problem: uczestnictwo w wyborze, a nie realizacja przydzielonych projektów."},{"id":"b","text":"Więcej wybranych projektów dostępnych do użytkowania w uzgodnionym zakresie i planowanym terminie.","feedback":"To rezultat dla mieszkańców. Podpisanie umowy lub przesunięcie harmonogramu go nie zastępuje."},{"id":"c","text":"Krótsze przygotowanie umów wykonawczych oraz sprawniejsze uzgadnianie dokumentacji z wykonawcami wybranych projektów.","feedback":"Umowa jest etapem wymagającym usprawnienia, lecz docelowym rezultatem jest dostępny projekt w uzgodnionym zakresie i terminie."}],"hint":"Porównaj cel pytania z zakresem każdej odpowiedzi. Ustal, co mierzy lub zakłada każda propozycja."},"effect":{"title":"Kryterium: terminowe udostępnienie uzgodnionego projektu. Który miernik zastosujesz?","correct":"c","options":[{"id":"a","text":"Maksymalizować odsetek projektów oddanych do użytkowania w uzgodnionym zakresie do ostatnio zaktualizowanego terminu realizacji.","feedback":"Aktualizacja terminu jest użyteczna w zarządzaniu, lecz nie zachowuje pierwotnego punktu odniesienia. Samo przesunięcie daty mogłoby poprawić wynik."},{"id":"b","text":"Maksymalizować odsetek projektów z podpisaną umową na uzgodniony zakres do pierwotnie przyjętego terminu realizacji.","feedback":"To miernik ważnego etapu, a nie oddania projektu mieszkańcom. Pozostaje do sprawdzenia wykonanie umowy i udostępnienie rezultatu."},{"id":"c","text":"Maksymalizować odsetek projektów oddanych do użytkowania w uzgodnionym zakresie do pierwotnie przyjętego terminu realizacji.","feedback":"Zachowane są rezultat, zakres i wspólny punkt odniesienia. Uzasadnione aktualizacje harmonogramu można opisywać dodatkowo."}],"hint":"Porównaj cel pytania z zakresem każdej odpowiedzi. Ustal, co mierzy lub zakłada każda propozycja."},"cost":{"title":"Liczysz dodatkowy koszt realizacji względem A0. Który mianownik odpowiada terminowemu rezultatowi, przy wspólnym okresie i porównywalnej złożoności projektów?","correct":"a","options":[{"id":"a","text":"Przyrost liczby projektów oddanych w uzgodnionym zakresie do pierwotnego terminu, w porównaniu ze scenariuszem A0.","feedback":"To dodatkowy rezultat spełniający warunek zakresu i stałego terminu. Złożoność projektów trzeba uwzględnić w interpretacji kosztu jednostki."},{"id":"b","text":"Liczba projektów oddanych w uzgodnionym zakresie do pierwotnego terminu, osiągnięta w ocenianej alternatywie.","feedback":"Łączna liczba obejmuje też projekty oddane w A0. Nie jest liczbą dodatkowych terminowych realizacji."},{"id":"c","text":"Przyrost liczby projektów oddanych w uzgodnionym zakresie do zaktualizowanego terminu, w porównaniu ze scenariuszem A0.","feedback":"Zmiana terminu zmienia jednostkę rezultatu. Pozorne polepszenie wskaźnika może wynikać z aktualizacji harmonogramu, nie szybszej realizacji."}],"hint":"Porównaj cel pytania z zakresem każdej odpowiedzi. Ustal, co mierzy lub zakłada każda propozycja."},"third":{"title":"Kryterium: rozliczalność wobec autorów i mieszkańców. Który miernik najlepiej odpowiada temu kryterium?","correct":"b","options":[{"id":"a","text":"Maksymalizować odsetek projektów z regularną informacją o postępach i terminie, publikowaną co miesiąc w trakcie realizacji.","feedback":"Regularność i termin nie zapewniają informacji o przeszkodzie oraz odpowiedzialności za następny krok. To niepełny zakres rozliczalności."},{"id":"b","text":"Maksymalizować odsetek projektów z aktualną, zrozumiałą informacją o etapie, przeszkodzie i odpowiedzialnym za kolejny krok.","feedback":"Treść pozwala ustalić stan sprawy i odpowiedzialność. Dla projektu bez opóźnienia jawnie zaznacz brak przeszkody zamiast wymagać jej istnienia."},{"id":"c","text":"Maksymalizować odsetek projektów z aktualną informacją o etapie i przeszkodzie, przesłaną autorowi po złożeniu zapytania.","feedback":"Odpowiedź wyłącznie po zapytaniu nie daje pozostałym mieszkańcom stałej informacji i nie wskazuje odpowiedzialności za kolejny krok."}],"hint":"Porównaj cel pytania z zakresem każdej odpowiedzi. Ustal, co mierzy lub zakłada każda propozycja."},"revision":{"title":"Który element projektu najlepiej odpowiada nowej wiadomości o zależnościach realizacji?","correct":"a","options":[{"id":"a","text":"Uzgodnienie terminów z odpowiedzialnymi jednostkami oraz wskazanie zależności przed przyjęciem harmonogramu realizacji projektów.","feedback":"To odpowiada niepotwierdzonym terminom zewnętrznych uzgodnień. Sam plan wewnętrzny nie zapewnia ich wykonania."},{"id":"b","text":"Zwiększenie częstotliwości raportowania wykonawców oraz wskazanie terminów odbioru robót w harmonogramie realizacji projektów.","feedback":"To dotyczy wykonania po umowie; nie rozwiązuje ujawnionej niepewności terminów uzgodnień innych jednostek."},{"id":"c","text":"Ujednolicenie opisów projektów dla mieszkańców oraz wskazanie dat publikacji komunikatów w harmonogramie realizacji projektów.","feedback":"To poprawa informacji. Nie zastępuje uzgodnienia terminów, od których zależy realizacja."}],"hint":"Porównaj cel pytania z zakresem każdej odpowiedzi. Ustal, co mierzy lub zakłada każda propozycja."},"constraint":{"title":"Która propozycja respektuje podane warunki usprawnienia?","correct":"c","options":[{"id":"a","text":"Przesunięcie części wybranych prac do kolejnej edycji oraz rozliczenie obecnego projektu według mniejszego zakresu.","feedback":"Rozliczenie okrojonego projektu zmienia zakres wybrany przez mieszkańców, żeby poprawić terminowość. Narusza warunek zlecenia."},{"id":"b","text":"Przesunięcie uzgodnień dotyczących terenu na etap odbioru oraz rozpoczęcie robót według przygotowanej dokumentacji projektu.","feedback":"Przeniesienie wymaganych uzgodnień na odbiór nie pozwala oprzeć rozpoczęcia robót na ich wyniku."},{"id":"c","text":"Przesunięcie przeglądu dokumentacji na początek przygotowania oraz uzgodnienie terminów odpowiedzi jednostek przed planowanym rozpoczęciem robót.","feedback":"Zmienia się kolejność przygotowania i koordynacja, a nie zakres projektu czy wymagania uzgodnień."}],"hint":"Porównaj cel pytania z zakresem każdej odpowiedzi. Ustal, co mierzy lub zakłada każda propozycja."}}}},"measurementNotes":{"GPA_a":"Standard z poprzedniej gry: potrzebny dojazd i powrót, do 60 minut w jedną stronę i koszt do 10% dziennego dochodu. To umowa ćwiczenia. Jednostka dostępności to podróż, a jednostka efektu w kryterium kosztowym to osoba; tej samej osoby nie liczymy wielokrotnie.","GPA_b":"Prognozy porównujemy przy tej samej dacie przygotowania i tych samych jednostkach pieniężnych. Średni błąd bezwzględny liczymy z porównywalnego zestawu kwartałów; błędy ze znakiem nie mogą się wzajemnie znosić.","CP_a":"Poziom T jest umowny. Model PM2,5 obejmuje mieszkańców gminy, także nieuczestniczących w programie. Te same sezony i założenia modelu stosujemy do A0, A1 i A2 w trzyletnim horyzoncie.","CP_b":"Próg 30 dni jest umowny. Mianownik obejmuje sprawy z danego okresu wpływu, dla których minęło co najmniej 30 dni obserwacji. Licznik obejmuje zakończone po progu i nadal otwarte po progu. Nowsze sprawy analizujemy osobno, zamiast liczyć je jako terminowe.","BK2_a":"Grupę docelową, standard nadmiernego obciążenia i sposób liczenia dochodu oraz wydatków ustalamy przed porównaniem. Poprawę sytuacji i jej podział odnosimy do A0. Mniejszą lukę oceniamy łącznie z poprawą dostępności, aby nie wyrównywać przez pogorszenie.","BK2_b":"Próg 12 miesięcy jest umowny. Porównujemy gospodarstwa z tego samego okresu wpisania na listę i z co najmniej roczną obserwacją. Liczymy przekroczenia przy późnych przydziałach oraz w sprawach nadal otwartych. Odpowiedniość lokalu wynika z jawnie ustalonych potrzeb.","SCT_a":"Poziom T jest umowny. Model NO₂ obejmuje mieszkańców ulic wewnątrz strefy i poza nią, przy wspólnych okresach i założeniach. Spadek ruchu lub średniego stężenia nie jest tożsamy ze spadkiem liczby mieszkańców ponad T.","SCT_b":"Próg 10 dni jest umowny. Czas liczymy od pierwszego złożenia; mianownik to sprawy z tego samego okresu wpływu z co najmniej dziesięciodniową obserwacją. Liczymy późno zakończone i nadal otwarte. Osobno mierzymy możliwość złożenia wniosku wśród podejmujących próbę osób z barierą cyfrową.","BO_a":"Możliwość udziału obejmuje zgłoszenie potrzeby i przewidziane sposoby uczestnictwa. Nie wymaga faktycznego oddania głosu. Lukę między grupami liczymy jako wartość bezwzględną różnicy udziałów i czytamy razem z ich poziomem.","BO_b":"Termin oznacza datę przyjętą przed porównaniem, a zakres uzgodniony projekt dostępny do użytkowania. Aktualizacje harmonogramu opisujemy osobno. Informacja o projekcie bez opóźnienia powinna jawnie wskazywać ten stan zamiast fikcyjnej przeszkody."},"costNote":"Efektywność kosztowa odnosi dodatkowe koszty do dodatkowego rezultatu względem A0 w tym samym okresie. Uwzględnij wskazany zakres kosztów instytucji i odbiorców, bez podwójnego liczenia transferów. Przy dodatnim przyroście efektu niższy koszt jego jednostki jest pożądany. Dla A0 nie licz 0/0; zerowy lub ujemny przyrost efektu wymaga osobnego omówienia.","revision":{"version":"2.2.0","date":"2026-11-14","basis":"Wykład v3: kolejność i iteracyjność. Zmienione dwa pytania wspólne. Zlecenia, alternatywy, kryteria i pytania profilowe po audycie 2.1.0 zachowane."},"methodNote":"Kolejność pracy: znane wartości i warunki uwzględniamy od początku. Alternatywy i kryteria rozwijamy w toku analizy. Po uzasadnionej korekcie stosujemy wspólne definicje do wszystkich opcji. Bardach i Patashnik, Wprowadzenie, s. xvi–xvii; polski PDF, s. 16 i 22–23; wykład v3, slajdy 4–8. Inne sekwencje omawiają Patton, Sawicki i Clark; Keeney pokazuje rolę wartości w tworzeniu alternatyw."};</script><script>window.B34ContentV20={"common":{"evidence":{"title":"Raport z obszaru Y opisuje poprawę po kilku zmianach, bez oddzielenia ich skutków. Do czego wykorzystasz go najpierw?","correct":"c","options":[{"id":"a","text":"Do ustalenia wielkości poprawy w X, po przeliczeniu wyniku na liczbę odbiorców.","feedback":"Przeliczenie skali nie oddziela skutków działań od innych zmian ani nie rozwiązuje problemu przenoszenia wyniku."},{"id":"b","text":"Do wstępnego uszeregowania działań w X, według wielkości poprawy odnotowanej w Y.","feedback":"Raport opisuje łączną zmianę. Nie pozwala uszeregować wkładu poszczególnych działań ani ich lokalnych efektów."},{"id":"c","text":"Do wskazania działań do rozważenia w X, po porównaniu mechanizmów i warunków.","feedback":"Opis może pomóc tworzyć alternatywy. Prognozowanie ich efektów wymaga dodatkowych przesłanek."}],"hint":"Rozróżnij użycie raportu do tworzenia pomysłów, do przypisania skutku oraz do prognozowania w nowym miejscu."},"baseline":{"title":"Jak zbudować A0 na przyjęty okres porównania?","correct":"b","options":[{"id":"a","text":"Zachować obecne działania i przyjąć wyniki na poziomie z ostatniego pomiaru.","feedback":"To zamraża rezultaty. Mogą się one zmieniać nawet bez nowej decyzji klienta."},{"id":"b","text":"Uwzględnić obecne działania oraz przewidywane zmiany otoczenia bez nowej decyzji klienta.","feedback":"A0 jest dynamiczną kontynuacją. Dzięki temu nie przypisujemy nowej alternatywie całej przyszłej zmiany."},{"id":"c","text":"Ograniczyć działania do zadań niezbędnych, uwzględniając przewidywane zmiany ich otoczenia.","feedback":"Ograniczenie działań jest odrębną decyzją. Może być alternatywą, ale nie zastępuje opisanej kontynuacji."}],"hint":"Co zmienia się samo lub wynika z już podjętych decyzji, a co wymaga nowej decyzji?"},"variant":{"title":"W poniższym przykładzie szkoleniowym która para przedstawia warianty skali jednego instrumentu?","correct":"a","options":[{"id":"a","text":"Dyżury doradcy dwa albo cztery razy miesięcznie, przy tym samym zakresie udzielanej pomocy.","feedback":"Zmienia się częstotliwość tego samego działania. Nie ustalamy jeszcze, która skala jest korzystniejsza."},{"id":"b","text":"Dyżury doradcy albo automatyczne pobieranie danych, przy tym samym miesięcznym budżecie obsługi spraw.","feedback":"Pomoc człowieka i wymiana danych działają przez odmienne mechanizmy. Wspólny budżet nie czyni ich wariantami skali."},{"id":"c","text":"Dyżury doradcy z dopłatą albo z przewozem, przy tej samej liczbie objętych wsparciem osób.","feedback":"Zmienia się skład pakietu instrumentów. Liczba odbiorców jest wspólna, lecz nie tożsamy sposób działania."}],"hint":"Porównaj wykonawcę, mechanizm, skład pakietu i parametr ilościowy."},"transfer":{"title":"Chcesz oszacować częstość bariery zapisu wśród seniorów z obszaru domu kultury. Jakie badanie odpowiada temu pytaniu?","correct":"a","options":[{"id":"a","text":"Ankieta w losowej próbie seniorów z całego obszaru, obejmującej także osoby niekorzystające z zajęć.","feedback":"Dobór z określonej populacji umożliwia oszacowanie częstości, z uwzględnieniem niepewności i braku odpowiedzi."},{"id":"b","text":"Analiza wszystkich zakończonych zapisów na zajęcia, obejmująca czas zgłoszenia i liczbę kontaktów z obsługą.","feedback":"Rejestr zakończonych zapisów pomija nieudane próby i osoby, które nie zaczęły zapisu. Opisuje inny zbiór."},{"id":"c","text":"Wywiady z kolejnymi seniorami zgłaszającymi trudności, obejmujące przebieg prób zapisu i napotkane przeszkody.","feedback":"To trafna metoda poznawania barier, ale celowy dobór osób z trudnościami nie wyznacza ich częstości w populacji."}],"hint":"Najpierw określ populację. Następnie sprawdź, kto ma szansę znaleźć się w każdej proponowanej próbie."}},"cases":{"GPA_a":{"task":"Przygotuj alternatywy korekty oferty, które ułatwią potrzebne podróże i powroty osobom bez auta. Ustal kryteria przed szacowaniem skutków.","horizon":"kolejny rok","baseline":"Obecny rozkład, istniejące połączenia i uzgodnione finansowanie.","trend":"Godziny zmian w zakładach pracy i zapotrzebowanie na podróże mogą się zmieniać także bez korekty rozkładu.","options":[["hours","Przesunięcie godzin wybranych kursów","Dopasowanie odjazdów do zakończenia zmian może umożliwić powroty bez zwiększania liczby kursów."],["connections","Koordynacja przesiadek między liniami","Uzgodnione przesiadki mogą połączyć istniejące odcinki w użyteczną podróż."],["late","Dodatkowy kurs po późnej zmianie","Dodatkowy odjazd może wypełnić lukę czasową, ale wymaga zasobów."],["package","Korekta godzin z uzgodnieniem przesiadek","Pakiet może usuwać dwie bariery; zależy od współpracy organizatorów."]],"scale":["Na dwóch wybranych liniach przez kwartał","Na pięciu wybranych liniach przez kwartał"],"newInfo":"Przegląd dwunastu wskazanych podróży pokazuje, że w pięciu powrót jest możliwy po przesunięciu odjazdu, a w czterech wymaga także uzgodnienia przesiadki. Część podróży należy do obu grup. Nie jest to próba wszystkich podróży.","limit":"W pierwszym kwartale pilotażu dostępna liczba wozogodzin pozostaje na obecnym poziomie. Zmiany między liniami wymagają uzgodnienia z operatorem.","adaptations":["Uzgodnić godziny z połączeniem przesiadkowym","Przesunąć istniejące kursy w ramach zasobów","Zachować projekt i sprawdzić jego zakres"],"criteria":["Dostępność: maksymalizować odsetek potrzebnych podróży osób bez auta z wykonalnym dojazdem i powrotem w przyjętym standardzie.","Efektywność kosztowa: minimalizować dodatkowy koszt publiczny i prywatny na dodatkową osobę z wykonalną potrzebną podróżą względem A0.","Równość dostępu: minimalizować różnicę odsetka wykonalnych podróży między obszarami peryferyjnymi a centralnymi."],"questions":{"scope":{"title":"Który rezultat odpowiada zleceniu zarządu GPA?","correct":"b","options":[{"id":"a","text":"Mniej rozbieżności między prognozą wkładu gminy a jego kwartalnym rozliczeniem.","feedback":"To rezultat istotny dla drugiego klienta, który planuje wkład gminy."},{"id":"b","text":"Więcej potrzebnych podróży osób bez auta z wykonalnym dojazdem i powrotem.","feedback":"To rezultat dotyczący dostępności. Sam wzrost przejazdów nie obejmuje osób dotąd wykluczonych."},{"id":"c","text":"Więcej kursów w rozkładzie na liniach obsługujących badane zakłady pracy zmianowej.","feedback":"Kursy są elementem oferty. Ich przyrost nie przesądza dopasowania do potrzebnych podróży."}],"hint":"Porównaj cel pytania z zakresem każdej odpowiedzi. Ustal, co mierzy lub zakłada każda propozycja."},"effect":{"title":"Kryterium: dostępność potrzebnych podróży. Który miernik najlepiej odpowiada temu rezultatowi?","correct":"a","options":[{"id":"a","text":"Maksymalizować odsetek potrzebnych podróży z wykonalnym dojazdem i powrotem według ustalonego standardu.","feedback":"Miernik łączy potrzebę z możliwością podróży. Trzeba określić populację, okres i standard."},{"id":"b","text":"Maksymalizować odsetek zaplanowanych kursów wykonanych przez operatora zgodnie z przyjętym rozkładem jazdy.","feedback":"To ważna niezawodność usługi, lecz nie mówi, czy rozkład umożliwia potrzebne podróże."},{"id":"c","text":"Maksymalizować odsetek miejsc zajętych w autobusach kursujących na liniach objętych korektą rozkładu.","feedback":"Napełnienie opisuje wykorzystanie oferty. Wzrost może współwystępować z brakiem dostępu części mieszkańców."}],"hint":"Porównaj cel pytania z zakresem każdej odpowiedzi. Ustal, co mierzy lub zakłada każda propozycja."},"cost":{"title":"Kryterium: koszt uzyskania dodatkowej dostępności względem A0. Która relacja kosztu i efektu pasuje do niego?","correct":"c","options":[{"id":"a","text":"Minimalizować dodatkowy koszt na kurs wykonany przez operatora w okresie porównania.","feedback":"Mianownik opisuje produkt usługi, a nie dodatkową dostępność potrzebnych podróży."},{"id":"b","text":"Minimalizować dodatkowy koszt na pasażera przewiezionego według rozkładu w okresie porównania.","feedback":"Liczba pasażerów pomija niezrealizowane potrzeby; ten wskaźnik może preferować już dostępne trasy."},{"id":"c","text":"Minimalizować dodatkowy koszt na dodatkową osobę z wykonalną potrzebną podróżą w okresie porównania.","feedback":"Porównuj koszty publiczne i prywatne oraz zmianę względem A0 w tym samym okresie."}],"hint":"Porównaj cel pytania z zakresem każdej odpowiedzi. Ustal, co mierzy lub zakłada każda propozycja."},"third":{"title":"Kryterium: wyrównanie dostępu peryferii i centrum. Który miernik bezpośrednio pokazuje różnicę możliwości?","correct":"b","options":[{"id":"a","text":"Minimalizować różnicę liczby przystanków na terenach peryferyjnych i centralnych obszaru.","feedback":"Taka sama liczba przystanków nie musi dawać takich samych możliwości podróży."},{"id":"b","text":"Minimalizować różnicę odsetka wykonalnych podróży na terenach peryferyjnych i centralnych obszaru.","feedback":"Porównuje się możliwość podróży według tego samego standardu, z uwzględnieniem potrzeb obu grup."},{"id":"c","text":"Minimalizować różnicę liczby sprzedanych biletów na terenach peryferyjnych i centralnych obszaru.","feedback":"Sprzedaż zależy m.in. od liczby ludności i obecnej oferty; nie obejmuje osób pozbawionych dostępu."}],"hint":"Porównaj cel pytania z zakresem każdej odpowiedzi. Ustal, co mierzy lub zakłada każda propozycja."},"revision":{"title":"Które sprawdzenie projektu najlepiej odpowiada nowej wiadomości o wskazanych podróżach?","correct":"c","options":[{"id":"a","text":"Sprawdzić rozpoznawalność rozkładu i czytelność informacji o kursach wśród osób objętych przeglądem podróży.","feedback":"To może być wartościowe, lecz wiadomość wskazuje przede wszystkim godziny i przesiadki, a nie brak znajomości oferty."},{"id":"b","text":"Sprawdzić wykorzystanie miejsc i wielkość pojazdów na liniach obsługujących osoby objęte przeglądem podróży.","feedback":"To odpowiada problemowi pojemności. Nowa wiadomość nie wskazuje przepełnienia jako bariery tych podróży."},{"id":"c","text":"Sprawdzić dopasowanie odjazdów i możliwość przesiadek dla tych samych osób objętych przeglądem podróży.","feedback":"To odpowiada obu wskazanym mechanizmom; identyfikacja tych samych podróży zapobiega podwójnemu liczeniu."}],"hint":"Porównaj cel pytania z zakresem każdej odpowiedzi. Ustal, co mierzy lub zakłada każda propozycja."},"constraint":{"title":"Która propozycja respektuje podany limit zasobów pilotażu?","correct":"a","options":[{"id":"a","text":"Uzgodnienie przesunięcia dziesięciu wozogodzin z poranków na wieczory oraz nowych godzin przesiadek między liniami.","feedback":"Przesunięcie nie zwiększa łącznej liczby wozogodzin. Trzeba sprawdzić dostępność pojazdów i skutki dla pasażerów porannych kursów."},{"id":"b","text":"Uzgodnienie dziesięciu dodatkowych wozogodzin wieczornych oraz zmniejszenia wydatków gminy na informację o rozkładach jazdy.","feedback":"Oszczędność pieniędzy nie zwiększa dostępnej liczby wozogodzin. To inny rodzaj ograniczenia zasobów."},{"id":"c","text":"Uzgodnienie dziesięciu dodatkowych wozogodzin weekendowych oraz utrzymania obecnej stawki operatora za realizację przewozów autobusowych.","feedback":"Utrzymanie stawki nie oznacza utrzymania łącznej liczby wozogodzin."}],"hint":"Porównaj cel pytania z zakresem każdej odpowiedzi. Ustal, co mierzy lub zakłada każda propozycja."}}},"GPA_b":{"task":"Przygotuj sposoby poprawy podstaw planowania wkładu gminy w przewozy, z uwzględnieniem ciągłości potrzebnych usług.","horizon":"cztery kolejne kwartały","baseline":"Obecny obieg danych, używane arkusze i harmonogram przygotowania prognoz.","trend":"Stawki, przychody i uzgodniona oferta mogą się zmieniać bez nowej procedury planowania.","options":[["version","Kontrola wersji arkusza przed prognozą","Sprawdzenie daty stawek i źródła danych może ograniczać błędy własnych obliczeń."],["calendar","Uzgodniony kalendarz przekazywania danych","Terminy uzgodnione ze związkiem mogą zmniejszyć liczbę prognoz opartych na niepełnych danych."],["ranges","Prognozy przedziałowe z aktualizacją założeń","Scenariusze przychodów i kosztów mogą ujawnić niepewność zanim zostanie przyjęta kwota."],["package","Kontrola wersji z kalendarzem danych","Pakiet łączy poprawę pracy urzędu i współpracę ze związkiem."]],"scale":["Pilotaż przez dwa kwartały","Pilotaż przez cztery kwartały"],"newInfo":"Audyt dwóch nowych prognoz wskazuje różne mechanizmy rozbieżności: w jednej użyto starej stawki mimo otrzymania aktualnej, w drugiej brakowało danych o przychodach. Nie ustalono udziału tych mechanizmów w całym roku.","limit":"Pilotaż musi zmieścić się w obecnej obsadzie urzędu i nie może samodzielnie zmieniać uzgodnionej oferty przewozowej.","adaptations":["Dodać kontrolę wersji danych","Uzgodnić termin aktualizacji i przedział prognozy","Zachować projekt i sprawdzić jego zakres"],"criteria":["Trafność prognoz: minimalizować bezwzględne odchylenie prognozowanego wkładu od rozliczenia, przy tej samej dacie prognozy.","Efektywność kosztowa: minimalizować dodatkowy koszt przygotowania na jednostkę zmniejszenia bezwzględnego błędu prognozy względem A0.","Ciągłość usług: maksymalizować odsetek potrzebnych podróży nadal wykonalnych podczas zmian planowania."],"questions":{"scope":{"title":"Który rezultat odpowiada zleceniu wójta w tej ścieżce?","correct":"a","options":[{"id":"a","text":"Mniejsze rozbieżności prognozy wkładu i rozliczenia przy zachowaniu potrzebnych usług przewozowych.","feedback":"Zlecenie dotyczy podstaw planowania, nie automatycznego zmniejszenia dopłat."},{"id":"b","text":"Mniejsze wydatki na wkład gminy dzięki ograniczeniu kursów o niskim napełnieniu.","feedback":"To propozycja redukcji usług i kosztów, której nie wynika z diagnozy błędów prognozy."},{"id":"c","text":"Mniejsze trudności powrotu z pracy dzięki przesunięciu godzin kursowania wybranych autobusów.","feedback":"To rezultat dotyczący zlecenia zarządu GPA o dostępności, a nie głównego problemu tego klienta."}],"hint":"Porównaj cel pytania z zakresem każdej odpowiedzi. Ustal, co mierzy lub zakłada każda propozycja."},"effect":{"title":"Kryterium: trafność prognoz wkładu. Który miernik odpowiada temu kryterium?","correct":"b","options":[{"id":"a","text":"Minimalizować średnią kwotę wkładu gminy podaną w prognozach przygotowanych na ten sam dzień.","feedback":"Niska kwota nie oznacza trafnej prognozy. Może zwiększać niedoszacowanie."},{"id":"b","text":"Minimalizować bezwzględną różnicę prognozy i rozliczenia dla prognoz przygotowanych na ten sam dzień.","feedback":"Bezwzględna różnica nie pozwala wzajemnie znosić się niedoszacowaniom i przeszacowaniom."},{"id":"c","text":"Minimalizować różnicę między kolejnymi wersjami prognozy przygotowanymi w ciągu każdego badanego kwartału.","feedback":"Stabilność wersji może oznaczać ignorowanie nowych danych. Nie mierzy zgodności z rozliczeniem."}],"hint":"Porównaj cel pytania z zakresem każdej odpowiedzi. Ustal, co mierzy lub zakłada każda propozycja."},"cost":{"title":"Kryterium: koszt zmniejszenia błędu prognoz względem A0. Który wskaźnik odpowiada temu celowi?","correct":"a","options":[{"id":"a","text":"Minimalizować dodatkowy koszt na jednostkę zmniejszenia bezwzględnego błędu prognozy wkładu.","feedback":"Koszt i zmniejszenie błędu trzeba określić w spójnych jednostkach oraz dla tego samego okresu."},{"id":"b","text":"Minimalizować dodatkowy koszt na każdą przygotowaną aw wykazał w jedenastu powtarzane żądania podobnych dokumentów. W siedmiu oczekiwano na dokument z innej instytucji; cztery sprawy należą do obu grup.","limit":"Organizacja obsługi może się zmienić, ale wymagane sprawdzenie prawidłowości rozliczenia pozostaje obowiązkowe.","adaptations":["Dodać przegląd treści ponownych wezwań","Dodać uzgodnienie pozyskiwania dokumentów","Zachować projekt i sprawdzić jego zakres"],"criteria":["Terminowość: minimalizować odsetek spraw trwających ponad umowne 30 dni od wpływu do wyniku weryfikacji; uwzględniać także sprawy otwarte.","Efektywność kosztowa: minimalizować dodatkowy koszt funduszu i beneficjenta na dodatkową prawidłowo zakończoną sprawę w umownym czasie względem A0.","Rzetelność: maksymalizować odsetek rozliczeń uznanych za poprawne w niezależnej kontroli próby spraw."],"questions":{"scope":{"title":"Który rezultat odpowiada zleceniu zarządu funduszu?","correct":"b","options":[{"id":"a","text":"Więcej inwestycji zgłoszonych do programu w gminach objętych lokalnymi działaniami środowiskowymi.","feedback":"To szerszy rezultat uczestnictwa; nie opisuje głównego problemu organizacji płatności."},{"id":"b","text":"Krótsza i mniej uciążliwa obsługa płatności przy zachowaniu wymaganej poprawności rozliczeń.","feedback":"To wąskie, uzasadnione zlecenie dotyczące obsługi, bez potrzeby redefiniowania go jako całego smogu."},{"id":"c","text":"Mniej mieszkańców na obszarach ponad T w modelu stężeń badanego sezonu grzewczego.","feedback":"To rezultat środowiskowy istotny w innej ścieżce; nie jest bezpośrednią miarą obsługi płatności."}],"hint":"Porównaj cel pytania z zakresem każdej odpowiedzi. Ustal, co mierzy lub zakłada każda propozycja."},"effect":{"title":"Kryterium: terminowość obsługi według umownego progu 30 dni. Który miernik zastosujesz?","correct":"c","options":[{"id":"a","text":"Minimalizować odsetek spraw przekazanych między zespołami przed upływem trzydziestu dni od ich wpływu.","feedback":"Przekazanie jest etapem organizacyjnym. Może przyspieszać albo wydłużać zakończenie sprawy."},{"id":"b","text":"Minimalizować odsetek spraw wymagających kontaktu z beneficjentem w ciągu trzydziestu dni od ich wpływu.","feedback":"Ograniczenie kontaktu nie musi skracać obsługi; może utrudniać wyjaśnienie braków."},{"id":"c","text":"Minimalizować odsetek spraw bez wyniku weryfikacji po upływie trzydziestu dni od ich wpływu.","feedback":"Uwzględnij właściwą kohortę spraw i sprawy nadal otwarte. Próg jest umową ćwiczenia."}],"hint":"Porównaj cel pytania z zakresem każdej odpowiedzi. Ustal, co mierzy lub zakłada każda propozycja."},"cost":{"title":"Kryterium: koszt dodatkowej terminowej i prawidłowej obsługi względem A0. Która relacja pasuje?","correct":"a","options":[{"id":"a","text":"Minimalizować dodatkowy koszt na dodatkową sprawę prawidłowo zakończoną w umownym czasie obsługi.","feedback":"Miernik łączy rezultat z jakością. Koszt obejmuje także obciążenie beneficjenta."},{"id":"b","text":"Minimalizować dodatkowy koszt na dodatkowe wezwanie wysłane w umownym czasie obsługi sprawy.","feedback":"Wezwanie jest działaniem; wzrost jego liczby może oznaczać większą uciążliwość."},{"id":"c","text":"Minimalizować dodatkowy koszt na dodatkowy dokument zarejestrowany w umownym czasie obsługi sprawy.","feedback":"Rejestracja dokumentu nie przesądza prawidłowego i terminowego zakończenia."}],"hint":"Porównaj cel pytania z zakresem każdej odpowiedzi. Ustal, co mierzy lub zakłada każda propozycja."},"third":{"title":"Kryterium: rzetelność rozliczeń. Który miernik pozwala ocenić ten rezultat?","correct":"b","options":[{"id":"a","text":"Maksymalizować odsetek spraw, w których wykonano wymagany komplet czynności kontrolnych zapisanych w procedurze.","feedback":"To miara wykonania procedury. Jej odhaczenie samo nie potwierdza poprawności ustalenia."},{"id":"b","text":"Maksymalizować odsetek spraw, w których niezależny przegląd potwierdził poprawność dokonanych ustaleń i rozliczenia.","feedback":"To sprawdzenie wyniku kontroli; dobór próby musi obejmować różne rodzaje rozstrzygnięć."},{"id":"c","text":"Maksymalizować odsetek spraw, w których beneficjent nie zwrócił się o wyjaśnienie wyniku przeprowadzonej kontroli.","feedback":"Brak pytania może wynikać z wielu powodów. Nie jest potwierdzeniem poprawności."}],"hint":"Porównaj cel pytania z zakresem każdej odpowiedzi. Ustal, co mierzy lub zakłada każda propozycja."},"revision":{"title":"Który przegląd projektu najlepiej odpowiada nowej wiadomości o długich sprawach?","correct":"c","options":[{"id":"a","text":"Zestawienie liczby przyjętych dokumentów z liczbą pracowników oraz określenie docelowej liczby spraw na osobę.","feedback":"To badanie obciążenia. Bez treści wezwań i zależności zewnętrznych nie rozpoznaje ujawnionych mechanizmów."},{"id":"b","text":"Zestawienie terminów wysyłki wezwań z terminami odbioru oraz określenie docelowej częstotliwości wysyłania przypomnień.","feedback":"Częstsze przypomnienia mogą powtarzać niejasne żądanie lub dotyczyć dokumentu niedostępnego w danym terminie."},{"id":"c","text":"Zestawienie treści ponownych wezwań z zależnościami od innych instytucji oraz rozpoznanie spraw z obiema barierami.","feedback":"To pozwala dopasować organizację do jakości komunikacji i dokumentów zewnętrznych, bez dublowania spraw."}],"hint":"Porównaj cel pytania z zakresem każdej odpowiedzi. Ustal, co mierzy lub zakłada każda propozycja."},"constraint":{"title":"Która zmiana respektuje warunek dotyczący kontroli rozliczenia?","correct":"a","options":[{"id":"a","text":"Weryfikacja kompletności i treści dokumentów w każdej sprawie przed wysłaniem jednego zbiorczego wezwania.","feedback":"Kontrola obejmuje każdą sprawę, a zmiana dotyczy organizacji wezwania. Trzeba sprawdzić, czy zebranie uwag jest wykonalne."},{"id":"b","text":"Weryfikacja kompletności dokumentów w każdej sprawie oraz kontrola ich treści w losowanej próbie rozliczeń.","feedback":"Kontrola próby może służyć innym celom, ale nie zastępuje obowiązkowej u. Przyjęcie nowego instrumentu i środków wymaga odrębnych decyzji właściwych organów.","adaptations":["Dodać warunek sprawdzenia reakcji podaży","Dodać wariant dla gospodarstw poza kredytem","Zachować projekt i sprawdzić jego zakres"],"criteria":["Dostępność finansowa: minimalizować odsetek gospodarstw z określonej grupy docelowej ponoszących nadmierne koszty mieszkania według jawnego standardu.","Efektywność kosztowa: minimalizować dodatkowy koszt społeczny na dodatkowe gospodarstwo wychodzące z nadmiernego obciążenia względem A0.","Sprawiedliwość: minimalizować lukę poprawy sytuacji między gospodarstwami o podobnych potrzebach z dostępem do kredytu i bez niego."],"questions":{"scope":{"title":"Co jest rezultatem nowego zlecenia, które wykracza poza poprzednią diagnozę ewaluacyjną?","correct":"a","options":[{"id":"a","text":"Zestaw propozycji przyszłego wsparcia z kryteriami, przy zachowaniu niepewności dotyczącej historycznych skutków.","feedback":"Zakres zmieniono jawnie: od rozpoznania niepewności do konstrukcji alternatyw, bez uznania dawnych efektów za ustalone."},{"id":"b","text":"Wybór wysokości nowej dopłaty na podstawie różnicy poprawy deklarowanej przez dwie badane grupy.","feedback":"Różnica deklaracji nie identyfikuje skutku; nie przesądza też rodzaju przyszłego instrumentu ani wysokości dopłaty."},{"id":"c","text":"Potwierdzenie skuteczności dawnego instrumentu na podstawie poprawy deklarowanej przez większość jego badanych odbiorców.","feedback":"To nadmierny wniosek z historycznych danych i powrót do innego celu niż nowe zlecenie."}],"hint":"Porównaj cel pytania z zakresem każdej odpowiedzi. Ustal, co mierzy lub zakłada każda propozycja."},"effect":{"title":"Kryterium: ograniczenie nadmiernego obciążenia kosztami mieszkania. Który miernik odnosi się do tego rezultatu?","correct":"c","options":[{"id":"a","text":"Minimalizować odsetek gospodarstw z grupy docelowej oczekujących na rozpatrzenie wniosku o wsparcie mieszkaniowe.","feedback":"To czas obsługi, nie poziom obciążenia kosztami mieszkania."},{"id":"b","text":"Minimalizować odsetek gospodarstw z grupy docelowej niekorzystających z przygotowanego instrumentu wsparcia mieszkaniowego.","feedback":"Korzystanie z instrumentu nie jest tożsame z poprawą sytuacji; część gospodarstw może poprawić ją inaczej."},{"id":"c","text":"Minimalizować odsetek gospodarstw z grupy docelowej przekraczających ustalony udział wydatków mieszkaniowych w dochodzie.","feedback":"Trzeba uzasadnić próg oraz jednakowo określić koszty, dochód, populację i okres."}],"hint":"Porównaj cel pytania z zakresem każdej odpowiedzi. Ustal, co mierzy lub zakłada każda propozycja."},"cost":{"title":"Kryterium: koszt dodatkowego ograniczenia obciążenia względem A0. Która relacja odpowiada temu efektowi?","correct":"b","options":[{"id":"a","text":"Dodatkowy koszt społeczny na dodatkowe gospodarstwo zgłaszające zainteresowanie proponowanym instrumentem wsparcia mieszkaniowego.","feedback":"Zainteresowanie nie jest poprawą sytuacji mieszkaniowej."},{"id":"b","text":"Dodatkowy koszt społeczny na dodatkowe gospodarstwo wychodzące z nadmiernego obciążenia kosztami mieszkania.","feedback":"Porównaj wspólny okres i jednostkę rezultatu. Niższy koszt jednostki efektu oznacza lepszą efektywność kosztową."},{"id":"c","text":"Dodatkowy koszt społeczny na dodatkowe gospodarstwo otrzymujące decyzję o udzieleniu wsparcia mieszkaniowego.","feedback":"Przyznanie wsparcia jest etapem wdrożenia; nie określa dodatkowej poprawy względem A0."}],"hint":"Porównaj cel pytania z zakresem każdej odpowiedzi. Ustal, co mierzy lub zakłada każda propozycja."},"third":{"title":"Kryterium: sprawiedliwość wobec podobnych potrzeb mieszkaniowych. Które porównanie najlepiej ujawnia pominięcie gospodarstw poza kredytem?","correct":"a","options":[{"id":"a","text":"Porównanie poprawy sytuacji gospodarstw z podobnymi potrzebami, mających i niemających dostępu do kredytu.","feedback":"Pozwala badać lukę w poprawie dla podobnych potrzeb; przyjęta interpretacja sprawiedliwości wymaga uzasadnienia."},{"id":"b","text":"Porównanie liczby złożonych wniosków gospodarstw z podobnymi potrzebami, mieszkających w dużych i małych miastach.","feedback":"To inny podział grup i miernik aktywności, który nie rozstrzyga pominięcia osób poza kredytem."},{"id":"c","text":"Porównanie czasu wydawania decyzji gospodarstwom z podobnymi potrzebami, obsługiwanym przez duże i małe instytucje.","feedback":"To aspekt rzetelnej obsługi, ale nie odpowiada wskazanemu problemowi podziału korzyści."}],"hint":"Porównaj cel pytania z zakresem każdej odpowiedzi. Ustal, co mierzy lub zakłada każda propozycja."},"revision":{"title":"Które sprawdzenie projektu najlepiej odpowiada nowej analizie wariantowej rynków?","correct":"c","options":[{"id":"a","text":"Wrażliwość zainteresowania wsparciem na wysokość dopłaty przy zachowaniu stałych cen i liczby dostępnych mieszkań.","feedback":"Założenie stałych cen i podaży usuwa z analizy mechanizm właśnie wskazany w wiadomości."},{"id":"b","text":"Wrażliwość wydatków budżetowych na liczbę odbiorców przy zachowaniu stałych cen i liczby dostępnych mieszkań.","feedback":"To ważne dla budżetu, ale stałe ceny i podaż nie pozwalają zbadać ujawnionego ryzyka przełożenia wsparcia na ceny."},{"id":"c","text":"Wrażliwość dostępności mieszkań na tempo wzrostu podaży przy różnych założeniach dotyczących reakcji cen na wsparcie.","feedback":"To sprawdza warunki działania mechanizmu. Nadal nie daje pewnego efektu konkretnego przyszłego instrumentu."}],"hint":"Porównaj cel pytania z zakresem każdej odpowiedzi. Ustal, co mierzy lub zakłada każda propozycja."},"constraint":{"title":"Który zapis odpowiada mandatowi przygotowania propozycji?","correct":"b","options":[{"id":"a","text":"Przekazanie uczestnikom zatwierdzonej listy naboru pilotażowego wraz z harmonogramem uruchomienia wypłat nowego wsparcia.","feedback":"To uruchamianie instrumentu. Mandat obejmuje przygotowanie propozycji, a decyzje o przyjęciu i finansowaniu są odrębne."},{"id":"b","text":"Przekazanie decydentom wariantów pilotażu wraz z kosztorysem i wykazem decyzji potrzebnych do uruchomienia wsparcia.","feedback":"To konkretny materiał do podjęcia odrębnych decyzji, mieszczący się w zleceniu przygotowawczym."},{"id":"c","text":"Przekazanie analitykom założenia o kontynuacji dawnych dopłat jako podstawy scenariusza bazowego przyszłego wsparcia.","feedback":"Wznowienie historycznego instrumentu wymaga nowej decyzji. Nie może pojawić się w A0 jako zwykła kontynuacja."}],"hint":"Porównaj cel pytania z zakresem każdej odpowiedzi. Ustal, co mierzy lub zakłada każda propozycja."}}},"BK2_b":{"task":"Przygotuj lokalne alternatywy poprawy dostępu do odpowiednich lokali dla gospodarstw objętych miejską pomocą, które pozostają poza kredytem.","horizon":"trzy kolejne lata","baseline":"Obecne zasady pracy z zasobem, rozpoczęte remonty i obsługa listy oczekujących.","trend":"Zwolnienia lokali, zmiany potrzeb gospodarstw i zakończenia rozpoczętych remontów zmieniają sytuację także bez nowego projektu.","options":[["repair","Uzgodniony harmonogram remontów dostępnego zasobu","Koordynacja etapów może skrócić czas przygotowania lokali nadających się do przydziału."],["match","Przegląd dopasowania lokali do potrzeb gospodarstw","Powiązanie wielkości i dostępności lokalu z potrzebami może ograniczać niedopasowanie."],["adapt","Dostosowanie wybranych lokali do ograniczeń mobilności","Adaptacja może udostępnić część zasobu gospodarstwom, dla których schody stanowią barierę."],["package","Remonty z przeglądem dopasowania i dostępności","Pakiet łączy przygotowanie lokali z ich przydatnością dla oczekujących."]],"scale":["Pilotaż obejmujący dziesięć lokali","Pilotaż obejmujący dwadzieścia lokali"],"newInfo":"W przeglądzie dziesięciu lokali planowanych do remontu cztery mają dostęp bez schodów. W wybranych długich sprawach część gospodarstw potrzebuje właśnie takiego dostępu. Nie zestawiono jeszcze całej listy potrzeb z całym zasobem.","l t na dodatkowy dokument odebrany elektronicznie w punkcie obsługi wyłączeń.","feedback":"Odebrany dokument nie przesądza prawidłowego i terminowego zakończenia sprawy."},{"id":"c","text":"Dodatkowy koszt na dodatkową sprawę prawidłowo zakończoną w umownym czasie obsługi.","feedback":"Koszt uwzględnia instytucję i wnioskodawcę. Przy braku poprawy nie interpretuj ilorazu jak zwykłej efektywności."}],"hint":"Porównaj cel pytania z zakresem każdej odpowiedzi. Ustal, co mierzy lub zakłada każda propozycja."},"third":{"title":"Kryterium: dostępność obsługi dla osób z barierą cyfrową. Który miernik pasuje?","correct":"a","options":[{"id":"a","text":"Maksymalizować odsetek podejmujących próbę osób z barierą cyfrową, które mogą złożyć kompletny wniosek.","feedback":"Trzeba objąć także przerwane próby. Złożenie wniosku nie oznacza przyznania wyłączenia."},{"id":"b","text":"Maksymalizować odsetek dokumentów dostarczonych elektronicznie przez osoby, których sprawy już zostały zakończone.","feedback":"To preferuje kanał i pomija osoby, które z powodu bariery nie dotarły do zakończenia."},{"id":"c","text":"Maksymalizować odsetek informacji o kanale elektronicznym wysłanych osobom oczekującym na rozpatrzenie wniosku.","feedback":"Wysłanie informacji jest działaniem; nie potwierdza, że osoba może skorzystać z obsługi."}],"hint":"Porównaj cel pytania z zakresem każdej odpowiedzi. Ustal, co mierzy lub zakłada każda propozycja."},"revision":{"title":"Które rozszerzenie oceny projektu odpowiada osobom ujawnionym przez nową wiadomość?","correct":"b","options":[{"id":"a","text":"Uzupełnić ocenę o rodzaje braków w dokumentach osób, których sprawy zakończono w badanym okresie.","feedback":"To nadal ogranicza zbiór do zakończonych spraw i pomija przerwane próby sprzed złożenia."},{"id":"b","text":"Uzupełnić ocenę o bariery przygotowania dokumentów osób, które przerwały próbę przed formalnym złożeniem wniosku.","feedback":"To obejmuje osoby pomijane w rejestrze i pozwala rozważyć wsparcie na wcześniejszym etapie."},{"id":"c","text":"Uzupełnić ocenę o czas otrzymania wezwania przez osoby, które złożyły wniosek i oczekują na wynik.","feedback":"To poszerza analizę o sprawy otwarte, ale nadal pomija osoby, które nie dotarły do formalnego złożenia."}],"hint":"Porównaj cel pytania z zakresem każdej odpowiedzi. Ustal, co mierzy lub zakłada każda propozycja."},"constraint":{"title":"Która propozycja pozostaje w granicach reorganizacji obsługi?","correct":"c","options":[{"id":"a","text":"Wyznaczenie krótszej ścieżki potwierdzania wyłączeń na podstawie deklaracji, z kontrolą dokumentów w losowanej próbie.","feedback":"Kontrola próby nie zastępuje wymaganej weryfikacji uprawnień każdej osoby ubiegającej się o wyłączenie."},{"id":"b","text":"Wyznaczenie dodatkowej kategorii uprawnionych do wyłączenia, obejmującej osoby oczekujące na wydanie dokumentów potwierdzających uprawnienie.","feedback":"To tworzy kategorię uprawnionych. Zespół obsługi może pomagać w uzyskaniu dokumentów, lecz nie zmienia zasad uprawnień."},{"id":"c","text":"Wyznaczenie dyżuru przygotowania dokumentów przed ich przekazaniem do zespołu sprawdzającego uprawnienia w danej sprawie.","feedback":"Wsparcie poprzedza weryfikację i nie zastępuje jej. Trzeba sprawdzić zasoby i dostępność dyżuru."}],"hint":"Porównaj cel pytania z zakresem każdej odpowiedzi. Ustal, co mierzy lub zakłada każda propozycja."}}},"BO_a":{"task":"Przygotuj alternatywy poprawy możliwości wpływu mieszkańców i ograniczenia barier udziału w kolejnej edycji BO. Uwzględnij grupy pomijane przez dotychczasowe działania.","horizon":"dwie kolejne edycje","baseline":"Obecne zasady udziału, kanały informacji i już zaplanowane działania wsparcia.","trend":"Skład uczestników, zainteresowanie tematami i doświadczenia z realizacją projektów mogą się zmieniać także przy obecnych zasadach.","options":[["accessible","Dostępne dyżury pomocy w zgłaszaniu potrzeb","Dostosowanie miejsca i sposobu wsparcia może ograniczyć bariery udziału."],["outreach","Docieranie do grup słabiej obecnych w BO","Współpraca z lokalnymi organizacjami może ułatwić rozpoznanie pomijanych potrzeb."],["follow","Czytelna informacja o dalszym losie projektów","Wyjaśnienie statusu i przeszkód może pomagać ocenić możliwość wpływu i odpowiedzialność za realizację."],["package","Dostępne wsparcie z informacją o realizacji","Pakiet łączy barierę udziału z wiarygodnością procesu."]],"scale":["Pilotaż w dwóch dzielnicach","Pilotaż w czterech dzielnicach"],"newInfo":"W ośmiu z dwunastu celowo dobranych rozmów osoby znały zasady BO, lecz wskazywały niewiarę w wykonanie projektów. Pięć z tych ośmiu potrzebowało także dostępnego miejsca pomocy. Nie zbadano częstości tych barier w mieście.","limit":"Pilotaż nie zmienia samodzielnie zasad głosowania. CKS może przygotować wsparcie i propozycje oraz uzgodnić działania z dzielnicami.","adaptations":["Dodać informację o realizacji i odpowiedzialności","Dodać dostępny kanał pomocy dla pomijanych grup","Zachować projekt i sprawdzić jego zakres"],"criteria":["Możliwość wpływu: maksymalizować odsetek mieszkańców mogących zgłosić potrzebę i skorzystać z przewidzianych sposobów udziału.","Efektywność kosztowa: minimalizować dodatkowy koszt publiczny i prywatny na dodatkową osobę uzyskującą możliwość udziału względem A0.","Równość możliwości: minimalizować różnicę odsetka osób z możliwością udziału między mieszkańcami z ograniczoną mobilnością a pozostałymi."],"questions":{"scope":{"title":"Który rezultat odpowiada zleceniu dyrektora CKS?","correct":"c","options":[{"id":"a","text":"Krótsza realizacja projektów przydzielonych dzielnicy dzięki wcześniejszemu uzgodnieniu zakresu prac wykonawczych.","feedback":"To centralny rezultat drugiego klienta. Może wpływać na wiarygodność BO, ale nie zastępuje problemu możliwości udziału."},{"id":"b","text":"Większa liczba materiałów informacyjnych skierowanych do mieszkańców przed rozpoczęciem kolejnej edycji BO.","feedback":"Materiały są produktem działania. Ich liczba skującą możliwość udziału w kolejnej edycji BO.","feedback":"Uwzględnij koszty mieszkańców i instytucji. Mniejsza wartość oznacza niższy koszt jednostki rezultatu."}],"hint":"Porównaj cel pytania z zakresem każdej odpowiedzi. Ustal, co mierzy lub zakłada każda propozycja."},"third":{"title":"Kryterium: równość możliwości osób z ograniczoną mobilnością i pozostałych. Który miernik zastosujesz?","correct":"b","options":[{"id":"a","text":"Minimalizować różnicę liczby oddanych głosów między osobami z ograniczoną mobilnością a pozostałymi.","feedback":"Liczebności grup i wybory uczestnictwa mogą się różnić. Równość możliwości nie wymaga identycznej liczby głosów."},{"id":"b","text":"Minimalizować różnicę odsetka osób z możliwością udziału między grupą z ograniczoną mobilnością a pozostałymi.","feedback":"To porównanie możliwości według tej samej definicji; wymaga wskazania barier i zakresu pomiaru."},{"id":"c","text":"Minimalizować różnicę liczby otrzymanych ulotek między osobami z ograniczoną mobilnością a pozostałymi.","feedback":"Jednakowa liczba materiałów nie oznacza równych możliwości skorzystania z procesu."}],"hint":"Porównaj cel pytania z zakresem każdej odpowiedzi. Ustal, co mierzy lub zakłada każda propozycja."},"revision":{"title":"Który element projektu najlepiej odpowiada wskazanym w nowej wiadomości barierom udziału?","correct":"c","options":[{"id":"a","text":"Rozszerzenie liczby wysyłanych instrukcji oraz zwiększenie częstotliwości przypominania terminów głosowania mieszkańcom objętym działaniem.","feedback":"To odpowiada niewiedzy o zasadach i terminach. Wiadomość wskazuje także wiarygodność realizacji i dostępność pomocy."},{"id":"b","text":"Zwiększenie liczby kanałów publikacji zasad oraz ujednolicenie treści komunikatów kierowanych do mieszkańców objętych działaniem.","feedback":"To może poprawiać komunikację zasad, ale nie odpowiada wprost obu ujawnionym barierom."},{"id":"c","text":"Wyjaśnienie stanu realizacji wcześniejszych projektów oraz zapewnienie dostępnego miejsca pomocy mieszkańcom objętym działaniem.","feedback":"To odpowiada wiarygodności realizacji i dostępności pomocy. Zakres i efekt nadal wymagają sprawdzenia."}],"hint":"Porównaj cel pytania z zakresem każdej odpowiedzi. Ustal, co mierzy lub zakłada każda propozycja."},"constraint":{"title":"Która propozycja mieści się w zakresie pilotażu CKS?","correct":"a","options":[{"id":"a","text":"Uruchomienie uzgodnionych z dzielnicami dyżurów pomocy oraz informacji o realizacji projektów wybranych wcześniej przez mieszkańców.","feedback":"To wsparcie i koordynacja w przyjętym mandacie, bez ustanawiania innych zasad głosowania."},{"id":"b","text":"Uruchomienie dodatkowego tygodnia głosowania dla mieszkańców, którzy potrzebują osobistej pomocy przy dokonaniu wyboru projektów.","feedback":"Wydłużenie terminu dla części osób zmienia zasady głosowania. Rozpoznana bariera nie rozszerza mandatu pilotażu."},{"id":"c","text":"Uruchomienie osobnego głosowania dla słabiej reprezentowanych mieszkańców z wydzieloną pulą środków na wybrane projekty.","feedback":"Wydzielenie głosowania i puli zmienia zasady procesu. Taki pomysł wymaga odrębnej propozycji i właściwych decyzji."}],"hint":"Porównaj cel pytania z zakresem każdej odpowiedzi. Ustal, co mierzy lub zakłada każda propozycja."}}},"BO_b":{"task":"Przygotuj sposoby usprawnienia realizacji projektów przydzielonych dzielnicy, ze szczególnym uwzględnieniem etapów przed podpisaniem umowy.","horizon":"realizacja jednej kolejnej edycji","baseline":"Obecne harmonogramy, podział odpowiedzialności i rozpoczęte uzgodnienia projektów.","trend":"Czas uzgodnień, dostępność wykonawców i koszty realizacji mogą zmieniać się także przy obecnej organizacji.","options":[["early","Wczesny przegląd zakresu i zależności projektu","Rozpoznanie niejasnego zakresu lub prawa do terenu może ujawnić przeszkody przed planowaną umową."],["owner","Koordynator z terminami uzgodnień","Jawna odpowiedzialność i harmonogram zależności mogą ograniczać oczekiwanie między jednostkami."],["track","Monitoring etapów z informacją dla autorów","Widoczny stan spraw i opóźnień może ułatwić reakcję i rozliczalność."],["package","Przegląd przygotowania z koordynacją uzgodnień","Pakiet łączy rozpoznanie przeszkód z organizacją ich rozwiązywania."]],"scale":["Pilotaż dla sześciu projektów","Pilotaż dla dwunastu projektów"],"newInfo":"W planie kolejnej edycji cztery z sześciu projektów wymagają uzgodnień z innymi jednostkami. W dwóch harmonogram zakłada ich odpowiedź przed terminem, którego te jednostki nie potwierdziły. Nie ustalono jeszcze terminów dla wszystkich zależności.","limit":"Pilotaż może zmieniać koordynację i harmonogramowanie, lecz nie może pomijać wymaganych uzgodnień ani ograniczać wybranego zakresu projektu wyłącznie dla poprawy terminowości.","adaptations":["Dodać wcześniejsze uzgodnienie zakresu projektu","Dodać harmonogram zależności z innymi jednostkami","Zachować projekt i sprawdzić jego zakres"],"criteria":["Terminowość rezultatu: maksymalizować odsetek projektów oddanych do użytkowania w uzgodnionym zakresie do pierwotnie przyjętego terminu.","Efektywność kosztowa: minimalizować dodatkowy koszt na dodatkowy projekt oddany w terminie i uzgodnionym zakresie względem A0.","Rozliczalność: maksymalizować odsetek projektów z aktualną i zrozumiałą informacją o etapie, przyczynie opóźnienia oraz odpowiedzialności za kolejny krok."],"questions":{"scope":{"title":"Który rezultat odpowiada zleceniu burmistrza dzielnicy?","correct":"b","options":[{"id":"a","text":"Większa liczba mieszkańców uczestniczących w głosowaniu nad projektami kolejnej edycji budżetu obywatelskiego.","feedback":"To inny problem: uczestnictwo w wyborze, a nie realizacja przydzielonych projektów."},{"id":"b","text":"Więcej wybranych projektów dostępnych do użytkowania w uzgodnionym zakresie i planowanym terminie.","feedback":"To rezultat dla mieszkańców. Podpisanie umowy lub przesunięcie harmonogramu go nie zastępuje."},{"id":"c","text":"Większa liczba spotkań wykonawców z autorami projektów przed rozpoczęciem realizacji prac w dzielnicy.","feedback":"Spotkania są działaniem. Ich liczba nie mierzy terminowego udostępnienia projektów."}],"hint":"Porównaj cel pytania z zakresem każdej odpowiedzi. Ustal, co mierzy lub zakłada każda propozycja."},"effect":{"title":"Kryterium: terminowe udostępnienie uzgodnionego projektu. Który miernik zastosujesz?","correct":"c","options":[{"id":"a","text":"Maksymalizować odsetek projektów z podpisaną umową wykonawczą przed terminem ich planowanego oddania do użytkowania.","feedback":"Umowa jest etapem procesu. Nie potwierdza zakończenia i udostępnienia projektu."},{"id":"b","text":"Maksymalizować odsetek projektów z aktualnym harmonogramem wskazującym termin oddania późniejszy niż bieżący dzień kontroli.","feedback":"Przesuwanie terminów może pozornie poprawiać wskaźnik bez poprawy rezultatu dla mieszkańców."},{"id":"c","text":"Maksymalizować odsetek projektów oddanych do użytkowania w uzgodnionym zakresie do pierwotnie przyjętego terminu realizacji.","feedback":"Trzeba zachować wspólny punkt odniesienia i zakres. Uzasadnione zmiany harmonogramu można opisywać osobno."}],"hint":"Porównaj cel pytania z zakresem każdej odpowiedzi. Ustal, co mierzy lub zakłada każda propozycja."},"cost":{"title":"Kryterium: koszt dodatkowej terminowej realizacji względem A0. Który wskaźnik pasuje?","correct":"a","options":[{"id":"a","text":"Dodatkowy koszt na dodatkowy projekt oddany w terminie i uzgodnionym zakresie realizacji.","feedback":"To relacja kosztu do rezultatu. Porównanie wymaga uwzględnienia złożoności projektów."},{"id":"b","text":"Dodatkowy koszt na dodatkową umowę podpisaną przed terminem rozpoczęcia zaplanowanych prac wykonawczych.","feedback":"Podpisanie umowy nie stanowi jeszcze rezultatu dostępnego mieszkańcom."},{"id":"c","text":"Dodatkowy koszt na dodatkowe spotkanie przeprowadzone przed terminem rozpoczęcia zaplanowanych prac wykonawczych.","feedback":"Spotkanie jest działaniem; ta relacja mierzy koszt produktu organizacyjnego."}],"hint":"Porównaj cel pytania z zakresem każdej odpowiedzi. Ustal, co mierzy lub zakłada każda propozycja."},"third":{"title":"Kryterium: rozliczalność wobec autorów i mieszkańców. Który miernik najlepiej odpowiada temu kryterium?","correct":"b","options":[{"id":"a","text":"Maksymalizować odsetek projektów, dla których opublikowano przynajmniej jedną wiadomość w każdym miesiącu realizacji.","feedback":"Częstość publikacji nie zapewnia aktualnej, zrozumiałej informacji o odpowiedzialności i kolejnych krokach."},{"id":"b","text":"Maksymalizować odsetek projektów z aktualną informacją o etapie, przeszkodzie i odpowiedzialnym za kolejny krok.","feedback":"Treść jest powiązana z możliwością śledzenia odpowiedzialności; trzeba sprawdzić także jej zrozumiałość."},{"id":"c","text":"Maksymalizować odsetek projektów, dla których liczba odsłon wiadomości wzrosła w kolejnym miesiącu realizacji.","feedback":"Odsłony opisują zainteresowanie, nie kompletność i użyteczność informacji potrzebnej do rozliczalności."}],"hint":"Porównaj cel pytania z zakresem każdej odpowiedzi. Ustal, co mierzy lub zakłada każda propozycja."},"revision":{"title":"Który element projektu najlepiej odpowiada nowej wiadomości o zależnościach realizacji?","correct":"a","options":[{"id":"a","text":"Uzgodnienie terminów z odpowiedzialnymi jednostkami oraz wskazanie zależności przed przyjęciem harmonogramu realizacji projektów.","feedback":"To odpowiada niepotwierdzonym terminom zewnętrznych uzgodnień. Sam plan wewnętrzny nie zapewnia ich wykonania."},{"id":"b","text":"Zwiększenie częstotliwości raportowania wykonawców oraz wskazanie terminów odbioru robót w harmonogramie realizacji projektów.","feedback":"To dotyczy wykonania po umowie; nie rozwiązuje ujawnionej niepewności terminów uzgodnień innych jednostek."},{"id":"c","text":"Ujednolicenie opisów projektów dla mieszkańców oraz wskazanie dat publikacji komunikatów w harmonogramie realizacji projektów.","feedback":"To poprawa informacji. Nie zastępuje uzgodnienia terminów, od których zależy realizacja."}],"hint":"Porównaj cel pytania z zakresem każdej odpowiedzi. Ustal, co mierzy lub zakłada każda propozycja."},"constraint":{"title":"Która propozycja respektuje podane warunki usprawnienia?","correct":"c","options":[{"id":"a","text":"Przesunięcie części wybranych prac do kolejnej edycji oraz rozliczenie obecnego projektu według mniejszego zakresu.","feedback":"Rozliczenie okrojonego projektu zmienia zakres wybrany przez mieszkańców, żeby poprawić terminowość. Narusza warunek zlecenia."},{"id":"b","text":"Przesunięcie uzgodnień dotyczących terenu na etap odbioru oraz rozpoczęcie robót według przygotowanej dokumentacji projektu.","feedback":"Przeniesienie wymaganych uzgodnień na odbiór nie pozwala oprzeć rozpoczęcia robót na ich wyniku."},{"id":"c","text":"Przesunięcie przeglądu dokumentacji na początek przygotowania oraz uzgodnienie terminów odpowiedzi jednostek przed planowanym rozpoczęciem robót.","feedback":"Zmienia się kolejność przygotowania i koordynacja, a nie zakres projektu czy wymagania uzgodnień."}],"hint":"Porównaj cel pytania z zakresem każdej odpowiedzi. Ustal, co mierzy lub zakłada każda propozycja."}}}}};</script><script>window.B34ContentV21={"common":{"evidence":{"title":"Raport z obszaru Y opisuje poprawę po kilku zmianach, bez oddzielenia ich skutków. Do czego wykorzystasz go najpierw?","correct":"c","options":[{"id":"a","text":"Do oszacowania poprawy w X, przyjmując zmianę z Y po korekcie o różnicę liczby odbiorców.","feedback":"Korekta liczby odbiorców nie oddziela skutków działań od innych zmian ani nie uzasadnia przeniesienia efektu do X."},{"id":"b","text":"Do wyboru działania dla X, przypisując zmianę z Y interwencji obejmującej największą liczbę odbiorców.","feedback":"Zasięg działania nie mówi, jaki był jego wkład w łączną poprawę. Raport nie pozwala ustalić takiego rankingu."},{"id":"c","text":"Do poszerzenia listy działań dla X, porównując mechanizmy i warunki opisane w obu obszarach.","feedback":"Raport może podsunąć alternatywy i pytania o warunki ich działania. Wielkość lokalnego efektu wymaga dodatkowych przesłanek."}],"hint":"Rozróżnij użycie raportu do tworzenia pomysłów, do przypisania skutku oraz do prognozowania w nowym miejscu."},"baseline":{"title":"Jak zbudować A0 na przyjęty okres porównania?","correct":"b","options":[{"id":"a","text":"Zachować obecne działania i przyjąć wyniki na poziomie z ostatniego pomiaru.","feedback":"To zamraża rezultaty. Mogą się one zmieniać nawet bez nowej decyzji klienta."},{"id":"b","text":"Uwzględnić obecne działania oraz przewidywane zmiany otoczenia bez nowej decyzji klienta.","feedback":"A0 jest dynamiczną kontynuacją. Dzięki temu nie przypisujemy nowej alternatywie całej przyszłej zmiany."},{"id":"c","text":"Ograniczyć działania do zadań niezbędnych, uwzględniając przewidywane zmiany ich otoczenia.","feedback":"Ograniczenie działań jest odrębną decyzją. Może być alternatywą, ale nie zastępuje opisanej kontynuacji."}],"hint":"Co zmienia się samo lub wynika z już podjętych decyzji, a co wymaga nowej decyzji?"},"variant":{"title":"W poniższym przykładzie szkoleniowym która para przedstawia warianty skali jednego instrumentu?","correct":"a","options":[{"id":"a","text":"Dyżury doradcy dwa albo cztery razy miesięcznie, przy tym samym zakresie udzielanej pomocy.","feedback":"Zmienia się częstotliwość tego samego działania. Nie ustalamy jeszcze, która skala jest korzystniejsza."},{"id":"b","text":"Dyżury doradcy albo automatyczne pobieranie danych, przy tym samym miesięcznym budżecie obsługi spraw.","feedback":"Pomoc człowieka i wymiana danych działają przez odmienne mechanizmy. Wspólny budżet nie czyni ich wariantami skali."},{"id":"c","text":"Dyżury doradcy z dopłatą albo z przewozem, przy tej samej liczbie objętych wsparciem osób.","feedback":"Zmienia się skład pakietu instrumentów. Liczba odbiorców jest wspólna, lecz nie tożsamy sposób działania."}],"hint":"Porównaj wykonawcę, mechanizm, skład pakietu i parametr ilościowy."},"transfer":{"title":"Dom kultury chce oszacować częstość bariery zapisu wśród seniorów z całego swojego obszaru. Który plan doboru respondentów odpowiada tej populacji?","correct":"a","options":[{"id":"a","text":"Wylosować seniorów z całego obszaru i zebrać odpowiedzi o próbach zapisu oraz przyczynach ich niepodejmowania.","feedback":"Lista, z której losujemy, powinna obejmować seniorów z całego obszaru, również niekorzystających z zajęć. Oszacowanie wymaga uwzględnienia braku odpowiedzi i niepewności."},{"id":"b","text":"Wylosować seniorów z rejestru zapisanych i zebrać odpowiedzi o próbach zapisu oraz trudnościach w ich ukończeniu.","feedback":"Losowanie nie usuwa błędu zakresu rejestru. Osoby, które nie zdołały się zapisać lub nie podjęły próby, pozostają poza nim."},{"id":"c","text":"Zaprosić seniorów przez otwarty komunikat i zebrać odpowiedzi o próbach zapisu oraz przyczynach ich niepodejmowania.","feedback":"Otwarty nabór może ujawnić doświadczenia, lecz samodzielne zgłaszanie się nie daje każdej osobie znanej szansy doboru. Częstość wśród ochotników nie jest częstością w całym obszarze."}],"hint":"Najpierw określ populację. Następnie sprawdź, kto ma szansę znaleźć się w każdej proponowanej próbie."}},"cases":{"GPA_a":{"task":"Przygotuj alternatywy korekty oferty, które ułatwią potrzebne podróże i powroty osobom bez auta. Ustal kryteria przed szacowaniem skutków.","horizon":"kolejny rok","baseline":"Obecny rozkład, istniejące połączenia i uzgodnione finansowanie.","trend":"Godziny zmian w zakładach pracy i zapotrzebowanie na podróże mogą się zmieniać także bez korekty rozkładu.","options":[["hours","Przesunięcie godzin wybranych kursów","Dopasowanie odjazdów do zakończenia zmian może umożliwić powroty bez zwiększania liczby kursów."],["connections","Koordynacja przesiadek między liniami","Uzgodnione przesiadki mogą połączyć istniejące odcinki w użyteczną podróż."],["late","Dodatkowy kurs po późnej zmianie","Dodatkowy odjazd może wypełnić lukę czasową, ale wymaga zasobów."],["package","Korekta godzin z uzgodnieniem przesiadek","Pakiet może usuwać dwie bariery; zależy od współpracy organizatorów."]],"scale":["Na dwóch wybranych liniach przez kwartał","Na pięciu wybranych liniach przez kwartał"],"newInfo":"Przegląd dwunastu wskazanych podróży pokazuje, że w pięciu powrót jest możliwy po przesunięciu odjazdu, a w czterech wymaga także uzgodnienia przesiadki. Część podróży należy do obu grup. Nie jest to próba wszystkich podróży.","limit":"W pierwszym kwartale pilotażu dostępna liczba wozogodzin pozostaje na obecnym poziomie. Zmiany między liniami wymagają uzgodnienia z operatorem.","adaptations":["Uzgodnić godziny z połączeniem przesiadkowym","Przesunąć istniejące kursy w ramach zasobów","Zachować projekt i sprawdzić jego zakres"],"criteria":["Dostępność: maksymalizować odsetek potrzebnych podróży osób bez auta z wykonalnym dojazdem i powrotem w przyjętym standardzie.","Efektywność kosztowa: minimalizować dodatkowy koszt publiczny i prywatny na dodatkową osobę z wykonalną potrzebną podróżą względem A0.","Równość dostępu: minimalizować bezwzględną różnicę odsetka wykonalnych podróży między obszarami peryferyjnymi a centralnymi."],"questions":{"scope":{"title":"Który rezultat odpowiada zleceniu zarządu GPA?","correct":"b","options":[{"id":"a","text":"Mniej rozbieżności między prognozą wkładu gminy a jego kwartalnym rozliczeniem.","feedback":"To rezultat istotny dla drugiego klienta, który planuje wkład gminy."},{"id":"b","text":"Więcej potrzebnych podróży osób bez auta z wykonalnym dojazdem i powrotem.","feedback":"To rezultat dotyczący dostępności. Sam wzrost przejazdów nie obejmuje osób dotąd wykluczonych."},{"id":"c","text":"Większe zadowolenie obecnych pasażerów z komfortu przejazdów na liniach obsługujących zakłady pracy.","feedback":"Komfort obecnych pasażerów jest ważny, ale zlecenie koncentruje się na możliwości potrzebnej podróży, także dla osób dziś niekorzystających."}],"hint":"Porównaj cel pytania z zakresem każdej odpowiedzi. Ustal, co mierzy lub zakłada każda propozycja."},"effect":{"title":"GPA ocenia dostępność potrzebnych podróży osób bez auta. Który miernik obejmuje ten rezultat?","correct":"a","options":[{"id":"a","text":"Maksymalizować udział potrzebnych podróży z wykonalnym dojazdem i powrotem według przyjętego standardu czasu i kosztu.","feedback":"Mianownik obejmuje potrzebne podróże, także dotąd niewykonalne. Dla każdej trzeba sprawdzić dojazd i powrót według wspólnego standardu."},{"id":"b","text":"Maksymalizować udział wykonanych przejazdów z dojazdem i powrotem ocenionym pozytywnie przez obecnych pasażerów badanych linii.","feedback":"Ocena obecnych pasażerów pomija osoby bez wykonalnej podróży. Zadowolenie może rosnąć, choć dostęp wykluczonych osób się nie zmieni."},{"id":"c","text":"Maksymalizować udział potrzebnych podróży z wykonalnym dojazdem do celu według przyjętego standardu czasu i kosztu.","feedback":"Dojazd do celu nie wystarcza, jeżeli nie można wrócić. Pominięcie powrotu zmienia definicję dostępności przyjętą w zleceniu."}],"hint":"Porównaj cel pytania z zakresem każdej odpowiedzi. Ustal, co mierzy lub zakłada każda propozycja."},"cost":{"title":"GPA porównuje dodatkowy koszt publiczny i prywatny z dodatkową dostępnością względem A0. Dla wspólnego okresu i dodatniego efektu którą relację należy minimalizować?","correct":"c","options":[{"id":"a","text":"Przyrost kosztów podzielony przez liczbę wszystkich osób z wykonalną potrzebną podróżą w danej alternatywie.","feedback":"Mianownik obejmuje także dostępność występującą w A0. Iloraz nie określa kosztu dodatkowej poprawy."},{"id":"b","text":"Łączne koszty podzielone przez przyrost liczby osób z wykonalną potrzebną podróżą względem A0.","feedback":"Licznik obejmuje również koszty scenariusza A0. Dla kosztu dodatkowego trzeba odjąć koszty kontynuacji."},{"id":"c","text":"Przyrost kosztów podzielony przez przyrost liczby osób z wykonalną potrzebną podróżą względem A0.","feedback":"Licznik i mianownik opisują zmianę wobec tej samej bazy. Uwzględnij koszty publiczne i prywatne oraz nie licz jednej osoby kilka razy."}],"hint":"Porównaj cel pytania z zakresem każdej odpowiedzi. Ustal, co mierzy lub zakłada każda propozycja."},"third":{"title":"Kryterium: wyrównanie dostępu peryferii i centrum. Który miernik bezpośrednio pokazuje różnicę możliwości?","correct":"b","options":[{"id":"a","text":"Minimalizować bezwzględną różnicę liczby wykonalnych podróży między obszarami peryferyjnymi i centralnymi w tym samym okresie.","feedback":"Liczebności i potrzeby obu obszarów mogą być różne. Równa liczba podróży nie oznacza równego udziału zaspokojonych potrzeb."},{"id":"b","text":"Minimalizować bezwzględną różnicę odsetka wykonalnych podróży między obszarami peryferyjnymi i centralnymi w tym samym okresie.","feedback":"Porównanie udziałów według wspólnego standardu pokazuje lukę możliwości. Czytaj ją razem z ogólną dostępnością, aby nie wyrównywać przez pogorszenie."},{"id":"c","text":"Minimalizować bezwzględną różnicę średniego czasu wykonanych podróży między obszarami peryferyjnymi i centralnymi w tym samym okresie.","feedback":"Średnia wśród wykonanych podróży pomija podróże niewykonalne. Wskazuje inny aspekt niż luka możliwości dojazdu i powrotu."}],"hint":"Porównaj cel pytania z zakresem każdej odpowiedzi. Ustal, co mierzy lub zakłada każda propozycja."},"revision":{"title":"Które sprawdzenie projektu najlepiej odpowiada nowej wiadomości o wskazanych podróżach?","correct":"c","options":[{"id":"a","text":"Sprawdzić rozpoznawalność rozkładu i czytelność informacji o kursach wśród osób objętych przeglądem podróży.","feedback":"To może być wartościowe, lecz wiadomość wskazuje przede wszystkim godziny i przesiadki, a nie brak znajomości oferty."},{"id":"b","text":"Sprawdzić wykorzystanie miejsc i wielkość pojazdów na liniach obsługujących osoby objęte przeglądem podróży.","feedback":"To odpowiada problemowi pojemności. Nowa wiadomość nie wskazuje przepełnienia jako bariery tych podróży."},{"id":"c","text":"Sprawdzić dopasowanie odjazdów i możliwość przesiadek dla tych samych osób objętych przeglądem podróży.","feedback":"To odpowiada obu wskazanym mechanizmom; identyfikacja tych samych podróży zapobiega podwójnemu liczeniu."}],"hint":"Porównaj cel pytania z zakresem każdej odpowiedzi. Ustal, co mierzy lub zakłada każda propozycja."},"constraint":{"title":"Która propozycja respektuje podany limit zasobów pilotażu?","correct":"a","options":[{"id":"a","text":"Uzgodnienie przesunięcia dziesięciu wozogodzin z poranków na wieczory oraz nowych godzin przesiadek między liniami.","feedback":"Przesunięcie nie zwiększa łącznej liczby wozogodzin. Trzeba sprawdzić dostępność pojazdów i skutki dla pasażerów porannych kursów."},{"id":"b","text":"Uzgodnienie dziesięciu dodatkowych wozogodzin wieczornych oraz zmniejszenia wydatków gminy na informację o rozkładach jazdy.","feedback":"Oszczędność pieniędzy nie zwiększa dostępnej liczby wozogodzin. To inny rodzaj ograniczenia zasobów."},{"id":"c","text":"Uzgodnienie dziesięciu dodatkowych wozogodzin weekendowych oraz utrzymania obecnej stawki operatora za realizację przewozów autobusowych.","feedback":"Utrzymanie stawki nie oznacza utrzymania łącznej liczby wozogodzin."}],"hint":"Porównaj cel pytania z zakresem każdej odpowiedzi. Ustal, co mierzy lub zakłada każda propozycja."}}},"GPA_b":{"task":"Przygotuj sposoby poprawy podstaw planowania wkładu gminy w przewozy, z uwzględnieniem ciągłości potrzebnych usług.","horizon":"cztery kolejne kwartały","baseline":"Obecny obieg danych, używane arkusze i harmonogram przygotowania prognoz.","trend":"Stawki, przychody i uzgodniona oferta mogą się zmieniać bez nowej procedury planowania.","options":[["version","Kontrola wersji arkusza przed prognozą","Sprawdzenie daty stawek i źródła danych może ograniczać błędy własnych obliczeń."],["calendar","Uzgodniony kalendarz przekazywania danych","Terminy uzgodnione ze związkiem mogą zmniejszyć liczbę prognoz opartych na niepełnych danych."],["ranges","Prognozy przedziałowe z aktualizacją założeń","Scenariusze przychodów i kosztów mogą ujawnić niepewność zanim zostanie przyjęta kwota."],["package","Kontrola wersji z kalendarzem danych","Pakiet łączy poprawę pracy urzędu i współpracę ze związkiem."]],"scale":["Pilotaż przez dwa kwartały","Pilotaż przez cztery kwartały"],"newInfo":"Audyt dwóch nowych prognoz wskazuje różne mechanizmy rozbieżności: w jednej użyto starej stawki mimo otrzymania aktualnej, w drugiej brakowało danych o przychodach. Nie ustalono udziału tych mechanizmów w całym roku.","limit":"Pilotaż musi zmieścić się w obecnej obsadzie urzędu i nie może samodzielnie zmieniać uzgodnionej oferty przewozowej.","adaptations":["Dodać kontrolę wersji danych","Uzgodnić termin aktualizacji i przedział prognozy","Zachować projekt i sprawdzić jego zakres"],"criteria":["Trafność prognoz: minimalizować średnią bezwzględną różnicę prognozowanego wkładu i rozliczenia, przy tej samej dacie przygotowania prognoz.","Efektywność kosztowa: minimalizować dodatkowy koszt przygotowania na jednostkę zmniejszenia średniego bezwzględnego błędu prognoz względem A0.","Ciągłość usług: maksymalizować odsetek potrzebnych podróży nadal wykonalnych podczas zmian planowania."],"questions":{"scope":{"title":"Który rezultat odpowiada zleceniu wójta w tej ścieżce?","correct":"a","options":[{"id":"a","text":"Mniejsze rozbieżności prognozy wkładu i rozliczenia przy zachowaniu potrzebnych usług przewozowych.","feedback":"Zlecenie dotyczy podstaw planowania, nie automatycznego zmniejszenia dopłat."},{"id":"b","text":"Mniejsze wydatki na wkład gminy dzięki ograniczeniu kursów o niskim napełnieniu.","feedback":"To propozycja redukcji usług i kosztów, która nie wynika z samej diagnozy błędów prognozy."},{"id":"c","text":"Mniejsze trudności powrotu z pracy dzięki przesunięciu godzin kursowania wybranych autobusów.","feedback":"To rezultat dotyczący zlecenia zarządu GPA o dostępności, a nie głównego problemu tego klienta."}],"hint":"Porównaj cel pytania z zakresem każdej odpowiedzi. Ustal, co mierzy lub zakłada każda propozycja."},"effect":{"title":"Kryterium: trafność prognoz wkładu. Który miernik odpowiada temu kryterium?","correct":"b","options":[{"id":"a","text":"Minimalizować średnią różnicę ze znakiem między prognozą a rozliczeniem dla prognoz przygotowanych na ten sam dzień.","feedback":"Dodatnie i ujemne błędy mogą się znieść. Średnia bliska zeru nie oznacza małych rozbieżności poszczególnych prognoz."},{"id":"b","text":"Minimalizować średnią bezwzględną różnicę między prognozą a rozliczeniem dla prognoz przygotowanych na ten sam dzień.","feedback":"Wartość bezwzględna ujmuje wielkość błędu bez znoszenia niedoszacowań i przeszacowań. Wspólna data zachowuje porównywalną dostępność informacji."},{"id":"c","text":"Minimalizować średnią bezwzględną różnicę między ostatnią aktualizacją prognozy a rozliczeniem, niezależnie od daty jej przygotowania.","feedback":"Późniejsza aktualizacja korzysta z dodatkowej wiedzy. Różne daty nie pozwalają uczciwie porównać trafności prognoz potrzebnych przy przygotowaniu budżetu."}],"hint":"Porównaj cel pytania z zakresem każdej odpowiedzi. Ustal, co mierzy lub zakłada każda propozycja."},"cost":{"title":"Wspólny okres i data prognoz są ustalone. Chcesz określić koszt dodatkowego zmniejszenia błędu względem A0. Którą relację zastosujesz przy dodatniej poprawie?","correct":"a","options":[{"id":"a","text":"Przyrost kosztów przygotowania prognoz podzielony przez spadek ich średniego bezwzględnego błędu względem A0.","feedback":"To koszt dodatkowej poprawy, przy błędzie liczonym dla porównywalnych prognoz. Jednostki błędu i kosztu muszą być jawne."},{"id":"b","text":"Przyrost kosztów przygotowania prognoz podzielony przez spadek kwoty prognozowanego wkładu gminy względem A0.","feedback":"Niższa prognozowana kwota nie oznacza mniejszego błędu. Może zwiększać niedoszacowanie
