mom wykrytym w audycie."},{"id":"c","text":"Osobne sprawdzenie podpisu pod arkuszem i daty zatwierdzenia wersji prognozy przez upoważnioną osobę.","feedback":"Formalne zatwierdzenie nie zastępuje sprawdzenia źródeł i kompletności danych."}],"hint":"Porównaj cel pytania z zakresem każdej odpowiedzi. Ustal, co mierzy lub zakłada każda propozycja."},"constraint":{"title":"Która propozycja respektuje warunki pilotażu?","correct":"c","options":[{"id":"a","text":"Przeznaczenie oszczędności z kontroli arkuszy na pół etatu analityka odpowiedzialnego za dane o przewozach.","feedback":"Finansowanie stanowiska z oszczędności nadal zwiększa obsadę, której pilotaż nie może powiększyć."},{"id":"b","text":"Przeznaczenie środków z czasowego zawieszenia kursów przez gminę na uporządkowanie danych potrzebnych do prognoz.","feedback":"Samodzielne zawieszenie kursów zmienia uzgodnioną ofertę, a pilotaż dotyczy organizacji prognozowania."},{"id":"c","text":"Przeznaczenie dwóch obecnych dyżurów na wspólną kontrolę arkuszy i uzgodnienie kalendarza danych o przewozach.","feedback":"To reorganizacja pracy obecnej obsady. Trzeba sprawdzić obciążenie pracowników i skutki zmiany przeznaczenia dyżurów."}],"hint":"Porównaj cel pytania z zakresem każdej odpowiedzi. Ustal, co mierzy lub zakłada każda propozycja."}}},"CP_a":{"task":"Przygotuj lokalne alternatywy ograniczania narażenia i barier inwestycji. Oddziel możliwości gminy od zmian wymagających współpracy poza nią.","horizon":"trzy kolejne lata","baseline":"Obecny punkt wsparcia, współpraca operatorska i rozpoczęte działania lokalne.","trend":"Inwestycje rozpoczęte wcześniej, pogoda i napływ zanieczyszczeń mogą zmieniać narażenie bez nowej decyzji gminy.","options":[["advisor","Wsparcie od rozpoznania bariery do rozliczenia","Towarzyszenie gospodarstwu może ograniczyć trudności proceduralne na kilku etapach."],["coord","Uzgodnienie działań z sąsiednimi gminami","Współpraca może objąć źródła, których pojedyncza gmina nie kontroluje."],["targe pięć kolejnych lat","baseline":"Obsługa wcześniejszych zobowiązań i istniejących instrumentów, bez wprowadzania nowego instrumentu z tego zlecenia.","trend":"Dochody, ceny i podaż mieszkań zmieniają się także bez nowego wsparcia. Trzeba uwzględnić te zmiany w porównaniu.","options":[["target","Wsparcie kosztów mieszkania kierowane według potrzeb","Wsparcie grup o wysokim obciążeniu kosztami może poprawić ich sytuację, lecz zależy też od reakcji cen."],["rental","Wsparcie zwiększania podaży mieszkań na dostępny najem","Zwiększenie dostępnej oferty może ograniczać bariery także gospodarstw bez możliwości uzyskania kredytu."],["supply","Wsparcie przygotowania terenów i infrastruktury mieszkaniowej","Usunięcie barier podaży może zwiększyć możliwości budowy; efekty wymagają czasu i współpracy."],["package","Ukierunkowane wsparcie z działaniem po stronie podaży","Pakiet łączy doraźne obciążenia kosztami z warunkami tworzenia mieszkań."]],"scale":["Projekt pilotażu w dwóch miastach","Projekt pilotażu w pięciu miastach"],"newInfo":"Analiza wariantowa dla dwóch rynków wskazuje: przy wolnej reakcji podaży część wzrostu zdolności do płacenia może przełożyć się na ceny. Wielkość zjawiska zależy od założeń; nie oszacowano efektu konkretnego nowego instrumentu.","limit":"Zlecenie dotyczy przygotowania propozycji i warunków pilotażu. Przyjęcie nowego instrumentu i środków wymaga odrębnych decyzji właściwych organów.","adaptations":["Dodać warunek sprawdzenia reakcji podaży","Dodać wariant dla gospodarstw poza kredytem","Zachować projekt i sprawdzić jego zakres"],"criteria":["Dostępność finansowa: minimalizować odsetek gospodarstw w grupie docelowej z nadmiernymi kosztami mieszkania według jawnego standardu.","Efektywność kosztowa: minimalizować dodatkowy koszt społeczny na dodatkowe gospodarstwo wychodzące z nadmiernego obciążenia względem A0.","Sprawiedliwość: minimalizować bezwzględną różnicę poprawy względem A0 między gospodarstwami o podobnych potrzebach z dostępem do kredytu i bez niego."],"questions":{"scope":{"title":"Jaki materiał ma powstać w nowym zleceniu ministra po poprzedniej diagnozie ewaluacyjnej?","correct":"a","options":[{"id":"a","text":"Propozycje różnych sposobów przyszłego wsparcia oraz wspólne kryteria ich oceny, oparte na rozpoznanych potrzebach.","feedback":"Nowe zlecenie dotyczy alternatyw i kryteriów. Historyczne doświadczenia pozostają przesłanką o ograniczonej mocy, a nie rozstrzygnięciem skutków przyszłego instrumentu."},{"id":"b","text":"Propozycja wysokości przyszłej dopłaty oraz kryteria jej przyznania, wyprowadzone z różnicy deklaracji badanych grup.","feedback":"To z góry zawęża instrument i myli kryteria oceny alternatyw z zasadami przyznania. Różnica deklaracji nie identyfikuje efektu dopłaty."},{"id":"c","text":"Propozycja dodatkowego badania dawnego programu oraz kryteria doboru próby, oparte na lukach historycznej diagnozy.","feedback":"To możliwy kierunek dalszej ewaluacji, lecz nie wykonuje nowego zlecenia przygotowania alternatyw przyszłego wsparcia i kryteriów ich porównania."}],"hint":"Porównaj cel pytania z zakresem każdej odpowiedzi. Ustal, co mierzy lub zakłada każda propozycja."},"effect":{"title":"Kryterium: ograniczenie nadmiernego obciążenia kosztami mieszkania. Który miernik odnosi się do tego rezultatu?","correct":"c","options":[{"id":"a","text":"Minimalizować średni udział wydatków mieszkaniowych w dochodzie gospodarstw z grupy docelowej, objętych wspólnym okresem oceny.","feedback":"Średnia może maleć dzięki poprawie u najmniej obciążonych, bez zmniejszenia odsetka gospodarstw ponad przyjętym progiem."},{"id":"b","text":"Minimalizować odsetek gospodarstw ponad ustalonym udziałem wydatków mieszkaniowych w dochodzie wśród odbiorców nowego wsparcia.","feedback":"Odbiorcy wsparcia są tylko częścią grupy docelowej. Zmiana tego, kto zostanie zakwalifikowany, może pozornie poprawić wynik."},{"id":"c","text":"Minimalizować odsetek gospodarstw ponad ustalonym udziałem wydatków mieszkaniowych w dochodzie w całej grupie docelowej.","feedback":"Przed porównaniem ustal próg, koszty, dochód, grupę i okres. Kryterium obejmuje również gospodarstwa, do których wsparcie nie dotrze."}],"hint":"Porównaj cel pytania z zakresem każdej odpowiedzi. Ustal, co mierzy lub zakłada każda propozycja."},"cost":{"title":"Dodatkowy koszt społeczny odnosisz do poprawy względem A0 w tym samym okresie. Który mianownik odpowiada wyjściu z nadmiernego obciążenia mieszkaniem?","correct":"b","options":[{"id":"a","text":"Przyrost liczby gospodarstw otrzymujących wsparcie przeznaczone na zmniejszenie nadmiernych kosztów mieszkania względem A0.","feedback":"Otrzymanie wsparcia nie zapewnia wyjścia z nadmiernego obciążenia, np. przy wzroście cen. Mianownik powinien odpowiadać rezultatowi."},{"id":"b","text":"Przyrost liczby gospodarstw wychodzących z nadmiernego obciążenia kosztami mieszkania względem scenariusza A0.","feedback":"To dodatkowy rezultat dla gospodarstw. Próg obciążenia, grupa docelowa i okres muszą być jednakowe w porównaniu."},{"id":"c","text":"Przyrost liczby gospodarstw zmniejszających udział wydatków mieszkaniowych w dochodzie względem scenariusza A0.","feedback":"Niewielki spadek udziału może pozostawić gospodarstwo ponad progiem. To inna jednostka efektu niż wyjście z nadmiernego obciążenia."}],"hint":"Porównaj cel pytania z zakresem każdej odpowiedzi. Ustal, co mierzy lub zakłada każda propozycja."},"third":{"title":"Kryterium: sprawiedliwość wobec podobnych potrzeb mieszkaniowych. Które porównanie najlepiej ujawnia pominięcie gospodarstw poza kredytem?","correct":"a","options":[{"id":"a","text":"Porównanie poprawy sytuacji gospodarstw z podobnymi potrzebami, mających i niemających dostępu do kredytu.","feedback":"Pozwala badać lukę w poprawie dla podobnych potrzeb; przyjęta interpretacja sprawiedliwości wymaga uzasadnienia."},{"id":"b","text":"Porównanie kwoty przyznanego wsparcia gospodarstwom z podobnymi potrzebami, mającym i niemającym dostępu do kredytu.","feedbac bejmuje zakupu nowego zasobu, zmiany krajowych dopłat ani kryteriów kredytowych banków.","adaptations":["Dodać dopasowanie kolejności remontów do potrzeb","Dodać sprawdzenie możliwości adaptacji lokali","Zachować projekt i sprawdzić jego zakres"],"criteria":["Dostęp do odpowiedniego lokalu: minimalizować odsetek uprawnionych gospodarstw oczekujących ponad umowne 12 miesięcy na lokal odpowiadający potrzebom.","Efektywność kosztowa: minimalizować dodatkowy koszt publiczny i prywatny na dodatkowe gospodarstwo uzyskujące odpowiedni lokal względem A0.","Równość dostępu: minimalizować bezwzględną różnicę udziału długiego oczekiwania między gospodarstwami wymagającymi lokalu bez schodów a pozostałymi."],"questions":{"scope":{"title":"Który rezultat odpowiada miejskiemu zleceniu tej ścieżki?","correct":"c","options":[{"id":"a","text":"Większa liczba udzielonych kredytów osobom oczekującym na lokal z miejskiego zasobu.","feedback":"To inny instrument i zakres decyzji; grupa może nie mieć możliwości uzyskania kredytu."},{"id":"b","text":"Krótsze przygotowanie lokali do przydziału przy zachowaniu dotychczasowego sposobu dopasowania ich do gospodarstw.","feedback":"Szybszy remont jest ważnym etapem, lecz niedopasowany lokal może nadal nie odpowiadać potrzebom oczekujących gospodarstw."},{"id":"c","text":"Krótsze oczekiwanie uprawnionych gospodarstw na lokal odpowiadający ich potrzebom mieszkaniowym.","feedback":"To rezultat powiązany z problemem, grupą i zakresem działania klienta."}],"hint":"Porównaj cel pytania z zakresem każdej odpowiedzi. Ustal, co mierzy lub zakłada każda propozycja."},"effect":{"title":"Miasto bada przekroczenie umownych 12 miesięcy oczekiwania. Porównuje uprawnione gospodarstwa z co najmniej roczną obserwacją od wpisania na listę. Który miernik zachowuje pełny zakres?","correct":"a","options":[{"id":"a","text":"Minimalizować odsetek gospodarstw czekających ponad dwanaście miesięcy na odpowiedni lokal, uwzględniając przydziały i nadal oczekujących.","feedback":"Przekroczenie liczymy zarówno przy późnym przydziale, jak i w nadal otwartej sprawie. Odpowiedniość lokalu oceniamy według ustalonych potrzeb."},{"id":"b","text":"Minimalizować odsetek gospodarstw czekających ponad dwanaście miesięcy na odpowiedni lokal, uwzględniając sprawy zakończone przydziałem.","feedback":"Ograniczenie do przydziałów pomija nadal oczekujących. Poprawa wśród zakończonych spraw może współistnieć ze wzrostem zaległości."},{"id":"c","text":"Minimalizować odsetek gospodarstw czekających ponad dwanaście miesięcy na pierwszą ofertę lokalu, uwzględniając wszystkie zgłoszone propozycje.","feedback":"Pierwsza oferta może nie odpowiadać potrzebom. Jej złożenie nie jest uzyskaniem odpowiedniego lokalu i nie zamyka problemu dostępu."}],"hint":"Porównaj cel pytania z zakresem każdej odpowiedzi. Ustal, co mierzy lub zakłada każda propozycja."},"cost":{"title":"Wspólny okres i dodatkowe koszty publiczne oraz prywatne są ustalone. Przez co je podzielisz, aby opisać dodatkowe zaspokojenie potrzeb względem A0?","correct":"b","options":[{"id":"a","text":"Przyrost liczby gospodarstw otrzymujących propozycję przydziału lokalu z miejskiego zasobu względem scenariusza A0.","feedback":"Propozycja może nie pasować do potrzeb i nie zostać zrealizowana. Nie jest jeszcze uzyskaniem odpowiedniego lokalu."},{"id":"b","text":"Przyrost liczby gospodarstw uzyskujących lokal odpowiadający ustalonym potrzebom mieszkaniowym względem scenariusza A0.","feedback":"To dodatkowy rezultat dla gospodarstwa. Przy dodatniej poprawie mniejszy koszt jednostki rezultatu jest pożądany."},{"id":"c","text":"Przyrost liczby gospodarstw uzyskujących lokal z miejskiego zasobu, liczony względem roku przed pilotażem.","feedback":"Zmiana rok do roku obejmuje też trendy i wcześniejsze remonty. Ponadto sam przydział nie zapewnia odpowiedniości lokalu."}],"hint":"Porównaj cel pytania z zakresem każdej odpowiedzi. Ustal, co mierzy lub zakłada każda propozycja."},"third":{"title":"Kryterium: wyrównanie dostępu gospodarstw z ograniczoną mobilnością. Który miernik odpowiada temu kryterium?","correct":"c","options":[{"id":"a","text":"Minimalizować bezwzględną różnicę liczby długo oczekujących gospodarstw wymagających dostępu bez schodów i pozostałych.","feedback":"Różne liczebności grup mogą dawać różną liczbę oczekujących przy takich samych szansach. Potrzebne są porównywalne udziały."},{"id":"b","text":"Minimalizować bezwzględną różnicę odsetka odpowiednich ofert odrzuconych przez gospodarstwa wymagające dostępu bez schodów i pozostałe.","feedback":"Odrzucenia ofert nie obejmują gospodarstw, które oferty jeszcze nie otrzymały. To inny aspekt niż przekroczenie czasu oczekiwania."},{"id":"c","text":"Minimalizować bezwzględną różnicę odsetka długo oczekujących gospodarstw wymagających dostępu bez schodów i pozostałych.","feedback":"Udziały wyznaczamy przy wspólnym progu i populacji uprawnionych. Lukę czytamy razem z dostępem do odpowiedniego lokalu w obu grupach."}],"hint":"Porównaj cel pytania z zakresem każdej odpowiedzi. Ustal, co mierzy lub zakłada każda propozycja."},"revision":{"title":"Który przegląd kolejności remontów najlepiej odpowiada nowej wiadomości o zasobie?","correct":"a","options":[{"id":"a","text":"Zestawienie potrzeb oczekujących gospodarstw z wielkością i dostępnością lokali możliwych do przygotowania w pilotażu.","feedback":"To odpowiada kwestii dopasowania, bez utożsamienia liczby lokali z liczbą zaspokojonych potrzeb."},{"id":"b","text":"Zestawienie kosztów planowanych remontów z liczbą metrów powierzchni lokali możliwych do przygotowania w pilotażu.","feedback":"To ocena kosztów zasobu. Sama nie pokazuje dopasowania dostępności i wielkości do gospodarstw."},{"id":"c","text":"Zestawienie kolejności zgłoszeń do remontu z czasem pozostawania lokali poza użytkowaniem przed rozpoczęciem pilotażu.","feedback":"To może uzasadniać kolejność administracyjną, ale nie odpowiada nowej informacji o dostępie bez schodów i potrzebach."}],"hint":"Porównaj cel pytania z zakresem każdej odpowiedzi. Ustal, co mierzy lub zakłada każda propozycja."},"constraint":{"title":"Który wariant mieści się w przyjętym zakresie lokalnego pilotażu?","correct":"c","options":[{"id":"a","text":"Przeznaczenie budżetu pilotażu na dopłaty do rat kredytowych dla gospodarstw oczekujących na miejski lokal.","feedback":"Lokalna dopłata może być odrębnym pomysłem, ale ten pilotaż ma wykorzystywać miejski zasób. Samo zmieszczenie się w budżecie nie wystarcza."},{"id":"b","text":"Przeznaczenie budżetu pilotażu na zakup mieszkań od deweloperów dla gospodarstw oczekujących na miejski lokal.","feedback":"Zakup nowego zasobu jest inną strategią. W tym zadaniu pilotaż dotyczy wykorzystania istniejącego zasobu miasta."},{"id":"c","text":"Przeznaczenie budżetu pilotażu na remonty posiadanych mieszkań wybranych według potrzeb gospodarstw oczekujących na lokal.","feedback":"To wykorzystanie istniejącego zasobu. Koszty, dobór remontów i wykonalność pozostają do sprawdzenia."}],"hint":"Porównaj cel pytania z zakresem każdej odpowiedzi. Ustal, co mierzy lub zakłada każda propozycja."}}},"SCT_a":{"task":"Przygotuj alternatywy dalszych działań ograniczających narażenie przy ulicach, uwzględniając podróże i obszary poza strefą. Nie przesądzaj rozszerzenia jej granic.","horizon":"trzy kolejne lata","baseline":"Obecne reguły strefy, sposób ich realizacji i rozpoczęte działania transportowe.","trend":"Skład floty, ruch, pogoda i inwestycje transportowe zmieniają narażenie także przy obecnych regułach.","options":[["boundary","Propozycja korekty obszaru strefy do dalszych prac","Zmiana obszaru może objąć źródła przy kolejnych ulicach; wymaga procedury i oceny skutków poza granicą."],["public","Usprawnienie dojazdu transportem zbiorowym","Dostępna alternatywa podróży może ograniczać zależność od samochodu i obciążenia części grup."],["traffic","Propozycja zmian organizacji ruchu przy wybranych ulicach","Zmiana tras i warunków ruchu może wpływać na emisję i jej rozkład przestrzenny."],["package","Prace nad regułami z usprawnieniem dojazdu","Pakiet łączy ograniczenie emisji z warunkami utrzymania potrzebnych podróży."]],"scale":["Analiza pilotażu dla dwóch korytarzy podróży","Analiza pilotażu dla czterech korytarzy podróży"],"newInfo":"Model dwóch wariantów organizacji ruchu wskazuje możliwość przeniesienia części ruchu na ulice poza strefą. Wynik jest wrażliwy na założenia o wyborze tras. Nie ustalono jeszcze skutku netto dla narażenia mieszkańców.","limit":"Klient przygotowuje propozycje. Zmiany uchwały i zasad wymagają właściwej procedury i decyzji rady; granica strefy nie wyznacza granicy analizy narażenia.","adaptations":["Rozszerzyć ocenę na ulice poza strefą","Dodać wariant usprawnień potrzebnych podróży","Zachować projekt i sprawdzić jego zakres"],"criteria":["Ograniczenie narażenia: minimalizować liczbę mieszkańców przy ulicach przypisanych przez model do poziomu NO₂ ponad T, wewnątrz i poza strefą.","Efektywność kosztowa: minimalizować dodatkowy koszt publiczny i prywatny na osobę mniej na obszarach ponad T względem A0.","Sprawiedliwość obciążeń: minimalizować odsetek osób o niskich dochodach tracących możliwość potrzebnej podróży bez dostępnej alternatywy."],"questions":{"scope":{"title":"Który rezultat odpowiada temu zleceniu prezydenta?","correct":"b","options":[{"id":"a","text":"Sprawniejsze potwierdzanie wyłączeń dla osób składających wnioski w miejskim punkcie obsługi.","feedback":"To główny rezultat drugiego klienta, który organizuje obsługę wyłączeń."},{"id":"b","text":"Mniejsze narażenie mieszkańców przy uwzględnieniu potrzebnych podróży oraz obszarów poza strefą.","feedback":"To rezultat publiczny z odpowiednio szerokim zakresem przestrzennym."},{"id":"c","text":"Mniejsze narażenie wewnątrz strefy przy dopuszczeniu wzrostu narażenia przy ulicach poza jej granicami.","feedback":"Zlecenie obejmuje również otoczenie strefy. Nie można uznać przeniesienia problemu za wystarczające spełnienie celu."}],"hint":"Porównaj cel pytania z zakresem każdej odpowiedzi. Ustal, co mierzy lub zakłada każda propozycja."},"effect":{"title":"Kryterium: ograniczenie narażenia według modelu NO₂. Który miernik odpowiada diagnozie?","correct":"c","options":[{"id":"a","text":"Minimalizować liczbę mieszkańców przy ulicach ponad T według modelu obejmującego obszar wewnątrz przyjętych granic strefy.","feedback":"Ten zakres pomija mieszkańców ulic poza strefą, na które może przenieść się ruch. W zleceniu granica strefy nie jest granicą analizy."},{"id":"b","text":"Minimalizować średnie stężenie NO₂ przy ulicach według modelu obejmującego strefę i otoczenie, bez ważenia liczbą mieszkańców.","feedback":"Średnia stężeń bez rozmieszczenia mieszkańców nie mierzy liczby osób na obszarach ponad T. Może zmieniać się inaczej niż narażenie populacji."},{"id":"c","text":"Minimalizować liczbę mieszkańców przy ulicach ponad T według modelu obejmującego obszar wewnątrz i poza granicami strefy.","feedback":"To zachowuje jednostkę rezultatu i zakres przestrzenny. Model jest przybliżeniem narażenia i wymaga wspólnych założeń dla porównywanych alternatyw."}],"hint":"Porównaj cel pytania z zakresem każdej odpowiedzi. Ustal, co mierzy lub zakłada każda propozycja."},"cost":{"title":"Wspólny okres oraz przyrost kosztów publicznych i prywatnych są ustalone. Który mianownik odpowiada dodatkowemu ograniczeniu narażenia względem A0?","correct":"a","options":[{"id":"a","text":"Spadek liczby mieszkańców przy ulicach ponad T w strefie i jej otoczeniu względem A0.","feedback":"Mianownik obejmuje dodatkową poprawę w całym zakresie przestrzennym. Przy braku dodatniej poprawy nie porównujemy mechanicznie ilorazów."},{"id":"b","text":"Spadek liczby mieszkańców przy ulicach ponad T wewnątrz granic strefy względem A0.","feedback":"Pominięcie otoczenia może ukryć przeniesienie narażenia. Koszt jednostki tak zawężonej poprawy nie odpowiada zleceniu."},{"id":"c","text":"Spadek liczby mieszkańców przy ulicach ponad T w strefie i otoczeniu względem stanu początkowego.","feedback":"Zmiana względem stanu początkowego obejmuje też trendy floty, pogody i ruchu. W zadaniu porównujemy z dynamicznym A0."}],"hint":"Porównaj cel pytania z zakresem każdej odpowiedzi. Ustal, co mierzy lub zakłada każda propozycja."},"third":{"title":"Kryterium: osłona potrzebnych podróży osób o niskich dochodach. Który miernik odnosi się do obciążenia?","correct":"b","options":[{"id":"a","text":"Minimalizować odsetek osób o niskich dochodach używających pojazdów niezgodnych z przyjętymi warunkami wjazdu.","feedback":"Zgodność pojazdu jest cechą zasobu. Nie pokazuje, czy osoba może odbyć potrzebną podróż innym sposobem."},{"id":"b","text":"Minimalizować odsetek osób o niskich dochodach tracących potrzebną podróż bez dostępnej alternatywy.","feedback":"Trzeba określić potrzebną podróż, dostępność i grupę; miernik dotyczy skutku dla ludzi."},{"id":"c","text":"Minimalizować odsetek osób o niskich dochodach korzystających z przesiadek podczas potrzebnych podróży.","feedback":"Przesiadka może być wygodna albo uciążliwa. Jej wystąpienie nie oznacza utraty możliwości podróży."}],"hint":"Porównaj cel pytania z zakresem każdej odpowiedzi. Ustal, co mierzy lub zakłada każda propozycja."},"revision":{"title":"Który sposób sprawdzenia projektu odpowiada informacji o możliwym przeniesieniu ruchu?","correct":"c","options":[{"id":"a","text":"Porównać liczbę wjazdów do strefy w obu wariantach przy różnych założeniach o wyborze tras.","feedback":"To nie obejmuje pełnego narażenia poza strefą. Spadek wjazdów nie wystarcza do wniosku o skutku netto."},{"id":"b","text":"Porównać narażenie przy ulicach wewnątrz strefy w obu wariantach przy różnych założeniach o wyborze tras.","feedback":"Wrażliwość założeń jest uwzględniona, lecz pominięto obszary, na które problem może się przenieść."},{"id":"c","text":"Porównać narażenie w strefie i jej otoczeniu w obu wariantach przy różnych założeniach o wyborze tras.","feedback":"To obejmuje możliwe przemieszczenie problemu i sprawdza wrażliwość wyniku na zachowania kierowców."}],"hint":"Porównaj cel pytania z zakresem każdej odpowiedzi. Ustal, co mierzy lub zakłada każda propozycja."},"constraint":{"title":"Które działanie odpowiada roli klienta opisanej w zleceniu?","correct":"a","options":[{"id":"a","text":"Przekazanie radzie projektu zmiany granic strefy wraz z oceną warunków i skutków wariantów.","feedback":"To przygotowanie propozycji do decyzji rady; projekt nie ustanawia sam nowych granic."},{"id":"b","text":"Przekazanie operatorowi nowej mapy granic strefy jako załącznika do zaktualizowanej instrukcji obsługi wniosków.","feedback":"Instrukcja obsługi nie zastępuje procedury zmiany uchwały i decyzji rady o granicach."},{"id":"c","text":"Przekazanie służbom nowej mapy granic strefy do pilotażowego stosowania na czas oceny wariantów.","feedback":"Pilotażowe stosowanie także zmienia zasady w praktyce. Wymaga właściwej procedury, a nie samej analizy."}],"hint":"Porównaj cel pytania z zakresem każdej odpowiedzi. Ustal, co mierzy lub zakłada każda propozycja."}}},"SCT_b":{"task":"Przygotuj sposoby ograniczenia czasu i barier obsługi wniosków o potwierdzenie wyłączenia, zachowując rzetelną weryfikację przy obecnych zasadach.","horizon":"kolejne dwanaście miesięcy","baseline":"Obecny podział pracy, kanały kontaktu i reguły sprawdzania wniosków.","trend":"Napływ spraw i dostępność dokumentów z innych instytucji mogą się zmieniać przy obecnej organizacji.","options":[["help","Pomoc w przygotowaniu dokumentów przed złożeniem","Wyjaśnienie wymagań może ograniczyć powtórne uzupełnienia i przerwane próby."],["triage","Podział obsługi według rodzaju braków","Właściwy przydział spraw może ograniczyć oczekiwanie na specjalistyczne wyjaśnienie."],["offline","Dostępny kontakt osobisty i telefoniczny","Alternatywa dla kanału elektronicznego może zmniejszyć bariery części wnioskodawców."],["package","Jasne wezwania z dostępnym kontaktem","Pakiet łączy jakość komunikacji i możliwość uzyskania pomocy."]],"scale":["Pilotaż w jednym punkcie przez trzy miesiące","Pilotaż w trzech punktach przez trzy miesiące"],"newInfo":"W rejestrze zakończonych spraw nie ma osób, które przerwały próbę złożenia. W sześciu z dziesięciu celowo dobranych rozmów z takimi osobami wskazano trudność przesłania dokumentu elektronicznego.","limit":"Zmiana organizacji obsługi nie może zmieniać uprawnień do wyłączenia ani pomijać wymaganej weryfikacji.","adaptations":["Dodać wsparcie przed złożeniem wniosku","Dodać śledzenie spraw przerwanych i otwartych","Zachować projekt i sprawdzić jego zakres"],"criteria":["Terminowość: minimalizować odsetek spraw trwających ponad umowne 10 dni od złożenia do wyniku weryfikacji, z uwzględnieniem spraw otwartych.","Efektywność kosztowa: minimalizować dodatkowy koszt instytucji i wnioskodawcy na dodatkową prawidłowo zakończoną sprawę w umownym czasie względem A0.","Dostępność obsługi: maksymalizować odsetek podejmujących próbę osób z barierą cyfrową, które mogą złożyć kompletny wniosek."],"questions":{"scope":{"title":"Który rezultat odpowiada zleceniu dyrektora ZDM?","correct":"a","options":[{"id":"a","text":"Krótsza i dostępna obsługa wniosków przy zachowaniu rzetelnej weryfikacji uprawnień do wyłączenia.","feedback":"To rezultat organizacyjny w zadanym zakresie. Nie wymaga zmiany zasad uprawnień."},{"id":"b","text":"Mniejsze stężenie NO₂ przy ulicach poza strefą dzięki zmianie zasad uprawnień do wyłączenia.","feedback":"To cel i rodzaj decyzji wykraczające poza zleconą organizację obsługi."},{"id":"c","text":"Krótsza obsługa poprawnie złożonych wniosków przy zachowaniu dotychczasowych barier dostępu do kanału elektronicznego.","feedback":"To poprawa tylko dla części osób. Zlecenie obejmuje ograniczanie barier, także przed formalnym złożeniem wniosku."}],"hint":"Porównaj cel pytania z zakresem każdej odpowiedzi. Ustal, co mierzy lub zakłada każda propozycja."},"effect":{"title":"Próg to umowne 10 dni od pierwszego złożenia do wyniku weryfikacji. W grupie spraw z pełnym okresem obserwacji który miernik zachowuje ten standard?","correct":"b","options":[{"id":"a","text":"Minimalizować odsetek spraw trwających ponad dziesięć dni od uzupełnienia dokumentów, wliczając zakończone oraz nadal otwarte.","feedback":"Przesunięcie początku na uzupełnienie dokumentów usuwa z pomiaru część czasu obsługi. Standard zaczyna się przy pierwszym złożeniu."},{"id":"b","text":"Minimalizować odsetek spraw trwających ponad dziesięć dni od pierwszego złożenia, wliczając zakończone oraz nadal otwarte.","feedback":"Licznik obejmuje późno zakończone i nadal otwarte po progu. Mianownik to ta sama grupa wpływu z co najmniej dziesięciodniową obserwacją."},{"id":"c","text":"Minimalizować odsetek spraw trwających ponad dziesięć dni od pierwszego złożenia, wliczając zakończone wynikiem weryfikacji.","feedback":"Ograniczenie zbioru do zakończonych spraw pomija aktualne zaległości. Czas tych osób także należy do rezultatu zlecenia."}],"hint":"Porównaj cel pytania z zakresem każdej odpowiedzi. Ustal, co mierzy lub zakłada każda propozycja."},"cost":{"title":"Porównujesz dodatkowe koszty instytucji i wnioskodawców w tym samym okresie. Który mianownik odpowiada dodatkowemu rezultatowi tej obsługi?","correct":"c","options":[{"id":"a","text":"Przyrost liczby spraw zakończonych w umownym czasie obsługi względem scenariusza A0.","feedback":"To pomija prawidłowość weryfikacji. Zakończona szybko, lecz błędnie sprawa nie spełnia warunków zlecenia."},{"id":"b","text":"Liczba spraw prawidłowo zakończonych w umownym czasie obsługi w ocenianej alternatywie.","feedback":"Łączny rezultat obejmuje też sprawy obsłużone w A0. Dla kosztu dodatkowego potrzebny jest przyrost rezultatu."},{"id":"c","text":"Przyrost liczby spraw prawidłowo zakończonych w umownym czasie obsługi względem A0.","feedback":"Licznik kosztu i mianownik efektu odnoszą się do tej samej zmiany. Zerowy lub ujemny przyrost efektu wymaga osobnej oceny."}],"hint":"Porównaj cel pytania z zak
