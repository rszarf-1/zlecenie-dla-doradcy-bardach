const DATA={"version":"2.0.0","key":"BD2-20261107","reading":"https://drive.google.com/file/d/1qRgdHdTwusO55uDVtkpzWo6rPDevOlG4/view?usp=sharing","formUrl":"https://docs.google.com/forms/d/e/1FAIpQLScRI06sRYjbfSok4WRtrvV26Xt6DYrZCaul-XhLUdc4B2yBfw/viewform","programs":[{"id":"GPA","name":"Grodziskie Przewozy Autobusowe / FRPA","short":"GPA / FRPA","context":"Znasz program organizacji przewozów. Ten sam transport może być przedmiotem analizy dostępności podróży albo przewidywalności finansowania przez gminę. Oba zlecenia dotyczą jednego umownego obszaru X; okres każdego badania wskazano w kartach dowodów.","background":"Publicznym uzasadnieniem przewozów jest m.in. dostęp do pracy i usług. Jego utrzymanie wymaga także wykonalnego finansowania. Liczba przejazdów i koszt przewozów nie mierzą tego samego.","sources":[["GPA — zadania i organy związku","https://gpagrodzisk.pl/info/zawartosc/5"],["GPA — konsultacje planu transportowego","https://gpagrodzisk.pl/info/zawartosc/91"]],"cards":[{"id":"D1","title":"Potrzebne podróże","scope":"Losowa próba 200 dorosłych bez auta; dzienniczki z jednego tygodnia.","result":"80 z 200 badanych nie mogło odbyć potrzebnej podróży i powrotu tego samego dnia przy standardzie do 60 minut w każdą stronę i kosztu do 10% dziennego dochodu. Są to progi ćwiczenia. Nie podano przedziału niepewności.","limit":"To wynik próby i jednego tygodnia; nie dokładna liczba wszystkich mieszkańców ani diagnoza przyczyny.","cost":1,"wait":2},{"id":"D2","title":"Godziny i możliwe bariery","scope":"Rozkłady, potrzeby zmianowe i 20 celowo dobranych rozmów.","result":"14 z 20 rozmówców wskazało brak powrotu po późnej zmianie. Rozkłady potwierdzają brak kursów dla wskazanych podróży. Część rozmówców znała ofertę. Nie zbadano weekendów ani wszystkich linii.","limit":"Dobór celowy pozwala rozpoznać barierę, ale nie oszacować jej częstości w populacji. Nie oszacowano skutku nowego kursu.","cost":2,"wait":4},{"id":"D3","title":"Prognozy wkładu gminy","scope":"Cztery kwartalne prognozy i rozliczenia udziału gminy X.","result":"W trzech z czterech kwartałów ostateczny wkład był o ponad 15% wyższy niż pierwsza prognoza. W dwóch zmiana stawek była znana przed sporządzeniem prognozy. Dokumenty nie wskazują jeszcze, czy uwzględniono ją w kalkulacji.","limit":"Próg 15% jest standardem planistycznym ćwiczenia. Rozbieżność prognozy i rozliczenia nie dowodzi niegospodarności ani nadmiernej ceny przewozów.","cost":1,"wait":2},{"id":"D4","title":"Jak powstawała prognoza","scope":"Chronologia przekazywania danych i cztery rozmowy ze służbami finansowymi.","result":"W dwóch kwartałach kalkulację sporządzono przed otrzymaniem pełnej informacji o stawkach i przychodach. W jednym wykorzystano starą wersję arkusza, choć nowe stawki już otrzymano. Relacje stron różnią się co do odpowiedzialności.","limit":"Trzeba porównać wersje dokumentów i daty. Relacja jednej strony nie ustala odpowiedzialności ani wpływu zmiany procedury.","cost":2,"wait":4},{"id":"D5","title":"Warunki działania","scope":"Zasoby, umowy i podział zadań przyjęte w symulacji.","result":"Organizator przygotowuje zmiany sieci w ramach uzgodnionego finansowania i umów. Gmina przygotowuje własny budżet i uzgadnia wkład; sama nie zmienia całej sieci. Zmiana oferty może wymagać innych gmin, operatora i organów związku.","limit":"To uproszczone warunki symulacji. W rzeczywistej K3 sprawdź statut, umowy, zasady FRPA i kompetencje organów.","cost":1,"wait":1},{"id":"D6","title":"Doświadczenie innego związku","scope":"Raport o zmianie rozkładu i zasad prognozowania w obszarze Y.","result":"W Y zmniejszyły się skargi i rozbieżności prognoz. Równocześnie zmienił się operator oraz sposób rozliczeń. Nie oddzielono wpływu poszczególnych zmian.","limit":"Raport może podsunąć pomysły. Nie dowodzi, że ten sam wynik wystąpi w X; w scenariuszu dotrze po terminie briefu.","cost":2,"wait":8}],"clients":[{"id":"a","title":"Zarząd Związku Powiatowo-Gminnego „Grodziskie Przewozy Autobusowe”","short":"Zarząd GPA","decision":"Jakie trudności podróży uwzględnić w przygotowaniu korekty oferty na kolejny kwartał?","powers":"Przygotowuje i organizuje zmiany oferty w ramach uzgodnionych zasobów.","limits":"Finansowanie i wykonanie wymagają uzgodnień z właściwymi organami, gminami i operatorem.","mandate":"Mieszkańcy skarżą się na dojazdy, choć dodaliśmy kursy. Sądzę, że nie znają oferty. Proszę przygotować diagnozę przed pracami nad korektą sieci.","talk":[{"question":"Co ma umożliwić ta analiza?","answer":"Chcemy określić, które potrzebne podróże nadal są niemożliwe. Liczba pasażerów nie obejmuje osób, które nie mogą skorzystać. Nie zamawiamy jeszcze wyboru nowego rozkładu."},{"question":"Co może Pan/Pani zmienić i od kogo zależy?","answer":"Możemy przygotować propozycje zmian godzin i połączeń. Większe wydatki oraz zmiany umów wymagają uzgodnień. Nie możemy założyć dowolnego zwiększenia budżetu."},{"question":"Skąd pochodzi diagnoza i co pozostaje niepewne?","answer":"Mamy skargi i wzrost liczby przejazdów. Hipoteza o niewiedzy pochodzi z rozmów z pracownikami. Wstępne badanie mieszkańców opisuje skalę trudności, ale jego wyniku jeszcze nie sprawdziliśmy."}],"seed":"Sygnał: skargi osób bez auta na potrzebne podróże i powroty. Roboczy standard dostępności: do 60 minut w każdą stronę i koszt do 10% dziennego dochodu. Skala wymaga sprawdzenia w D1.","focus":"Dostępność potrzebnych podróży osób bez auta, powiązana z decyzją o korekcie oferty.","priority":["D1","D2"],"uses":["Bezpośrednio precyzuje skalę i zakres problemu podróży.","Sprawdza konkurencyjne wyjaśnienie wobec niewiedzy mieszkańców.","Pomaga ocenić finansowanie późniejszych zmian; nie mierzy trudności dojazdu.","Wyjaśnia prognozowanie finansów, ważne przy zasobach, ale poza główną hipotezą zlecenia.","Ustala możliwości i zależności klienta; może uzasadnić zawężenie analizy.","Może pomóc przy alternatywach, lecz nie będzie gotowy przed briefem."],"questions":[{"prompt":"Jaką roboczą definicję najlepiej przyjąć dla tego zlecenia?","options":[{"id":"a","text":"Zbyt mały zasięg informacji o kursach wśród mieszkańców bez auta ogranicza wykorzystanie dostępnej oferty przewozowej.","why":"To hipoteza przyczynowa. Nie mamy jeszcze dowodu, że informacja jest barierą."},{"id":"b","text":"Trudności mieszkańców bez auta w odbyciu potrzebnych podróży i powrotów wymagają określenia skali wobec standardu dostępności.","why":"Definicja odpowiada decyzji o ofercie. Przyczynę pozostawia do sprawdzenia, a skalę do doprecyzowania."},{"id":"c","text":"Nieprzewidywalna wysokość wkładu gminy w przewozy utrudnia planowanie wydatków na transport w kolejnych kwartałach.","why":"To sensowny problem dla klienta finansującego przewozy, ale nie główne pytanie tego zlecenia."}],"correct":"b","basis":"Zlecenie i rozmowa dotyczą potrzebnych podróży; klient proponuje niewiedzę jako wyjaśnienie.","pitfall":"Przejęcie hipotezy klienta jako definicji.","remedy":"Ujmij niepożądany stan i standard; przyczynę zapisz osobno.","pages":"4–9, 12","hint":"Który stan musi rozpoznać ten klient przed korektą oferty?"},{"prompt":"Jak D2 zmienia ocenę hipotezy o niewiedzy?","options":[{"id":"a","text":"D2 daje podstawę, by w planie dla całej gminy potraktować brak powrotów jako częstszą barierę niż niewiedzę.","why":"Potwierdzono konkretne podróże, nie całą populację i wszystkie przyczyny."},{"id":"b","text":"D2 daje podstawę, by w planie dla całej gminy potraktować niewiedzę jako częstszą barierę niż brak powrotów.","why":"Celowy dobór ogranicza uogólnienie, ale nie potwierdza hipotezy o informacji."},{"id":"c","text":"D2 daje podstawę, by rozpoznać brak powrotów w badanych podróżach i osobno ustalić częstość obu barier w gminie.","why":"Uwzględniasz nowy dowód i jego granicę. Nie trzeba odrzucić wszelkiego znaczenia informacji."}],"correct":"c","basis":"D2: 14 rozmówców i potwierdzenie konkretnych braków w rozkładzie; brak oszacowania populacyjnego.","pitfall":"Uogólnienie rozpoznanej bariery na cały problem.","remedy":"Podaj zakres potwierdzenia i to, co nadal wymaga danych.","pages":"12–16, 19, 21","hint":"Czy potwierdzenie przykładu ustala częstość bariery?"}],"example":"W badanej próbie 80 z 200 osób nie mogło odbyć potrzebnej podróży i powrotu przy standardzie z D1. D2 uzasadnia skupienie części dalszej analizy na powrotach po późnej zmianie, bez uznania tej bariery za jedyną.","nextEvidence":"Dopasowane dzienniczki i rozkłady także dla weekendów: czy kolejna korekta powinna objąć inne pory podróży?"},{"id":"b","title":"Wójt gminy X, członkowskiej gminy związku","short":"Wójt gminy X","decision":"Jaką podstawę planowania wkładu w przewozy przyjąć w projekcie budżetu gminy?","powers":"Przygotowuje projekt budżetu i stanowisko gminy w uzgodnieniach finansowania.","limits":"Budżet przyjmuje rada gminy; oferta i rozliczenia wymagają współpracy ze związkiem.","mandate":"Wkład na przewozy okazuje się wyższy niż prognozowaliśmy. Uważam, że informacje od związku przychodzą zbyt późno. Potrzebuję diagnozy przed projektem budżetu.","talk":[{"question":"Co ma umożliwić ta analiza?","answer":"Potrzebujemy przewidywalnych wydatków bez pochopnego ograniczania potrzebnych podróży. Problemem zlecenia jest jakość podstaw do planowania wkładu, nie automatyczne obniżenie dopłat."},{"question":"Co może Pan/Pani zmienić i od kogo zależy?","answer":"Mogę przygotować zmiany sposobu planowania w urzędzie i uzgodnień ze związkiem. Nie ustalam sam całej sieci ani zasad FRPA. Projekt budżetu przedstawiam radzie."},{"question":"Skąd pochodzi diagnoza i co pozostaje niepewne?","answer":"Skarbnik zgłasza rozbieżności. Jako sygnał przyjmujemy przekroczenie pierwszej prognozy o ponad 15%. Podejrzenie o spóźnioną informację trzeba zestawić z datami i wersjami naszych obliczeń."}],"seed":"Sygnał: różnice między pierwszą prognozą a rozliczeniem wkładu. Próg do zbadania to 15% prognozy, przyjęty wyłącznie w symulacji. Cztery kwartały to zakres analizy.","focus":"Niepewność i rozbieżności planowania wkładu gminy, z uwzględnieniem konsekwencji dla usług.","priority":["D3","D4"],"uses":["Pozwala ocenić, czy potencjalne oszczędności pogorszyłyby dostępność; nie sprawdza błędów prognozy.","Przyda się przy późniejszej rozmowie o ofercie; nie wyjaśnia kalkulacji finansowych.","Bezpośrednio określa wielkość i zakres rozbieżności prognoz.","Sprawdza hipotezę klienta i konkurencyjne wyjaśnienie w pracy jego urzędu.","Określa, co można zmienić lokalnie, a co wymaga uzgodnienia.","Przydatny później jako analogia; dostępność po terminie ogranicza użycie teraz."],"questions":[{"prompt":"Jaką roboczą definicję najlepiej przyjąć dla tego zlecenia?","options":[{"id":"a","text":"Rozbieżności między prognozą a rozliczeniem wkładu gminy utrudniają przygotowanie budżetu; trzeba ustalić ich rozmiar i uwarunkowania.","why":"To problem właściwy dla przygotowywanej decyzji. Nie przesądza, kto odpowiada za rozbieżność."},{"id":"b","text":"Braki dostępnych powrotów po późnej zmianie utrudniają mieszkańcom dojazdy; trzeba ustalić ich rozmiar i uwarunkowania.","why":"To ważny problem przewozów, ale zastąpiłby zamówioną diagnozę planowania innym zleceniem."},{"id":"c","text":"Zbyt późne przekazywanie stawek przez związek pogarsza obliczenia wkładu gminy; trzeba ustalić skalę opóźnienia informacji.","why":"Wpisujesz niepotwierdzoną przyczynę do definicji i pomijasz możliwość błędu po stronie gminy."}],"correct":"a","basis":"Klient przygotowuje projekt budżetu; późna informacja jest jego hipotezą.","pitfall":"Automatyczny powrót do ogólnego celu programu albo obwinienie innej instytucji.","remedy":"Dopasuj zakres do decyzji i pozostaw otwarte konkurencyjne wyjaśnienia.","pages":"1, 4–7, 12–14","hint":"Czy definicja pomoże przygotować budżet, nie przesądzając winy?"},{"prompt":"Jaki wniosek dla klienta uzasadniają D3 i D4?","options":[{"id":"a","text":"Przed budżetem warto zbadać nadmierny poziom wkładu gminy, przyjmując różnicę 15% jako wstępny sygnał przepłacania za przewozy.","why":"15% jest progiem oceny prognozy, nie oszacowaniem możliwej oszczędności ani niegospodarności."},{"id":"b","text":"Przed budżetem warto zbadać obieg informacji i kalkulacje gminy, rozdzielając dostępność danych od sposobu ich wykorzystania.","why":"D4 wskazuje zarówno przepływ informacji, jak i starą wersję arkusza. Zakres badania powinien objąć oba."},{"id":"c","text":"Przed budżetem warto zbadać odpowiedzialność związku za rozbieżności, przyjmując brak kompletnych danych jako główne wyjaśnienie wszystkich kwartałów.","why":"To nie obejmuje przypadku, w którym informację otrzymano, ale użyto starej kalkulacji."}],"correct":"b","basis":"D3–D4 opisują cztery kwartały i odmienne przebiegi przygotowania prognoz.","pitfall":"Potwierdzanie winy wskazanej przez klienta.","remedy":"Skonfrontuj relacje obu instytucji z dokumentacją i datami.","pages":"15–16, 21","hint":"Którego przypadku nie wyjaśnia sama późna informacja?"}],"example":"W trzech z czterech kwartałów wkład przekroczył pierwszą prognozę o ponad 15%. To problem planowania, a nie dowód nadmiernej ceny przewozów. Rozpoznania wymagają obieg danych oraz własne kalkulacje gminy.","nextEvidence":"Porównanie wersji prognoz i dat otrzymania danych: czy lepszy obieg informacji wystarczy, czy trzeba zmienić także kalkulację?"}]},{"id":"CP","name":"Czyste Powietrze","short":"Czyste Powietrze","context":"Dwa fikcyjne zlecenia osadzono w instytucjach programu po zmianach z 2025 r. Jedno dotyczy lokalnego narażenia na zanieczyszczenia, drugie obsługi wniosków o płatność. Nie odtwarzamy obecnych warunków naboru ani terminów prawnych.","background":"Program wspiera inwestycje zmieniające ogrzewanie i efektywność energetyczną. Narażenie ludzi, bariery inwestycji i czas obsługi płatności są powiązanymi, ale odrębnymi przedmiotami analizy.","sources":[["NFOŚiGW — gminni operatorzy, 7.03.2025","https://www.gov.pl/web/nfosigw/rusza-nabor-na-gminnych-operatorow-czystego-powietrza2"],["NFOŚiGW — obsługa płatności, 10.07.2025","https://www.gov.pl/web/nfosigw/usprawnienie-procedur-rozpatrywania-wnioskow-o-platnosc-w-programie-priorytetowym-czyste-powietrze"]],"cards":[{"id":"D1","title":"Narażenie mieszkańców","scope":"Model sezonowy, pomiary i mapa ludności gminy X.","result":"Model wskazuje 600 z 2000 mieszkańców powyżej poziomu T dla PM2,5 w badanym sezonie. T jest poziomem odniesienia ćwiczenia, a nie aktualną normą. Nie określono jeszcze przedziału niepewności.","limit":"Wynik zależy od modelu i okresu; nie jest sam w sobie informacją o źródłach ani efekcie programu.","cost":1,"wait":2},{"id":"D2","title":"Źródła i zmiana powietrza","scope":"Inwentaryzacja ogrzewania, model napływu i pogoda.","result":"Analiza wskazuje udział ogrzewania lokalnego oraz napływu spoza gminy. Po inwestycjach spadły stężenia, ale sezon był cieplejszy. Materiał nie oddziela efektu inwestycji od pogody i pozostałych źródeł.","limit":"Nie można przypisać całej poprawy programowi ani założyć, że działania jednej gminy usuną całe narażenie.","cost":2,"wait":4},{"id":"D3","title":"Przebieg wniosków o płatność","scope":"100 kolejnych zakończonych spraw jednego zespołu; rozbicie czasu na etapy.","result":"60 ze 100 spraw trwało dłużej niż przyjęty w ćwiczeniu standard 30 dni od wpływu. W 40 z tych 60 spraw co najmniej połowę czasu zajęło oczekiwanie na uzupełnienia. Nie ustalono, czy wezwania były konieczne i jasne.","limit":"Sprawy zakończone mogą pomijać najdłuższe nadal otwarte. To opis czasu, nie rozstrzygnięcie winy wnioskodawców ani personelu.","cost":1,"wait":2},{"id":"D4","title":"Doświadczenie oczekujących","scope":"12 celowo dobranych rozmów z beneficjentami i przegląd wezwań w ich sprawach.","result":"Osiem osób nie rozumiało pierwszego wezwania do uzupełnienia. W trzech sprawach kolejne wezwanie dotyczyło dokumentu możliwego do wskazania już wcześniej. Dwie osoby zgłaszały trudność uzyskania dokumentów od wykonawcy.","limit":"Wybrane sprawy ujawniają możliwe bariery. Nie mówią, jaki odsetek wszystkich beneficjentów je napotyka.","cost":2,"wait":4},{"id":"D5","title":"Kto może co zmienić","scope":"Podział zadań i zasoby przyjęte dla zleceń.","result":"Gmina ma punkt wsparcia i współpracuje z operatorem. Nie zmienia samodzielnie krajowych zasad dopłat ani emisji poza granicą. Fundusz organizuje obsługę swoich spraw, lecz część procedur i dokumentów wynika z zasad programu.","limit":"Nie przedstawiamy operatora jako nowej instytucji. W realnej analizie sprawdź obowiązujące reguły, umowy i podział kompetencji.","cost":1,"wait":1},{"id":"D6","title":"Wsparcie w innym regionie","scope":"Raport o mobilnym doradztwie i zmianie obsługi w regionie Y.","result":"W regionie Y przybyło zakończonych inwestycji i skrócił się czas części spraw. Zmieniono też finansowanie oraz system informatyczny. Nie rozdzielono skutków zmian.","limit":"To analogia do oceny, nie gotowa prognoza dla X. Raport w scenariuszu będzie dostępny po terminie briefu.","cost":2,"wait":8}],"clients":[{"id":"a","title":"Wójt gminy X","short":"Wójt — narażenie mieszkańców","decision":"Które źródła narażenia i bariery uwzględnić w przygotowaniu lokalnych działań środowiskowych?","powers":"Przygotowuje lokalne działania i wykorzystanie istniejącej współpracy z programem.","limits":"Nie ustala krajowych zasad dotacji; napływ zanieczyszczeń wymaga współpracy poza gminą.","mandate":"Mamy zanieczyszczone powietrze i mało ukończonych inwestycji. Sądzę, że dodatkowa pomoc przy wnioskach rozwiąże problem. Potrzebuję diagnozy do planu działań gminy.","talk":[{"question":"Co ma umożliwić ta analiza?","answer":"Chcę wiedzieć, którzy mieszkańcy są narażeni i jaką część problemu można ograniczać działaniami lokalnymi. Sama liczba wniosków nie wyznacza celu."},{"question":"Co może Pan/Pani zmienić i od kogo zależy?","answer":"Mamy już punkt wsparcia i współpracę operatorską. Możemy rozważać ich organizację i współpracę z innymi gminami. Nie zmieniamy samodzielnie zasad krajowego programu."},{"question":"Skąd pochodzi diagnoza i co pozostaje niepewne?","answer":"Łączę małą liczbę inwestycji z formalnościami, ale nie mam porównania ich znaczenia z finansami i wykonawcami. Nie znam też dobrze udziału napływu zanieczyszczeń."}],"seed":"Sygnał: sezonowe narażenie mieszkańców. W symulacji oceniamy je względem poziomu T, którego nie należy traktować jako aktualnej normy. Zasięg i wielkość opisuje dopiero D1.","focus":"Narażenie mieszkańców i zakres możliwego działania gminy.","priority":["D1","D2"],"uses":["Określa grupę, zakres i skalę narażenia.","Sprawdza źródła problemu i ograniczenia przypisania poprawy inwestycjom.","Opisuje obsługę płatności; może być barierą programu, ale nie mierzy lokalnego narażenia.","Pomaga rozpoznać barierę administracyjną w wybranych sprawach; nie wyjaśnia wszystkich inwestycji.","Pozwala powiązać diagnozę z możliwościami gminy i istniejącym wsparciem.","Może poszerzyć warianty, lecz wymaga oceny podobieństwa i przyjdzie po terminie."],"questions":[{"prompt":"Który zakres najlepiej odpowiada temu zleceniu?","options":[{"id":"a","text":"Narażenie mieszkańców gminy i udział różnych źródeł, z osobnym sprawdzeniem barier wykorzystania wsparcia dla inwestycji.","why":"Odpowiada planowi lokalnych działań i zostawia otwarte znaczenie poszczególnych barier."},{"id":"b","text":"Czas rozpatrywania wniosków o płatność w funduszu, z osobnym sprawdzeniem obciążenia zespołu obsługującego dokumenty.","why":"To zasadny problem dla funduszu, ale sam nie odpowie na pytanie wójta o narażenie i lokalne źródła."},{"id":"c","text":"Dostępność dodatkowego punktu składania wniosków w gminie, z osobnym sprawdzeniem godzin pracy i kosztów jego uruchomienia.","why":"Przyjmujesz konkretną organizację wsparcia zanim sprawdzisz, jaką barierę ma usuwać."}],"correct":"a","basis":"Klient przygotowuje lokalny plan działań; pomoc w formalnościach jest jedną propozycją.","pitfall":"Zamiana problemu w brak preferowanego rozwiązania.","remedy":"Określ stan i zakres; sprawdź związki między narażeniem, inwestycjami i obsługą.","pages":"4–9, 12","hint":"Jakie pytanie o mieszkańców ma rozstrzygnąć plan gminy?"},{"prompt":"Co uzasadnia materiał D2?","options":[{"id":"a","text":"Materiał uzasadnia ocenę udziału programu w poprawie na podstawie spadku stężeń po inwestycjach, z uwzględnieniem liczby wymienionych urządzeń.","why":"Następstwo czasowe nie oddziela wpływu inwestycji od cieplejszego sezonu."},{"id":"b","text":"Materiał uzasadnia analizę ogrzewania i napływu; ocenę wpływu inwestycji trzeba oprzeć także na pogodzie oraz pozostałych zmianach.","why":"Materiał poszerza kontekst, nie usuwa roli lokalnych źródeł i nie rozstrzyga wielkości wpływu."},{"id":"c","text":"Materiał uzasadnia ocenę udziału napływu w problemie na podstawie pozostałych stężeń po inwestycjach, z uwzględnieniem nowych urządzeń.","why":"Obecność napływu nie dowodzi, że jest jedynym ani dominującym źródłem."}],"correct":"b","basis":"D2 wskazuje kilka źródeł i cieplejszy sezon bez oszacowania oddzielnych efektów.","pitfall":"Przypisanie zmiany jednemu czynnikowi.","remedy":"Uwzględnij kontekst i nazwij potrzebne porównanie.","pages":"12, 15–16, 19","hint":"Jakie inne czynniki zmieniły się równocześnie?"}],"example":"W badanym sezonie model wskazuje 600 z 2000 osób ponad poziomem T. W przygotowaniu działań gminy trzeba rozróżnić źródła lokalne i napływ oraz osobno sprawdzić bariery inwestycji. Nie znamy dokładnego udziału programu w zmianie stężeń.","nextEvidence":"Oszacowanie udziału źródeł z niepewnością: czy lokalne działania wystarczą, czy potrzebna jest współpraca z innymi obszarami?"},{"id":"b","title":"Zarząd WFOŚiGW w Warszawie","short":"Fundusz — obsługa płatności","decision":"Jakie problemy obsługi uwzględnić w organizacji pracy zespołu rozpatrującego płatności?","powers":"Organizuje pracę funduszu i przygotowuje usprawnienia w granicach zasad programu.","limits":"Nie może dowolnie pominąć wymaganej kontroli; zmiana części zasad wymaga uzgodnień.","mandate":"Beneficjenci długo czekają na płatność. Podejrzewamy, że wielokrotne uzupełnienia dokumentów wydłużają sprawy. Proszę sprawdzić ten problem przed reorganizacją obsługi.","talk":[{"question":"Co ma umożliwić ta analiza?","answer":"Potrzebujemy zmniejszyć czas i uciążliwość obsługi przy zachowaniu poprawności rozliczenia. To wąskie zlecenie o obsłudze, nie nowa diagnoza całego zanieczyszczenia powietrza."},{"question":"Co może Pan/Pani zmienić i od kogo zależy?","answer":"Możemy zmieniać organizację pracy, sposób informowania i jakość wezwań w zakresie dopuszczonym zasadami. Nie zamawiamy projektu usunięcia wszystkich wymagań dokumentacyjnych."},{"question":"Skąd pochodzi diagnoza i co pozostaje niepewne?","answer":"Sygnałem są skargi i wielokrotne kontakty. Jako roboczy standard ćwiczenia przyjmujemy 30 dni od wpływu sprawy. Nie jest to termin prawny. Chcemy sprawdzić, co zajmuje czas i które bariery są możliwe do ograniczenia."}],"seed":"Sygnał: długie oczekiwanie i powtarzane uzupełnienia. Badamy jeden zespół oraz sprawy z ostatniego kwartału. Standard 30 dni jest umowny, a nie prawny.","focus":"Czas i uciążliwość obsługi płatności przy zachowaniu poprawności kontroli.","priority":["D3","D4"],"uses":["Wyjaśnia ogólny cel programu; nie mierzy obsługi płatności.","Ważne dla oceny środowiskowej, lecz nie rozstrzyga organizacji pracy zespołu.","Precyzuje czas i etapy procesu, z ograniczeniem do spraw zakończonych.","Sprawdza, jak komunikacja i wykonawcy mogą wydłużać konkretne sprawy.","Pozwala odróżnić możliwe usprawnienie od zmiany zasad wymagającej uzgodnień.","Może być analogią organizacyjną w dalszych pracach; nie będzie dostępny przed briefem."],"questions":[{"prompt":"Jak ująć problem tego klienta zgodnie ze zleceniem?","options":[{"id":"a","text":"Nadmierne narażenie mieszkańców na PM2,5, z określeniem grupy, sezonu i udziału lokalnego ogrzewania w emisjach.","why":"To ogólna racja programu. Zastąpiłaby konkretną diagnozę organizacyjną innym zadaniem."},{"id":"b","text":"Nadmierna liczba wymaganych dokumentów, z określeniem formularzy do usunięcia i kosztu uproszczenia procedury płatności.","why":"Zakładasz, że wymagań jest za dużo i że ich usunięcie jest właściwym kierunkiem."},{"id":"c","text":"Nadmierny czas i uciążliwość obsługi płatności, z określeniem grup spraw, standardu i etapów wymagających rozpoznania.","why":"Zachowujesz uzasadniony wąski zakres, oddzielając stan od hipotezy o uzupełnieniach."}],"correct":"c","basis":"Rozmowa wprost określa decyzję organizacyjną i potrzebę zachowania poprawności kontroli.","pitfall":"Uznanie szerokiego problemu społecznego za jedyną poprawną definicję.","remedy":"Dopasuj definicję do decyzji i publicznego znaczenia jakości obsługi.","pages":"1, 4, 6–7, 14","hint":"Co klient rzeczywiście przygotowuje po otrzymaniu briefu?"},{"prompt":"Jak wykorzystać D3 i D4 w rewizji diagnozy?","options":[{"id":"a","text":"Podtrzymać problem czasu obsługi i porównać znaczenie uzupełnień z innymi etapami, sprawdzając czytelność wezwań oraz nadal otwarte sprawy.","why":"Hipoteza klienta ma częściowe wsparcie. Można ją doprecyzować bez obowiązkowego odrzucania i bez przerzucania winy."},{"id":"b","text":"Podtrzymać problem czasu obsługi i oszacować udział beneficjentów w zwłoce, przypisując czas uzupełnień trudnościom po ich stronie.","why":"Nie zbadano konieczności i jasności wszystkich wezwań ani wszystkich etapów. D4 wskazuje również problem komunikacji."},{"id":"c","text":"Podtrzymać problem czasu obsługi i ustalić skalę niejasnych wezwań, przenosząc proporcję ośmiu rozmówców na całą populację spraw.","why":"Próba celowa ujawnia barierę, ale nie uzasadnia przeniesienia proporcji ośmiu z dwunastu na wszystkie sprawy."}],"correct":"a","basis":"D3 wskazuje oczekiwanie w 40 z 60 długich spraw; D4 ujawnia konkretne trudności komunikacyjne.","pitfall":"Odrzucenie klienta dla samej niezależności albo przypisanie winy bez dowodu.","remedy":"Podtrzymaj to, co ma wsparcie, i ujawnij zakres niepewności.","pages":"12–16, 21","hint":"Czy dowody wymagają zmiany całego problemu, czy doprecyzowania przyczyny?"}],"example":"W badanych zakończonych sprawach 60 ze 100 przekraczało umowne 30 dni. Podtrzymujemy problem czasu i uciążliwości obsługi; oczekiwanie na uzupełnienia oraz jakość wezwań są ważnymi kierunkami dalszego rozpoznania.","nextEvidence":"Przebieg spraw nadal otwartych i ocena wezwań: czy zmiana komunikacji usunie znaczną część zwłoki bez osłabienia kontroli?"}]},{"id":"BK2","name":"Bezpieczny Kredyt 2%","short":"BK2%","context":"Analizujemy doświadczenia historycznego instrumentu. Scenariusz nie zakłada otwartego naboru. Wspólna dokumentacja dotyczy umownego roku działania i miasta X: zawiera dane o odbiorcach dopłat oraz gospodarstwach pozostających poza kredytem.","background":"Potrzeby mieszkaniowe można ujmować przez koszty, jakość i dostępność mieszkania. Dopłata do kredytu obejmuje określoną grupę. Jej ocena może służyć decyzji krajowej, a rozpoznanie pominiętych potrzeb — decyzji lokalnej.","sources":[["MRiT — opis instrumentu z 2023 r.","https://www.gov.pl/web/rozwoj-technologia/bezpieczny-kredyt-2--zaczynamy"],["Rzecznik Finansowy — charakterystyka BK2","https://rf.gov.pl/edukacja/baza-wiedzy/najczestsze-pytania-i-odpowiedzi-faq/bezpieczny-kredyt-2/"]],"cards":[{"id":"D1","title":"Potrzeby w całej badanej grupie","scope":"Losowa próba 200 młodych gospodarstw w mieście X, niezależnie od udziału w dopłatach.","result":"70 ze 200 gospodarstw przeznacza na mieszkanie ponad 40% dochodu rozporządzalnego. W tym ćwiczeniu jest to standard nadmiernego obciążenia. Nie mierzono wszystkich wymiarów jakości mieszkania.","limit":"Próg nie jest kryterium uprawnienia do programu. Badanie jednego miasta nie opisuje całego kraju.","cost":1,"wait":2},{"id":"D2","title":"Poprawa u odbiorców dopłat","scope":"Badanie beneficjentów i niebeneficjentów z danymi o sytuacji sprzed wsparcia.","result":"Poprawę warunków deklaruje 80% beneficjentów i 50% porównywanych niebeneficjentów. Beneficjenci mieli wcześniej wyższe dochody i stabilniejsze zatrudnienie. Nie przygotowano porównania uwzględniającego te różnice ani wpływu dopłat na ceny.","limit":"Różnica opisowa nie jest oszacowaniem wpływu dopłat. Wskazuje potrzebę lepszego porównania, nie dowodzi ani skuteczności, ani nieskuteczności.","cost":2,"wait":4},{"id":"D3","title":"Oczekiwanie na lokalne wsparcie","scope":"Rejestr 100 gospodarstw spełniających przyjęte w scenariuszu warunki pomocy miejskiej.","result":"30 ze 100 gospodarstw czeka na odpowiedni lokal ponad 12 miesięcy, przyjęte jako roboczy próg analizy. W rejestrze znajdują się informacje o wielkości gospodarstwa i potrzebnym standardzie dostępności lokalu.","limit":"To rejestr uprawnionych oczekujących, nie wszystkich mieszkańców bez kredytu. Próg ćwiczenia nie jest gwarantowanym terminem prawnym.","cost":1,"wait":2},{"id":"D4","title":"Bariery dopasowania lokalu","scope":"Dokumentacja 20 długich spraw i osiem rozmów z osobami oczekującymi.","result":"W 12 z 20 celowo wybranych spraw problemem był brak lokalu odpowiadającego wielkości gospodarstwa lub potrzebom dostępności. W pięciu opóźniał się remont dostępnego lokalu. W trzech brakowało aktualnych dokumentów. Rozmowy wskazują też koszty tymczasowego najmu.","limit":"Wynik dotyczy wybranych długich spraw. Nie daje udziałów przyczyn w całym rejestrze ani oceny krajowego programu.","cost":2,"wait":4},{"id":"D5","title":"Możliwości instytucji","scope":"Uproszczony podział decyzji krajowych i lokalnych w symulacji.","result":"Resort przygotowuje propozycje instrumentów krajowych, wymagające decyzji rządu, parlamentu i finansowania. Prezydent miasta przygotowuje działania lokalne i gospodarowanie zasobem w granicach reguł przyjętych przez właściwe organy. Nie zmienia krajowych dopłat.","limit":"W rzeczywistej analizie sprawdź datę, podstawy prawne i budżet. Nie zakładamy aktualnego naboru BK2 ani bieżącego projektu nowego instrumentu.","cost":1,"wait":1},{"id":"D6","title":"Doświadczenie miasta Y","scope":"Raport o dopłatach i miejskim zasobie w innym rynku mieszkaniowym.","result":"W Y wzrosła liczba dostępnych mieszkań, ale równocześnie zwiększyła się podaż prywatna. Rynek Y reaguje na wzrost popytu inaczej niż mało elastyczna podaż w X.","limit":"Nie przenoś wyniku wyłącznie na podstawie podobnej liczby mieszkańców. Raport dotrze po terminie briefu.","cost":2,"wait":8}],"clients":[{"id":"a","title":"Minister Rozwoju i Technologii — historyczny scenariusz ewaluacyjny","short":"Minister — doświadczenia dopłat","decision":"Jaką ocenę doświadczeń dopłat przyjąć przed pracami nad przyszłym instrumentem?","powers":"Zleca analizę i przygotowuje propozycje rozwiązań krajowych.","limits":"Nowy instrument wymaga właściwych decyzji politycznych i finansowych; analiza nie zakłada jego przyjęcia.","mandate":"Większość beneficjentów mówi o poprawie. Nie wiemy jednak, ile tej poprawy wynika z dopłat. Potrzebuję oceny tego, co można już stwierdzić przed pracami nad przyszłym wsparciem.","talk":[{"question":"Co ma umożliwić ta analiza?","answer":"To zlecenie ewaluacyjne. Potrzebuję rozpoznać niepewność o dodatkowych skutkach dopłat i skutkach poza grupą odbiorców. Nie oczekuję uzasadnienia odtworzenia programu."},{"question":"Co może Pan/Pani zmienić i od kogo zależy?","answer":"Możemy przygotować propozycje na poziomie krajowym, lecz nie zastępuje to decyzji rządu, parlamentu ani ustalenia środków. Analizujemy historyczne doświadczenia."},{"question":"Skąd pochodzi diagnoza i co pozostaje niepewne?","answer":"Deklaracje beneficjentów są punktem wyjścia. Nie wiemy, co stałoby się bez dopłaty ani jak zmieniły się warunki niebeneficjentów. Wynik z jednego miasta może nie przenosić się na kraj."}],"seed":"Sygnał: deklarowana poprawa wśród odbiorców. Problem zlecenia to niepewność o dodatkowym skutku dopłat. Zakres początkowy: doświadczenia wybranego instrumentu i dostępne badanie miasta X.","focus":"Niepewność ewaluacyjna o skutkach dopłat istotna dla przyszłego projektowania wsparcia.","priority":["D2","D1"],"uses":["Pokazuje potrzeby poza odbiorcami; pomaga ustalić zakres oceny i pominięte grupy.","Bezpośrednio sprawdza, co można powiedzieć o dodatkowej poprawie dzięki dopłatom.","Może ujawnić potrzeby pomijane przez kredyt, lecz nie jest oszacowaniem jego wpływu.","Pomaga zrozumieć lokalne bariery; nie zastępuje porównania skutków dopłat.","Ustala zakres możliwych przyszłych decyzji i potrzebne uzgodnienia.","Przydatna analogia rynkowa w dalszej pracy; niedostępna przed briefem."],"questions":[{"prompt":"Co jest problemem analitycznym w tym zleceniu?","options":[{"id":"a","text":"Nadmierny czas oczekiwania na lokal miejski, który wymaga rozpoznania struktury dostępnego zasobu i zasad przydzielania mieszkań.","why":"To problem klienta lokalnego. Nie odpowiada bezpośrednio zamówionej ocenie instrumentu krajowego."},{"id":"b","text":"Nadmierne koszty rat kredytowych, które wymagają zwiększenia dopłat dla gospodarstw zamierzających kupić swoje pierwsze mieszkanie.","why":"Przesądzasz instrument i jego rozszerzenie. Klient zamawia ocenę wiedzy o skutkach."},{"id":"c","text":"Niepewność o dodatkowych skutkach dopłat, która utrudnia wykorzystanie doświadczeń programu przy przygotowaniu przyszłego wsparcia.","why":"Bardach dopuszcza niepewność jako problem ewaluacji służącej przyszłemu działaniu."}],"correct":"c","basis":"Klient wyraźnie pyta, ile poprawy można przypisać dopłatom.","pitfall":"Wymuszanie ogólnej diagnozy społecznej zamiast rozpoznania niepewności ewaluacyjnej.","remedy":"Nazwij, czego nie wiadomo i jakiej przyszłej decyzji to przeszkadza.","pages":"6, 15–16","hint":"Jakiej wiedzy brakuje do wykorzystania doświadczeń programu?"},{"prompt":"Jak D2 wpływa na definicję problemu klienta?","options":[{"id":"a","text":"Zawęża problem do utrzymania korzyści z dopłat: różnica 80% do 50% jest podstawą wstępnego oszacowania efektu programu.","why":"Samo porównanie dwóch różnych grup nie daje wiarygodnej sytuacji bez programu."},{"id":"b","text":"Zawęża problem do rozdzielenia efektu dopłat od różnic grup: potrzeba porównania uwzględniającego ich sytuację przed programem.","why":"Można podtrzymać zlecenie ewaluacyjne i wskazać konkretną lukę: porównanie uwzględniające dobór do wsparcia."},{"id":"c","text":"Zawęża problem do poprawy doboru adresatów: różnice dochodów przed programem są podstawą wstępnego wyjaśnienia całej przewagi beneficjentów.","why":"Dane wskazują konkurencyjne wyjaśnienie. Nie oszacowano jednak wpływu dochodu ani braku wpływu dopłat."}],"correct":"b","basis":"D2 zawiera różnice sprzed programu oraz brak modelu porównania.","pitfall":"Przejście od różnicy opisowej do pewności przyczynowej.","remedy":"Oddziel ustalenie o grupach od nieustalonego skutku instrumentu.","pages":"6, 19","hint":"Czy materiał rozstrzyga, co stałoby się bez dopłat?"}],"example":"Niepewność dotyczy dodatkowej poprawy warunków dzięki dopłatom, przy różnicach między beneficjentami a niebeneficjentami. D2 jej nie usuwa. D1 uzasadnia uwzględnienie także potrzeb gospodarstw poza programem.","nextEvidence":"Wiarygodne porównanie przebiegu warunków mieszkaniowych bez dopłaty, z oceną doboru do programu i reakcji rynku."},{"id":"b","title":"Prezydent miasta X","short":"Prezydent — gospodarstwa poza kredytem","decision":"Jakie bariery uwzględnić w przygotowaniu lokalnego planu poprawy dostępu do odpowiedniego lokalu?","powers":"Przygotowuje działania dotyczące miejskiego zasobu i współpracy lokalnej.","limits":"Nie zmienia krajowych dopłat; zasady, budżet i wykonanie wymagają właściwych uchwał i współpracy jednostek.","mandate":"BK2 nie obejmuje wszystkich potrzeb mieszkaniowych: część gospodarstw bez możliwości uzyskania kredytu długo czeka na lokal miejski. Podejrzewam, że brakuje lokali odpowiadających ich potrzebom. Potrzebuję diagnozy do lokalnego planu dla tej grupy.","talk":[{"question":"Co ma umożliwić ta analiza?","answer":"Chodzi o gospodarstwa spełniające przyjęte w scenariuszu warunki pomocy miejskiej. Interesuje nas długość oczekiwania na odpowiedni lokal, a nie zwiększenie liczby kredytów."},{"question":"Co może Pan/Pani zmienić i od kogo zależy?","answer":"Możemy przygotować działania dotyczące remontów i dopasowania zasobu oraz propozycje dla właściwych organów miasta. Nie ustalamy krajowych zasad dopłat ani decyzji kredytowych banków."},{"question":"Skąd pochodzi diagnoza i co pozostaje niepewne?","answer":"Przyjmujemy ponad 12 miesięcy jako roboczy próg wymagający analizy, nie termin prawny. Mamy rejestr i skargi. Brak odpowiednich lokali jest przypuszczeniem, które chcemy porównać z opóźnieniami remontów i dokumentów."}],"seed":"Sygnał: długie oczekiwanie gospodarstw objętych lokalną pomocą. Zakres: rejestr miasta X; próg ćwiczenia: ponad 12 miesięcy. Populacja nie obejmuje wszystkich niebeneficjentów BK2.","focus":"Dostęp do odpowiedniego lokalu w wybranej grupie objętej pomocą miejską.","priority":["D3","D4"],"uses":["Daje szerszy kontekst potrzeb, ale nie zastąpi danych o grupie zlecenia.","Pomaga ocenić granice dopłat jako odpowiedzi na potrzeby; nie mierzy czasu oczekiwania na lokal.","Określa skalę w rejestrze i cechy gospodarstw oczekujących.","Sprawdza dopasowanie zasobu oraz konkurencyjne bariery realizacji.","Rozróżnia lokalne możliwości od krajowych instrumentów.","Może podsunąć lokalne warianty, po ocenie kontekstu i już po bieżącym terminie."],"questions":[{"prompt":"Która definicja najlepiej odpowiada lokalnemu zleceniu?","options":[{"id":"a","text":"Niepewność co do wpływu dopłat na warunki wszystkich beneficjentów utrudnia podjęcie krajowej decyzji o nowym instrumencie.","why":"To właściwe pytanie ewaluacyjne dla pierwszego klienta, lecz inne niż obecne zlecenie."},{"id":"b","text":"Długie oczekiwanie uprawnionych gospodarstw na odpowiedni lokal w mieście X wymaga określenia skali i barier dostępu.","why":"Wskazujesz grupę i trudność, pozostawiając do sprawdzenia, które bariery wydłużają oczekiwanie."},{"id":"c","text":"Niedostateczna liczba lokali o określonej wielkości wymaga przygotowania nowych inwestycji mieszkaniowych dla wszystkich oczekujących.","why":"Zakładasz przyczynę oraz kierunek działania. Część bariery może dotyczyć już istniejącego zasobu."}],"correct":"b","basis":"Rozmowa ogranicza zlecenie do lokalnej grupy uprawnionych i przygotowania planu miasta.","pitfall":"Kopiowanie definicji klienta krajowego albo przesądzenie przyczyny.","remedy":"Zdefiniuj właściwą populację, standard i zakres decyzji.","pages":"4–9, 12","hint":"Czy zadanie dotyczy odbiorców kredytu, czy grupy oczekującej na lokal?"},{"prompt":"Co można powiedzieć na podstawie D3 i D4?","options":[{"id":"a","text":"Rejestr i rozmowy pozwalają oszacować brak dopasowania lokali na 60% długiego oczekiwania, a następnie sprawdzić pozostałe bariery w mieście.","why":"20 spraw wybrano celowo. Nie znamy populacyjnego udziału przyczyn."},{"id":"b","text":"Rejestr i rozmowy pozwalają oszacować długie oczekiwanie na 30% gospodarstw bez kredytu, a następnie zbadać bariery dostępu do lokali.","why":"Rejestr uprawnionych nie jest populacją wszystkich gospodarstw bez kredytu."},{"id":"c","text":"Rejestr opisuje 30 ze 100 uprawnionych gospodarstw; rozmowy wskazują możliwe bariery, których częstość w całej grupie wymaga sprawdzenia.","why":"Zachowujesz zakres rejestru i ograniczenie celowo dobranych spraw, a diagnozę klienta możesz częściowo podtrzymać."}],"correct":"c","basis":"D3 opisuje cały wskazany rejestr; D4 opisuje 20 wybranych długich spraw.","pitfall":"Pomylenie populacji problemu z dostępnym rejestrem lub próbą.","remedy":"Podaj właściwy mianownik i zakres każdej informacji.","pages":"6–7, 15, 19","hint":"Kogo dokładnie obejmuje każda liczba?"}],"example":"W rejestrze miasta X 30 ze 100 uprawnionych gospodarstw czeka ponad umowne 12 miesięcy. Wybrane sprawy wskazują bariery dopasowania lokali, remontów i dokumentów; nie znamy ich udziałów w całym rejestrze.","nextEvidence":"Zestawienie potrzeb całego rejestru ze stanem i terminami dostępności lokali: które bariery powinien objąć plan miasta?"}]},{"id":"SCT","name":"Strefa Czystego Transportu w Warszawie","short":"SCT Warszawa","context":"Dwa fikcyjne zlecenia dotyczą tej samej strefy: narażenia mieszkańców oraz obsługi osób ubiegających się o potwierdzenie wyłączenia. Nie uczymy aktualnych uprawnień do wjazdu. Okres i progi są umowne.","background":"Ochrona przed zanieczyszczeniem jest uzasadnieniem SCT. Dostępna i rzetelna obsługa jej reguł również ma publiczne znaczenie. Problem organizacyjny nie musi być przepisany na ogólny problem powietrza.","sources":[["ZDM — rola w obsłudze SCT","https://zdm.waw.pl/sprawy/strefa-czystego-transportu/"],["Warszawa — informacje o SCT","https://warszawa19115.pl/-/strefa-czystego-transportu-sct"]],"cards":[{"id":"D1","title":"Rozkład narażenia","scope":"Pomiary kwartalne, model przestrzenny i mapa ludności wybranych ulic.","result":"Oszacowano 400 z 1200 mieszkańców badanego zespołu ulic powyżej poziomu T dla NO₂. Podwyższone wartości występują także na dwóch ulicach poza strefą. T jest progiem scenariusza. Nie określono przedziału niepewności.","limit":"Granice pomiaru nie obejmują całej Warszawy. Położenie poza strefą nie przesądza przyczyny ani zasadności poszerzenia.","cost":1,"wait":2},{"id":"D2","title":"Ruch i inne wyjaśnienia","scope":"Ruch, pogoda, zabudowa i pomiary na ulicach w strefie oraz porównawczych.","result":"NO₂ spadło w obu grupach ulic. Jednocześnie zmieniały się pogoda i natężenie ruchu. Na jednej ulicy poza strefą ważna może być słaba wentylacja związana z zabudową. Nie sprawdzono przeniesienia ruchu.","limit":"Same spadki nie identyfikują wpływu strefy. Potrzebne jest wiarygodne porównanie i sprawdzenie alternatywnych wyjaśnień.","cost":2,"wait":4},{"id":"D3","title":"Czas obsługi wyłączeń","scope":"100 kolejnych zakończonych spraw z umownego miesiąca; rejestr etapów.","result":"60 ze 100 spraw trwało ponad umowne 10 dni. W 35 z tych 60 spraw ponad połowę czasu zajęło oczekiwanie na uzupełnienie dokumentów. Nie ustalono, czy wezwania były jasne ani ile najdłuższych spraw nadal jest otwartych.","limit":"10 dni nie jest terminem prawnym. Dane nie dowodzą, że przyczyną jest niedobór personelu lub zaniedbanie wnioskodawcy.","cost":1,"wait":2},{"id":"D4","title":"Doświadczenie obsługi","scope":"16 celowo dobranych rozmów, również z osobami, które przerwały składanie wniosku.","result":"Osiem osób zgłaszało trudność z dokumentami elektronicznymi, pięć z rozumieniem wezwania, trzy z uzyskaniem dokumentu od innej instytucji. Dla wybranych spraw potwierdzono powtarzany kontakt bez wyjaśnienia wymagań.","limit":"Rozmowy rozpoznają bariery, nie ich częstość w całej populacji. Nie ustalają uprawnienia każdej osoby ani skutku reorganizacji.","cost":2,"wait":4},{"id":"D5","title":"Zakres działania klientów","scope":"Podział zadań i ograniczenia w tej symulacji.","result":"Prezydent przygotowuje kierunek dalszych prac nad strefą; zmiana uchwały wymaga właściwej procedury i decyzji rady. ZDM obsługuje wnioski o wyłączenia. Dyrektor może przygotować usprawnienia organizacji, ale nie samodzielnie zmienić warunki wjazdu.","limit":"Przed rzeczywistą rekomendacją trzeba sprawdzić obowiązujące przepisy, upoważnienia i zasoby. Tutaj korzystamy z podanych warunków zadania.","cost":1,"wait":1},{"id":"D6","title":"Doświadczenie innego miasta","scope":"Raport o strefie i systemie obsługi w mieście Y.","result":"W Y spadło NO₂ i skrócono obsługę. Miasto miało inne zasady wyłączeń, większą dostępność komunikacji zbiorowej i inny system informatyczny. Raport łączy kilka zmian.","limit":"Podobna nazwa strefy nie wystarcza do przeniesienia wyników. Dokument dotrze po terminie briefu.","cost":2,"wait":8}],"clients":[{"id":"a","title":"Prezydent m.st. Warszawy","short":"Prezydent — kierunek prac nad SCT","decision":"Czy i z jaką diagnozą skierować propozycję zmian SCT do dalszych prac?","powers":"Przygotowuje propozycje i organizuje prace po stronie władz wykonawczych miasta.","limits":"Zmiany uchwały wymagają właściwej procedury i decyzji rady; nie każdą emisję można ograniczyć regułami wjazdu.","mandate":"Mieszkańcy części ulic nadal skarżą się na spaliny. Być może strefa jest zbyt mała. Potrzebuję diagnozy narażenia przed dalszymi pracami nad jej zmianą.","talk":[{"question":"Co ma umożliwić ta analiza?","answer":"Chcę ustalić, kogo i gdzie dotyczy narażenie oraz co już wiemy o jego źródłach. Nie zamawiam jeszcze wyboru nowych granic."},{"question":"Co może Pan/Pani zmienić i od kogo zależy?","answer":"Możemy skierować propozycje do dalszych prac. Zmiana reguł wymaga odpowiedniej procedury i współpracy organów. Musimy też uwzględnić podróże i skutki poza strefą."},{"question":"Skąd pochodzi diagnoza i co pozostaje niepewne?","answer":"Podstawą obaw są skargi i cząstkowe pomiary. Mały obszar strefy jest moim wyjaśnieniem, a nie ustalonym wynikiem analizy. W grze posługujemy się umownym poziomem T."}],"seed":"Sygnał: narażenie przy wybranych ulicach w badanym kwartale. Poziom T służy porównaniu w ćwiczeniu; wielkość i zasięg wymagają sprawdzenia.","focus":"Narażenie mieszkańców i jego źródła istotne dla dalszych prac nad SCT.","priority":["D1","D2"],"uses":["Precyzuje skalę i przestrzenny zakres narażenia.","Sprawdza hipotezy o źródłach i ograniczenia oceny wpływu.","Ważne dla wdrożenia i obciążeń mieszkańców, ale nie jest pomiarem narażenia.","Ujawnia skutki procedur dla ludzi; może uzupełnić ocenę zmian, lecz nie wyjaśnia stężeń.","Pozwala odnieść zakres diagnozy do możliwości i zależności klienta.","Może podsunąć warianty; nie mieści się w terminie i wymaga kontroli kontekstu."],"questions":[{"prompt":"Która robocza definicja odpowiada temu zleceniu?","options":[{"id":"a","text":"Nadmierne narażenie mieszkańców wybranych ulic na NO₂, z ustaleniem obszaru, okresu, skali i podstawy oceny.","why":"Odpowiada zamówionej diagnozie i pozostawia otwarte źródła oraz możliwe działania."},{"id":"b","text":"Niedostateczne pokrycie ulic regułami SCT, z ustaleniem obszaru wymagającego objęcia nowymi granicami strefy.","why":"Definiujesz brak większej strefy jako problem i przyjmujesz hipotezę klienta."},{"id":"c","text":"Nadmierne oczekiwanie na potwierdzenie wyłączenia, z ustaleniem grup spraw, czasu obsługi i barier procedury.","why":"To uzasadniony problem drugiego klienta. Nie zastępuje obecnego zlecenia o narażeniu."}],"correct":"a","basis":"Rozmowa oddziela narażenie od hipotezy o wielkości strefy.","pitfall":"Wpisanie rozwiązania do definicji.","remedy":"Nazwij niepożądany stan, a parametr instrumentu sprawdzaj jako możliwy czynnik.","pages":"4–9, 12","hint":"Który stan jest celem analizy, a który opisuje projekt instrumentu?"},{"prompt":"Jakie znaczenie mają dla klienta D1 i D2?","options":[{"id":"a","text":"D1 i D2 uzasadniają przygotowanie poszerzenia granic jako kierunku ograniczenia narażenia, z dalszym badaniem jego przewidywanych kosztów.","why":"Położenie problemu nie określa automatycznie przyczyny i właściwego instrumentu."},{"id":"b","text":"D1 i D2 uzasadniają przygotowanie zmiany instrumentu jako kierunku ograniczenia narażenia, skoro spadek wystąpił także poza strefą.","why":"Zmiana poza strefą nie dowodzi zerowego wpływu. Trzeba oddzielić wspólne trendy i inne czynniki."},{"id":"c","text":"D1 i D2 uzasadniają objęcie diagnozą ulic poza strefą; wybór granic i oszacowanie wpływu wymagają dalszych porównań.","why":"Doprecyzowujesz zakres problemu, pozostawiając do analizy przyczyny, wpływ i kierunek działania."}],"correct":"c","basis":"D1 opisuje narażenie, D2 wskazuje zmiany kilku czynników i brak sprawdzenia przeniesienia ruchu.","pitfall":"Przedwczesne przejście od obserwacji do rekomendacji.","remedy":"Oddziel zakres problemu, wyjaśnienie i wybór instrumentu.","pages":"12–16, 19","hint":"Czy pomiar poza granicą mówi, co trzeba zmienić w granicy?"}],"example":"Model wskazuje 400 z 1200 mieszkańców badanych ulic ponad poziomem T, także poza strefą. Zakres diagnozy powinien objąć te ulice, ale ich położenie nie przesądza poszerzenia. Udział SCT w zmianie stężeń pozostaje nieustalony.","nextEvidence":"Porównanie ruchu, pogody i narażenia, z oceną przeniesienia ruchu: co wyjaśnia pozostałe narażenie i jakich działań warto dalej szukać?"},{"id":"b","title":"Dyrektor Zarządu Dróg Miejskich w Warszawie","short":"Dyrektor ZDM — obsługa wyłączeń","decision":"Jakie problemy uwzględnić w organizacji obsługi wniosków o potwierdzenie wyłączenia?","powers":"Przygotowuje organizację pracy i komunikację w ramach obsługi prowadzonej przez ZDM.","limits":"Nie zmienia samodzielnie zasad wyłączeń ani granic strefy; część danych pochodzi z innych instytucji.","mandate":"Osoby ubiegające się o wyłączenie zgłaszają długie oczekiwanie. Uważam, że brakuje pracowników. Proszę rozpoznać problem przed zmianą organizacji obsługi.","talk":[{"question":"Co ma umożliwić ta analiza?","answer":"Potrzebuję wiedzieć, gdzie powstaje oczekiwanie i jak obciąża ludzi. Poprawa ma zachować rzetelną weryfikację. Sam wzrost liczby obsłużonych spraw nie wystarczy."},{"question":"Co może Pan/Pani zmienić i od kogo zależy?","answer":"Mogę przygotować zmiany podziału pracy i sposobu informacji w ramach naszych zasobów. Nie mogę przez zmianę obsługi ustanowić nowych uprawnień ani zmienić granic strefy."},{"question":"Skąd pochodzi diagnoza i co pozostaje niepewne?","answer":"Sygnałem są skargi, niepełny rejestr i oczekiwanie w punkcie. Przyjmujemy ponad 10 dni jako umowny próg do analizy, nie termin prawny. Nie sprawdziliśmy udziału personelu, dokumentów i komunikacji."}],"seed":"Sygnał: czas i trudności uzyskania potwierdzenia wyłączenia w jednym miesiącu. Próg 10 dni jest umowny. Skala i etapy procesu wymagają sprawdzenia w D3.","focus":"Czas i dostępność rzetelnej obsługi, z poszanowaniem reguł wyłączeń.","priority":["D3","D4"],"uses":["Daje środowiskowy kontekst strefy; nie mierzy jakości obsługi.","Pomaga ocenić środowiskowy skutek SCT, lecz nie sprawdza kolejki spraw.","Bezpośrednio określa czas i etapy obsługi.","Pozwala sprawdzić bariery również poza rejestrem zakończonych spraw.","Oddziela usprawnienie obsługi od zmiany uprawnień i granic.","Może służyć późniejszemu porównaniu rozwiązań, po ocenie odmiennych reguł."],"questions":[{"prompt":"Który problem należy roboczo zdefiniować dla dyrektora?","options":[{"id":"a","text":"Nadmierne narażenie mieszkańców na spaliny, z uwzględnieniem ulic poza strefą i możliwego udziału starszych pojazdów.","why":"To ważny problem środowiskowy, lecz nie odpowiada konkretnemu zleceniu organizacyjnemu."},{"id":"b","text":"Nadmierny czas i trudności uzyskania potwierdzenia wyłączenia, z uwzględnieniem grup spraw i standardu rzetelnej obsługi.","why":"Zachowujesz właściwy zakres i publiczne znaczenie obsługi, nie przesądzając przyczyny."},{"id":"c","text":"Niedostateczna liczba pracowników obsługujących wyłączenia, z uwzględnieniem potrzeb nowych etatów i dostępnego budżetu jednostki.","why":"Brak pracowników jest hipotezą. Bez sprawdzenia nie należy utożsamiać go z problemem i rozwiązaniem."}],"correct":"b","basis":"Klient przygotowuje organizację obsługi, a brak personelu podaje jako wyjaśnienie.","pitfall":"Zastąpienie właściwego wąskiego zlecenia ogólnym celem programu.","remedy":"Zdefiniuj stan w zakresie decyzji klienta; przyczyny pozostaw do sprawdzenia.","pages":"1, 4–9, 14","hint":"Którą sytuację może poprawić przygotowywana organizacja obsługi?"},{"prompt":"Co wynika dla tej diagnozy z D3 i D4?","options":[{"id":"a","text":"Warto zbadać dokumenty i komunikację obok obciążenia personelu, rozdzielając czas oczekiwania od czasu pracy nad sprawą.","why":"Nowy materiał poszerza wyjaśnienia, a wąski problem obsługi pozostaje zasadny."},{"id":"b","text":"Warto zbadać potrzebę etatów dla 60 długich spraw, przeliczając przekroczenie standardu na wielkość niedoboru pracy personelu.","why":"Odsetek spraw powyżej progu nie jest oszacowaniem niedoboru personelu ani skutku zwiększenia zatrudnienia."},{"id":"c","text":"Warto zbadać trudności w
