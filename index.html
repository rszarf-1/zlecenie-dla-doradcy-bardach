const DATA={"version":"2.3.0","key":"BD2-20261107","reading":"https://drive.google.com/file/d/1khXtBtyNtTJFo1JFcNLub8UYYg1-HpbW/view?usp=sharing","formUrl":"https://docs.google.com/forms/d/e/1FAIpQLScRI06sRYjbfSok4WRtrvV26Xt6DYrZCaul-XhLUdc4B2yBfw/viewform","programs":[{"id":"GPA","name":"Grodziskie Przewozy Autobusowe / FRPA","short":"GPA / FRPA","context":"Znasz program organizacji przewozów. Ten sam transport może być przedmiotem analizy dostępności podróży albo przewidywalności finansowania przez gminę. Oba zlecenia dotyczą jednego umownego obszaru X; okres każdego badania wskazano w kartach dowodów.","background":"Publicznym uzasadnieniem przewozów jest m.in. dostęp do pracy i usług. Jego utrzymanie wymaga także wykonalnego finansowania. Liczba przejazdów i koszt przewozów nie mierzą tego samego.","sources":[["GPA — zadania i organy związku","https://gpagrodzisk.pl/info/zawartosc/5"],["GPA — konsultacje planu transportowego","https://gpagrodzisk.pl/info/zawartosc/91"]],"cards":[{"id":"D1","title":"Potrzebne podróże","scope":"Losowa próba 200 dorosłych bez dostępu do samochodu, mieszkających na badanym obszarze obsługiwanym przez GPA. Dzienniczki podróży z jednego umownego tygodnia po zmianie rozkładu.","result":"80 z 200 osób nie mogło odbyć co najmniej jednej potrzebnej podróży z powrotem tego samego dnia. W ćwiczeniu wymagamy dojazdu do celu w najwyżej 60 minut w każdą stronę i łącznego kosztu podróży oraz powrotu do 10% dziennego dochodu osoby. To umowne warunki oceny, nie przepisy.","limit":"Wynik dotyczy tej próby i tygodnia, nie dokładnej liczby wszystkich mieszkańców. Nie podano niepewności oszacowania. Karta nie wyjaśnia jeszcze, dlaczego podróż była niemożliwa.","cost":1,"wait":2,"kind":"Fikcyjny materiał do analizy"},{"id":"D2","title":"Godziny i możliwe bariery","scope":"Rozkłady z tygodnia badanego w D1, godziny pracy zmianowej oraz 20 rozmów z celowo wybranymi osobami zgłaszającymi trudności powrotu.","result":"14 z 20 rozmówców wskazało brak powrotu po późnej zmianie w pracy. Zestawienie godzin końca pracy i rozkładów potwierdza brak odpowiednich kursów dla wskazanych podróży. Część rozmówców znała ofertę. Nie zbadano weekendów ani wszystkich linii.","limit":"Dobór celowy pozwala rozpoznać barierę, ale nie oszacować jej częstości w populacji. Nie oszacowano skutku nowego kursu.","cost":2,"wait":4,"kind":"Fikcyjny materiał do analizy"},{"id":"D3","title":"Prognozy wkładu gminy","scope":"Pierwsza prognoza i ostateczne rozliczenie wkładu gminy X w każdym z czterech kwartałów jednego umownego roku. Wkład to udział gminy w finansowaniu przewozów.","result":"W kwartałach 1, 2 i 3 ostateczny wkład był o ponad 15% wyższy od pierwszej prognozy; w kwartale 4 nie przekroczono tego progu. W kwartałach 1 i 2 pismo o nowych stawkach dotarło do gminy przed pierwszą prognozą. Sama tabela nie pokazuje, czy stawki uwzględniono w obliczeniach.","limit":"Próg 15% jest standardem planistycznym ćwiczenia. Rozbieżność prognozy i rozliczenia nie dowodzi niegospodarności ani nadmiernej ceny przewozów.","cost":1,"wait":2,"kind":"Fikcyjny materiał do analizy"},{"id":"D4","title":"Jak powstawała prognoza","scope":"Daty przekazania danych, wersje arkuszy z kwartałów 1–3 z D3 oraz cztery rozmowy z pracownikami finansowymi gminy i związku.","result":"W kwartale 1 użyto starego arkusza, choć gmina otrzymała nowe stawki. W kwartale 2 stawki były znane, ale brakowało pełnych danych o przychodach. W kwartale 3 prognozę przygotowano przed otrzymaniem pełnych danych o stawkach i przychodach. Rozmówcy różnie oceniają odpowiedzialność za te sytuacje.","limit":"Braki informacji i własne obliczenia gminy mogą mieć różne znaczenie w poszczególnych kwartałach. Nie oszacowano udziału każdego czynnika w rozbieżności ani skutku zmiany procedury.","cost":2,"wait":4,"kind":"Fikcyjny materiał do analizy"},{"id":"D5","title":"Warunki działania","scope":"Zasoby, umowy i podział zadań przyjęte w symulacji.","result":"Organizator przygotowuje zmiany sieci w ramach uzgodnionego finansowania i umów. Gmina przygotowuje własny budżet i uzgadnia wkład; sama nie zmienia całej sieci. Zmiana oferty może wymagać innych gmin, operatora i organów związku.","limit":"To uproszczone warunki symulacji. W rzeczywistej K3 sprawdź statut, umowy, zasady FRPA i kompetencje organów.","cost":1,"wait":1,"kind":"Warunki przyjęte w zleceniu","purpose":"Konkretna sytuacja działania: możliwości i zależności klienta (lektura PL, s. 25–26)."},{"id":"D6","title":"Doświadczenie innego związku","scope":"Raport o zmianie rozkładu i zasad prognozowania w obszarze Y.","result":"W Y zmniejszyły się skargi i rozbieżności prognoz. Równocześnie zmienił się operator oraz sposób rozliczeń. Nie oddzielono wpływu poszczególnych zmian.","limit":"Raport może podsunąć pomysły. Nie dowodzi, że ten sam wynik wystąpi w X; w scenariuszu dotrze po terminie briefu.","cost":2,"wait":8,"kind":"Fikcyjny materiał do analizy","purpose":"Doświadczenie z innego miejsca: sprawdź warunki, zamiast kopiować wynik (lektura PL, s. 25–26, 29–30)."}],"clients":[{"id":"a","title":"Zarząd Związku Powiatowo-Gminnego „Grodziskie Przewozy Autobusowe”","short":"Zarząd GPA","decision":"Jakie trudności podróży uwzględnić w przygotowaniu korekty oferty na kolejny kwartał?","powers":"Przygotowuje i organizuje zmiany oferty w ramach uzgodnionych zasobów.","limits":"Finansowanie i wykonanie wymagają uzgodnień z właściwymi organami, gminami i operatorem.","mandate":"Mieszkańcy skarżą się na dojazdy, choć dodaliśmy kursy. Sądzę, że nie znają oferty. Proszę przygotować diagnozę przed pracami nad korektą sieci.","talk":[{"question":"Co ma umożliwić ta analiza?","answer":"Chcemy określić, które potrzebne podróże nadal są niemożliwe. Liczba pasażerów nie obejmuje osób, które nie mogą skorzystać. Nie zamawiamy jeszcze wyboru nowego rozkładu."},{"question":"Co może Pan/Pani zmienić i od kogo zależy?","answer":"Możemy przygotować propozycje zmian godzin i połączeń. Większe wydatki oraz zmiany umów wymagają uzgodnień. Nie możemy założyć dowolnego zwiększenia budżetu."},{"question":"Skąd pochodzi diagnoza i co pozostaje niepewne?","answer":"Mamy skargi i wzrost liczby przejazdów. Hipoteza o niewiedzy pochodzi z rozmów z pracownikami. Wstępne badanie mieszkańców opisuje skalę trudności, ale jego wyniku jeszcze nie sprawdziliśmy."}],"seed":"Sygnał: skargi osób bez auta na potrzebne podróże i powroty. Roboczy standard dostępności: do 60 minut w każdą stronę i koszt do 10% dziennego dochodu. Skala wymaga sprawdzenia w D1.","focus":"Dostępność potrzebnych podróży osób bez auta, powiązana z decyzją o korekcie oferty.","priority":["D1","D2"],"uses":["Bezpośrednio precyzuje skalę i zakres problemu podróży.","Sprawdza konkurencyjne wyjaśnienie wobec niewiedzy mieszkańców.","Pomaga ocenić finansowanie późniejszych zmian; nie mierzy trudności dojazdu.","Wyjaśnia prognozowanie finansów, ważne przy zasobach, ale poza główną hipotezą zlecenia.","Ustala możliwości i zależności klienta; może uzasadnić zawężenie analizy.","Może pomóc przy alternatywach, lecz nie będzie gotowy przed briefem."],"questions":[{"prompt":"Jaką roboczą definicję najlepiej przyjąć dla tego zlecenia?","options":[{"id":"a","text":"Zbyt mały zasięg informacji o kursach wśród mieszkańców bez auta ogranicza wykorzystanie dostępnej oferty przewozowej.","why":"To hipoteza przyczynowa. Nie mamy jeszcze dowodu, że informacja jest barierą."},{"id":"b","text":"Trudności mieszkańców bez auta w odbyciu potrzebnych podróży i powrotów wymagają określenia skali wobec standardu dostępności.","why":"Definicja odpowiada decyzji o ofercie. Przyczynę pozostawia do sprawdzenia, a skalę do doprecyzowania."},{"id":"c","text":"Nieprzewidywalna wysokość wkładu gminy w przewozy utrudnia planowanie wydatków na transport w kolejnych kwartałach.","why":"To sensowny problem dla klienta finansującego przewozy, ale nie główne pytanie tego zlecenia."}],"correct":"b","basis":"Zlecenie i rozmowa dotyczą potrzebnych podróży; klient proponuje niewi dni. W 40 z tych 60 spraw co najmniej połowę czasu zajęło oczekiwanie na uzupełnienia. Nie ustalono, czy wezwania były konieczne i zrozumiałe.","limit":"Pomijamy nadal otwarte sprawy, które mogą trwać najdłużej. Nie badamy czasu zaksięgowania pieniędzy po zleceniu wypłaty. Opis etapów nie rozstrzyga winy personelu ani wnioskodawców.","cost":1,"wait":2,"kind":"Fikcyjny materiał do analizy"},{"id":"D4","title":"Doświadczenie oczekujących","scope":"12 celowo dobranych rozmów z osobami oczekującymi na płatność w tym samym okresie oraz przegląd wezwań w ich sprawach. To nie jest losowa próba z D3.","result":"Osiem osób nie rozumiało pierwszego wezwania. W trzech sprawach kolejne wezwanie dotyczyło dokumentu, który można było wskazać wcześniej. Dwie osoby miały trudność z uzyskaniem dokumentów od wykonawcy. Te grupy mogą się nakładać: jedna osoba mogła napotkać kilka barier.","limit":"Wybrane sprawy ujawniają możliwe bariery. Nie mówią, jaki odsetek wszystkich beneficjentów je napotyka.","cost":2,"wait":4,"kind":"Fikcyjny materiał do analizy"},{"id":"D5","title":"Kto może co zmienić","scope":"Podział zadań i zasoby przyjęte dla zleceń.","result":"Gmina ma punkt wsparcia i współpracuje z operatorem, czyli podmiotem pomagającym mieszkańcom przejść przez inwestycję i uzyskać wsparcie na zasadach programu. Nie zmienia sama zasad krajowych ani emisji poza granicą. Fundusz organizuje obsługę swoich spraw w granicach tych zasad.","limit":"To warunki przyjęte dla zadania. W realnej analizie sprawdź obowiązujące reguły, umowy i podział kompetencji; istnienie punktu nie przesądza o jakości jego działania.","cost":1,"wait":1,"kind":"Warunki przyjęte w zleceniu","purpose":"Konkretna sytuacja działania: możliwości i zależności klienta (lektura PL, s. 25–26)."},{"id":"D6","title":"Wsparcie w innym regionie","scope":"Raport o mobilnym doradztwie i zmianie obsługi w regionie Y.","result":"W regionie Y przybyło zakończonych inwestycji i skrócił się czas części spraw. Zmieniono też finansowanie oraz system informatyczny. Nie rozdzielono skutków zmian.","limit":"To doświadczenie do oceny, nie gotowa prognoza dla X. Raport w scenariuszu będzie dostępny po terminie briefu.","cost":2,"wait":8,"kind":"Fikcyjny materiał do analizy","purpose":"Doświadczenie z innego miejsca: sprawdź warunki, zamiast kopiować wynik (lektura PL, s. 25–26, 29–30)."}],"clients":[{"id":"a","title":"Wójt gminy X","short":"Wójt — narażenie mieszkańców","decision":"Które źródła narażenia i bariery uwzględnić w przygotowaniu lokalnych działań środowiskowych?","powers":"Przygotowuje lokalne działania i wykorzystanie istniejącej współpracy z programem.","limits":"Nie ustala krajowych zasad dotacji; napływ zanieczyszczeń wymaga współpracy poza gminą.","mandate":"Mamy zanieczyszczone powietrze i mało ukończonych inwestycji. Sądzę, że dodatkowa pomoc przy wnioskach rozwiąże problem. Potrzebuję diagnozy do planu działań gminy.","talk":[{"question":"Co ma umożliwić ta analiza?","answer":"Chcę wiedzieć, którzy mieszkańcy są narażeni i jaką część problemu można ograniczać działaniami lokalnymi. Sama liczba wniosków nie wyznacza celu."},{"question":"Co może Pan/Pani zmienić i od kogo zależy?","answer":"Mamy już punkt wsparcia i współpracę operatorską. Możemy rozważać ich organizację i współpracę z innymi gminami. Nie zmieniamy samodzielnie zasad krajowego programu."},{"question":"Skąd pochodzi diagnoza i co pozostaje niepewne?","answer":"Łączę małą liczbę inwestycji z formalnościami, ale nie mam porównania ich znaczenia z finansami i wykonawcami. Nie znam też dobrze udziału napływu zanieczyszczeń."}],"seed":"Sygnał: sezonowe narażenie mieszkańców. W symulacji oceniamy je względem poziomu T, którego nie należy traktować jako aktualnej normy. Zasięg i wielkość opisuje dopiero D1.","focus":"Narażenie mieszkańców i zakres możliwego działania gminy.","priority":["D1","D2"],"uses":["Określa grupę, zakres i przybliżoną skalę narażenia.","Sprawdza źródła problemu i ograniczenia przypisania poprawy inwestycjom.","Opisuje obsługę płatności; może być barierą programu, ale nie mierzy lokalnego narażenia.","Pomaga rozpoznać barierę administracyjną w wybranych sprawach; nie wyjaśnia wszystkich inwestycji.","Pozwala powiązać diagnozę z możliwościami gminy i istniejącym wsparciem.","Może poszerzyć warianty, lecz wymaga oceny podobieństwa i przyjdzie po terminie."],"questions":[{"prompt":"Który zakres najlepiej odpowiada temu zleceniu?","options":[{"id":"a","text":"Narażenie mieszkańców gminy i udział różnych źródeł, z osobnym sprawdzeniem barier wykorzystania wsparcia dla inwestycji.","why":"Odpowiada planowi lokalnych działań i zostawia otwarte znaczenie poszczególnych barier."},{"id":"b","text":"Czas rozpatrywania wniosków o płatność w funduszu, z osobnym sprawdzeniem obciążenia zespołu obsługującego dokumenty.","why":"To zasadny problem dla funduszu, ale sam nie odpowie na pytanie wójta o narażenie i lokalne źródła."},{"id":"c","text":"Dostępność dodatkowego punktu składania wniosków w gminie, z osobnym sprawdzeniem godzin pracy i kosztów jego uruchomienia.","why":"Przyjmujesz konkretną organizację wsparcia zanim sprawdzisz, jaką barierę ma usuwać."}],"correct":"a","basis":"Klient przygotowuje lokalny plan działań; pomoc w formalnościach jest jedną propozycją.","pitfall":"Zamiana problemu w brak preferowanego rozwiązania.","remedy":"Określ stan i zakres; sprawdź związki między narażeniem, inwestycjami i obsługą.","pages":"7–12, 17–19","hint":"Jakie pytanie o mieszkańców ma rozstrzygnąć plan gminy?","originalPages":"4–9, 12"},{"prompt":"Co uzasadnia materiał D2?","options":[{"id":"a","text":"Materiał uzasadnia ocenę udziału programu w poprawie na podstawie spadku stężeń po inwestycjach, z uwzględnieniem liczby wymienionych urządzeń.","why":"Następstwo czasowe nie oddziela wpływu inwestycji od cieplejszego sezonu."},{"id":"b","text":"Materiał uzasadnia analizę ogrzewania i napływu; ocenę wpływu inwestycji trzeba oprzeć także na pogodzie oraz pozostałych zmianach.","why":"Materiał poszerza kontekst, nie usuwa roli lokalnych źródeł i nie rozstrzyga wielkości wpływu."},{"id":"c","text":"Materiał uzasadnia ocenę udziału napływu w problemie na podstawie pozostałych stężeń po inwestycjach, z uwzględnieniem nowych urządzeń.","why":"Obecność napływu nie dowodzi, że jest jedynym ani dominującym źródłem."}],"correct":"b","basis":"D2 wskazuje kilka źródeł i cieplejszy sezon bez oszacowania oddzielnych efektów.","pitfall":"Przypisanie zmiany jednemu czynnikowi.","remedy":"Uwzględnij kontekst i nazwij potrzebne porównanie.","pages":"12, 18–20, 25, 29","hint":"Jakie inne czynniki zmieniły się równocześnie?","originalPages":"12, 15–16, 19"}],"example":"W badanym sezonie 600 z 2000 mieszkańców mieszka na obszarach ze stężeniem przypisanym przez model powyżej T. To przybliżenie narażenia. W przygotowaniu działań gminy trzeba rozróżnić źródła lokalne i napływ oraz osobno sprawdzić bariery inwestycji. Nie znamy dokładnego udziału programu w zmianie stężeń.","nextEvidence":"Oszacowanie udziału źródeł z niepewnością: czy lokalne działania wystarczą, czy potrzebna jest współpraca z innymi obszarami?","standard":{"value":"Ochrona mieszkańców przed zanieczyszczeniem.","reference":"Poziom T jest umowną granicą ćwiczenia, nie aktualną normą prawną ani zaleceniem zdrowotnym.","indicator":"Liczba mieszkańców przypisana przez model do obszarów ponad T."},"critic":"Osoby rezygnujące ze wsparcia mogą wskazać bariery kosztu lub dokumentów; inni mieszkańcy napływ zanieczyszczeń. Nie należy ograniczać rozmów do korzystających z programu."},{"id":"b","title":"Zarząd WFOŚiGW w Warszawie","short":"Fundusz — obsługa płatności","decision":"Jakie problemy obsługi uwzględnić w organizacji pracy zespołu rozpatrującego płatności?","powers":"Organizuje pracę funduszu i przygotowuje usprawnienia w granicach zasad programu.","limits":"Nie może dowolnie pominąć wymaganej kontroli; zmiana części zasad wymaga uzgodnień.","mandate":"Beneficjenci długo czekają na płatność. Podejrzewamy, że wielokrotne uzupełnienia dokumentów wydłużają sprawy. Proszę sprawdzić ten problem przed reorganizacją obsługi.","talk":[{"question":"Co ma umożliwić ta analiza?","answer":"Potrzebujemy zmniejszyć czas i uciążliwość obsługi przy zachowaniu poprawności rozliczenia. To wąskie zlecenie o obsłudze, nie nowa diagnoza całego zanieczyszczenia powietrza."},{"question":"Co może Pan/Pani zmienić i od kogo zależy?","answer":"Możemy zmieniać organizację pracy, sposób informowania i jakość wezwań w zakresie dopuszczonym zasadami. Nie zamawiamy projektu usunięcia wszystkich wymagań dokumentacyjnych."},{"question":"Skąd pochodzi diagnoza i co pozostaje niepewne?","answer":"Sygnałem są skargi i wielokrotne kontakty. Jako roboczy standard ćwiczenia przyjmujemy 30 dni od wpływu sprawy. Nie jest to termin prawny. Chcemy sprawdzić, co zajmuje czas i które bariery są możliwe do ograniczenia."}],"seed":"Sygnał: długie oczekiwanie i powtarzane uzupełnienia. Badamy jeden zespół oraz sprawy z ostatniego kwartału. Standard 30 dni jest umowny, a nie prawny.","focus":"Czas i uciążliwość obsługi płatności przy zachowaniu poprawności kontroli.","priority":["D3","D4"],"uses":["Wyjaśnia ogólny cel programu; nie mierzy obsługi płatności.","Ważne dla oceny środowiskowej, lecz nie rozstrzyga organizacji pracy zespołu.","Precyzuje czas i etapy procesu, z ograniczeniem do spraw zakończonych.","Sprawdza, jak komunikacja i wykonawcy mogą wydłużać konkretne sprawy.","Pozwala odróżnić możliwe usprawnienie od zmiany zasad wymagającej uzgodnień.","Może dostarczyć przykładu organizacji pracy w dalszych pracach; nie będzie dostępny przed briefem."],"questions":[{"prompt":"Jak ująć problem tego klienta zgodnie ze zleceniem?","options":[{"id":"a","text":"Nadmierne narażenie mieszkańców na PM2,5, z określeniem grupy, sezonu i udziału lokalnego ogrzewania w emisjach.","why":"To ogólna racja programu. Zastąpiłaby konkretną diagnozę organizacyjną innym zadaniem."},{"id":"b","text":"Nadmierna liczba wymaganych dokumentów, z określeniem formularzy do usunięcia i kosztu uproszczenia procedury płatności.","why":"Zakładasz, że wymagań jest za dużo i że ich usunięcie jest właściwym kierunkiem."},{"id":"c","text":"Nadmierny czas i uciążliwość obsługi płatności, z określeniem grup spraw, standardu i etapów wymagających rozpoznania.","why":"Zachowujesz uzasadniony wąski zakres, oddzielając stan od hipotezy o uzupełnieniach."}],"correct":"c","basis":"Rozmowa wprost określa decyzję organizacyjną i potrzebę zachowania poprawności kontroli.","pitfall":"Uznanie szerokiego problemu społecznego za jedyną poprawną definicję.","remedy":"Dopasuj definicję do decyzji i publicznego znaczenia jakości obsługi.","pages":"8–12, 17–19","hint":"Co klient rzeczywiście przygotowuje po otrzymaniu briefu?","originalPages":"1, 4, 6–7, 14"},{"prompt":"Jak wykorzystać D3 i D4 w rewizji diagnozy?","options":[{"id":"a","text":"Podtrzymać problem czasu obsługi i porównać znaczenie uzupełnień z innymi etapami, sprawdzając czytelność wezwań oraz nadal otwarte sprawy.","why":"Hipoteza klienta ma częściowe wsparcie. Można ją doprecyzować bez obowiązkowego odrzucania i bez przerzucania winy."},{"id":"b","text":"Podtrzymać problem czasu obsługi i oszacować udział beneficjentów w zwłoce, przypisując czas uzupełnień trudnościom po ich stronie.","why":"Nie zbadano konieczności i jasności wszystkich wezwań ani wszystkich etapów. D4 wskazuje również problem komunikacji."},{"id":"c","text":"Podtrzymać problem czasu obsługi i ustalić skalę niejasnych wezwań, przenosząc proporcję ośmiu rozmówców na całą populację spraw.","why":"Próba celowa ujawnia barierę, ale nie uzasadnia przeniesienia proporcji ośmiu z dwunastu na wszystkie sprawy."}],"correct":"a","basis":"D3 wskazuje oczekiwanie w 40 z 60 długich spraw; D4 ujawnia konkretne trudności komunikacyjne.","pitfall":"Odrzucenie klienta dla samej niezależności albo przypisanie winy bez dowodu.","remedy":"Podtrzymaj to, co ma wsparcie, i ujawnij zakres niepewności.","pages":"12, 18–20, 25, 29","hint":"Czy dowody wymagają zmiany całego problemu, czy doprecyzowania przyczyny?","originalPages":"12–16, 21"}],"example":"W badanych zakończonych sprawach 60 ze 100 przekraczało umowne 30 dni. Podtrzymujemy problem czasu i uciążliwości obsługi; oczekiwanie na uzupełnienia oraz jakość wezwań są ważnymi kierunkami dalszego rozpoznania.","nextEvidence":"Przebieg spraw nadal otwartych i ocena wezwań: czy zmiana komunikacji usunie znaczną część zwłoki bez osłabienia kontroli?","standard":{"value":"Terminowa i rzetelna obsługa płatności.","reference":"30 dni to próg przyjęty w scenariuszu, nie ustawowy termin. Szybkość nie usprawiedliwia pomijania wymaganej kontroli.","indicator":"Odsetek spraw ponad 30 dni oraz czas poszczególnych etapów."},"critic":"Beneficjenci mogą kwestionować jasność wezwań, a personel konieczność kontroli. Do sprawdzenia są też doświadczenia osób z nadal otwartymi sprawami."}]},{"id":"BK2","name":"Bezpieczny Kredyt 2%","short":"BK2%","context":"Analizujemy doświadczenia historycznego instrumentu. Scenariusz nie zakłada otwartego naboru. Wspólna dokumentacja dotyczy umownego roku działania i miasta X: zawiera dane o odbiorcach dopłat oraz gospodarstwach pozostających poza kredytem.","background":"Potrzeby mieszkaniowe można ujmować przez koszty, jakość i dostępność mieszkania. Dopłata do kredytu obejmuje określoną grupę. Jej ocena może służyć decyzji krajowej, a rozpoznanie pominiętych potrzeb — decyzji lokalnej.","sources":[["MRiT — opis instrumentu z 2023 r.","https://www.gov.pl/web/rozwoj-technologia/bezpieczny-kredyt-2--zaczynamy"],["Rzecznik Finansowy — charakterystyka BK2","https://rf.gov.pl/edukacja/baza-wiedzy/najczestsze-pytania-i-odpowiedzi-faq/bezpieczny-kredyt-2/"]],"cards":[{"id":"D1","title":"Potrzeby w całej badanej grupie","scope":"Losowa próba 200 gospodarstw domowych w mieście X, w których osoba prowadząca gospodarstwo ma 18–35 lat. Badanie z jednego umownego miesiąca, niezależnie od korzystania z dopłat.","result":"70 ze 200 gospodarstw wydaje na mieszkanie ponad 40% miesięcznego dochodu pozostałego po podatkach i obowiązkowych składkach. Koszty obejmują czynsz lub ratę oraz opłaty eksploatacyjne. Próg 40% przyjęto w ćwiczeniu; nie zbadano wszystkich wymiarów jakości mieszkania.","limit":"Wiek i próg służą temu badaniu, nie definiują uprawnienia do BK2. Jedno miasto i miesiąc nie opisują całego kraju ani zmiany po dopłatach.","cost":1,"wait":2,"kind":"Fikcyjny materiał do analizy"},{"id":"D2","title":"Poprawa u odbiorców dopłat","scope":"Po 100 celowo dobranych gospodarstw korzystających i niekorzystających z dopłat, badanych na tych samych rynkach w ciągu 12 miesięcy. Zebrano też dane o sytuacji przed wsparciem.","result":"Poprawę warunków mieszkaniowych deklaruje 80% beneficjentów i 50% pozostałych badanych. Beneficjenci mieli wcześniej wyższe dochody i stabilniejsze zatrudnienie. Porównanie nie uwzględnia tych różnic; nie zbadano też wpływu dopłat na ceny mieszkań.","limit":"To deklaracje dwóch różnych grup, a nie oszacowanie dodatkowej poprawy spowodowanej dopłatą. Sama różnica między 80% a 50% nie dowodzi ani skuteczności, ani nieskuteczności programu.","cost":2,"wait":4,"kind":"Fikcyjny materiał do analizy"},{"id":"D3","title":"Oczekiwanie na lokalne wsparcie","scope":"Rejestr 100 gospodarstw uprawnionych i nadal oczekujących na lokal z pomocy miejskiej, według stanu na jeden umowny dzień. Czas liczony od wpisania na listę oczekujących.","result":"30 ze 100 gospodarstw czeka ponad 12 miesięcy — roboczy próg tego ćwiczenia. Rejestr opisuje wielkość gospodarstwa i potrzeby lokalu, np. dostęp bez schodów dla osoby z ograniczoną mobilnością.","limit":"To obecna lista oczekujących, nie wszystkie osoby bez kredytu ani sprawy już zakończone. Próg nie jest gwarantowanym terminem prawnym; nie obliczono średniego czasu oczekiwania wszystkich gospodarstw.","cost":1,"wait":2,"kind":"Fikcyjny materiał do analizy"},{"id":"D4","title":"Bariery dopasowania lokalu","scope":"Dokumentacja 20 celowo wybranych spośród 30 długich spraw z D3 oraz osiem rozmów z osobami z tych gospodarstw.","result":"W 12 sprawach jako główną barierę zapisano brak lokalu o odpowiedniej wielkości lub dostępności, np. bez schodów. W pięciu był nią niezakończony remont, a w trzech brak aktualnych dokumentów. To podział według jednej głównej bariery w aktach; współwystępowanie innych jest możliwe. Rozmowy wskazują też koszty tymczasowego najmu.","limit":"Wynik dotyczy wybranych długich spraw. Nie daje udziałów przyczyn w całym rejestrze ani oceny krajowego programu.","cost":2,"wait":4,"kind":"Fikcyjny materiał do analizy"},{"id":"D5","title":"Możliwości instytucji","scope":"Uproszczony podział decyzji krajowych i lokalnych w symulacji.","result":"Resort przygotowuje propozycje instrumentów krajowych, wymagające decyzji rządu, parlamentu i finansowania. Prezydent miasta przygotowuje działania lokalne i gospodarowanie zasobem w granicach reguł przyjętych przez właściwe organy. Nie zmienia krajowych dopłat.","limit":"W rzeczywistej analizie sprawdź datę, podstawy prawne i budżet. Nie zakładamy aktualnego naboru BK2 ani bieżącego projektu nowego instrumentu.","cost":1,"wait":1,"kind":"Warunki przyjęte w zleceniu","purpose":"Konkretna sytuacja działania: możliwości i zależności klienta (lektura PL, s. 25–26)."},{"id":"D6","title":"Doświadczenie miasta Y","scope":"Raport o dopłatach i miejskim zasobie w innym rynku mieszkaniowym.","result":"W mieście Y po zmianach wsparcia wzrosła liczba mieszkań dostępnych dla badanych gospodarstw, ale równocześnie przybyło mieszkań budowanych prywatnie. Raport wskazuje, że w X budowa nowych mieszkań reaguje wolniej na wzrost zainteresowania zakupem. Nie oddzielono skutków poszczególnych zmian.","limit":"Nie przenoś wyniku wyłącznie na podstawie podobnej liczby mieszkańców. Raport dotrze po terminie briefu.","cost":2,"wait":8,"kind":"Fikcyjny materiał do analizy","purpose":"Doświadczenie z innego miejsca: sprawdź warunki, zamiast kopiować wynik (lektura PL, s. 25–26, 29–30)."}],"clients":[{"id":"a","title":"Minister Rozwoju i Technologii — historyczny scenariusz ewaluacyjny","short":"Minister — doświadczenia dopłat","decision":"Jaką ocenę doświadczeń dopłat przyjąć przed pracami nad przyszłym instrumentem?","powers":"Zleca analizę i przygotowuje propozycje rozwiązań krajowych.","limits":"Nowy instrument wymaga właściwych decyzji politycznych i finansowych; analiza nie zakłada jego przyjęcia.","mandate":"Większość beneficjentów mówi o poprawie. Nie wiemy jednak, ile tej poprawy wynika z dopłat. Potrzebuję oceny tego, co można już stwierdzić przed pracami nad przyszłym wsparciem.","talk":[{"question":"Co ma umożliwić ta analiza?","answer":"To zlecenie ewaluacyjne. Potrzebuję rozpoznać niepewność o dodatkowych skutkach dopłat i skutkach poza grupą odbiorców. Nie oczekuję uzasadnienia odtworzenia programu."},{"question":"Co może Pan/Pani zmienić i od kogo zależy?","answer":"Możemy przygotować propozycje na poziomie krajowym, lecz nie zastępuje to decyzji rządu, parlamentu ani ustalenia środków. Analizujemy historyczne doświadczenia."},{"question":"Skąd pochodzi diagnoza i co pozostaje niepewne?","answer":"Deklaracje beneficjentów są punktem wyjścia. Nie wiemy, co stałoby się bez dopłaty ani jak zmieniły się warunki niebeneficjentów. Wynik z jednego miasta może nie przenosić się na kraj."}],"seed":"Sygnał: deklarowana poprawa wśród odbiorców. Problem zlecenia to niepewność o dodatkowym skutku dopłat. Zakres początkowy: doświadczenia wybranego instrumentu i dostępne badanie miasta X.","focus":"Niepewność ewaluacyjna o skutkach dopłat istotna dla przyszłego projektowania wsparcia.","priority":["D2","D1"],"uses":["Pokazuje potrzeby poza odbiorcami; pomaga ustalić zakres oceny i pominięte grupy.","Bezpośrednio sprawdza, co można powiedzieć o dodatkowej poprawie dzięki dopłatom.","Może ujawnić potrzeby pomijane przez kredyt, lecz nie jest oszacowaniem jego wpływu.","Pomaga zrozumieć lokalne bariery; nie zastępuje porównania skutków dopłat.","Ustala zakres możliwych przyszłych decyzji i potrzebne uzgodnienia.","Przydatne doświadczenie z innego rynku w dalszej pracy; niedostępna przed briefem."],"questions":[{"prompt":"Co jest problemem analitycznym w tym zleceniu?","options":[{"id":"a","text":"Nadmierny czas oczekiwania na lokal miejski, który wymaga rozpoznania struktury dostępnego zasobu i zasad przydzielania mieszkań.","why":"To problem klienta lokalnego. Nie odpowiada bezpośrednio zamówionej ocenie instrumentu krajowego."},{"id":"b","text":"Nadmierne koszty rat kredytowych, które wymagają zwiększenia dopłat dla gospodarstw zamierzających kupić swoje pierwsze mieszkanie.","why":"Przesądzasz instrument i jego rozszerzenie. Klient zamawia ocenę wiedzy o skutkach."},{"id":"c","text":"Niepewność o dodatkowych skutkach dopłat, która utrudnia wykorzystanie doświadczeń programu przy przygotowaniu przyszłego wsparcia.","why":"Bardach dopuszcza niepewność jako problem ewaluacji służącej przyszłemu działaniu."}],"correct":"c","basis":"Klient wyraźnie pyta, ile poprawy można przypisać dopłatom.","pitfall":"Wymuszanie ogólnej diagnozy społecznej zamiast rozpoznania niepewności ewaluacyjnej.","remedy":"Nazwij, czego nie wiadomo i jakiej przyszłej decyzji to przeszkadza.","pages":"10, 19–20","hint":"Jakiej wiedzy brakuje do wykorzystania doświadczeń programu?","originalPages":"6, 15–16"},{"prompt":"Jak D2 wpływa na definicję problemu klienta?","options":[{"id":"a","text":"Zawęża problem do utrzymania korzyści z dopłat: różnica 80% do 50% jest podstawą wstępnego oszacowania efektu programu.","why":"Samo porównanie dwóch różnych grup nie daje wiarygodnej sytuacji bez programu."},{"id":"b","text":"Zawęża problem do rozdzielenia efektu dopłat od różnic grup: potrzeba porównania uwzględniającego ich sytuację przed programem.","why":"Można podtrzymać zlecenie ewaluacyjne i wskazać konkretną lukę: porównanie uwzględniające dobór do wsparcia."},{"id":"c","text":"Zawęża problem do poprawy doboru adresatów: różnice dochodów przed programem są podstawą wstępnego wyjaśnienia całej przewagi beneficjentów.","why":"Dane wskazują konkurencyjne wyjaśnienie. Nie oszacowano jednak wpływu dochodu ani braku wpływu dopłat."}],"correct":"b","basis":"D2 zawiera różnice sprzed programu oraz brak modelu porównania.","pitfall":"Przejście od różnicy opisowej do pewności przyczynowej.","remedy":"Oddziel ustalenie o grupach od nieustalonego skutku instrumentu.","pages":"10, 19–20, 25, 29","hint":"Czy materiał rozstrzyga, co stałoby się bez dopłat?","originalPages":"6, 19"}],"example":"Niepewność dotyczy dodatkowej poprawy warunków dzięki dopłatom, przy różnicach między beneficjentami a niebeneficjentami. D2 jej nie usuwa. D1 uzasadnia uwzględnienie także potrzeb gospodarstw poza programem.","nextEvidence":"Wiarygodne porównanie przebiegu warunków mieszkaniowych bez dopłaty, z oceną doboru do programu i reakcji rynku.","standard":{"value":"Wiedza wystarczająca do przygotowania przyszłego wsparcia.","reference":"Nie ma obowiązkowego liczbowego progu „dopuszczalnej niepewności”. Trzeba wskazać, jaki brak wiedzy może zmienić przyszłą decyzję.","indicator":"Zakres wiarygodnych ustaleń o dodatkowym skutku dopłat i o tym, czego porównanie nie rozstrzyga."},"critic":"Banki i beneficjenci mogą podkreślać poprawę, a osoby poza kredytem koszty i pominięte potrzeby. Żadna z tych perspektyw sama nie identyfikuje wpływu dopłat."},{"id":"b","title":"Prezydent miasta X","short":"Prezydent — gospodarstwa poza kredytem","decision":"Jakie bariery uwzględnić w przygotowaniu lokalnego planu poprawy dostępu do odpowiedniego lokalu?","powers":"Przygotowuje działania dotyczące miejskiego zasobu i współpracy lokalnej.","limits":"Nie zmienia krajowych dopłat; zasady, budżet i wykonanie wymagają właściwych uchwał i współpracy jednostek.","mandate":"BK2 nie obejmuje wszystkich potrzeb mieszkaniowych: część gospodarstw bez możliwości uzyskania kredytu długo czeka na lokal miejski. Podejrzewam, że brakuje lokali odpowiadających ich potrzebom. Potrzebuję diagnozy do lokalnego planu dla tej grupy.","talk":[{"question":"Co ma umożliwić ta analiza?","answer":"Chodzi o gospodarstwa spełniające przyjęte w scenariuszu warunki pomocy miejskiej. Interesuje nas długość oczekiwania na odpowiedni lokal, a nie zwiększenie liczby kredytów."},{"question":"Co może Pan/Pani zmienić i od kogo zależy?","answer":"Możemy przygotować działania dotyczące remontów i dopasowania zasobu oraz propozycje dla właściwych organów miasta. Nie ustalamy krajowych zasad dopłat ani decyzji kredytowych banków."},{"question":"Skąd pochodzi diagnoza i co pozostaje niepewne?","answer":"Przyjmujemy ponad 12 miesięcy jako roboczy próg wymagający analizy, nie termin prawny. Mamy rejestr i skargi. Brak odpowiednich lokali jest przypuszczeniem, które chcemy porównać z opóźnieniami remontów i dokumentów."}],"seed":"Sygnał: długie oczekiwanie gospodarstw objętych lokalną pomocą. Zakres: rejestr miasta X; próg ćwiczenia: ponad 12 miesięcy. Populacja nie obejmuje wszystkich niebeneficjentów BK2.","focus":"Dostęp do odpowiedniego lokalu w wybranej grupie objętej pomocą miejską.","priority":["D3","D4"],"uses":["Daje szerszy kontekst potrzeb, ale nie zastąpi danych o grupie zlecenia.","Pomaga ocenić granice dopłat jako odpowiedzi na potrzeby; nie mierzy czasu oczekiwania na lokal.","Określa skalę w rejestrze i cechy gospodarstw oczekujących.","Sprawdza dopasowanie zasobu oraz konkurencyjne bariery realizacji.","Rozróżnia lokalne możliwości od krajowych instrumentów.","Może podsunąć lokalne warianty, po ocenie kontekstu i już po bieżącym terminie."],"questions":[{"prompt":"Która definicja najlepiej odpowiada lokalnemu zleceniu?","options":[{"id":"a","text":"Niepewność co do wpływu dopłat na warunki wszystkich beneficjentów utrudnia podjęcie krajowej decyzji o nowym instrumencie.","why":"To właściwe pytanie ewaluacyjne dla pierwszego klienta, lecz inne niż obecne zlecenie."},{"id":"b","text":"Długie oczekiwanie uprawnionych gospodarstw na odpowiedni lokal w mieście X wymaga określenia skali i barier dostępu.","why":"Wskazujesz grupę i trudność, pozostawiając do sprawdzenia, które bariery wydłużają oczekiwanie."},{"id":"c","text":"Niedostateczna liczba lokali o określonej wielkości wymaga przygotowania nowych inwestycji mieszkaniowych dla wszystkich oczekujących.","why":"Zakładasz przyczynę oraz kierunek działania. Część bariery może dotyczyć już istniejącego zasobu."}],"correct":"b","basis":"Rozmowa ogranicza zlecenie do lokalnej grupy uprawnionych i przygotowania planu miasta.","pitfall":"Kopiowanie definicji klienta krajowego albo przesądzenie przyczyny.","remedy":"Zdefiniuj właściwą populację, standard i zakres decyzji.","pages":"8–12, 17–19","hint":"Czy zadanie dotyczy odbiorców kredytu, czy grupy oczekującej na lokal?","originalPages":"4–9, 12"},{"prompt":"Co można powiedzieć na podstawie D3 i D4?","options":[{"id":"a","text":"Rejestr i rozmowy pozwalają oszacować brak dopasowania lokali na 60% długiego oczekiwania, a następnie sprawdzić pozostałe bariery w mieście.","why":"20 spraw wybrano celowo. Nie znamy populacyjnego udziału przyczyn."},{"id":"b","text":"Rejestr i rozmowy pozwalają oszacować długie oczekiwanie na 30% gospodarstw bez kredytu, a następnie zbadać bariery dostępu do lokali.","why":"Rejestr uprawnionych nie jest populacją wszystkich gospodarstw bez kredytu."},{"id":"c","text":"Rejestr opisuje 30 ze 100 uprawnionych gospodarstw; rozmowy wskazują możliwe bariery, których częstość w całej grupie wymaga sprawdzenia.","why":"Zachowujesz zakres rejestru i ograniczenie celowo dobranych spraw, a diagnozę klienta możesz częściowo podtrzymać."}],"correct":"c","basis":"D3 opisuje cały wskazany rejestr; D4 opisuje 20 wybranych długich spraw.","pitfall":"Pomylenie populacji problemu z dostępnym rejestrem lub próbą.","remedy":"Podaj właściwy mianownik i zakres każdej informacji.","pages":"12, 18–20, 25, 29","hint":"Kogo dokładnie obejmuje każda liczba?","originalPages":"6–7, 15, 19"}],"example":"W rejestrze miasta X 30 ze 100 uprawnionych gospodarstw czeka ponad umowne 12 miesięcy. Wybrane sprawy wskazują bariery dopasowania lokali, remontów i dokumentów; nie znamy ich udziałów w całym rejestrze.","nextEvidence":"Zestawienie potrzeb całego rejestru ze stanem i terminami dostępności lokali: które bariery powinien objąć plan miasta?","standard":{"value":"Dostęp uprawnionych gospodarstw do odpowiedniego lokalu.","reference":"Ponad 12 miesięcy to umowny próg wymagający uwagi w tej grze, nie termin prawny.","indicator":"Liczba i odsetek gospodarstw z tego rejestru oczekujących ponad 12 miesięcy."},"critic":"Oczekujący mogą wskazać niedopasowanie lokali, a realizatorzy remonty i dokumenty. Rejestr nie ujmuje wszystkich potrzeb mieszkaniowych miasta."}]},{"id":"SCT","name":"Strefa Czystego Transportu w Warszawie","short":"SCT Warszawa","context":"Dwa fikcyjne zlecenia dotyczą tej samej strefy: narażenia mieszkańców oraz obsługi osób ubiegających się o potwierdzenie wyłączenia. Nie uczymy aktualnych uprawnień do wjazdu. Okres i progi są umowne.","background":"Ochrona przed zanieczyszczeniem jest uzasadnieniem SCT. Dostępna i rzetelna obsługa jej reguł również ma publiczne znaczenie. Problem organizacyjny nie musi być przepisany na ogólny problem powietrza.","sources":[["ZDM — rola w obsłudze SCT","https://zdm.waw.pl/sprawy/strefa-czystego-transportu/"],["Warszawa — informacje o SCT","https://warszawa19115.pl/-/strefa-czystego-transportu-sct"]],"cards":[{"id":"D1","title":"Rozkład narażenia","scope":"Pomiary i model średnich stężeń NO₂ w jednym umownym kwartale, połączone z mapą miejsc zamieszkania 1200 osób na badanym zespole ulic.","result":"400 z 1200 osób mieszka przy ulicach, którym model przypisał stężenie powyżej T — umownego poziomu porównania dla tego kwartału. Takie wartości występują też na dwóch ulicach poza strefą. To przybliżenie narażenia według adresu, nie pomiar osobistego kontaktu ludzi z NO₂.","limit":"Nie podano niepewności modelu; badanie nie obejmuje całej Warszawy. Położenie ulicy poza strefą nie przesądza przyczyny wysokiego stężenia ani zasadności poszerzenia strefy.","cost":1,"wait":2,"kind":"Fikcyjny materiał do analizy"},{"id":"D2","title":"Ruch i inne wyjaśnienia","scope":"Ruch, pogoda, zabudowa i średnie stężenia na ulicach w strefie oraz wybranych ulicach poza nią, porównane w dwóch umownych okresach przed zmianą zasad i po niej.","result":"Stężenie NO₂ spadło w obu grupach ulic. Zmieniały się też pogoda i natężenie ruchu. Na jednej ulicy poza strefą gęsta zabudowa mogła utrudniać rozpraszanie zanieczyszczeń. Nie ustalono, czy ruch przeniósł się między ulicami ani czy grupy miały podobne wcześniejsze trendy.","limit":"Same spadki nie identyfikują wpływu strefy. Potrzebne jest wiarygodne porównanie i sprawdzenie alternatywnych wyjaśnień.","cost":2,"wait":4,"kind":"Fikcyjny materiał do analizy"},{"id":"D3","title":"Czas obsługi wyłączeń","scope":"100 kolejnych spraw zakończonych w umownym miesiącu. Czas w dniach kalendarzowych: od pierwszego złożenia wniosku do przekazania wyniku weryfikacji, wraz z oczekiwaniem na uzupełnienia.","result":"60 ze 100 spraw trwało ponad umowne 10 dni. W 35 z tych 60 spraw ponad połowę czasu zajęło oczekiwanie na uzupełnienie dokumentów. Nie ustalono jasności wezwań ani czasu trwania spraw nadal otwartych.","limit":"10 dni to standard ćwiczenia, nie termin prawny. Pominięcie otwartych spraw może zaniżać obraz opóźnień. Dane nie ustalają, czy przyczyną jest niedobór personelu lub zaniedbanie wnioskodawcy.","cost":1,"wait":2,"kind":"Fikcyjny materiał do analizy"},{"id":"D4","title":"Doświadczenie obsługi","scope":"16 celowo dobranych rozmów z osobami podejmującymi próbę złożenia wniosku w tym samym okresie, także z osobami, które ją przerwały. Przegląd dokumentacji dostępnych spraw.","result":"Osiem osób zgłaszało trudność z dokumentami elektronicznymi, pięć z rozumieniem wezwania, trzy z uzyskaniem dokumentu od innej instytucji. Liczby dotyczą wskazań barier; jedna osoba mogła wskazać kilka. W części akt potwierdzono powtarzany kontakt bez wyjaśnienia wymagań.","limit":"Rozmowy rozpoznają bariery, nie ich częstość w całej populacji. Nie ustalają uprawnienia każdej osoby ani skutku reorganizacji.","cost":2,"wait":4,"kind":"Fikcyjny materiał do analizy"},{"id":"D5","title":"Zakres działania klientów","scope":"Podział zadań i ograniczenia w tej symulacji.","result":"Prezydent przygotowuje kierunek dalszych prac nad strefą; zmiana uchwały wymaga właściwej procedury i decyzji rady. ZDM obsługuje wnioski o wyłączenia. Dyrektor może przygotować usprawnienia organizacji, ale nie samodzielnie zmienić warunki wjazdu.","limit":"Przed rzeczywistą rekomendacją trzeba sprawdzić obowiązujące przepisy, upoważnienia i zasoby. Tutaj korzystamy z podanych warunków zadania.","cost":1,"wait":1,"kind":"Warunki przyjęte w zleceniu","purpose":"Konkretna sytuacja działania: możliwości i zależności klienta (lektura PL, s. 25–26)."},{"id":"D6","title":"Doświadczenie innego miasta","scope":"Raport o strefie i systemie obsługi w mieście Y.","result":"W Y spadło NO₂ i skrócono obsługę. Miasto miało inne zasady wyłączeń, większą dostępność komunikacji zbiorowej i inny system informatyczny. Raport łączy kilka zmian.","limit":"Podobna nazwa strefy nie wystarcza do przeniesienia wyników. Dokument dotrze po terminie briefu.","cost":2,"wait":8,"kind":"Fikcyjny materiał do analizy","purpose":"Doświadczenie z innego miejsca: sprawdź warunki, zamiast kopiować wynik (lektura PL, s. 25–26, 29–30)."}],"clients":[{"id":"a","title":"Prezydent m.st. Warszawy","short":"Prezydent — kierunek prac nad SCT","decision":"Czy i z jaką diagnozą skierować propozycję zmian SCT do dalszych prac?","powers":"Przygotowuje propozycje i organizuje prace po stronie władz wykonawczych miasta.","limits":"Zmiany uchwały wymagają właściwej procedury i decyzji rady; nie każdą emisję można ograniczyć regułami wjazdu.","mandate":"Mieszkańcy części ulic nadal skarżą się na spaliny. Być może strefa jest zbyt mała. Potrzebuję diagnozy narażenia przed dalszymi pracami nad jej zmianą.","talk":[{"question":"Co ma umożliwić ta analiza?","answer":"Chcę ustalić, kogo i gdzie dotyczy narażenie oraz co już wiemy o jego źródłach. Nie zamawiam jeszcze wyboru nowych granic."},{"question":"Co może Pan/Pani zmienić i od kogo zależy?","answer":"Możemy skierować propozycje do dalszych prac. Zmiana reguł wymaga odpowiedniej procedury i współpracy organów. Musimy też uwzględnić podróże i skutki poza strefą."},{"question":"Skąd pochodzi diagnoza i co pozostaje niepewne?","answer":"Podstawą obaw są skargi i cząstkowe pomiary. Mały obszar strefy jest moim wyjaśnieniem, a nie ustalonym wynikiem analizy. W grze posługujemy się umownym poziomem T."}],"seed":"Sygnał: narażenie przy wybranych ulicach w badanym kwartale. Poziom T służy porównaniu w ćwiczeniu; wielkość i zasięg wymagają sprawdzenia.","focus":"Narażenie mieszkańców i jego źródła istotne dla dalszych prac nad SCT.","priority":["D1","D2"],"uses":["Precyzuje skalę i przestrzenny zakres narażenia.","Sprawdza hipotezy o źródłach i ograniczenia oceny wpływu.","Ważne dla wdrożenia i obciążeń mieszkańców, ale nie jest pomiarem narażenia.","Ujawnia skutki procedur dla ludzi; może uzupełnić ocenę zmian, lecz nie wyjaśnia stężeń.","Pozwala odnieść zakres diagnozy do możliwości i zależności klienta.","Może podsunąć warianty; nie mieści się w terminie i wymaga kontroli kontekstu."],"questions":[{"prompt":"Która robocza definicja odpowiada temu zleceniu?","options":[{"id":"a","text":"Nadmierne narażenie mieszkańców wybranych ulic na NO₂, z ustaleniem obszaru, okresu, skali i podstawy oceny.","why":"Odpowiada zamówionej diagnozie i pozostawia otwarte źródła oraz możliwe działania."},{"id":"b","text":"Niedostateczne pokrycie ulic regułami SCT, z ustaleniem obszaru wymagającego objęcia nowymi granicami strefy.","why":"Definiujesz brak większej strefy jako problem i przyjmujesz hipotezę klienta."},{"id":"c","text":"Nadmierne oczekiwanie na potwierdzenie wyłączenia, z ustaleniem grup spraw, czasu obsługi i barier procedury.","why":"To uzasadniony problem drugiego klienta. Nie zastępuje obecnego zlecenia o narażeniu."}],"correct":"a","basis":"Rozmowa oddziela narażenie od hipotezy o wielkości strefy.","pitfall":"Wpisanie rozwiązania do definicji.","remedy":"Nazwij niepożądany stan, a parametr instrumentu sprawdzaj jako możliwy czynnik.","pages":"7–12, 17–19","hint":"Który stan jest celem analizy, a który opisuje projekt instrumentu?","originalPages":"4–9, 12"},{"prompt":"Jakie znaczenie mają dla klienta D1 i D2?","options":[{"id":"a","text":"D1 i D2 uzasadniają przygotowanie poszerzenia granic jako kierunku ograniczenia narażenia, z dalszym badaniem jego przewidywanych kosztów.","why":"Położenie problemu nie określa automatycznie przyczyny i właściwego instrumentu."},{"id":"b","text":"D1 i D2 uzasadniają przygotowanie zmiany instrumentu jako kierunku ograniczenia narażenia, skoro spadek wystąpił także poza strefą.","why":"Zmiana poza strefą nie dowodzi zerowego wpływu. Trzeba oddzielić wspólne trendy i inne czynniki."},{"id":"c","text":"D1 i D2 uzasadniają objęcie diagnozą ulic poza strefą; wybór granic i oszacowanie wpływu wymagają dalszych porównań.","why":"Doprecyzowujesz zakres problemu, pozostawiając do analizy przyczyny, wpływ i kierunek działania."}],"correct":"c","basis":"D1 opisuje narażenie, D2 wskazuje zmiany kilku czynników i brak sprawdzenia przeniesienia ruchu.","pitfall":"Przedwczesne przejście od obserwacji do rekomendacji.","remedy":"Oddziel zakres problemu, wyjaśnienie i wybór instrumentu.","pages":"12, 18–20, 25, 29","hint":"Czy pomiar poza granicą mówi, co trzeba zmienić w granicy?","originalPages":"12–16, 19"}],"example":"400 z 1200 mieszkańców badanego zespołu ulic mieszka przy ulicach ze stężeniem przypisanym przez model powyżej T. To przybliżenie narażenia, także poza strefą. Przed pracami nad zmianami trzeba sprawdzić źródła i warunki rozpraszania zanieczyszczeń; D1 i D2 nie przesądzają rozszerzenia strefy.","nextEvidence":"Porównanie ruchu, pogody i narażenia, z oceną przeniesienia ruchu: co wyjaśnia pozostałe narażenie i jakich działań warto dalej szukać?","standard":{"value":"Ochrona mieszkańców przed nadmiernym narażeniem.","reference":"Poziom T jest fikcyjnym punktem odniesienia. Granica strefy nie wyznacza granicy dopuszczalnego narażenia.","indicator":"Liczba mieszkańców i obszary przypisane przez model do poziomu ponad T."},"critic":"Mieszkańcy poza strefą mogą wskazać narażenie u siebie, a osoby dojeżdżające koszty dostosowania. Trzeba sprawdzić te argumenty i ich znaczenie dla zakresu decyzji."},{"id":"b","title":"Dyrektor Zarządu Dróg Miejskich w Warszawie","short":"Dyrektor ZDM — obsługa wyłączeń","decision":"Jakie problemy uwzględnić w organizacji obsługi wniosków o potwierdzenie wyłączenia?","powers":"Przygotowuje organizację pracy i komunikację w ramach obsługi prowadzonej przez ZDM.","limits":"Nie zmienia samodzielnie zasad wyłączeń ani granic strefy; część danych pochodzi z innych instytucji.","mandate":"Osoby ubiegające się o wyłączenie zgłaszają długie oczekiwanie. Uważam, że brakuje pracowników. Proszę rozpoznać problem przed zmianą organizacji obsługi.","talk":[{"question":"Co ma umożliwić ta analiza?","answer":"Potrzebuję wiedzieć, gdzie powstaje oczekiwanie i jak obciąża ludzi. Poprawa ma zachować rzetelną weryfikację. Sam wzrost liczby obsłużonych spraw nie wystarczy."},{"question":"Co może Pan/Pani zmienić i od kogo zależy?","answer":"Mogę przygotować zmiany podziału pracy i sposobu informacji w ramach naszych zasobów. Nie mogę przez zmianę obsługi ustanowić nowych uprawnień ani zmienić granic strefy."},{"question":"Skąd pochodzi diagnoza i co pozostaje niepewne?","answer":"Sygnałem są skargi, niepełny rejestr i oczekiwanie w punkcie. Przyjmujemy ponad 10 dni jako umowny próg do analizy, nie termin prawny. Nie sprawdziliśmy udziału personelu, dokumentów i komunikacji."}],"seed":"Sygnał: czas i trudności uzyskania potwierdzenia wyłączenia w jednym miesiącu. Próg 10 dni jest umowny. Skala i etapy procesu wymagają sprawdzenia w D3.","focus":"Czas i dostępność rzetelnej obsługi, z poszanowaniem reguł wyłączeń.","priority":["D3","D4"],"uses":["Daje środowiskowy kontekst strefy; nie mierzy jakości obsługi.","Pomaga ocenić środowiskowy skutek SCT, lecz nie sprawdza kolejki spraw.","Bezpośrednio określa czas i etapy obsługi.","Pozwala sprawdzić bariery również poza rejestrem zakończonych spraw.","Oddziela usprawnienie obsługi od zmiany uprawnień i granic.","Może służyć późniejszemu porównaniu rozwiązań, po ocenie odmiennych reguł."],"questions":[{"prompt":"Który problem należy roboczo zdefiniować dla dyrektora?","options":[{"id":"a","text":"Nadmierne narażenie mieszkańców na spaliny, z uwzględnieniem ulic poza strefą i możliwego udziału starszych pojazdów.","why":"To ważny problem środowiskowy, lecz nie odpowiada konkretnemu zleceniu organizacyjnemu."},{"id":"b","text":"Nadmierny czas i trudności uzyskania potwierdzenia wyłączenia, z uwzględnieniem grup spraw i standardu rzetelnej obsługi.","why":"Zachowujesz właściwy zakres i publiczne znaczenie obsługi, nie przesądzając przyczyny."},{"id":"c","text":"Niedostateczna liczba pracowników obsługujących wyłączenia, z uwzględnieniem potrzeb nowych etatów i dostępnego budżetu jednostki.","why":"Brak pracowników jest hipotezą. Bez sprawdzenia nie należy utożsamiać go z problemem i rozwiązaniem."}],"correct":"b","basis":"Klient przygotowuje organizację obsługi, a brak personelu podaje jako wyjaśnienie.","pitfall":"Zastąpienie właściwego wąskiego zlecenia ogólnym celem programu.","remedy":"Zdefiniuj stan w zakresie decyzji klienta; przyczyny pozostaw do sprawdzenia.","pages":"8–12, 17–19","hint":"Którą sytuację może poprawić przygotowywana organizacja obsługi?","originalPages":"1, 4–9, 14"},{"prompt":"Co wynika dla tej diagnozy z D3 i D4?","options":[{"id":"a","text":"Warto zbadać dokumenty i komunikację obok obciążenia personelu, rozdzielając czas oczekiwania od czasu pracy nad sprawą.","why":"Nowy materiał poszerza wyjaśnienia, a wąski problem obsługi pozostaje zasadny."},{"id":"b","text":"Warto zbadać potrzebę etatów dla 60 długich spraw, przeliczając przekroczenie standardu na wielkość niedoboru pracy personelu.","why":"Odsetek spraw powyżej progu nie jest oszacowaniem niedoboru personelu ani skutku zwiększenia zatrudnienia."},{"id":"c","text":"Warto zbadać trudności w zakończonych sprawach, wykorzystując ich rozkład czasu jako przybliżenie wszystkich spraw wpływających do zespołu.","why":"Pominięcie osób rezygnujących i spraw otwartych może zniekształcić diagnozę dostępności."}],"correct":"a","basis":"D3 wskazuje oczekiwanie na uzupełnienia, a D4 ujawnia bariery także u osób przerywających procedurę.","pitfall":"Dopasowanie dowodów do pierwszej hipotezy klienta.","remedy":"Rozważ konkurencyjne wyjaśnienia i pominięte grupy.","pages":"12, 18–20, 25, 29","hint":"Kto i jaki etap może nie być widoczny w rejestrze zakończonych spraw?","originalPages":"12–16, 21"}],"example":"60 ze 100 zakończonych spraw przekraczało umowne 10 dni. Podtrzymujemy problem czasu i dostępności obsługi, ale oprócz personelu badamy komunikację i dokumenty. Sprawy otwarte oraz rezygnacje wymagają uzupełnienia.","nextEvidence":"Chronologia także spraw otwartych oraz obciążenie pracowników: czy reorganizacja powinna dotyczyć obsady, komunikacji, czy obu?","standard":{"value":"Terminowa, dostępna i rzetelna obsługa wyłączeń.","reference":"10 dni to standard ćwiczenia, nie przepis. Nie rozstrzyga on uprawnienia konkretnej osoby do wyłączenia.","indicator":"Odsetek spraw ponad 10 dni i bariery napotykane w kolejnych etapach."},"critic":"Osoby składające wniosek mogą wskazać trudności cyfrowe i dokumenty, a personel obciążenie i wymagania procedury. Warto dotrzeć także do rezygnujących."}]},{"id":"BO","name":"Warszawski budżet obywatelski","short":"BO Warszawa","context":"Jedno zlecenie dotyczy możliwości wpływu mieszkańców, drugie terminowej realizacji wybranych projektów w dzielnicy X. Wszystkie liczby i opisane trudności są fikcyjne; nie opisują faktycznej edycji BO.","background":"Uczestnictwo, uwzględnienie potrzeb i wykonanie wybranych projektów to różne elementy BO. Frekwencja nie mierzy każdego z nich. Wiedza o aktorach z K2 pomaga rozpoznać pozycję obu klientów.","sources":[["Warszawa — zasady i etapy BO","https://warszawa19115.pl/-/bud%C5%BCet-obywatelski-na-2026-r."],["Warszawa — portal BO","https://bo.um.warszawa.pl/"]],"cards":[{"id":"D1","title":"Możliwości wpływu","scope":"Losowa próba 200 uprawnionych mieszkańców dzielnicy X po jednej umownej edycji BO, także osób niegłosujących. W tej samej próbie jest 50 osób z ograniczoną mobilnością.","result":"90 ze 200 badanych deklaruje brak możliwości wpływu na wybór lokalnych wydatków. Wśród 50 osób z ograniczoną mobilnością tak odpowiada 35. Te 35 osób jest częścią ogólnej liczby 90. Punktem odniesienia jest równość możliwości wpływu, nie identyczna frekwencja każdej grupy.","limit":"Deklaracja nie jest pełnym pomiarem rzeczywistego wpływu. Badanie jednej dzielnicy nie opisuje automatycznie miasta.","cost":1,"wait":2,"kind":"Fikcyjny materiał do analizy"},{"id":"D2","title":"Bariery uczestnictwa","scope":"16 celowo dobranych rozmów z osobami niegłosującymi w ostatniej edycji BO oraz dokumentacja wcześniejszych projektów.","result":"Dziesięć osób wskazuje niewiarę w realizację potrzebnych projektów; sześć z tych dziesięciu mówi również o trudnościach dotarcia do informacji i wsparcia. Dokumentacja potwierdza, że dwa wcześniejsze projekty dotyczące dostępności, wybrane w głosowaniu, nie zostały wykonane mimo upływu zaplanowanego terminu.","limit":"Rozmowy nie mierzą częstości barier wśród wszystkich mieszkańców. Niewykonanie dwóch projektów nie dowodzi, że wyjaśnia całe zróżnicowanie udziału w BO.","cost":2,"wait":4,"kind":"Fikcyjny materiał do analizy"},{"id":"D3","title":"Terminy realizacji","scope":"Rejestr 12 projektów jednej umownej edycji, przydzielonych do realizacji dzielnicy X. Stan na dzień kontroli; porównanie z pierwotnie zatwierdzonym harmonogramem.","result":"W pięciu z 12 projektów minął planowany termin zakończenia, a projekt nie był ukończony. W czterech pierwsze odnotowane opóźnienie wystąpił przed podpisaniem umowy wykonawczej, w jednym po podpisaniu. Przebieg tych pięciu spraw rozwija D4.","limit":"Wewnętrzny termin nie jest tutaj terminem ustawowym. Rejestr nie obejmuje wszystkich projektów miasta ani jeszcze wszystkich przyczyn zwłoki.","cost":1,"wait":2,"kind":"Fikcyjny materiał do analizy"},{"id":"D4","title":"Chronologia i perspektywy","scope":"Akta tych samych pięciu opóźnionych projektów z D3 oraz rozmowy z realizatorami i autorami.","result":"W trzech projektach przed umową późno ustalono szczegółowy zakres prac, w czwartym trwało uzgadnianie prawa do wykorzystania nieruchomości. W piątym wykonawca przekroczył termin umowny. Autorzy zgłaszali też brak aktualnych informacji o postępie.","limit":"Chronologia wskazuje miejsca do sprawdzenia. Nie dowodzi jeszcze, że konkretny model koordynacji skróci realizację ani że winna jest jedna strona.","cost":2,"wait":4,"kind":"Fikcyjny materiał do analizy"},{"id":"D5","title":"Zadania i zależności","scope":"Podział przygotowania zasad i realizacji przyjęty w symulacji.","result":"CKS koordynuje działania dotyczące udziału mieszkańców i przygotowuje propozycje; część zmian zasad wymaga decyzji właściwych organów miasta. Dzielnica organizuje realizację przydzielonych jej projektów, zależną m.in. od budżetu, uzgodnień i zamówień.","limit":"Burmistrz nie ustanawia sam reguł całego BO. W realnym projekcie należy sprawdzić właściwość jednostki dla danego projektu.","cost":1,"wait":1,"kind":"Warunki przyjęte w zleceniu","purpose":"Konkretna sytuacja działania: możliwości i zależności klienta (lektura PL, s. 25–26)."},{"id":"D6","title":"Doświadczenie innego miasta","scope":"Raport o nowych zasadach zgłaszania i koordynacji realizacji w mieście Y.","result":"W Y wzrosło uczestnictwo i skrócono realizację. Jednocześnie zwiększono budżet, zmieniono podział obszarów i system monitorowania. Raport nie oddziela wpływu tych działań.","limit":"Może inspirować warianty, ale nie dowodzi efektu w Warszawie. Dotarcie dokumentu zajmie osiem dni.","cost":2,"wait":8,"kind":"Fikcyjny materiał do analizy","purpose":"Doświadczenie z innego miejsca: sprawdź warunki, zamiast kopiować wynik (lektura PL, s. 25–26, 29–30)."}],"clients":[{"id":"a","title":"Dyrektor Centrum Komunikacji Społecznej Urzędu m.st. Warszawy","short":"Dyrektor CKS — możliwości wpływu","decision":"Jakie bariery udziału uwzględnić w propozycjach przygotowania następnej edycji BO?","powers":"Koordynuje prace i przygotowuje propozycje dotyczące udziału mieszkańców.","limits":"Zmiany części zasad wymagają właściwych decyzji miasta; realizacja zależy też od dzielnic i innych jednostek.","mandate":"Niektóre grupy rzadko uczestniczą w BO. Sądzę, że nie interesują się wydatkami miasta. Proszę rozpoznać możliwości wpływu i bariery przed następną edycją.","talk":[{"question":"Co ma umożliwić ta analiza?","answer":"Chodzi o równość możliwości wpływu i uwzględnienie potrzeb, nie sam wzrost liczby głosów. Chcemy wiedzieć, kto pozostaje pomijany."},{"question":"Co może Pan/Pani zmienić i od kogo zależy?","answer":"Przygotowujemy wsparcie i propozycje zmian. Nie podejmujemy samodzielnie każdej decyzji o zasadach ani realizacji projektów. Potrzebujemy współpracy z dzielnicami."},{"question":"Skąd pochodzi diagnoza i co pozostaje niepewne?","answer":"Hipoteza o braku zainteresowania wynika z niskiego udziału. Nie badaliśmy jej wobec czasu, dostępności wsparcia i oczekiwania, że projekt zostanie wykonany. W grze korzystamy z próby jednej dzielnicy."}],"seed":"Sygnał: niski udział wybranych grup. Roboczy standard to równość możliwości wpływu, nie ustalony procent frekwencji. Zakres początkowych danych ogranicza się do dzielnicy X.","focus":"Możliwości wpływu i bariery określonych grup, z ostrożnością wobec uogólnień miejskich.","priority":["D1","D2"],"uses":["Określa różnice między grupami i status wskaźnika wpływu.","Sprawdza hipotezę o braku zainteresowania wobec innych wyjaśnień.","Może wyjaśnić część oczekiwań mieszkańców, lecz nie mierzy całego wpływu.","Pomaga połączyć wiarygodność realizacji z doświadczeniami autorów.","Wyjaśnia możliwości klienta i potrzebę współpracy z realizatorami.","Może być źródłem wariantów później; wymaga kontroli kontekstu i nie mieści się w terminie."],"questions":[{"prompt":"Która robocza definicja odpowiada zleceniu CKS?","options":[{"id":"a","text":"Nadmierne opóźnienia realizacji projektów dzielnicy, z określeniem etapów przygotowania umów i odpowiedzialności wykonawców.","why":"To ważny problem realizacji, ale nie cały zakres zlecenia o możliwościach wpływu."},{"id":"b","text":"Niedostateczna rozpoznawalność kampanii miejskiej, z określeniem kanałów promocji i grup, do których trzeba dotrzeć.","why":"Zakładasz, że komunikacja jest główną barierą i kierunkiem działania."},{"id":"c","text":"Ograniczone możliwości wpływu określonych grup, z określeniem zakresu, standardu równości i barier wymagających sprawdzenia.","why":"Zachowujesz cel zlecenia i nie przypisujesz niskiego udziału jednej niepotwierdzonej przyczynie."}],"correct":"c","basis":"Klient pyta o równość możliwości, a frekwencję i zainteresowanie trzeba rozdzielić.","pitfall":"Zamiana wskaźnika uczestnictwa w diagnozę przyczyny.","remedy":"Nazwij publicznie istotny stan i sprawdź konkurencyjne wyjaśnienia.","pages":"7–12, 17–19","hint":"Czy liczba głosów mówi już, dlaczego ktoś nie uczestniczy?","originalPages":"4–9, 12"},{"prompt":"Jak D1 i D2 powinny wpłynąć na diagnozę?","options":[{"id":"a","text":"Warto rozszerzyć rozpoznanie nierówności możliwości i wiary w realizację, sprawdzając zakres wniosków poza badaną dzielnicą i deklaracjami mieszkańców.","why":"Korzystasz z dowodów, a jednocześnie zachowujesz granice deklaracji, próby i zakresu."},{"id":"b","text":"Warto utrzymać rozpoznanie braku zainteresowania jako głównej bariery, traktując niereprezentatywność rozmów jako powód do zachowania wcześniejszej diagnozy.","why":"Ograniczenia nowego materiału nie dowodzą prawdziwości pierwotnej hipotezy klienta."},{"id":"c","text":"Warto przyjąć niewykonanie projektów jako główną barierę wpływu, traktując udokumentowane przypadki jako mocniejszą podstawę niż deklaracje mieszkańców.","why":"Potwierdzone przypadki nie ustalają udziału tej przyczyny w całym problemie."}],"correct":"a","basis":"D1 zawiera deklaracje w próbie; D2 rozpoznaje możliwe mechanizmy i dwa przypadki niewykonania.","pitfall":"Traktowanie ograniczeń danych jako potwierdzenia ulubionej hipotezy.","remedy":"Wskaż, co materiał wspiera i czego nie rozstrzyga.","pages":"12, 18–20, 25, 29","hint":"Czy ograniczenie próby usuwa wszystko, czego dowiedzieliśmy się o barierach?","originalPages":"12–16, 21"}],"example":"W próbie dzielnicy X brak możliwości wpływu deklaruje 90 z 200 osób, w tym 35 z 50 z ograniczoną mobilnością. D2 uzasadnia badanie barier i wiary w realizację; nie pozwala uznać braku zainteresowania za główną przyczynę.","nextEvidence":"Dane o możliwościach wpływu i potrzebach pomijanych grup w innych dzielnicach: co może uzasadnić propozycje miejskie?","standard":{"value":"Równość możliwości wpływu i uwzględnienie potrzeb.","reference":"To podstawa oceny, nie żądanie identycznej frekwencji wszystkich grup. Trzeba uzasadnić, jakie różnice możliwości uznajemy za niesprawiedliwe.","indicator":"Deklaracje wpływu i bariery udziału to częściowe wskaźniki; nie mierzą całej równości."},"critic":"Nieuczestnicy mogą wskazać brak możliwości lub niewiarę w realizację, a aktywni autorzy brak zainteresowania innych. Nie przypisuj żadnej grupie jednego motywu."},{"id":"b","title":"Burmistrz dzielnicy X m.st. Warszawy","short":"Burmistrz — realizacja projektów","decision":"Jakie problemy organizacji uwzględnić w planie realizacji przydzielonych dzielnicy projektów BO?","powers":"Przygotowuje i koordynuje działania realizacyjne w zakresie zadań dzielnicy.","limits":"Nie ustala sam zasad całego BO; realizacja wymaga właściwych uzgodnień, środków i procedur.","mandate":"Wybrane projekty są oddawane później niż zaplanowano. Sądzę, że zawodzą wykonawcy. Proszę rozpoznać opóźnienia przed ustaleniem organizacji dalszej realizacji.","talk":[{"question":"Co ma umożliwić ta analiza?","answer":"Potrzebuję diagnozy terminów i etapów, żeby mieszkańcy mogli korzystać z wybranych projektów. Nie zamawiam nowej diagnozy frekwencji ani oceny całego BO."},{"question":"Co może Pan/Pani zmienić i od kogo zależy?","answer":"Możemy przygotować zmiany koordynacji, harmonogramowania i informacji w zakresie naszych projektów. Nie rozwiążemy samodzielnie każdego uzgodnienia własności ani nie pominiemy wymaganych procedur."},{"question":"Skąd pochodzi diagnoza i co pozostaje niepewne?","answer":"Mamy harmonogram i skargi autorów. Porównujemy terminy rzeczywiste z wewnętrznym planem, nie z domniemanym terminem ustawowym. Przypisanie zwłoki wykonawcom nie zostało sprawdzone dla wszystkich etapów."}],"seed":"Sygnał: przekroczenia wewnętrznego harmonogramu 12 projektów przydzielonych dzielnicy X. Nie obejmujemy wszystkich projektów miasta. Przyczyny wymagają chronologii.","focus":"Terminowa realizacja wybranych projektów i konkretne miejsca powstawania zwłoki.","priority":["D3","D4"],"uses":["Daje kontekst wpływu mieszkańców, lecz nie ustala etapów opóźnienia projektów.","Może pokazać konsekwencje niewykonania dla zaufania; nie zastąpi dokumentacji realizacji.","Określa zakres i czas opóźnień w projektach tego klienta.","Sprawdza hipotezę o wykonawcach wobec etapów poprzedzających umowę.","Pozwala określić, co wymaga współpracy i pozostaje poza samą koordynacją dzielnicy.","Może pomóc w dalszej analizie organizacyjnej, ale nie jest dostępny przed briefem."],"questions":[{"prompt":"Jak roboczo zdefiniować problem tego klienta?","options":[{"id":"a","text":"Przekroczenia harmonogramów wybranych projektów dzielnicy, z ustaleniem skali, etapów zwłoki i znaczenia dla korzystających mieszkańców.","why":"To właściwy zakres dla organizacji realizacji. Nie przesądza przyczyny ani środka zaradczego."},{"id":"b","text":"Ograniczone możliwości wpływu mieszkańców całego miasta, z ustaleniem reprezentacji potrzeb i zasad udziału w następnej edycji.","why":"To ważne pytanie drugiego poziomu analizy, ale zastąpiłoby konkretne zlecenie innym."},{"id":"c","text":"Niska rzetelność wykonawców projektów dzielnicy, z ustaleniem sposobów zwiększenia kar i kontroli wykonywania zawartych umów.","why":"Przejmujesz diagnozę klienta i kierunek rozwiązania, zanim sprawdzisz chronologię zwłoki."}],"correct":"a","basis":"Zlecenie dotyczy określonych projektów i przygotowania organizacji ich realizacji.","pitfall":"Wpisanie winy i rozwiązania do definicji problemu.","remedy":"Zdefiniuj opóźnienie wobec jawnego harmonogramu i sprawdź etapy.","pages":"8–12, 17–19","hint":"Czy definicja pozostawia możliwość, że zwłoka powstaje przed umową?","originalPages":"4–9, 12"},{"prompt":"Jak D3 i D4 zmieniają ocenę hipotezy klienta?","options":[{"id":"a","text":"D3 i D4 kierują uwagę na nadzór nad wykonawcami, ponieważ przygotowanie umów należy traktować jako część problemu wykonawstwa.","why":"Rola wykonawcy w ukończeniu projektu nie dowodzi jego odpowiedzialności za wcześniejszą zwłokę."},{"id":"b","text":"D3 i D4 kierują uwagę na przygotowanie oraz wykonanie, ponieważ opóźnienia zaczynają się na różnych etapach realizacji.","why":"Rozszerzasz wyjaśnienie w obrębie właściwego problemu, uwzględniając także jeden przypadek po podpisaniu umowy."},{"id":"c","text":"D3 i D4 kierują uwagę na przygotowanie przed umową, ponieważ cztery takie przypadki uzasadniają pominięcie późniejszego wykonawstwa.","why":"Jeden przypadek dotyczy przekroczenia terminu przez wykonawcę. Nie należy automatycznie wykluczać tego wyjaśnienia."}],"correct":"b","basis":"D3: cztery opóźnienia przed umową i jedno po; D4: zakres, własność oraz wykonanie.","pitfall":"Zastąpienie badania przebiegu spraw etykietą winnego.","remedy":"Rozdziel etapy i zachowaj różne wyjaśnienia dla różnych spraw.","pages":"12, 18–20, 25, 29","hint":"Czy jedna przyczyna pasuje do wszystkich pięciu projektów?","originalPages":"12–16, 21"}],"example":"Pięć z 12 projektów przekroczyło harmonogram. W czterech zwłoka wystąpiła przed umową, więc analiza organizacji musi objąć przygotowanie zakresu i uzgodnienia, a także wykonanie jednego opóźnionego kontraktu.","nextEvidence":"Chronologia podejmowania uzgodnień i planowania zakresu: które zależności może usprawnić dzielnica, a które wymagają innych jednostek?","standard":{"value":"Możliwość korzystania z wybranych projektów w zaplanowanym terminie.","reference":"Punktem odniesienia jest zatwierdzony wewnętrzny harmonogram, nie domniemany termin ustawowy.","indicator":"Liczba projektów opóźnionych i etap, na którym powstała zwłoka."},"critic":"Wykonawcy mogą wskazać późne ustalenie zakresu, a autorzy brak informacji. Trzeba ustalić kolejność zdarzeń, zamiast wybierać stronę na podstawie samej wypowiedzi."}]}],"terms":[{"id":"problem","name":"Problem i jego wartościująca definicja","en":"Define the problem; make the definition evaluative","pages":"6–10","definition":"Definicja wartościująca (w przekładzie także: ewaluacyjna) wskazuje stan uznawany za niepożądany i ujawnia podstawę tej oceny. „Wartościująca” oznacza tu uzasadnienie, dlaczego stan jest zły; nie oznacza samo w sobie badania skuteczności programu. Te same fakty mogą być oceniane różnie. Określ, kogo i czego dotyczy problem, dlaczego jest ważny publicznie i dla jakiej decyzji go analizujesz. Słowa „za dużo” lub „za mało” często pomagają, ale nie pasują do każdego zadania.","examples":{"GPA":"Zbyt wiele osób bez auta nie może dojechać do podstawowych usług według jawnego standardu dostępności.","CP":"Nadmierne narażenie mieszkańców na PM2,5. Trzeba wskazać grupę, okres oraz podstawę oceny poziomu jako nadmiernego.","BK2":"Zbyt duże obciążenie dochodów kosztami odpowiedniego mieszkania. Własność nie musi być jedynym sposobem zaspokojenia potrzeby.","SCT":"Nadmierne narażenie mieszkańców określonych ulic na NO₂. Granica strefy nie wyznacza automatycznie granicy problemu.","BO":"Zbyt mały wpływ określonych grup na wydatki wobec jawnego standardu równości możliwości uczestnictwa."},"origin":"paraphrase","group":"start","basis":"Parafraza wskazówki lub pojęcia z lektury. Przykład jest autorski.","originalPages":"2–6"},{"id":"rhetoric","name":"Retoryka sporu publicznego — język debaty i skarg","en":"Issue rhetoric","pages":"8–10","definition":"Retoryka sporu publicznego to potoczny język debaty w otoczeniu klienta: skargi, etykiety i oceny. Może zawierać cel, przypuszczenie o przyczynie lub preferowane rozwiązanie. Użyj go do zbudowania roboczej definicji; sprawdź zarówno empiryczne twierdzenia, jak i uzasadnienie oceny. „Retoryka” nie oznacza tu automatycznie kłamstwa.","examples":{"GPA":"Zdanie „autobusy jeżdżą donikąd” wymaga przełożenia na konkretne trudności podróży, grupy i godziny.","CP":"Hasło „program stoi, bo tonie w papierach” łączy ocenę realizacji z hipotezą o barierze administracyjnej.","BK2":"Hasło „młodych nie stać na własne M” wymaga rozdzielenia potrzeb mieszkaniowych, dostępu do własności i grupy adresatów.","SCT":"Hasło „miasto dusi się w spalinach” wymaga ustalenia narażenia, obszaru i udziału różnych źródeł.","BO":"Hasło „budżet przejęli aktywiści” jest punktem wyjścia do badania wpływu i reprezentacji, a nie gotowym ustaleniem."},"origin":"paraphrase","group":"reading","basis":"Parafraza wskazówki lub pojęcia z lektury. Przykład jest autorski.","originalPages":"4–6"},{"id":"scale","name":"Skala problemu i kwantyfikacja","en":"Quantify if possible","pages":"11","definition":"Określ rozmiar nadmiaru lub niedoboru, jeśli to możliwe. Podaj liczbę lub zakres szacunku, grupę i okres. Gdy brakuje liczby, nazwij sposób jej ustalenia. Nie wymyślaj wyniku ani precyzji: „nie wiemy jeszcze, ilu…” jest dopuszczalnym początkiem.","examples":{"GPA":"Odsetek osób bez auta niemogących odbyć potrzebnej podróży i wrócić w określonym czasie i koszcie.","CP":"Liczba mieszkańców narażonych ponad przyjęty poziom w określonym okresie; same odczyty jednej stacji nie ustalają tego automatycznie.","BK2":"Odsetek gospodarstw przekraczających określony próg obciążenia dochodu zdefiniowanymi kosztami mieszkaniowymi.","SCT":"Rozkład stężeń NO₂ i liczba narażonych mieszkańców w badanym obszarze, z okresem i sposobem pomiaru.","BO":"Udział osób deklarujących brak wpływu oraz reprezentacja potrzeb poszczególnych grup w wydatkach; frekwencja opisuje tylko część sytuacji."},"origin":"paraphrase","group":"reading","basis":"Parafraza wskazówki lub pojęcia z lektury. Przykład jest autorski.","originalPages":"6–7"},{"id":"cause","name":"Definicja diagnostyczna i twierdzenie przyczynowe","en":"Diagnose conditions that cause problems","pages":"12, 18–19","definition":"Niekiedy jako problem definiuje się warunek powodujący inne szkody, a nie samą szkodę. Taka definicja diagnostyczna jest dopuszczalna, ale zawiera twierdzenie o przyczynie. Trzeba ocenić, czy związek rzeczywiście występuje i jak jest ważny. Nie wolno uznać go za prawdziwy samym sformułowaniem definicji.","examples":{"GPA":"„Nieznajomość rozkładu powoduje trudności dojazdu” to hipoteza. Trzeba sprawdzić także dopasowanie godzin i możliwość powrotu.","CP":"„Emisje z ogrzewania powodują narażenie” wymaga oceny ich udziału obok innych źródeł i warunków rozprzestrzeniania.","BK2":"„Wysokie raty powodują niezaspokojenie potrzeb” wymaga odróżnienia kosztu finansowania od dochodów, cen i podaży.","SCT":"„Starsze pojazdy odpowiadają za narażenie” wymaga sprawdzenia składu ruchu, emisji i innych czynników.","BO":"„Niewiedza powoduje nieuczestnictwo” trzeba sprawdzić obok braku czasu, barier reguł i przekonania o małym wpływie."},"origin":"paraphrase","group":"reading","basis":"Parafraza wskazówki lub pojęcia z lektury. Przykład jest autorski.","originalPages":"7, 9, 12"},{"id":"context","name":"Kontekst problemu","en":"Context of the problem","pages":"19","definition":"Warunki występowania problemu mogą zmieniać znaczenie przyczyn i skuteczność działań. Definicja powinna uwzględniać te różnice, jeśli są istotne.","examples":{"GPA":"Godziny pracy zmianowej, odległość przystanku i dostępność usług zmieniają charakter trudności dojazdu.","CP":"Typ zabudowy, sposób ogrzewania i lokalne warunki rozprzestrzeniania zanieczyszczeń różnicują sytuację mieszkańców.","BK2":"Warunki rynku mieszkaniowego i możliwości najmu różnią się między lokalizacjami i grupami dochodowymi.","SCT":"Natężenie ruchu, zabudowa ulic i alternatywy podróży mogą różnicować problem oraz skutki ograniczeń wjazdu.","BO":"Zasoby organizacyjne, lokalizacja i bariery udziału różnicują możliwości oddziaływania mieszkańców na wydatki."},"origin":"paraphrase","group":"reading","basis":"Parafraza wskazówki lub pojęcia z lektury. Przykład jest autorski.","originalPages":"12"},{"id":"data","name":"Dane","en":"Data","pages":"25","definition":"Fakty o świecie lub ich reprezentacje: liczby, zapisy spraw, obserwacje i wypowiedzi. Nie wszystkie dane są trafne lub wystarczające dla zadania. Trzeba sprawdzić, czego rzeczywiście dotyczą i jak powstały.","examples":{"GPA":"Godziny odjazdów, ceny biletów i zapis wypowiedzi mieszkańca o potrzebnej godzinie powrotu.","CP":"Odczyt stężenia, data zakończenia inwestycji i wypowiedź osoby, która nie wymieniła ogrzewania.","BK2":"Dochód gospodarstwa, wysokość raty, czynsz i opis dotychczasowych warunków mieszkaniowych.","SCT":"Odczyty NO₂, liczba pojazdów, parametry pogody i wypowiedź mieszkańca ulicy.","BO":"Liczba głosów, lokalizacja projektu i wypowiedź osoby, która nie uczestniczyła w głosowaniu."},"origin":"paraphrase","group":"start","basis":"Parafraza wskazówki lub pojęcia z lektury. Przykład jest autorski.","originalPages":"15"},{"id":"information","name":"Informacje","en":"Information","pages":"25","definition":"Dane, którym nadano znaczenie przez uporządkowanie, zestawienie lub podział na kategorie. Przykładowo zestawienie czasu obsługi według etapów pozwala zobaczyć, gdzie trwa ona długo. To, czy taka informacja jest dowodem, zależy od pytania, na które ma odpowiadać.","examples":{"GPA":"Zestawienie godzin powrotu z pracy z ostatnim kursem ujawnia, gdzie oferta nie odpowiada potrzebie.","CP":"Zestawienie stężeń według sezonów i obszarów wskazuje różnice narażenia wymagające wyjaśnienia.","BK2":"Porównanie obciążenia kosztami mieszkania w grupach dochodowych pokazuje rozkład trudności.","SCT":"Zestawienie zmian NO₂ wewnątrz i poza strefą pokazuje podobieństwa i różnice przebiegu zmian.","BO":"Zestawienie zgłoszeń i wybranych projektów według obszarów pokazuje przestrzenny rozkład uczestnictwa i wydatków."},"origin":"paraphrase","group":"start","basis":"Parafraza wskazówki lub pojęcia z lektury. Przykład jest autorski.","originalPages":"15"},{"id":"evidence","name":"Dowody","en":"Evidence","pages":"25, 29","definition":"Informacje wpływające na przekonania ważnych odbiorców, w tym analityka, o problemie i możliwościach jego ograniczenia. Mogą wzmocnić przekonanie, osłabić je lub ujawnić niepewność. Nie oznaczają niepodważalnego rozstrzygnięcia. Ich jakość i znaczenie dla pytania nadal wymagają oceny.","examples":{"GPA":"Znajomość linii przy braku kursu powrotnego osłabia hipotezę, że jedyną barierą jest niewiedza.","CP":"Powtarzalny wzorzec stężeń i dane o źródłach mogą zmienić ocenę udziału emisji lokalnych; sam wzorzec nie rozstrzyga przyczyn.","BK2":"Informacja o zakupach planowanych przed dopłatą podważa założenie, że każdy kredyt oznacza dodatkowy zakup.","SCT":"Spadek NO₂ także poza strefą podważa przypisanie całej poprawy strefie, ale nie dowodzi braku jej wpływu.","BO":"Wzrost frekwencji przy trwałym pomijaniu potrzeb części grup osłabia utożsamienie uczestnictwa z reprezentacją."},"origin":"paraphrase","group":"start","basis":"Parafraza wskazówki lub pojęcia z lektury. Przykład jest autorski.","originalPages":"15, 19"},{"id":"value","name":"Wartość dowodów","en":"The value of evidence","pages":"26, 28–29","definition":"Porównaj koszt zdobycia informacji z jej możliwą wartością. Bardach wskazuje trzy elementy: szansę, że informacja zmieni decyzję na lepszą; szansę, że nowa decyzja da lepszy wynik; oraz wielkość poprawy. Zmiana może dotyczyć także wcześniejszego rozpoznania problemu, wariantów lub modelu. Droższe badanie bywa warte wykonania; najtańsze dane nie są automatycznie najlepsze.","examples":{"GPA":"Badanie barier nieużytkowników może bardziej zmienić kierunek pracy niż łatwo dostępna liczba wyświetleń rozkładu.","CP":"Rozpoznanie źródeł i barier inwestycji może być cenniejsze dla decyzji niż kolejny raport o liczbie obsłużonych wniosków.","BK2":"Kosztowne porównanie dodatkowych skutków dopłat może być zasadne przed decyzją o dużych wydatkach.","SCT":"Dane o ruchu i pogodzie pomagają ocenić interpretację spadku stężeń; ranking popularności stref rozstrzyga inne pytanie.","BO":"Rozmowy z nieuczestniczącymi mogą ujawnić bariery pomijane przez łatwo dostępne ankiety zwycięskich projektodawców."},"origin":"paraphrase","group":"reading","basis":"Parafraza wskazówki lub pojęcia z lektury. Przykład jest autorski.","originalPages":"16, 18–19"},{"id":"independence","name":"Uwolnij zniewolony umysł — zachowaj niezależność","en":"Free the captive mind","pages":"31","definition":"Dostęp do danych i gotowej diagnozy nie powinien skłaniać do jej bezkrytycznego przejęcia. Poszukaj rozmówców, którzy zdecydowanie się z nią nie zgadzają, i sprawdź ich argumenty. Można zacząć od pytania klienta, kto by się sprzeciwił i dlaczego, ale jest to tylko częściowy zamiennik bezpośredniego kontaktu z krytykami.","examples":{"GPA":"Rozmawiaj z organizatorem oraz z osobami pomijanymi przez ofertę. Dostęp do rozkładów nie zobowiązuje do poparcia kampanii.","CP":"Dane operatora zestaw z doświadczeniami osób rezygnujących z inwestycji i krytyką sposobu udzielania wsparcia.","BK2":"Analizę banków i beneficjentów skonfrontuj z sytuacją niebeneficjentów i argumentami krytyków dopłat.","SCT":"Sprawdź argumenty zarządcy strefy i krytyków, w tym dotyczące przeniesienia ruchu oraz kosztów dostosowania.","BO":"Obok zwycięskich projektodawców uwzględnij nieuczestników, autorów odrzuconych propozycji i krytyków zasad."},"origin":"paraphrase","group":"reading","basis":"Parafraza wskazówki lub pojęcia z lektury. Przykład jest autorski.","originalPages":"21"},{"id":"hypothetical","name":"Problem hipotetyczny","en":"Hypothetical problem","pages":"13–14","definition":"Możliwy problem, którego istnienia jeszcze nie potwierdzono. Gdy klient proponuje rozwiązanie, można zbadać, jaka domniemana strata czasu, pieniędzy lub możliwości miałaby je uzasadniać. Odłóż uznanie tej straty za fakt do sprawdzenia materiału. „Hipotetyczny” nie znaczy tu „fikcyjny na potrzeby gry”.","examples":{"GPA":"Sugestia „potrzebujemy aplikacji” może oznaczać możliwą stratę czasu przy planowaniu podróży. Najpierw sprawdź jej występowanie.","CP":"Pomysł nowego punktu obsługi może odpowiadać domniemanym kosztom i rezygnacjom wynikającym z trudnych procedur.","BK2":"Postulat większych dopłat zakłada określone bariery potrzeb mieszkaniowych. Trzeba sprawdzić ich występowanie i skalę.","SCT":"Postulat przesunięcia granicy może zakładać istotne narażenie poza nią. Diagnoza tego narażenia pozostaje otwarta.","BO":"Pomysł dodatkowego głosowania może zakładać niewykorzystane możliwości wpływu; ich istnienia nie dowodzi sam pomysł."},"origin":"paraphrase","group":"reading","basis":"Parafraza wskazówki lub pojęcia z lektury. Przykład jest autorski.","originalPages":"8"},{"id":"opportunity","name":"Ukryte szanse — niewykorzystane możliwości poprawy","en":"Latent opportunity","pages":"14–17","definition":"Analiza może szukać m
