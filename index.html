ożliwych korzyści, których nie ujawniły skargi. Przedmiotem pracy bywa utracona możliwość poprawy, a nie tylko już odczuwana szkoda.","examples":{"GPA":"Możliwe lepsze skoordynowanie przesiadek bez zwiększania liczby kursów wymaga sprawdzenia rozkładów i potrzeb.","CP":"Połączenie doradztwa z istniejącym kontaktem z mieszkańcami może ułatwić inwestycje, jeśli mechanizm i warunki to potwierdzą.","BK2":"Wykorzystanie dostępnych zasobów mieszkaniowych może otwierać inną drogę poprawy niż zwiększanie dopłat do zakupu.","SCT":"Lepsze skoordynowanie transportu zbiorowego może umożliwić ograniczenie narażenia przy mniejszych trudnościach dostosowania.","BO":"Istniejące miejsca spotkań mogą ułatwić udział dotąd pomijanych grup bez tworzenia osobnej struktury organizacyjnej."},"origin":"paraphrase","group":"reading","basis":"Parafraza wskazówki lub pojęcia z lektury. Przykład jest autorski.","originalPages":"8–11"},{"id":"purposes","name":"Trzy główne cele zbierania dowodów","en":"Three principal purposes","pages":"25–26","definition":"Według Bardacha dowody służą: (1) rozpoznaniu natury i rozmiaru problemu; (2) rozpoznaniu konkretnej sytuacji działania, np. zasobów, obciążenia urzędu, postaw i współpracy instytucji; (3) ocenie rozwiązań uznawanych za skuteczne w podobnych sytuacjach. Wracamy do zbierania z różnymi pytaniami. Podział „skala — przyczyny — wpływ” jest pomocą do naszych zadań, a nie tą trójką autora.","examples":{"GPA":"Trudności dojazdu; zasoby i kompetencje organizatora; doświadczenia porównywalnego systemu przewozów.","CP":"Narażenie mieszkańców; zdolność gminy i gospodarstw do inwestycji; doświadczenia wsparcia w podobnych warunkach.","BK2":"Potrzeby mieszkaniowe; warunki rynku i możliwości działania; doświadczenia podobnych instrumentów wsparcia.","SCT":"Narażenie przy ulicach; ruch, kompetencje i możliwości dostosowania; doświadczenia innych stref.","BO":"Wpływ i potrzeby grup; reguły oraz zdolność realizacji projektów; doświadczenia innych miast."},"origin":"paraphrase","group":"reading","basis":"Parafraza wskazówki lub pojęcia z lektury. Przykład jest autorski.","originalPages":"15"},{"id":"estimate","name":"Świadomy szacunek","en":"Educated guess; guesstimate","pages":"11, 28–29","definition":"Przybliżenie oparte na dostępnej wiedzy i ujawnionych założeniach, nie dowolna liczba. Porównaj, co przypuszczasz, z tym, czego mogłoby nauczyć dodatkowe badanie. Jeśli różnica może zmienić ważną decyzję, warto zdobyć lepsze dane. Szacunek nie jest wymówką dla pominięcia potrzebnego badania.","examples":{"GPA":"Wstępnie oszacuj grupę bez auta z dostępnych danych, zaznacz zakres błędu i sprawdź, czy wpływa na wybór dalszych badań.","CP":"Przybliż liczbę narażonych na podstawie ludności i map pomiarów, ujawniając ograniczenia pokrycia.","BK2":"Oszacuj zakres obciążenia kosztami przy kilku założeniach o dochodach; nie przedstawiaj go jako zmierzonego skutku dopłaty.","SCT":"Wstępny szacunek narażonych może służyć planowaniu pomiarów, jeśli jasno opisano braki danych przestrzennych.","BO":"Przybliż zasięg potrzeb z istniejących badań, podając, których grup nie reprezentują."},"origin":"paraphrase","group":"reading","basis":"Parafraza wskazówki lub pojęcia z lektury. Przykład jest autorski.","originalPages":"6–7, 18–19"},{"id":"quality","name":"Ocena badania: trafność wewnętrzna i zewnętrzna","en":"Internal and external validity","pages":"29","definition":"Trafność wewnętrzna dotyczy tego, czy badanie wiarygodnie ustala wpływ analizowanego czynnika, a nie innych różnic lub zmian. Trafność zewnętrzna dotyczy możliwości zastosowania wniosku poza badaną grupą i warunkami. Odrębnie sprawdź pomiar: czy dane naprawdę opisują to, o co pytasz.","examples":{"GPA":"Ankieta pasażerów może opisać ich doświadczenia, lecz pomija osoby niekorzystające; nie wyjaśnia automatycznie sytuacji całej gminy.","CP":"Spadek stężeń po inwestycjach wymaga uwzględnienia innych zmian; wynik jednej gminy nie przenosi się automatycznie na inną.","BK2":"Beneficjenci i niebeneficjenci mogą się różnić przed programem; proste porównanie nie usuwa tych wcześniejszych różnic.","SCT":"Obszar poza strefą może odczuwać jej skutki, co komplikuje użycie go jako porównania.","BO":"Opinie zwycięskich projektodawców nie reprezentują wszystkich mieszkańców; wzrost poczucia wpływu może mieć także inne przyczyny."},"origin":"support","group":"tools","basis":"Lektura PL wymienia rodzaje trafności na s. 29, lecz ich tam nie definiuje. Objaśnienie: Gertler i in., Impact Evaluation in Practice, wyd. 2, rozdz. 4 (s. 71–74) i 15.","sourceUrl":"https://thedocs.worldbank.org/en/doc/300711529868962964-0160022017/original/2pmMarch8ImpactEvaluationinPractice.pdf","originalPages":"19"},{"id":"analogy","name":"Analogia: podobny mechanizm w innym obszarze","en":"Best practices; use analogies","pages":"30–31","definition":"Szukaj pouczającego podobieństwa także między pozornie odmiennymi dziedzinami. Analogia pomaga stawiać pytania i tworzyć pomysły; nie dowodzi, że działanie przyniesie taki sam skutek. Wskaż zarówno podobny mechanizm, jak i różnice, które ograniczają przeniesienie wniosku.","examples":{"GPA":"Koordynację przesiadek można porównać z dopasowywaniem kolejnych etapów obsługi w innej usłudze; potrzeby podróży trzeba sprawdzić osobno.","CP":"Organizacja kolejki spraw w funduszu może podsunąć pytania o rozwiązania stosowane w innych usługach; przepisy i rodzaj dokumentów mogą być inne.","BK2":"Dopasowywanie lokali do potrzeb można zestawić z doborem miejsc w innej usłudze publicznej, nie utożsamiając zasad uprawnienia.","SCT":"Obsługę wyłączeń można porównać z dostępnością innej procedury urzędowej. Podobny formularz nie oznacza identycznych potrzeb użytkowników.","BO":"Przygotowanie projektu BO można porównać z uzgadnianiem zakresu projektu informatycznego; podobieństwo nie usuwa odmiennych reguł i celów."},"origin":"paraphrase","group":"reading","basis":"Parafraza wskazówki lub pojęcia z lektury. Przykład jest autorski.","originalPages":"20"},{"id":"iteration","name":"Iteracja — powtarzanie kroków i rewizja definicji","en":"Iterate","pages":"4, 19–20","definition":"Iteracja to powrót do wcześniejszego kroku z nową wiedzą. Rewizja oznacza ponowne rozpatrzenie definicji: można zmienić jej zakres, wyjaśnienie lub ocenę, ale też podtrzymać ją z uzasadnieniem. Proces nie jest jednorazową linią od 1 do 8. Zakres bywa uzgadniany z klientem i współpracownikami; uzgodnienie nie zastępuje dowodów.","examples":{"GPA":"Nowe dane o powrotach mogą przesunąć uwagę z informacji na godziny, przy zachowaniu problemu dostępności.","CP":"Dane o napływie zanieczyszczeń mogą poszerzyć diagnozę przyczyn bez wykluczania znaczenia lokalnego ogrzewania.","BK2":"D2 może podtrzymać problem niepewności o skutkach dopłat i doprecyzować, jakiego porównania brakuje, bez automatycznego zastępowania zlecenia innym.","SCT":"Nowe pomiary poza granicą mogą wymagać poszerzenia obszaru diagnozy, bez przesądzania rozszerzenia instrumentu.","BO":"Dane o pomijanych potrzebach mogą przesunąć nacisk z ogólnej frekwencji na możliwości wpływu konkretnych grup."},"origin":"paraphrase","group":"start","basis":"Parafraza wskazówki lub pojęcia z lektury. Przykład jest autorski.","originalPages":"1, 12–14"},{"id":"evaluation","name":"Niepewność jako problem ewaluacji","en":"Uncertainty is the problem that evaluation addresses","pages":"10","definition":"W analizie ewaluacyjnej problemem może być nadmierna niepewność o dotychczasowym działaniu programu: jakie były wyniki, jak ocenić je według kryteriów i co w projekcie lub realizacji do nich doprowadziło. Wiedza o przeszłości ma pomagać w przyszłych decyzjach. Nie każda ewaluacja ogranicza się do pomiaru przyczynowego wpływu.","examples":{"GPA":"Nie wiemy, na ile zmiana organizacji przewozów poprawiła dostęp do usług; ta luka ma znaczenie dla dalszych decyzji.","CP":"Nie wiemy, jaką zmianę narażenia przyniosło wsparcie inwestycji ani od czego zależały wyniki.","BK2":"Nie wiemy, jaka poprawa warunków mieszkaniowych nastąpiła dzięki dopłatom i jakie wywołały skutki poza programem.","SCT":"Nie wiemy, jaka część zmiany narażenia wynika ze strefy; ocena ma pomóc w przyszłych decyzjach.","BO":"Nie wiemy, czy BO zwiększa wpływ pomijanych grup; ocena konkretnej zmiany reguł jest węższym zadaniem."},"origin":"paraphrase","group":"reading","basis":"Parafraza wskazówki lub pojęcia z lektury. Przykład jest autorski.","originalPages":"6"},{"id":"mechanism","name":"Rola programu i mechanizm interwencji","en":"","pages":null,"definition":"Zakładany ciąg od działania programu przez zmianę zachowań lub warunków do ograniczenia problemu. To schemat dydaktyczny, a nie osobna definicja Bardacha z tych rozdziałów.","examples":{"GPA":"Koordynacja połączeń → możliwa podróż i powrót → lepszy dostęp do pracy i usług. Każde przejście wymaga sprawdzenia.","CP":"Wsparcie inwestycji → zmiana ogrzewania → zmiana emisji i narażenia. Wniosek o dotację nie jest końcowym rezultatem.","BK2":"Dopłata → zmiana obciążenia i możliwości zakupu → zmiana warunków mieszkaniowych. Trzeba uwzględnić reakcję rynku.","SCT":"Reguły wjazdu → zmiana ruchu lub składu pojazdów → zmiana emisji i narażenia, także poza granicą.","BO":"Udział w zgłaszaniu i wyborze → realizacja projektów → zmiana wpływu mieszkańców i uwzględnienia ich potrzeb."},"origin":"support","group":"tools","basis":"Autorski schemat pomocniczy. Nie jest odrębną definicją ani dodatkowym krokiem Bardacha.","originalPages":null},{"id":"impact","name":"Zmiana obserwowana i wpływ programu","en":"Impact; counterfactual","pages":null,"definition":"Zmiana opisuje różnicę między pomiarami. Wpływ dotyczy różnicy wobec wiarygodnie oszacowanej sytuacji bez interwencji. Ocena wymaga określenia interwencji, wyniku i porównania.","examples":{"GPA":"Spadek trudności dojazdu po zmianie sieci nie ustala, jaka poprawa nastąpiłaby bez tej zmiany.","CP":"Spadek stężeń po inwestycjach może współwystępować ze zmianą pogody i innych emisji.","BK2":"Poprawa warunków beneficjentów nie pokazuje, ilu kupiłoby odpowiednie mieszkanie bez dopłaty.","SCT":"Spadek NO₂ po wdrożeniu trzeba odróżnić od wpływu samej strefy względem sytuacji bez niej.","BO":"Porównanie dwóch edycji może badać zmianę reguł. Wpływ istnienia BO wymaga porównania z sytuacją bez BO."},"origin":"support","group":"tools","basis":"Pomocnicze pojęcie ewaluacji wpływu, a nie definicja podana przez Bardacha w krokach 1–2. Gertler i in., Impact Evaluation in Practice, wyd. 2, rozdz. 3.","sourceUrl":"https://thedocs.worldbank.org/en/doc/300711529868962964-0160022017/original/2pmMarch8ImpactEvaluationinPractice.pdf","originalPages":null},{"id":"client","name":"Zleceniodawca i sytuacja decyzyjna","en":"","pages":"4, 8–10, 20, 25","definition":"Zleceniodawca potrzebuje wiedzy do określonej decyzji. Rozpoznaj jego cel, zadania i uprawnienia: co może zrobić sam, do czego potrzebuje innych, jakie ma zasoby i ograniczenia. Jego twierdzenia oraz oceny są punktem wyjścia do analizy. Perspektywa klienta nie jest jedyną perspektywą osób dotkniętych problemem.","examples":{"GPA":"Zarząd GPA analizuje dostępność podróży, a wójt przygotowanie wkładu gminy do budżetu.","CP":"Wójt rozpoznaje lokalne narażenie, a zarząd funduszu organizację obsługi płatności.","BK2":"Minister analizuje doświadczenia krajowych dopłat, a prezydent miasta potrzeby uprawnionych do pomocy lokalnej.","SCT":"Prezydent przygotowuje dalsze prace nad SCT, a dyrektor ZDM organizację obsługi wyłączeń.","BO":"Dyrektor CKS rozpoznaje możliwości wpływu mieszkańców, a burmistrz dzielnicy realizację przydzielonych projektów."},"origin":"synthesis","group":"start","basis":"Autorska synteza wskazówek z podanych stron, nie osobne hasło autora.","originalPages":"1, 4–5, 14–15"},{"id":"working","name":"Robocza definicja i rewizja","en":"","pages":"8–12, 19–20","definition":"Robocza definicja jest najlepszym obecnie opisem problemu, z zaznaczeniem niewiedzy. Nie musi od razu zawierać liczby ani pełnej diagnozy przyczyn. Zachowaj ją, aby po dowodach wskazać, co konkretnie zmieniłeś/aś lub podtrzymałeś/aś.","examples":{"GPA":"Przed dowodami: trudności potrzebnej podróży o nieustalonej skali. Po D1: 80 z 200 badanych nie spełnia umownych warunków; zakres populacji pozostaje ważny.","CP":"Przed dowodami: długi czas płatności o nieznanej skali. Po D3: 60 ze 100 zakończonych spraw ponad umowne 30 dni; nadal trzeba sprawdzić sprawy otwarte.","BK2":"Przed dowodami: niepewność wpływu dopłat. Po D2: wiadomo, że proste porównanie nie usuwa wcześniejszych różnic między grupami; niepewność zostaje doprecyzowana.","SCT":"Przed dowodami: narażenie mieszkańców wybranych ulic. Po D1: diagnoza obejmuje także wskazane ulice poza strefą, bez automatycznej decyzji o zmianie granic.","BO":"Przed dowodami: opóźnienia projektów o nieustalonej skali. Po D3–D4: 5 z 12 projektów i różne etapy zwłoki, zamiast jednej etykiety winnego."},"origin":"synthesis","group":"reading","basis":"Autorskie objaśnienie roboczego charakteru definicji i wskazówki „Stosuj iterację (powtarzaj kroki)”.","originalPages":"4–7, 12–14"},{"id":"commission","name":"Wąskie zlecenie i problem publiczny","en":"","pages":"4, 8–10, 20","definition":"Właściwy zakres może dotyczyć skutków społecznych, działania organizacji albo niepewności ewaluacyjnej. Uzasadnij publiczne znaczenie i dopasowanie do decyzji. Szersza definicja nie jest automatycznie lepsza. Gdy zakres klienta pomija ważną szkodę lub zależność, ujawnij to i uzasadnij potrzebę jego ponownego uzgodnienia.","examples":{"GPA":"Przewidywalność wkładu gminy może być właściwym problemem obok dostępności podróży.","CP":"Czas obsługi płatności może być właściwym problemem funduszu; nie musi być zastąpiony stężeniem PM2,5.","BK2":"Resort bada niepewność skutków dopłat, a miasto czas dostępu do lokalu w wybranej grupie.","SCT":"Jakość obsługi wyłączeń ma znaczenie publiczne obok ochrony przed NO₂.","BO":"Opóźnienie realizacji wybranego projektu może być właściwym problemem obok reprezentacji potrzeb."},"origin":"synthesis","group":"reading","basis":"Autorska synteza przykładów i wskazówek o dopasowaniu analizy do sytuacji.","originalPages":"1, 4, 6–7, 14"},{"id":"reference","name":"Podstawa oceny — standard lub punkt odniesienia","definition":"Uzasadnienie, względem którego nazywasz stan „zbyt dużym”, „zbyt długim” lub „niesprawiedliwym”. Może nim być cel, zasada równości, obowiązująca norma albo uzasadnione porównanie. Wyjaśnij, czyj to punkt odniesienia i dlaczego go przyjmujesz. Nie zawsze jest liczbowy ani bezsporny. „Standard” to nasze określenie pomocnicze, nie osobny obowiązkowy termin Bardacha.","examples":{"GPA":"A: dostęp do potrzebnej podróży według umownych warunków czasu i kosztu. B: przewidywalność wkładu wobec prognozy budżetowej.","CP":"A: ochrona mieszkańców, w grze zilustrowana poziomem T. B: umowne 30 dni z zachowaniem rzetelnej kontroli; to nie termin prawny.","BK2":"A: wiedza wystarczająca do przygotowania przyszłego wsparcia; nie ma tu jednego progu liczbowego. B: umowne 12 miesięcy oczekiwania.","SCT":"A: poziom T jako fikcyjny punkt porównania narażenia. B: 10 dni jako umowny standard obsługi, nie przepis.","BO":"A: równość możliwości wpływu — nie wymaga identycznej frekwencji każdej grupy. B: zatwierdzony harmonogram realizacji."},"pages":"7–10","origin":"synthesis","group":"start","en":"","basis":"Autorskie objaśnienie wskazówki „Nadaj definicji charakter wartościujący (ewaluacyjny)”. To nie to samo zadanie co porównywanie skutków alternatyw według kryteriów w kroku 4.","originalPages":"2–6"},{"id":"indicator","name":"Wskaźnik i próg: pomiar to nie podstawa oceny","definition":"Wskaźnik to określona miara zjawiska, np. odsetek spraw opóźnionych. Próg to granica pozwalająca odróżnić przypadki, np. ponad 30 dni. Podstawa oceny wyjaśnia natomiast, dlaczego taki stan uznajesz za problem. Sama liczba nie wybiera uzasadnionej wartości ani progu.","examples":{"GPA":"Odsetek osób bez potrzebnego powrotu mierzy trudność podróży. Warunki „60 minut i 10% dziennego dochodu” są umownym punktem odniesienia gry.","CP":"„60 ze 100 spraw” to wielkość zaobserwowana; „30 dni” to przyjęta granica. Poprawności tej granicy nie dowodzi liczba 60.","BK2":"„30 ze 100 uprawnionych gospodarstw” to wskaźnik; „ponad 12 miesięcy” to umowny próg. Potrzeba odpowiedniego lokalu uzasadnia ocenę.","SCT":"„400 z 1200 mieszkańców ponad T” to wynik modelu. T jest umowną granicą ćwiczenia, nie aktualną normą jakości powietrza.","BO":"Odsetek deklarujących brak wpływu jest jednym wskaźnikiem. Nie mierzy całej równości możliwości udziału ani wszystkich potrzeb."},"pages":"11","origin":"synthesis","group":"start","en":"","basis":"Objaśnienie miary i liczbowego punktu odniesienia na podstawie wskazówki „Kwantyfikuj, jeśli to możliwe”.","originalPages":"6–7"},{"id":"hypothesis","name":"Hipoteza — przypuszczenie do sprawdzenia","definition":"Twierdzenie, którego jeszcze nie traktujemy jako ustalonego, np. o przyczynie zwłoki. Wskaż, jakie informacje je wspierają, jakie mu przeczą i jakie inne wyjaśnienie trzeba rozważyć. Hipoteza może otrzymać częściowe wsparcie; nie trzeba jej zawsze odrzucać.","examples":{"GPA":"Brak wiedzy o kursach może wyjaśniać trudności, ale trzeba sprawdzić też godziny powrotów.","CP":"Oczekiwanie na dokumenty może wydłużać obsługę; nie wynika z tego, że winni są beneficjenci.","BK2":"Wyższy odsetek poprawy u beneficjentów może wynikać z dopłat lub z wcześniejszych różnic między grupami.","SCT":"Niedobór pracowników może opóźniać obsługę, ale możliwe są też bariery dokumentów i komunikacji.","BO":"Nieuczestnictwo może wiązać się z niewiedzą, brakiem zainteresowania, dostępnością lub niewiarą w realizację."},"pages":"9, 12–14, 18–19","origin":"synthesis","group":"start","en":"","basis":"Parafraza wskazówki z lektury. Przykład jest autorski.","originalPages":"5, 7–9, 12"},{"id":"public","name":"Dlaczego problem jest publicznie ważny?","definition":"Wyjaśnij, dlaczego stan zasługuje na uwagę i ewentualne użycie zasobów publicznych. Bardach omawia m.in. problemy działania rynku, ubóstwo i dyskryminację oraz nieosiąganie celów przez instytucje publiczne przy akceptowalnych kosztach. Sam fakt, że działa program lub że klient składa zamówienie, nie dowodzi, że interwencja poprawi sytuację.","examples":{"GPA":"Dostęp do pracy i usług oraz odpowiedzialne finansowanie przewozów uzasadniają pytania obu klientów.","CP":"Szkody z zanieczyszczenia dotyczą innych ludzi, a jakość obsługi wpływa na dostęp do publicznego wsparcia.","BK2":"Niezaspokojone potrzeby mieszkaniowe mogą uzasadniać działanie, ale nie przesądzają, że dopłata do własności jest najlepszym rozwiązaniem.","SCT":"Ochrona przed szkodliwymi zanieczyszczeniami i rzetelna obsługa reguł to dwie odrębne racje publiczne.","BO":"Możliwości wpływu mieszkańców oraz wykorzystanie wspólnych pieniędzy wymagają uzasadnionych standardów oceny."},"pages":"7–9","origin":"paraphrase","group":"tools","en":"","basis":"Parafraza wskazówki z lektury. Przykład jest autorski.","originalPages":"2–5"},{"id":"risk","name":"Ryzyko i niepewność","definition":"Problem może dotyczyć przyszłej szkody lub zbyt dużego ryzyka, nawet jeśli szkoda jeszcze nie wystąpiła. Określ zdarzenie, okres i podstawę oceny prawdopodobieństwa. Jeśli nie masz podstaw do liczby, nie podawaj wymyślonego procentu. Ogólna niepewność oznacza brak pełnej wiedzy; nie zawsze daje się opisać prawdopodobieństwem.","examples":{"GPA":"Możliwość utraty potrzebnych kursów przy trudnościach finansowania nie jest jeszcze zaobserwowaną likwidacją połączeń.","CP":"Ryzyko nieukończenia inwestycji wymaga odrębnej diagnozy od liczby już zakończonych wniosków.","BK2":"Przyszły wzrost obciążeń gospodarstw jest innym twierdzeniem niż dzisiejszy udział rat w dochodzie.","SCT":"Możliwy wzrost narażenia na innych ulicach po zmianie ruchu trzeba odróżnić od pomiaru obecnego narażenia.","BO":"Ryzyko opóźnienia przyszłej realizacji wymaga wskazania warunków, nie tylko policzenia dawnych opóźnień."},"pages":"6, 12–13","origin":"synthesis","group":"tools","en":"","basis":"Objaśnienie części „Warunki ryzyka: Prawdopodobieństwo” oraz uwag o przyszłych problemach.","originalPages":"2, 7–8"},{"id":"literature","name":"Przegląd literatury i ocena źródła","definition":"Szukaj badań przyczyn i możliwych rozwiązań. Nie czytaj wyłącznie końcowego wniosku: sprawdź metodę, zakres, ograniczenia i przydatność do swojej decyzji. Przy materiale organizacji popierającej dany wariant uwzględnij jej interes i porównaj inne źródła. Sam interes autora nie dowodzi fałszu, a wygodny dostęp nie dowodzi jakości.","examples":{"GPA":"Badanie samych pasażerów nie odpowiada na wszystkie pytania o mieszkańców bez dostępu do połączeń.","CP":"Raport instytucji realizującej program trzeba zestawić z metodą badania i doświadczeniami osób, które nie ukończyły sprawy.","BK2":"Materiał banków może być użyteczny, ale sprawdź dobór grup i perspektywę osób poza kredytem.","SCT":"W ocenie strefy sprawdź zmiany pogody, ruchu i sposób dobrania ulic porównawczych, nie tylko hasło „stężenia spadły”.","BO":"Raport zwycięskich projektodawców nie zastąpi rozpoznania potrzeb nieuczestników."},"pages":"29","origin":"paraphrase","group":"tools","en":"","basis":"Parafraza wskazówki z lektury. Przykład jest autorski.","originalPages":"19"},{"id":"practices","name":"Najlepsze praktyki — sprawdź warunki zastosowania","definition":"Poszukaj rozwiązań, które inni uznają za skuteczne w podobnych sytuacjach. Zbadaj podstawy oceny ich wyników i warunki działania, zanim przeniesiesz wniosek. Określenie „dobra praktyka” nie jest dowodem skuteczności. Karta D6 w grze ćwiczy właśnie tę ostrożność.","examples":{"GPA":"Rozwiązanie działające w sieci Y może nie pomóc tam, gdzie brakuje kursu o potrzebnej godzinie.","CP":"Uproszczenie procedury w funduszu Y może wymagać innych uprawnień lub zasobów.","BK2":"Wynik dopłat w innym kraju zależy m.in. od sytuacji rynku i grup objętych wsparciem.","SCT":"Efekt strefy w innym mieście wymaga oceny ruchu, pojazdów i równoczesnych działań.","BO":"Wysoka frekwencja w innym mieście nie rozstrzyga równości wpływu ani terminowości realizacji u nas."},"pages":"29–30","origin":"paraphrase","group":"tools","en":"Survey Best Practices","basis":"Parafraza wskazówki z lektury. Przykład jest autorski.","originalPages":"19–20"},{"id":"early","name":"Zacznij wcześnie — zaplanuj pozyskanie informacji","definition":"Osoby i instytucje mają własne terminy. Prośby o dane i rozmowy składaj odpowiednio wcześnie; odróżnij czas swojej pracy od oczekiwania na odpowiedź. W grze D6 wymaga 2 dni pracy, ale dociera w dniu 8, czyli po terminie notatki. To może być informacja do następnego etapu.","examples":{"GPA":"D6 dla GPA / FRPA może się przydać później. We własnej analizie K3 ustal, kto ma materiał, kiedy go udostępni i kiedy trzeba o niego poprosić.","CP":"D6 dla Czyste Powietrze może się przydać później. We własnej analizie K3 ustal, kto ma materiał, kiedy go udostępni i kiedy trzeba o niego poprosić.","BK2":"D6 dla BK2% może się przydać później. We własnej analizie K3 ustal, kto ma materiał, kiedy go udostępni i kiedy trzeba o niego poprosić.","SCT":"D6 dla SCT Warszawa może się przydać później. We własnej analizie K3 ustal, kto ma materiał, kiedy go udostępni i kiedy trzeba o niego poprosić.","BO":"D6 dla BO Warszawa może się przydać później. We własnej analizie K3 ustal, kto ma materiał, kiedy go udostępni i kiedy trzeba o niego poprosić."},"pages":"31","origin":"paraphrase","group":"tools","en":"Start Early","basis":"Parafraza wskazówki z lektury. Przykład jest autorski.","originalPages":"20"},{"id":"relations","name":"Konsultuj się, buduj wiarygodność, wypracowuj konsensus","definition":"Zbieranie informacji ma także wymiar relacji: pozwala poznać zastrzeżenia, uzyskać informację zwrotną i czasem ułatwić współpracę. Analityk może pomagać stronom w porozumieniu, jeśli odpowiada to zadaniu. Pozyskanie poparcia nie uprawnia do ukrywania dowodów niekorzystnych dla klienta.","examples":{"GPA":"Rozmowa z organizatorem i gminą może ujawnić odmienne rozumienie prognozy kosztów.","CP":"Rozmowa z personelem i beneficjentami może pomóc ustalić, które wezwania są niejasne.","BK2":"Perspektywy resortu, banków i gospodarstw pokazują różne pytania o skutki dopłat.","SCT":"Rozmowa z obsługą i osobami rezygnującymi może ujawnić bariery niewidoczne w zakończonych sprawach.","BO":"Autorzy, realizatorzy i mieszkańcy mogą inaczej rozumieć powód opóźnienia; trzeba sprawdzić chronologię."},"pages":"31","origin":"synthesis","group":"tools","en":"","basis":"Objaśnienie wskazówek „Konsultuj się, buduj wiarygodność, wypracowuj konsensus” i „Uwolnij zniewolony umysł”. Konsensus oznacza porozumienie między stronami; nie stanowi dowodu prawdziwości diagnozy.","originalPages":"20–21"},{"id":"sample","name":"Populacja, próba, rejestr i mianownik","definition":"Populacja to grupa, o której chcesz wnioskować. Próba to jej badana część. Próba losowa korzysta z losowego doboru, a celowa z wyboru przypadków według określonych cech. Rejestr to ewidencja osób lub spraw i może pomijać część ważnej grupy. Sprawdź, kogo nie ma w danych; odsetek z próby celowej nie jest automatycznie odsetkiem w całej populacji. Przy odsetku mianownik to liczba wszystkich przypadków, do której odnosisz wynik: w 60 ze 100 spraw jest nim 100.","examples":{"GPA":"200 dorosłych bez auta w D1 i 20 celowo wybranych osób z trudnościami w D2 to różne podstawy wnioskowania.","CP":"100 zakończonych spraw nie obejmuje spraw nadal otwartych. 12 rozmów nie reprezentuje automatycznie wszystkich beneficjentów.","BK2":"Rejestr 100 uprawnionych nie jest grupą wszystkich osób bez kredytu. 20 długich spraw wybrano celowo.","SCT":"Rejestr zakończonych spraw może pomijać osoby, które utknęły w procedurze lub zrezygnowały.","BO":"Próba z jednej dzielnicy nie daje sama w sobie diagnozy całej Warszawy."},"pages":null,"origin":"support","group":"tools","en":"","basis":"Pomocnicze pojęcia metod badań; w lekturze PL ogólne zalecenie oceny metody i zakresu wniosków — s. 29.","originalPages":null},{"id":"brief","name":"Brief — krótka notatka dla klienta","definition":"Zwięzły zapis tego, co klient powinien wiedzieć przed dalszą pracą nad decyzją. W tej grze zawiera obecną definicję problemu, uzasadnienie zmiany lub podtrzymania oraz jedno dalsze pytanie. Nie jest jeszcze rekomendacją najlepszego wariantu ani pełną kartą K3.","examples":{"GPA":"Dla każdego z dwóch klientów GPA / FRPA przygotujesz osobną notatkę, a następnie porównasz ich zakres i dowody.","CP":"Dla każdego z dwóch klientów Czyste Powietrze przygotujesz osobną notatkę, a następnie porównasz ich zakres i dowody.","BK2":"Dla każdego z dwóch klientów BK2% przygotujesz osobną notatkę, a następnie porównasz ich zakres i dowody.","SCT":"Dla każdego z dwóch klientów SCT Warszawa przygotujesz osobną notatkę, a następnie porównasz ich zakres i dowody.","BO":"Dla każdego z dwóch klientów BO Warszawa przygotujesz osobną notatkę, a następnie porównasz ich zakres i dowody."},"pages":null,"origin":"support","group":"tools","en":"","basis":"Objaśnienie pomocnicze w grze; nie odrębna definicja z tych stron podręcznika.","originalPages":null},{"id":"words_GPA","name":"GPA, FRPA i wkład gminy","definition":"GPA to Grodziskie Przewozy Autobusowe, związek organizujący przewozy. FRPA oznacza Fundusz rozwoju przewozów autobusowych o charakterze użyteczności publicznej. Wkład gminy to środki, które przeznacza na finansowanie przewozów; prognoza jest przewidywaniem kwoty, a rozliczenie jej późniejszym ustaleniem.","examples":{"GPA":"W scenariuszu problem przewidywalności wkładu nie jest tym samym co sama wysokość kosztu przewozów."},"pages":null,"origin":"support","group":"program","en":"","basis":"Objaśnienie pomocnicze w grze; nie odrębna definicja z tych stron podręcznika.","programs":["GPA"],"originalPages":null},{"id":"words_CP","name":"Fundusz, operator i efektywność energetyczna","definition":"WFOŚiGW to wojewódzki fundusz ochrony środowiska i gospodarki wodnej; NFOŚiGW to fundusz narodowy. Operator wspiera osoby w przejściu procesu inwestycji i uzyskaniu wsparcia. Efektywność energetyczna oznacza ograniczanie zużycia energii dla uzyskania porównywalnej usługi, np. odpowiedniego ogrzania domu.","examples":{"CP":"Wójt i zarząd wojewódzkiego funduszu mają inne zadania. Sprawność obsługi płatności nie jest miarą zmiany narażenia mieszkańców."},"pages":null,"origin":"support","group":"program","en":"","basis":"Objaśnienie pomocnicze w grze; nie odrębna definicja z tych stron podręcznika.","programs":["CP"],"originalPages":null},{"id":"words_BK2","name":"BK2, gospodarstwo i dopłata","definition":"BK2 oznacza Bezpieczny Kredyt 2%. Gospodarstwo domowe to osoba lub osoby wspólnie organizujące utrzymanie. Dopłata do rat jest instrumentem wsparcia kredytu; poprawa sytuacji beneficjenta nie oznacza automatycznie dodatkowego skutku wywołanego dopłatą.","examples":{"BK2":"W grze rozdzielamy beneficjentów dopłat i lokalną grupę uprawnionych do pomocy mieszkaniowej; nie są to wymienne populacje."},"pages":null,"origin":"support","group":"program","en":"","basis":"Objaśnienie pomocnicze w grze; nie odrębna definicja z tych stron podręcznika.","programs":["BK2"],"originalPages":null},{"id":"words_SCT","name":"SCT, ZDM i wyłączenie","definition":"SCT to Strefa Czystego Transportu, a ZDM — Zarząd Dróg Miejskich. Wyłączenie oznacza sytuację, w której dane ograniczenie wjazdu nie ma zastosowania zgodnie z właściwymi regułami. Scenariusz dotyczy potwierdzania wyłączeń; nie podaje aktualnej listy uprawnień do wjazdu.","examples":{"SCT":"Dyrektor ZDM przygotowuje organizację obsługi w przyjętym zakresie, a nie samodzielną zmianę granic lub zasad strefy."},"pages":null,"origin":"support","group":"program","en":"","basis":"Objaśnienie pomocnicze w grze; nie odrębna definicja z tych stron podręcznika.","programs":["SCT"],"originalPages":null},{"id":"words_BO","name":"BO, CKS i uwzględnianie potrzeb","definition":"BO to budżet obywatelski, CKS — Centrum Komunikacji Społecznej. „Reprezentacja potrzeb” w grze oznacza uwzględnianie potrzeb różnych grup w decyzjach i wydatkach. Frekwencja to udział uprawnionych, którzy uczestniczą; sama nie pokazuje, czy potrzeby różnych grup zostały uwzględnione.","examples":{"BO":"Dyrektor CKS i burmistrz dzielnicy analizują różne części procesu: możliwości wpływu i realizację przydzielonych projektów."},"pages":null,"origin":"support","group":"program","en":"","basis":"Objaśnienie pomocnicze w grze; nie odrębna definicja z tych stron podręcznika.","programs":["BO"],"originalPages":null},{"id":"air","name":"Emisja, stężenie i narażenie; PM2,5 i NO₂","definition":"Emisja to uwalnianie zanieczyszczeń ze źródła. Stężenie opisuje ich ilość w określonej objętości powietrza. Narażenie dotyczy kontaktu ludzi z zanieczyszczeniem i zależy także od miejsca oraz czasu przebywania. PM2,5 to drobny pył o średnicy cząstek do około 2,5 mikrometra; NO₂ to dwutlenek azotu. Te pojęcia nie są zamienne.","examples":{"CP":"Liczba wymienionych urządzeń, zmiana emisji i zmiana narażenia mieszkańców to różne wielkości. Napływ oznacza zanieczyszczenia docierające spoza badanego obszaru.","SCT":"Liczba starszych pojazdów nie jest miarą narażenia. Trzeba uwzględnić emisje, warunki rozprzestrzeniania i to, gdzie przebywają ludzie."},"pages":null,"origin":"support","group":"program","en":"","basis":"Objaśnienie pomocnicze w grze; nie odrębna definicja z tych stron podręcznika.","programs":["CP","SCT"],"originalPages":null},{"id":"model","name":"Model i niepewność oszacowania","definition":"Model to uproszczony opis zależności służący np. oszacowaniu wielkości, której nie zmierzono u każdej osoby. Wynik zależy od danych i założeń. Niepewność oszacowania mówi, jak niedokładna może być liczba; podany zakres wymaga wyjaśnienia metody. Nie nazywaj dowolnych granic formalnym przedziałem ufności.","examples":{"GPA":"Prognoza wkładu zależy od przyjętych danych o kosztach i przewozach; późniejsze rozliczenie może się od niej różnić.","CP":"Liczbę narażonych oszacowano łącząc model stężeń i mapę ludności, a nie mierząc osobisty kontakt każdej osoby.","BK2":"Oszacowanie poprawy bez dopłaty wymaga założeń o porównywalności grup i innych zmianach.","SCT":"Model przestrzenny przypisuje poziomy do ulic i mieszkańców. Dokładność tej mapy trzeba sprawdzić.","BO":"Prognoza czasu realizacji może zależeć od kolejności uzgodnień; sama średnia z dawnych projektów może pomijać ważne różnice."},"pages":null,"origin":"support","group":"tools","en":"","basis":"Pomocnicze objaśnienie modeli i szacowania; lektura PL omawia szacunki na s. 11, 28–29, a przykład modelu na s. 26–28.","originalPages":null}],"initialFields":[{"id":"problem","label":"1. Moja robocza definicja problemu","prompt":"Napisz 1–2 zdania: co wymaga poprawy, dla kogo, gdzie lub kiedy i jaki punkt odniesienia uzasadnia tę ocenę. Powiąż zakres z decyzją tego klienta. Nieznaną skalę oznacz jako nieustaloną.","helper":"„W [grupie i zakresie] występuje lub może występować [stan], oceniany względem [punktu odniesienia]. Jest to ważne dla decyzji o […]”. Możesz zachować dobrze uzasadnioną diagnozę klienta. Krótko wyjaśnij znaczenie publiczne. Punkt odniesienia nie musi być liczbą."},{"id":"hypothesis","label":"2. Hipoteza — przypuszczenie do sprawdzenia","prompt":"Wskaż jedno możliwe wyjaśnienie lub niepewność z wypowiedzi klienta. Napisz, co je wspiera, a czego jeszcze nie wiadomo. Przy zleceniu ewaluacyjnym wskaż, jaki skutek pozostaje nieustalony.","helper":"„Klient przypuszcza […]. Na razie wiemy […], ale trzeba sprawdzić […]”. Cel i podstawę oceny uzasadniamy; twierdzenie o przyczynie sprawdzamy dowodami."}],"finalFields":[{"id":"problem","label":"1. Obecna definicja i decyzja klienta","prompt":"W 1–3 zdaniach podaj obecną definicję problemu i jej znaczenie dla decyzji klienta. Wskaż właściwą grupę, zakres i podstawę oceny (punkt odniesienia). Użyj konkretnego materiału D1–D6 lub jawnie zaznacz brak wiedzy.","helper":"Definicja może pozostać taka sama. Nie rozszerzaj jej automatycznie do całego problemu społecznego programu."},{"id":"revision","label":"2. Co zmieniam lub podtrzymuję po dowodach?","prompt":"Przywołaj jeden fragment swojej roboczej notatki. Wyjaśnij, co zmieniasz lub podtrzymujesz na podstawie konkretnej karty D1–D6. Dodaj jedną granicę wniosku.","helper":"„Wcześniej napisałem/am […]. Po D… zmieniam/podtrzymuję […], ponieważ […]. Nadal nie można stwierdzić […]”. Podtrzymanie i zmiana są równorzędne, gdy mają uzasadnienie."},{"id":"next","label":"3. Jedna następna informacja","prompt":"Wskaż jedno pytanie, potrzebną informację i możliwe źródło. Wyjaśnij, co odpowiedź mogłaby zmienić w analizie lub przygotowaniu decyzji. Zaznacz, czy potrzebna jest przed tą decyzją, czy później.","helper":"„Aby sprawdzić […], potrzebuję […] z […]. Wynik może zmienić […]. Warto zdobyć go [teraz/później], ponieważ […]”. Nie zamawiaj po prostu „więcej badań”."}],"compareFields":[{"id":"scope","label":"1. Co zmieniło się w definicji problemu?","prompt":"Wskaż jedną konkretną różnicę między definicjami przygotowanymi dla obu klientów. Wyjaśnij ją decyzją, odpowiedzialnością lub ograniczeniami klientów.","helper":"„Dla [klient] skupiłem/am się na […], a dla [klient] na […], ponieważ […]”. Jeśli definicje są podobne, uzasadnij, dlaczego mimo różnych zleceń."},{"id":"evidence","label":"2. Co zmieniło się w doborze dowodów?","prompt":"Wskaż jedną kartę D1–D6 i porównaj jej znaczenie dla obu zleceń. Wyjaśnij, na jakie pytanie odpowiada w każdej ścieżce. Możesz uzasadnić wybór tej samej karty.","helper":"„D… było ważniejsze dla […], bo […]. Dla drugiego klienta […]”. Zmiana priorytetu nie zmienia prawdziwości informacji."},{"id":"constant","label":"3. Co pozostaje wspólne?","prompt":"Wskaż jeden wspólny fakt lub ograniczenie dowodu oraz jedną wskazówkę Bardacha, która ma zastosowanie w obu ścieżkach. Wyjaśnij krótko, jak.","helper":"Możesz odwołać się do jawnej podstawy oceny, oddzielenia hipotezy, wskazówki „Pomyśl, zanim zaczniesz zbierać”, wartości dowodów lub iteracji (powrotu do wcześniejszego kroku). Samo wymienienie nazwy nie wystarczy."}],"followupFields":[{"id":"problem","label":"1. Roboczy problem dla wybranego klienta","max":500,"prompt":"Zapisz 1–2 zdania do dalszej pracy. Usuń fikcyjne liczby z gry. Jeżeli istnienie lub skala problemu nie są sprawdzone w rzeczywistości, zaznacz to.","helper":"Możesz wykorzystać sens definicji z gry, ale jej dane nie są źródłem o rzeczywistym programie. Zlecenie pozostaje jawnym założeniem dydaktycznym."},{"id":"evidence","label":"2. Jedno twierdzenie i rzeczywiste źródło","max":500,"prompt":"Wybierz jedno twierdzenie z notatki. Podaj źródło (tytuł, link lub strona), co pozwala ustalić i czego nie rozstrzyga. Jeśli nie masz źródła, wpisz: niesprawdzone — i nazwij twierdzenie.","helper":"„Sprawdzam […]. Źródło […] potwierdza […], ale nie ustala […]”. Może to być dokument znany z wcześniejszej części kursu. Nie trzeba teraz wyszukać wielu materiałów."},{"id":"next","label":"3. Jedna następna informacja","max":500,"prompt":"Napisz, czego nadal potrzebujesz i jak odpowiedź może zmienić definicję lub dalszą analizę dla tego klienta.","helper":"„Potrzebujemy […], ponieważ wynik może skłonić nas do […]”. To początek K3, nie kompletna karta ani końcowa rekomendacja."}],"source":"Lektura podstawowa: Bardach_1-2-tlumaczenie.pdf — polski przekład i adaptacja kroków 1–2 z E. Bardach i E. M. Patashnik, A Practical Guide for Policy Analysis, wyd. 6, 2020. Wszystkie odsyłacze „Lektura PL, s.” dotyczą tego 41-stronicowego PDF. Zgodnie z notą na s. 2 polskie ramki i elementy dydaktyczne dodano w adaptacji. Zlecenia, rozmowy, karty D1–D6 i formularze notatek są odrębnymi pomocami dydaktycznymi gry, nie dodatkowymi krokami Bardacha. Zapowiedź alternatyw znajduje się na s. 34 adaptacji; pełny krok 3 jest poza zakresem tej lektury.","fictional":"Wszystkie zlecenia, rozmowy, liczby, progi i problemy opisane w scenariuszu są fikcyjne. Nazwy programów i instytucji są rzeczywiste; gmina/miasto/dzielnica X są umowne. Nie przypisuj tych wypowiedzi rzeczywistym osobom. Źródła instytucjonalne służą tylko osadzeniu ról, nie potwierdzają danych gry.","readingOriginal":"https://drive.google.com/file/d/1qRgdHdTwusO55uDVtkpzWo6rPDevOlG4/view?usp=sharing","readingPriority":"7–12, 17–20, 25–26 i 28–31","readingNote":"Numery stron w grze odnoszą się do polskiego PDF i zgadzają się z numerami wydrukowanymi na stronach. Krok 1: s. 5–24; krok 2: s. 25–34. Nota o przekładzie na s. 2 odróżnia tekst autorów od dodatków adaptacji.","readingSections":[{"title":"Zlecenie → robocza definicja","pages":"7–12","text":"Charakter wartościujący, retoryka sporu publicznego, niepewność ewaluacyjna, kwantyfikacja i diagnoza przyczyn. Szczególnie s. 8–10: wypowiedź klienta jest materiałem do analizy."},{"title":"Pułapki i powrót do definicji","pages":"17–20","text":"Nie wpisuj rozwiązania, sprawdzaj przyczyny, uwzględnij kontekst; stosuj iterację, czyli powracaj do wcześniejszych kroków."},{"title":"Plan zbierania dowodów","pages":"25–26, 28–29","text":"Dane, informacje i dowody; trzy cele zbierania; wartość dowodów wobec kosztu; świadomy szacunek i krytyczna ocena badań."},{"title":"Inne doświadczenia i niezależność doradcy","pages":"29–31","text":"Najlepsze praktyki, analogie, wczesne prośby o dane, konsultacje i „Uwolnij zniewolony umysł”."},{"title":"Pomocnicza powtórka z adaptacji","pages":"22–24, 32–34","text":"Przykład smogu, podsumowania, pojęcia i listy kontrolne. To dodatki dydaktyczne adaptacji. Na s. 34 znajduje się także zapowiedź konstruowania alternatyw; nie jest to pełny rozdział o kroku 3."}]};

  const canSubmit = (s,stage) => stage==='pre' ? Object.values(s.routes).some(r=>r.complete&&!r.origin) : stage==='post' && s.compared;
  const submissionLabel = stage => stage==='pre'?'1 — przed zajęciami, po co najmniej jednym kliencie':stage==='post'?'2 — po poznaniu obu klientów i zapisaniu porównania':'Nie oznaczono etapu (zapis roboczy lub starsza wersja)';
  function prepareSubmission(raw,stage){const s=validate(raw);if(!canSubmit(s,stage))throw Error('Najpierw ukończ własną ścieżkę (etap 1) albo zapisz porównanie obu klientów (etap 2).');s.submission={stage,at:now()};s.screen=stage==='pre'?'submit-pre':'finish';return validate(s);}
  function sourceLabel(s,id){const rt=s.routes[id];return rt.complete?(rt.origin?'Dołączono ukończoną ścieżkę z zapisu innej osoby':'Ścieżka rozegrana w tym zapisie'):s.peer[id]?'Omówiono ścieżkę rozegraną przez inną osobę':rt.started?'Własna ścieżka w toku':'Jeszcze nie poznano';}
  function mergeRoute(current,donor,id,replace=false){

  function validate(raw) {

      for(const k of ['started','knewPacket','initialLocked','planLocked','complete'])if(typeof r[k]!=='boolean')fail();
      if(!Array.isArray(r.read)||new Set(r.read).size!==r.read.length||r.read.some(i=>![0,1,2].includes(i)))fail();
      if(!Array.isArray(r.answers)||r.answers.length!==2)fail();
      const answers=r.answers.map(a=>{

        if(typeof a.help!=='boolean'||typeof a.helpBefore!=='boolean')fail();
        const history=a.history.map((h,i)=>{if(!h||!['a','b','c'].includes(h.choice)||typeof h.at!=='string'||Number.isNaN(Date.parse(h.at))||i>0&&h.choice===a.history[i-1].choice)fail();return {choice:h.choice,at:h.at};});
        return {order:[...a.order],selected:a.selected,history,help:a.help,helpBefore:a.helpBefore};

      if(typeof r.plan!=='string'||r.plan.length>1000)fail();
      const initial=notes(r.initial,DATA.initialFields),final=notes(r.final,DATA.finalFields);
      if(r.started!==raw.order.includes(id)||!r.started&&(r.unlocked>0||r.read.length>0||r.knewPacket))fail();

      if(r.initialLocked!==(r.unlocked>=2)||r.initialLocked&&(!filled(initial)||!checked(answers[0])))fail();
      if(r.planLocked!==(r.unlocked>=3)||r.planLocked&&(!r.plan.trim()||!planStatus(program(raw.program),r.selected).valid))fail();
      if(r.complete&&(!r.planLocked||!filled(final)||!checked(answers[1])))fail();
      let origin=null;if(r.origin){if(typeof r.origin.session!=='string'||!r.origin.session.length||r.origin.session.length>100||!versions.includes(r.origin.version)||typeof r.origin.at!=='string'||Number.isNaN(Date.parse(r.origin.at)))fail();origin={session:r.origin.session,version:r.origin.version,at:r.origin.at};}
      routes[id]={origin,stage:r.stage,unlocked:r.unlocked,read:[...r.read],started:r.started,knewPacket:r.knewPacket,answers,initial,initialLocked:r.initialLocked,selected:[...r.selected],plan:r.plan,planLocked:r.planLocked,final,complete:r.complete};

    return {kind:raw.kind,version:DATA.version,sourceVersion,mode,peer,followup,submission,key:raw.key,program:raw.program,session:raw.session,created:raw.created,savedAt:raw.savedAt,active:raw.active,screen:raw.screen,order:[...raw.order],routes,comparison,compared:raw.compared};

  function scores(s) {

  }
  function crc(text) {let c=0xffffffff;for(const b of new TextEncoder().encode(text)){c^=b;for(let i=0;i<8;i++)c=c&1?0xedb88320^(c>>>1):c>>>1;}return ((c^0xffffffff)>>>0).toString(16).padStart(8,'0');}

if(typeof module!=='undefined')module.exports=createEngine;

/* Browser interface. All student work stays local until the student submits the Google Form. */
const E=createEngine(DATA), KEY='bardach-advisor-v2-', memory=new Map();
let S=null, home=true, storageError='', corrupt=null, glossaryFocus=null;
const $=s=>document.querySelector(s), esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const p=()=>E.program(S.program), c=()=>p().clients.find(x=>x.id===S.active), r=()=>S.routes[S.active];

function save(){
  if(!S)return;
  S.savedAt=E.now(); S=E.validate(S); if(S.screen==='finish'&&S.compared&&!S.submission)S=E.prepareSubmission(S,'post'); memory.set(S.program,S);
  try{localStorage.setItem(KEY+S.program,JSON.stringify(S));storageError='';}catch{storageError='Przeglądarka nie zapisuje postępu. Pobierz zapis JSON przed zamknięciem karty.';}
  const el=$('#storage');if(el)el.textContent=storageError||'Postęp zapisany w tej przeglądarce. Kopię pobierzesz jako JSON.';
  document.querySelectorAll('[data-action="finish"]').forEach(b=>b.disabled=!S.compared);
  document.querySelectorAll('[data-action="submit-pre"]').forEach(b=>b.disabled=!E.canSubmit(S,'pre'));
  document.querySelectorAll('[data-action="compare"]').forEach(b=>b.disabled=!E.canCompare(S));
}
function message(text,error=false){const el=$('#message');el.textContent=text;el.className='notice '+(error?'warn':'');el.hidden=false;el.setAttribute('role',error?'alert':'status');el.focus();}

function filename(suffix){return `Bardach_v2_${S.program}_${S.session.slice(0,8)}.${suffix}`;}

function readingGuide(){return `<div class="reading-guide"><p><strong>${link('Lektura podstawowa — polski przekład i adaptacja kroków 1–2',DATA.reading)}</strong></p><p>Do gry szczególnie przydadzą się <b>s. ${esc(DATA.readingPriority)}</b>. Wracaj do nich przy odpowiednim zadaniu; nie musisz zapamiętać całego tekstu.</p><details><summary>Mapa lektury: co przeczytać do którego zadania?</summary><div class="inside"><p class="meta">${esc(DATA.readingNote)}</p><dl class="reading-map">${DATA.readingSections.map(x=>`<dt>${esc(x.title)} · s. ${esc(x.pages)}</dt><dd>${esc(x.text)}</dd>`).join('')}</dl><p>Oryginał jest materiałem uzupełniającym i ma inną numerację: ${link('Tekst angielski',DATA.readingOriginal)}.</p></div></details></div>`;}

function standardHelp(){const s=c().standard;return `<div class="notice"><strong>Co znaczy „podstawa oceny”?</strong><p>To punkt odniesienia, wobec którego stan jest „zbyt duży”, „zbyt długi” lub niesprawiedliwy. Nie zawsze jest liczbowy ani bezsporny.</p><p><b>W tym zleceniu:</b> ${esc(s.value)}</p><details><summary>Punkt odniesienia i wskaźnik dla tego klienta</summary><div class="inside"><p><b>Podstawa / punkt odniesienia:</b> ${esc(s.reference)}</p><p><b>Wskaźnik — co opisują dane:</b> ${esc(s.indicator)}</p><p class="meta">Autorskie objaśnienie do lektury PL, s. 7–11. W przekładzie: „Nadaj definicji charakter wartościujący (ewaluacyjny)”. Na tym etapie nie wybierasz jeszcze kryteriów porównania skutków alternatyw z kroku 4.</p></div></details>${termLinks(['reference','indicator'])}</div>`;}
function stepOneCheck(){return `<details><summary>Sprawdź notatkę: trzy pułapki definiowania problemu</summary><div class="inside"><p><b>Rozwiązanie w definicji:</b> czy zamiast problemu wpisałeś/aś brak wybranego środka, np. dodatkowego etatu?</p><p><b>Przyczyna uznana bez sprawdzenia:</b> czy opis klienta traktujesz jako hipotezę, czy już jako fakt? Definicja diagnostyczna jest dopuszczalna, jeśli związek ma uzasadnienie.</p><p><b>Pominięty kontekst:</b> czy uwzględniasz grupę, miejsce i warunki, w których problem występuje?</p><p class="meta">Lektura PL: pułapki — s. 17–19; iteracja — s. 19–20.</p></div></details>`;}
function evidenceGuide(){return `<details><summary>Do czego potrzebujemy dowodów według Bardacha?</summary><div class="inside"><ol><li>Rozpoznanie natury i rozmiaru problemu.</li><li>Rozpoznanie konkretnej sytuacji działania: zasobów, uprawnień, obciążenia i współpracy instytucji.</li><li>Ocena rozwiązań uznawanych za skuteczne gdzie indziej lub wcześniej.</li></ol><p>To trzy główne cele w lekturze PL na s. 25–26. Podział na skalę, przyczyny i wpływ jest pomocny w naszej grze, ale nie jest tą samą trójką autora. Zakres zależy od zlecenia.</p></div></details><details><summary>Przed zebraniem danych: wartość, źródło i termin</summary><div class="inside"><p><b>Wartość:</b> co zmienisz, jeśli wynik okaże się inny niż przypuszczasz? Czy zmiana może prowadzić do lepszej decyzji i jak dużej poprawy?</p><p><b>Źródło:</b> sprawdź, kto i jak zebrał materiał, kogo objął, jakie ma ograniczenia i jakie interesy może mieć autor. Wynik czytaj razem z metodą.</p><p><b>Termin:</b> poproś o dane i rozmowy wcześnie. Nakład Twojej pracy i oczekiwanie na odpowiedź to różne czasy.</p><p><b>Inne perspektywy:</b> poszukaj osób kwestionujących diagnozę klienta. Ich krytykę także trzeba sprawdzić.</p><p class="meta">Lektura PL, s. 26, 28–31. Świadomy szacunek może wystarczyć do części zadań; ważna decyzja może uzasadniać kosztowne badanie. Nie wybieraj danych tylko dlatego, że są łatwo dostępne.</p></div></details>${termLinks(['purposes','value','literature','early','independence'])}`;}
