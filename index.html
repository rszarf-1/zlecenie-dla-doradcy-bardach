function renderHome(){return `<section class="card hero"><p class="eyebrow">Bardach · kroki 1 i 2 · wersja 2.3</p><h1>Zlecenie dla doradcy</h1><p class="lead">Jeden program. Dwóch klientów. Praca samodzielna lub zespołowa.</p><p>Znasz program z analizy procesu polityki. Teraz jako niezależny doradca przygotowujesz wiedzę do konkretnej decyzji publicznej — wykonujesz policy analysis.</p><div class="flow"><div><strong>Przed zajęciami</strong>Rozegraj co najmniej jednego klienta i wyślij zgłoszenie 1. Zachowaj JSON.</div><div><strong>Na zajęciach</strong>Poznaj drugą perspektywę, porównaj obie prace i wyślij zgłoszenie 2.</div><div><strong>Dalsza praca</strong>Wybierz jedno z tych zleceń i sprawdź jedno twierdzenie w rzeczywistym źródle.</div></div><div class="notice"><strong>Wypowiedź klienta jest punktem wyjścia.</strong><p>Możesz ją doprecyzować, podważyć lub podtrzymać. Uzasadnij to dowodami i sytuacją decyzyjną. Wąski problem obsługi programu też może być właściwym przedmiotem zlecenia.</p></div>${readingGuide()}<label for="program"><b>Wybierz swój program</b></label><select id="program" class="wide-select">${DATA.programs.map(x=>`<option value="${x.id}" ${S?.program===x.id?'selected':''}>${esc(x.name)}</option>`).join('')}</select><div class="actions">${btn('Otwórz program / wznów pracę','choose','','primary')}${btn('Wznów własny zapis z pliku','import')}</div>${corrupt?`<div class="notice warn" role="alert"><p>Zapis programu ${esc(corrupt.id)} jest uszkodzony lub niezgodny. Nie został nadpisany.</p><div class="actions">${btn('Pobierz zapis do odzyskania','recover')}${btn('Rozpocznij nową sesję tego programu','replace-corrupt')}</div></div>`:''}<p class="meta">Na początku nie musisz ukończyć obu klientów. Zapis pozostaje w tej przeglądarce; plik JSON pozwala przenieść go na inne urządzenie. Nie wpisuj danych osobowych. Nic nie wysyła się automatycznie.</p></section><section class="card"><h2>Jak pracować</h2><p>W każdej rozegranej ścieżce poznasz zlecenie i rozmowę, zapiszesz roboczy problem, zaplanujesz dwa źródła, przeczytasz dowody i przygotujesz krótką notatkę. Pytania zamknięte wyjaśniają podstawę, pułapkę i sposób poprawy; notatki ocenia prowadząca.</p><p>Samodzielnie: rozegraj obu klientów i porównaj własne analizy. W zespole: jeśli rozegraliście tego samego klienta, wykonajcie drugiego razem; jeśli różnych — wymieńcie się pracami i je omówcie. Nie trzeba przepisywać odpowiedzi drugiej osoby.</p><div class="notice warn">${esc(DATA.fictional)}</div>${sources()}</section>`;}
function overview(){const prepared=Object.values(S.routes).some(x=>x.complete);return `<section class="card"><p class="eyebrow">${esc(p().short)} · przed zajęciami i na zajęciach</p><h1>Dwa zlecenia</h1><label for="work-mode"><b>Jak wykonasz porównanie?</b></label><select id="work-mode" class="wide-select"><option value="solo" ${S.mode==='solo'?'selected':''}>Samodzielnie</option><option value="team" ${S.mode==='team'?'selected':''}>W zespole</option></select><p class="meta">${S.mode==='solo'?'Samodzielnie rozgrywasz obu klientów i porównujesz własne analizy.':'W zespole można wymienić się wcześniej wykonanymi ścieżkami.'} Przed zajęciami każda osoba rozgrywa co najmniej jednego klienta. Tryb można zmienić.</p>${S.mode==='solo'&&Object.values(S.routes).some(x=>x.origin)?'<p class="notice warn">Ten zapis zawiera pracę dołączoną od innej osoby. Do wspólnego porównania wybierz tryb zespołowy. Aby wykonać wszystko samodzielnie, otwórz dołączoną ścieżkę i użyj „Rozpocznij tę ścieżkę ponownie”.</p>':''}<div class="notice"><strong>${prepared?'Przygotowanie przed zajęciami jest gotowe.':'Zacznij od dowolnego klienta.'}</strong><p>${prepared?'Wyślij zgłoszenie 1 przed zajęciami i zachowaj plik ze swoją pracą. Zgłoszenie 2 wyślesz po poznaniu drugiej perspektywy i zapisaniu porównania.':'Przejdź jedną ścieżkę do końca. Na zajęcia przynieś jej zapis; możesz też wcześniej rozegrać obie.'}</p>${E.canSubmit(S,'pre')?`<div class="actions">${btn('Zgłoszenie 1 — przed zajęciami','submit-pre','','primary')}${btn('Zachowaj moje przygotowanie — plik JSON','json')}</div>`:prepared?btn('Zachowaj zapis — plik JSON','json'):''}</div>${S.sourceVersion==='2.0.0'?'<p class="meta">Zachowano Twój zapis z wersji 2.0. Doprecyzowano opisy kart dowodów; przed dalszą pracą zestaw z nimi wcześniejsze notatki.</p>':''}<p>${esc(p().context)}</p><p>${esc(p().background)}</p><div class="guide"><strong>To samo tło, różne zadania.</strong>Ustal, do jakiej decyzji klient potrzebuje wiedzy. Szerszy problem nie jest automatycznie lepszy; diagnozę klienta trzeba sprawdzić.<small>Lektura PL, s. 4, 8–12, 19–20, 25–26.</small></div><div class="grid">${p().clients.map(client=>{const rt=S.routes[client.id];return `<article class="card"><span class="tag">Klient ${client.id.toUpperCase()} · ${esc(E.sourceLabel(S,client.id))}</span><h2 style="margin-top:14px">${esc(client.short)}</h2><p><b>Decyzja:</b> ${esc(client.decision)}</p><p>${esc(client.mandate)}</p>${btn(rt.complete?'Otwórz ścieżkę':rt.started?'Kontynuuj ścieżkę':S.peer[client.id]?'Rozegraj także samodzielnie':'Rozpocznij od tego klienta','client',`data-client="${client.id}"`,'primary')}${S.mode==='team'&&prepared&&!rt.complete?`<div class="actions">${btn(S.peer[client.id]?'Wróć do omówienia w zespole':'Poznaj tę ścieżkę od osoby z zespołu','exchange',`data-client="${client.id}"`)}</div>`:''}</article>`;}).join('')}</div>${S.mode==='team'?`<details><summary>Wymiana prac w zespole — jak to zrobić?</summary><div class="inside"><p>Jeśli wykonaliście różne ścieżki, pokażcie sobie notatki i omówcie: decyzję klienta, definicję problemu, ważny dowód oraz zmianę lub podtrzymanie definicji. Następnie użyj przycisku „Poznaj tę ścieżkę od osoby z zespołu”. Wspólne odpowiedzi wpiszecie tylko w porównaniu.</p><p>Możesz też dołączyć ukończoną ścieżkę z pliku JSON drugiej osoby. Jej notatki pokażą się obok Twoich. Zapis musi dotyczyć tego samego programu.</p>${btn('Dołącz ścieżkę z pliku drugiej osoby','join-import')}</div></details>`:''}${joinPreview()}<div class="actions">${btn(S.mode==='team'?'Porównajcie obie prace':'Porównaj obie prace','compare',`${E.canCompare(S)?'':'disabled'}`,'primary')}${S.compared?btn('Dalsza praca i oddawanie wyników','finish'):''}</div><p class="meta" style="margin-top:16px">Porównanie dotyczy zmiany klienta i wartości informacji. Wiedza z pierwszej ścieżki może pomóc w drugiej; to nie jest niezależny test „przed i po”.</p></section>${sources()}`;}
function brief(){return `<section class="card"><p class="eyebrow">1 / 4 · poznaj klienta</p><h2>Zlecenie i rozmowa</h2><p><b>${esc(c().title)}</b></p><blockquote>${esc(c().mandate)}</blockquote><dl class="brief-dl"><dt>Decyzja</dt><dd>${esc(c().decision)}</dd><dt>Możliwości</dt><dd>${esc(c().powers)}</dd><dt>Zależności</dt><dd>${esc(c().limits)}</dd><dt>Termin i zasoby</dt><dd>W symulacji: krótka notatka dla klienta (brief) za 5 dni. Możesz przeznaczyć łącznie 3 dni pracy na przygotowanie dwóch źródeł. To ograniczenia analizy, nie zegar odliczający czas gry.</dd></dl>${guide('Posłuchaj klienta, a potem samodzielnie sformułuj problem.','Oddziel to, co klient chce poprawić, od przypuszczenia o przyczynie i preferowanego rozwiązania. Wyjaśnij też, dlaczego klient uznaje ten stan za wymagający poprawy.','8–12, 17–20')}<h3>Trzy pytania doradcy</h3><p>Otwórz każdą odpowiedź. Zapamiętaj: decyzję, zakres i to, czego klient jeszcze nie wie.</p>${c().talk.map((t,i)=>`<div class="talk">${btn(esc(t.question),'talk',`data-index="${i}" aria-expanded="${r().read.includes(i)}" aria-controls="talk-${i}"`)}${r().read.includes(i)?`<p id="talk-${i}"><b>Klient:</b> ${esc(t.answer)}</p>`:`<div id="talk-${i}" hidden></div>`}</div>`).join('')}<details><summary>Dodatkowe pytanie: kto mógłby nie zgodzić się z klientem?</summary><div class="inside"><p><b>Klient:</b> ${esc(c().critic)}</p><p class="meta">To fikcyjna relacja klienta o możliwej krytyce, nie bezpośrednia wypowiedź krytyków. Bardach zaleca kontakt z nimi; samo pytanie klienta jest tylko częściowym zamiennikiem (lektura PL, s. 31).</p>${termLinks(['independence','relations'])}</div></details><details><summary>Uporządkuj punkt wyjścia</summary><div class="inside">${esc(c().seed)}</div></details>${r().knewPacket?'<div class="notice">To kolejna ścieżka. Wspólny pakiet był już dostępny podczas wcześniejszej pracy; możesz się do niego odwoływać także w roboczej notatce.</div>':''}<div class="actions">${btn('Przejdź do roboczej definicji','next-brief','','primary')}</div></section>`;}
function initial(){return `<section class="card"><p class="eyebrow">2 / 4 · krok 1 Bardacha</p><h2>Robocza definicja problemu</h2>${guide('Zlecenie jest materiałem do analizy.','Nazwij niepożądany stan, grupę, zakres i podstawę oceny. Jeśli definicja wskazuje przyczynę, zaznacz, co wymaga sprawdzenia. Nie przedstawiaj przypuszczeń jako faktów ani wybranego rozwiązania jako problemu.','8–12, 17–20')}${standardHelp()}${termLinks(['hypothesis','cause'])}${question(0)}<h3>Teraz zapisz własną notatkę</h3><p>Nie trzeba przepisywać odpowiedzi z pytania zamkniętego. Sformułuj problem konkretnie dla tego klienta.</p>${DATA.initialFields.map(f=>field(f,'initial',r().initial[f.id],r().initialLocked)).join('')}${stepOneCheck()}<div class="actions">${btn(r().initialLocked?'Przejdź do zapisanego planu':'Zachowaj wersję roboczą i zaplanuj dowody','next-initial','','primary')}</div><p class="meta" style="margin-top:16px">Po przejściu dalej zachowamy tę wersję do porównania. Nową definicję wpiszesz po zapoznaniu się z dowodami.</p></section>`;}
function plan(){const ps=E.planStatus(p(),r().selected);return `<section class="card"><p class="eyebrow">3 / 4 · krok 2 Bardacha</p><h2>Zaplanuj zbieranie niezbędnych dowodów</h2>${guide('Pomyśl, zanim zaczniesz zbierać.','Wybierz informacje, które mogą zmienić rozpoznanie problemu lub przygotowanie decyzji. Ustal pytanie, źródło i wartość informacji wobec czasu i kosztu jej zdobycia.','25–26, 28–31')}${evidenceGuide()}<details><summary>Moja robocza definicja i hipoteza</summary><div class="inside"><p class="note">${esc(r().initial.problem)}</p><p class="note">${esc(r().initial.hypothesis)}</p></div></details><p><b>Wybierz dokładnie 2 źródła.</b> Łączny nakład nie może przekroczyć 3 dni pracy, a oba źródła muszą być dostępne najpóźniej w dniu 5. Dostępność liczona jest od dziś; prace mogą toczyć się równolegle. Źródło D6 możesz rozważyć w dalszym zadaniu.</p><div class="budget" id="budget" role="status">${budgetText(ps)}</div><div class="evidence-grid">${p().cards.map(card=>`<label class="evidence-choice"><input type="checkbox" data-card="${card.id}" ${r().selected.includes(card.id)?'checked':''} ${r().planLocked?'disabled':''}><span><strong>${card.id} · ${esc(card.title)}</strong><p>${esc(card.scope)}</p><small>Nakład: ${card.cost} ${card.cost===1?'dzień':'dni'} pracy. Dostępność: dzień ${card.wait}.</small></span></label>`).join('')}</div><div class="field"><label for="plan">Dlaczego te dwa źródła?</label><p id="plan-help">Dla każdego źródła podaj pytanie i wyjaśnij znaczenie odpowiedzi dla decyzji klienta. Przy jednym pokaż, jak dwa różne możliwe wyniki zmieniłyby Twoje rozpoznanie. Wystarczą 3–4 krótkie zdania.</p><textarea id="plan" maxlength="1000" data-group="plan" aria-describedby="plan-help" ${r().planLocked?'readonly':''}>${esc(r().plan)}</textarea><small>Do 1000 znaków. Nie punktujemy automatycznie zestawu kart; liczy się uzasadnienie.</small><details><summary>Pomoc w uzasadnieniu</summary><div class="inside">„D… pozwoli ustalić […], co jest ważne dla decyzji […]. Jeśli wynik pokaże […], sprawdzę […]; jeśli […], skupię się na […]”. Drugie źródło uzasadnij jednym zdaniem. Możesz potrzebować danych o skali, przyczynach, wpływie programu albo możliwościach działania klienta — zależnie od zlecenia.</div></details></div><div class="actions">${btn(r().planLocked?'Otwórz pakiet i rewizję':'Zapisz plan i otwórz dowody','next-plan','','primary')}</div><p class="meta" style="margin-top:16px">Po zapisaniu plan pozostanie widoczny. Dla celów szkoleniowych otrzymasz cały pakiet, dzięki czemu obie ścieżki będą porównywalne. Potem wskażesz, czego jeszcze warto się dowiedzieć.</p></section>`;}
function budgetText(ps){return `Wybrane źródła: ${ps.count}/2 · Nakład: ${ps.cost}/3 dni pracy · Najpóźniejsza dostępność: dzień ${ps.wait}/5. ${ps.valid?'Plan mieści się w ograniczeniach.':''}`;}
function revision(){return `<section class="card"><p class="eyebrow">4 / 4 · wróć do kroku 1 po kroku 2</p><h2>Dowody i ponowne przemyślenie definicji</h2>${guide('Stosuj iterację (powtarzaj kroki).','Sprawdź, co dowody mówią o skali, możliwych przyczynach, skutkach programu i kontekście działania. Możesz zmienić albo podtrzymać definicję. Wskaż podstawę i granicę wniosku.','19–20, 25–26, 29–31')}${termLinks(['iteration','evidence','sample','impact'])}<details><summary>Mój zachowany plan</summary><div class="inside"><p>${esc(r().selected.join(' + '))}</p><p class="note">${esc(r().plan)}</p></div></details>${packet()}<p class="notice">Przed odpowiedzią na pytanie niżej przeczytaj karty, do których się ono odwołuje — także wtedy, gdy nie były w Twoim planie.</p>${question(1)}<h3>Krótki brief dla klienta</h3><details open><summary>Moja wersja robocza — punkt odniesienia</summary><div class="inside"><p class="note">${esc(r().initial.problem)}</p><p class="note">${esc(r().initial.hypothesis)}</p></div></details>${DATA.finalFields.map(f=>field(f,'final',r().final[f.id])).join('')}<div class="actions">${btn('Zapisz brief i zakończ tę ścieżkę','complete-client','','primary')}</div><p class="meta" style="margin-top:16px">Zakończenie sprawdza obecność odpowiedzi, nie jakość argumentacji. Tę omówicie z prowadzącym.</p></section>`;}
function compare(){const cols=p().clients;const val=(x,key,group='final')=>S.routes[x.id].complete?S.routes[x.id][group][key]:'Omówiono ustnie — skorzystajcie z notatki osoby, która rozegrała tę ścieżkę. Nie trzeba jej przepisywać.';const rows=[['Sposób poznania',x=>E.sourceLabel(S,x.id)],['Decyzja klienta',x=>x.decision],['Definicja robocza',x=>val(x,'problem','initial')],['Definicja po dowodach',x=>val(x,'problem')],['Co zmieniono lub podtrzymano',x=>val(x,'revision')],['Plan źródeł',x=>S.routes[x.id].complete?S.routes[x.id].selected.join(' + ')+': '+S.routes[x.id].plan:'Przedstawiony w rozmowie zespołu'],['Dalsza informacja',x=>val(x,'next')]];return `<section class="card"><p class="eyebrow">Porównanie · jeden program, dwie decyzje</p><h2>Co zmienił klient?</h2><p>${S.mode==='team'?'Przed pisaniem uzgodnijcie wspólne wnioski. Korzystajcie z zapisów oraz z wymiany prac.':'Porównaj własną pracę dla obu klientów.'} Klient wpływa na zakres analizy i wartość informacji. Nie zmienia prawdziwości danych ani obowiązku sprawdzania hipotez.</p><details><summary>Zestawienie prac dla obu klientów</summary><div class="inside compare"><table><caption class="sr-only">Porównanie obu ścieżek</caption><thead><tr><th scope="col">Element</th>${cols.map(x=>`<th scope="col">${esc(x.short)}</th>`).join('')}</tr></thead><tbody>${rows.map(([label,fn])=>`<tr><th scope="row">${label}</th>${cols.map(x=>`<td data-label="${esc(x.short)}" style="white-space:pre-wrap">${esc(fn(x))}</td>`).join('')}</tr>`).join('')}</tbody></table></div></details>${DATA.compareFields.map(f=>field(f,'comparison',S.comparison[f.id])).join('')}<div class="actions">${btn('Zapisz porównanie i przejdź dalej','complete-compare','','primary')}</div></section>`;}
function submissionPanel(stage){return `<ol><li>Skopiuj cały kod przyciskiem poniżej.</li><li>Otwórz formularz i wybierz <b>etap ${stage==='pre'?'1 — przed zajęciami':'2 — po porównaniu'}</b>. Wklej kod w „Kod rozgrywki BD1”.</li><li>Podaj oznaczenie zespołu albo „indywidualnie” oraz własną opinię. W etapie 2 podaj tylko czas dalszej pracy, bez czasu zgłoszonego wcześniej.</li><li>Kliknij „Prześlij” w formularzu i sprawdź potwierdzenie. Zachowaj też plik JSON.</li></ol><label for="submission-code"><b>Kod do formularza — etap ${stage==='pre'?'1':'2'}</b></label><textarea id="submission-code" class="code" readonly spellcheck="false">${esc(E.encode(S))}</textarea><div class="actions">${btn('Kopiuj kod','copy-code','','primary')}<a class="button" target="_blank" rel="noopener" href="${esc(DATA.formUrl)}">Otwórz formularz Google ↗</a></div><p class="meta">Formularz wymaga zalogowania i zbiera zweryfikowany e-mail; użyj konta UW. Program, klienci, odpowiedzi i sposób poznania ścieżek są w kodzie — nie wpisujesz ich ponownie. Opinie służą poprawie gry. Samo skopiowanie kodu lub otwarcie formularza nie wysyła pracy. Poprawkę wyślij ponownie, wybierając ten sam etap.</p><div class="actions">${btn('Pobierz raport TXT','txt')}${btn('Pobierz kopię JSON','json')}${btn('Drukuj / zapisz PDF','print')}</div>`;}
function submitPre(){return `<section class="card"><p class="eyebrow">Przygotowanie przed zajęciami</p><h1>Zgłoszenie 1 — przed zajęciami</h1><p>Ukończono co najmniej jedną własną ścieżkę. To wystarczy do pierwszego zgłoszenia. Kod zawiera obecną pracę, także jeśli zdążyłeś/aś już poznać obu klientów.</p><p>Każda osoba wysyła swój kod i własną opinię. Na zajęciach wrócisz do tej samej gry: poznasz drugą perspektywę albo wymienisz się pracą w zespole, a następnie zapiszesz porównanie.</p>${submissionPanel('pre')}<div class="actions">${btn('Wróć do dwóch zleceń','overview')}</div><details><summary>Sprawdź zawartość raportu</summary><div class="inside"><pre class="report">${esc(E.reportText(S))}</pre></div></details></section>`;}
function finish(){const sc=E.scores(S);return `<section class="card"><p class="eyebrow">Obie perspektywy poznane · porównanie zapisane</p><h1>Omówienie i dalsza praca</h1><p>${S.mode==='team'?'Macie':'Masz'} porównanie pracy dla dwóch klientów programu <b>${esc(p().name)}</b>. Na zajęciach omówcie jeden przykład zmiany problemu lub priorytetu dowodowego. Następnie wybierz jedno z tych zleceń do dalszej pracy — trzeciego klienta nie trzeba wymyślać.</p><details><summary>Rozmowa z prowadzącą: od badania procesu do doradzania</summary><div class="inside"><p>W K2 wyjaśnialiście proces polityki, np. rolę koalicji lub powiązanie strumieni w przyjęciu programu. Teraz przygotowujecie wiedzę do decyzji konkretnego klienta. Wiedza o aktorach i ograniczeniach nadal pomaga.</p><ol><li>Co klient powiedział, a jak sformułowano problem?</li><li>Który dowód zmienił lub wzmocnił definicję?</li><li>Co zmieniło się wraz z klientem, a jakie fakty pozostały wspólne?</li></ol></div></details>${followupPanel()}<h2>Zgłoszenie 2 — po porównaniu</h2><p><b>Każda osoba wysyła własny formularz.</b> Możecie wkleić wspólny kod zespołu, ale każdy podaje własny czas i własną opinię o grze. Próbę K3 można uzupełnić później; nie blokuje oddania porównania.</p>${submissionPanel('post')}<div class="actions">${btn('Wróć do porównania','compare')}</div><details><summary>Informacja zwrotna z pytań i pełny raport</summary><div class="inside"><p>Sprawdzono ${sc.checked} z 4 pytań gry. Poprawne pierwsze wybory: ${sc.first}/${sc.checked}; ostatnie: ${sc.last}/${sc.checked}. Omówienie ustne nie tworzy odpowiedzi. Dołączone odpowiedzi pochodzą z pracy innej osoby; wspólny wynik nie jest indywidualną oceną.</p><pre class="report">${esc(E.reportText(S))}</pre></div></details></section><section class="card"><p class="eyebrow">Dalej · krok 3 Bardacha</p><h2>Konstruowanie alternatyw</h2><p>Dla jednego z poznanych klientów przygotujesz różne sposoby działania na podstawie definicji i dowodów. Uwzględnisz kontynuację obecnych działań i trendów, potrzebne uzgodnienia oraz możliwość łączenia działań. Nie wybieramy jeszcze ostatecznej rekomendacji.</p><p class="meta">Zapowiedź w polskiej adaptacji: s. 34. To następne zadanie analizy polityki publicznej (policy analysis); pełny krok 3 nie jest objęty tą lekturą.</p></section>${sources()}`;}
function sidebar(){return `<aside aria-label="Nawigacja i zapis"><nav class="steps" aria-label="Etapy pracy">${btn('Dwa zlecenia','overview',` ${S.screen==='overview'?'aria-current="step"':''}`)}${S.screen==='path'?['Zlecenie i rozmowa','Robocza definicja','Plan dowodów','Dowody i rewizja'].map((t,i)=>btn(`<span class="stepnum">${i+1}</span>${t}`,'stage',`data-index="${i}" ${r().stage===i?'aria-current="step"':''} ${r().unlocked<i?'disabled':''}`)).join(''):''}${E.canSubmit(S,'pre')?btn('Zgłoszenie 1 — przed zajęciami','submit-pre',S.screen==='submit-pre'?'aria-current="step"':''):''}${btn('Porównanie','compare',`${S.screen==='compare'?'aria-current="step"':''} ${!E.canCompare(S)?'disabled':''}`)}${S.compared?btn('Zgłoszenie 2 — po porównaniu','finish',S.screen==='finish'?'aria-current="step"':''):''}<p id="storage" class="storage">${esc(storageError||'Postęp zapisuje się w tej przeglądarce. Pobierz także kopię JSON.')}</p><div class="toolbar">${btn('Zapis JSON','json')}${btn('Raport TXT','txt')}${btn('Wczytaj JSON','import')}${btn('Nowa sesja','new')}</div></nav></aside>`;}
function render(focus=true){
  const focused=document.activeElement;
  const remember=focused?.id?{id:focused.id}:focused?.name?{name:focused.name,value:focused.value}:focused?.dataset.action?{action:focused.dataset.action,index:focused.dataset.index,client:focused.dataset.client}:null;
  $('#app').innerHTML=home?`<main id="main" tabindex="-1">${renderHome()}</main>`:`<div class="layout">${sidebar()}<main id="main" tabindex="-1">${S.screen==='path'?`<section class="card compact"><p class="eyebrow">${esc(p().short)} · klient ${S.active.toUpperCase()}</p><strong>${esc(c().title)}</strong><p><b>Decyzja:</b> ${esc(c().decision)}</p></section>`:''}${S.screen==='overview'?overview():S.screen==='exchange'?exchange():S.screen==='compare'?compare():S.screen==='finish'?finish():S.screen==='submit-pre'?submitPre():[brief,initial,plan,revision][r().stage]()}${S.screen==='path'&&r().stage<3&&Object.values(S.routes).some(x=>x.planLocked)?`<details><summary>Wspólny pakiet znany z wcześniejszej pracy</summary><div class="inside">${packet(c(),false)}</div></details>`:''}${S.screen==='path'?`<details><summary>Rozpocznij tę ścieżkę ponownie</summary><div class="inside"><p>Usunie to notatki i historię tylko tego klienta. Porównanie pozostanie jako szkic do ponownego zatwierdzenia. Wiedzy poznanej w poprzednim przebiegu nie można cofnąć.</p>${btn('Wyzeruj ścieżkę tego klienta','reset-client')}</div></details>`:''}<p class="foot">Wersja 2.3 · fikcyjny materiał dydaktyczny · ${link('Bardach, kroki 1 i 2',DATA.reading)}</p></main></div>`;
  $('#message').hidden=true;
  if(focus){$('#main').focus({preventScroll:true});window.scrollTo({top:0,behavior:'instant'});}
  else if(remember){const target=remember.id?document.getElementById(remember.id):remember.name?[...document.querySelectorAll('[name]')].find(x=>x.name===remember.name&&x.value===remember.value):[...document.querySelectorAll('[data-action]')].find(x=>x.dataset.action===remember.action&&x.dataset.index===remember.index&&x.dataset.client===remember.client);target?.focus({preventScroll:true});}
}
function invalidate(){r().complete=false;S.peer[S.active]=null;S.compared=false;S.followup.done=false;}
function renderTerms(){
  const query=$('#term-search').value.toLocaleLowerCase('pl'),scope=$('#term-scope').value;
  const available=DATA.terms.filter(t=>!t.programs||(S&&t.programs.includes(S.program)));
  const list=available.filter(t=>(scope==='all'||t.group===scope)&&[t.name,t.en,t.definition,S?t.examples[S.program]:''].join(' ').toLocaleLowerCase('pl').includes(query));
  $('#term-count').textContent=`Widoczne hasła: ${list.length} z ${available.length}. Przykłady: ${S?p().short:'wybierz program'}.`;
  const origins={paraphrase:'Z lektury — parafraza',synthesis:'Objaśnienie do lektury',support:'Pojęcie pomocnicze'};
  $('#terms').innerHTML=list.map(t=>`<article class="term" data-term-id="${t.id}"><span class="tag">${origins[t.origin]}</span><h3>${esc(t.name)}</h3>${t.en?`<p class="meta">${esc(t.en)}</p>`:''}<p>${esc(t.definition)}</p>${S?`<p class="example"><b>${esc(p().short)}:</b> ${esc(t.examples[S.program])}</p>`:'<p class="meta">Wybierz program, aby zobaczyć przykład.</p>'}<p class="source">${t.pages?`${link('Lektura PL, s. '+t.pages,DATA.reading)}. `:''}${esc(t.basis)}${t.sourceUrl?' '+link('Źródło uzupełniające',t.sourceUrl):''}</p></article>`).join('')||'<p>Brak pasujących haseł. Zmień zakres lub wpisz inne słowo.</p>';
}
let joinDonor=null;
function joinPreview(){if(!joinDonor)return '';const choices=p().clients.filter(x=>joinDonor.routes[x.id].complete);return `<section class="notice" id="join-preview"><h2>Dołącz jedną ukończoną ścieżkę</h2><p>Plik dotyczy ${esc(p().name)}. Twoja druga ścieżka pozostanie zachowana. Zastąpienie już rozpoczętej pracy wymaga dodatkowego potwierdzenia.</p><label for="join-client">Wybierz klienta z pliku</label><select id="join-client" class="wide-select">${choices.map(x=>`<option value="${x.id}">${x.id.toUpperCase()} · ${esc(x.short)}</option>`).join('')}</select><div class="actions">${btn('Dołącz wybraną ścieżkę','confirm-join','','primary')}${btn('Anuluj dołączanie','cancel-join')}</div></section>`;}
function exchange(){return `<section class="card"><p class="eyebrow">Wymiana w zespole · klient ${S.active.toUpperCase()}</p><h1>Poznaj pracę drugiej osoby</h1><p>Ta możliwość dotyczy sytuacji, gdy ktoś z zespołu rozegrał już tego klienta. Jeśli wszyscy wykonaliście drugiego — rozegrajcie tę ścieżkę razem.</p><h2>${esc(c().title)}</h2><blockquote>${esc(c().mandate)}</blockquote><p><b>Decyzja:</b> ${esc(c().decision)}</p><details><summary>Przypomnijcie rozmowę i możliwości klienta</summary><div class="inside"><p><b>Możliwości:</b> ${esc(c().powers)}</p><p><b>Zależności:</b> ${esc(c().limits)}</p>${c().talk.map(t=>`<p><b>${esc(t.question)}</b><br>${esc(t.answer)}</p>`).join('')}</div></details><ol><li>Osoba, która rozegrała tę ścieżkę, pokazuje swoją notatkę.</li><li>Wyjaśnia definicję problemu, wybór źródeł oraz jeden dowód, po którym zmieniła lub podtrzymała definicję.</li><li>Pozostali pytają o uzasadnienie. Wspólne wnioski zapiszecie za chwilę w porównaniu.</li></ol><details><summary>Wspólny pakiet do rozmowy</summary><div class="inside">${packet(c(),false)}</div></details><label class="option"><input id="exchange-check" type="checkbox" ${S.peer[S.active]?'checked':''}><span>Ktoś z naszego zespołu ukończył tę ścieżkę. Omówiliśmy zlecenie, definicję, dowód i rewizję; możemy porównać tę pracę z drugim klientem.</span></label><p class="meta">Potwierdzenie zapisze wymianę w zespole. Nie dopisze odpowiedzi na pytania ani punktów za tę ścieżkę.</p><div class="actions">${btn('Potwierdź omówienie i wróć do porównania','confirm-exchange','','primary')}${btn('Wróć bez zmian','overview')}</div></section>`;}
function followupPanel(){const f=S.followup,client=p().clients.find(c=>c.id===f.client);return `<details id="followup-panel"><summary>Początek K3: jedno znane zlecenie i jedna weryfikacja</summary><div class="inside"><p>Wykonaj po omówieniu z prowadzącą. Zlecenie może pozostać jawną symulacją; nie potrzebujesz trzeciego klienta ani nowej rozmowy. Sprawdź jedno ważne twierdzenie w rzeczywistym źródle, np. dokumencie poznanym wcześniej.</p><p class="notice warn">Dane i wypowiedzi z gry są fikcyjne. Nie przenoś ich do K3 jako ustaleń o rzeczywistym programie. Brak źródła lub nierozstrzygający dokument można jawnie zaznaczyć.</p><label for="followup-client"><b>Kontynuuję zlecenie klienta</b></label><select id="followup-client" class="wide-select"><option value="">Wybierz A lub B</option>${p().clients.map(c=>`<option value="${c.id}" ${f.client===c.id?'selected':''}>${c.id.toUpperCase()} · ${esc(c.short)}</option>`).join('')}</select>${client?`<p><b>Decyzja:</b> ${esc(client.decision)}</p><details><summary>Przypomnij zlecenie i dotychczasową definicję</summary><div class="inside"><p>${esc(client.mandate)}</p><p>${esc(S.routes[client.id].final.problem||'Odwołajcie się do notatki osoby, która rozegrała tego klienta.')}</p></div></details>`:''}${DATA.followupFields.map(x=>field(x,'followup',f[x.id])).join('')}<p class="meta" id="followup-status">${f.done?'Próba K3 zapisana.':'Szkic. Możesz wrócić do niego na zajęciach.'}</p>${btn('Zapisz krótką próbę K3','save-followup','','primary')}<p class="meta">To początek K3. Warianty działania, kryteria i przewidywane skutki opracujesz na kolejnych zajęciach.</p></div></details>`;}
async function actTeam(action,el){
  if(!S)return false;
  if(action==='exchange'){if(S.mode!=='team'||!Object.values(S.routes).some(x=>x.complete))return true;S.active=el.dataset.client;S.screen='exchange';commit();return true;}
  if(action==='confirm-exchange'){if(S.mode!=='team'||S.screen!=='exchange')return true;if(!$('#exchange-check').checked){message('Najpierw wymieńcie się pracą i zaznaczcie potwierdzenie omówienia.',true);return true;}S.peer[S.active]=E.now();S.compared=false;S.followup.done=false;S.screen='overview';commit();return true;}
  if(action==='join-import'){$('#join-file').click();return true;}
  if(action==='cancel-join'){joinDonor=null;render();return true;}
  if(action==='confirm-join'){if(!joinDonor)return true;const id=$('#join-client').value,replace=S.routes[id].started;if(replace&&!confirm('Zastąpić dotychczasową pracę klienta '+id.toUpperCase()+' ścieżką z pliku? Drugi klient pozostanie bez zmian. Anuluj, jeśli najpierw chcesz pobrać kopię JSON.'))return true;S=E.mergeRoute(S,joinDonor,id,replace);joinDonor=null;commit();message('Dołączono ukończoną ścieżkę. Omówcie ją razem przed porównaniem.');return true;}
  if(action==='save-followup'){if(!S.followup.client||!DATA.followupFields.every(f=>S.followup[f.id].trim())){message('Wybierz jednego z dwóch klientów i uzupełnij trzy krótkie odpowiedzi. Brak źródła można oznaczyć jako „niesprawdzone”.',true);return true;}S.followup.done=true;save();$('#followup-status').textContent='Próba K3 zapisana.';$('#submission-code').value=E.encode(S);$('main pre.report').textContent=E.reportText(S);message('Zapisano próbę K3 w raporcie i kodzie do formularza.');return true;}
  return false;
}
function refreshFollowup(){save();if($('#submission-code'))$('#submission-code').value=E.encode(S);if($('main pre.report'))$('main pre.report').textContent=E.reportText(S);if($('#followup-status'))$('#followup-status').textContent='Szkic po zmianie — zapisz próbę ponownie.';}
async function act(action,el){
  if(await actTeam(action,el))return;
  if(action==='home'){joinDonor=null;home=true;render();return;}
  if(action==='glossary'){glossaryFocus=document.activeElement;const term=DATA.terms.find(t=>t.id===el.dataset.term);$('#term-search').value=term?.name||'';$('#term-scope').value=term?'all':'start';renderTerms();$('#glossary').showModal();$('#term-search').focus();return;}
  if(action==='close-glossary'){$('#glossary').close();return;}
  if(action==='choose'){joinDonor=null;selectProgram($('#program').value);return;}
  if(action==='import'){$('#import-file').click();return;}
  if(action==='recover'){download(`Bardach_v2_${corrupt.id}_odzyskanie.txt`,corrupt.raw);return;}
  if(action==='replace-corrupt'){if(confirm('Zachowaj kopię uszkodzonego zapisu, jeśli chcesz go odzyskać. Zastąpić go nową sesją?')){S=E.fresh(corrupt.id);corrupt=null;home=false;commit();}return;}
  if(!S)return;
  if(action==='json'){save();download(filename('json'),JSON.stringify(S,null,2),'application/json');return;}
  if(action==='txt'){save();download(filename('txt'),E.reportText(S));return;}
  if(action==='print'){$('#print-report').textContent=E.reportText(S);window.print();return;}
  if(action==='copy-code'){const box=$('#submission-code');box.focus();box.select();try{await navigator.clipboard.writeText(box.value);message('Kod skopiowany. Wklej go w formularzu Google.');}catch{message('Kod jest zaznaczony. Skopiuj go skrótem Ctrl+C (na Macu ⌘C), a następnie wklej w formularzu.');}return;}
  if(action==='new'){if(confirm('Rozpocząć nową sesję tego programu? Zastąpi to lokalny postęp. Najpierw pobierz JSON, jeśli chcesz go zachować.')){S=E.fresh(S.program);home=false;commit();}return;}
  if(action==='submit-pre'){S=E.prepareSubmission(S,'pre');commit();return;}
  if(action==='overview'){S.screen='overview';commit();return;}
  if(action==='client'){startClient(el.dataset.client);return;}
  if(action==='stage'){const i=Number(el.dataset.index);if(i<=r().unlocked){r().stage=i;S.screen='path';commit();}return;}
  if(action==='talk'){const i=Number(el.dataset.index);if(!r().read.includes(i))r().read.push(i);commit(false);return;}
  if(action==='next-brief'){if(r().read.length<3){message('Otwórz wszystkie trzy odpowiedzi klienta przed sformułowaniem problemu.',true);return;}r().unlocked=Math.max(r().unlocked,1);r().stage=1;commit();return;}
  if(action==='hint'){const a=r().answers[Number(el.dataset.index)];a.help=true;if(!a.history.length)a.helpBefore=true;commit(false);return;}
  if(action==='check'){const i=Number(el.dataset.index),a=r().answers[i];if(i===0&&r().initialLocked)return;if(!a.selected){message('Najpierw wybierz jedną odpowiedź.',true);return;}if(!E.checked(a)){if(a.history.length>=100){message('Osiągnięto limit 100 zmian odpowiedzi. Zachowaj ostatni sprawdzony wybór.',true);return;}a.history.push({choice:a.selected,at:E.now()});}commit(false);return;}
  if(action==='next-initial'){if(!E.checked(r().answers[0])||!E.filled(r().initial)){message('Sprawdź odpowiedź zamkniętą i uzupełnij obie krótkie notatki. Poprawny wynik pytania zamkniętego nie jest warunkiem przejścia.',true);return;}r().initialLocked=true;r().unlocked=Math.max(r().unlocked,2);r().stage=2;commit();return;}
  if(action==='next-plan'){if(!E.planStatus(p(),r().selected).valid||!r().plan.trim()){message('Wybierz dokładnie 2 źródła: do 3 dni pracy łącznie, oba dostępne do dnia 5. Dodaj uzasadnienie wyboru.',true);return;}r().planLocked=true;r().unlocked=3;r().stage=3;commit();return;}
  if(action==='complete-client'){if(!E.checked(r().answers[1])||!E.filled(r().final)){message('Sprawdź odpowiedź zamkniętą i uzupełnij trzy pola briefu. Każde pole może zawierać krótką odpowiedź.',true);return;}r().complete=true;S.screen='overview';commit();return;}
  if(action==='compare'){if(!E.canCompare(S)){message('Poznaj obie perspektywy: rozegraj ścieżki lub w trybie zespołowym omów pracę drugiej osoby.',true);return;}S.screen='compare';commit();return;}
  if(action==='complete-compare'){if(!E.filled(S.comparison)){message('Uzupełnij trzy krótkie odpowiedzi porównujące ścieżki.',true);return;}S.compared=true;S=E.prepareSubmission(S,'post');commit();return;}
  if(action==='finish'){if(S.compared){S=E.prepareSubmission(S,'post');commit();}return;}
  if(action==='reset-client'){if(confirm('Usunąć lokalne odpowiedzi tylko tego klienta i ponownie otworzyć porównanie?')){const id=S.active,known=Object.values(S.routes).some(x=>x.planLocked);S.routes[id]=E.route();S.peer[id]=null;S.followup.done=false;S.order=S.order.filter(x=>x!==id);S.compared=false;startClient(id);r().knewPacket=known;commit();}return;}
}
document.addEventListener('click',e=>{const el=e.target.closest('[data-action]');if(el&&!el.disabled)Promise.resolve(act(el.dataset.action,el)).catch(err=>message('Nie udało się wykonać operacji: '+err.message,true));});
document.addEventListener('input',e=>{const el=e.target;if(el.id==='term-search'){if(el.value.trim())$('#term-scope').value='all';renderTerms();return;}if(!S||!el.dataset.group||el.readOnly)return;const group=el.dataset.group;if(group==='followup'){S.followup[el.dataset.field]=el.value;S.followup.done=false;refreshFollowup();return;}if(group==='comparison'){S.comparison[el.dataset.field]=el.value;S.compared=false;S.followup.done=false;}else if(group==='plan')r().plan=el.value;else{r()[group][el.dataset.field]=el.value;if(group==='final')invalidate();}save();});
document.addEventListener('change',e=>{const el=e.target;if(!S)return;if(el.dataset.question!==undefined){const i=Number(el.dataset.question);if(i===0&&r().initialLocked)return;r().answers[i].selected=el.value;if(i===1)invalidate();commit(false);}if(el.dataset.card){if(r().planLocked)return;const id=el.dataset.card;if(el.checked&&r().selected.length>=2){el.checked=false;message('Wybrano już dwa źródła. Odznacz jedno, aby wybrać inne.',true);return;}r().selected=el.checked?[...r().selected,id]:r().selected.filter(x=>x!==id);save();$('#budget').textContent=budgetText(E.planStatus(p(),r().selected));}});
document.addEventListener('change',e=>{if(!S)return;const el=e.target;
  if(el.id==='work-mode'){S.mode=el.value;S.compared=false;S.followup.done=false;S.screen='overview';joinDonor=null;commit(false);}
  if(el.id==='followup-client'){S.followup.client=el.value||null;S.followup.done=false;save();render(false);$('#followup-panel').open=true;$('#followup-client').focus();}
});
$('#join-file').addEventListener('change',async e=>{const f=e.target.files[0];e.target.value='';if(!f||!S)return;try{if(f.size>300000)throw Error('Wybierz pojedynczy plik JSON gry.');const donor=E.validate(JSON.parse(await f.text()));if(donor.program!==S.program)throw Error('Plik dotyczy innego programu.');if(donor.session===S.session)throw Error('To plik tej samej sesji; użyj wznowienia własnego zapisu.');if(!Object.values(donor.routes).some(x=>x.complete))throw Error('W pliku nie ma ukończonej ścieżki.');joinDonor=donor;S.screen='overview';commit();$('#join-preview').scrollIntoView();$('#join-client').focus();}catch(err){message('Nie dołączono pliku: '+err.message,true);}});
$('#term-scope').addEventListener('change',renderTerms);
$('#glossary').addEventListener('close',()=>glossaryFocus?.focus());
$('#glossary').addEventListener('keydown',e=>{if(e.key==='Escape'){e.preventDefault();$('#glossary').close();}});
$('#import-file').addEventListener('change',async e=>{const f=e.target.files[0];e.target.value='';if(!f)return;try{if(f.size>300000)throw Error('Plik jest za duży. Wybierz pojedynczy zapis JSON gry.');const next=E.validate(JSON.parse(await f.text()));if(!confirm(`Wczytać zapis programu ${E.program(next.program).name}? Zastąpi to lokalny postęp tego programu.`))return;S=next;home=false;corrupt=null;joinDonor=null;commit();message('Wczytano zapis. Możesz kontynuować pracę.');}catch(err){message('Nie wczytano pliku: '+err.message,true);}});
render(false);

</script></body></html>
