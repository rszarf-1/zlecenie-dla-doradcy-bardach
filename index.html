etapów, żeby mieszkańcy mogli korzystać z wybranych projektów. Nie zamawiam nowej diagnozy frekwencji ani oceny całego BO."},{"question":"Co może Pan/Pani zmienić i od kogo zależy?","answer":"Możemy przygotować zmiany koordynacji, harmonogramowania i informacji w zakresie naszych projektów. Nie rozwiążemy samodzielnie każdego uzgodnienia własności ani nie pominiemy wymaganych procedur."},{"question":"Skąd pochodzi diagnoza i co pozostaje niepewne?","answer":"Mamy harmonogram i skargi autorów. Porównujemy terminy rzeczywiste z wewnętrznym planem, nie z domniemanym terminem ustawowym. Przypisanie zwłoki wykonawcom nie zostało sprawdzone dla wszystkich etapów."}],"seed":"Sygnał: przekroczenia wewnętrznego harmonogramu 12 projektów przydzielonych dzielnicy X. Nie obejmujemy wszystkich projektów miasta. Przyczyny wymagają chronologii.","focus":"Terminowa realizacja wybranych projektów i konkretne miejsca powstawania zwłoki.","priority":["D3","D4"],"uses":["Daje kontekst wpływu mieszkańców, lecz nie ustala etapów opóźnienia projektów.","Może pokazać konsekwencje niewykonania dla zaufania; nie zastąpi dokumentacji realizacji.","Określa zakres i czas opóźnień w projektach tego klienta.","Sprawdza hipotezę o wykonawcach wobec etapów poprzedzających umowę.","Pozwala określić, co wymaga współpracy i pozostaje poza samą koordynacją dzielnicy.","Może pomóc w dalszej analizie organizacyjnej, ale nie jest dostępny przed briefem."],"questions":[{"prompt":"Jak roboczo zdefiniować problem tego klienta?","options":[{"id":"a","text":"Przekroczenia harmonogramów wybranych projektów dzielnicy, z ustaleniem skali, etapów zwłoki i znaczenia dla korzystających mieszkańców.","why":"To właściwy zakres dla organizacji realizacji. Nie przesądza przyczyny ani środka zaradczego."},{"id":"b","text":"Ograniczone możliwości wpływu mieszkańców całego miasta, z ustaleniem reprezentacji potrzeb i zasad udziału w następnej edycji.","why":"To ważne pytanie drugiego poziomu analizy, ale zastąpiłoby konkretne zlecenie innym."},{"id":"c","text":"Niska rzetelność wykonawców projektów dzielnicy, z ustaleniem sposobów zwiększenia kar i kontroli wykonywania zawartych umów.","why":"Przejmujesz diagnozę klienta i kierunek rozwiązania, zanim sprawdzisz chronologię zwłoki."}],"correct":"a","basis":"Zlecenie dotyczy określonych projektów i przygotowania organizacji ich realizacji.","pitfall":"Wpisanie winy i rozwiązania do definicji problemu.","remedy":"Zdefiniuj opóźnienie wobec jawnego harmonogramu i sprawdź etapy.","pages":"4–9, 12","hint":"Czy definicja pozostawia możliwość, że zwłoka powstaje przed umową?"},{"prompt":"Jak D3 i D4 zmieniają ocenę hipotezy klienta?","options":[{"id":"a","text":"D3 i D4 kierują uwagę na nadzór nad wykonawcami, ponieważ przygotowanie umów należy traktować jako część problemu wykonawstwa.","why":"Rola wykonawcy w ukończeniu projektu nie dowodzi jego odpowiedzialności za wcześniejszą zwłokę."},{"id":"b","text":"D3 i D4 kierują uwagę na przygotowanie oraz wykonanie, ponieważ opóźnienia zaczynają się na różnych etapach realizacji.","why":"Rozszerzasz wyjaśnienie w obrębie właściwego problemu, uwzględniając także jeden przypadek po podpisaniu umowy."},{"id":"c","text":"D3 i D4 kierują uwagę na przygotowanie przed umową, ponieważ cztery takie przypadki uzasadniają pominięcie późniejszego wykonawstwa.","why":"Jeden przypadek dotyczy przekroczenia terminu przez wykonawcę. Nie należy automatycznie wykluczać tego wyjaśnienia."}],"correct":"b","basis":"D3: cztery opóźnienia przed umową i jedno po; D4: zakres, własność oraz wykonanie.","pitfall":"Zastąpienie badania przebiegu spraw etykietą winnego.","remedy":"Rozdziel etapy i zachowaj różne wyjaśnienia dla różnych spraw.","pages":"12–16, 21","hint":"Czy jedna przyczyna pasuje do wszystkich pięciu projektów?"}],"example":"Pięć z 12 projektów przekroczyło harmonogram. W czterech zwłoka wystąpiła przed umową, więc analiza organizacji musi objąć przygotowanie zakresu i uzgodnienia, a także wykonanie jednego opóźnionego kontraktu.","nextEvidence":"Chronologia podejmowania uzgodnień i planowania zakresu: które zależności może usprawnić dzielnica, a które wymagają innych jednostek?"}]}],"terms":[{"id":"problem","name":"Problem publiczny i oceniająca definicja","en":"Define the problem; make the definition evaluative","pages":"2–4","definition":"Opis niepożądanego stanu zawiera ocenę, co jest niewłaściwe i dlaczego. Uzasadnienie działania publicznego wymaga namysłu; niesprawność rynku nie gwarantuje skutecznej interwencji.","examples":{"GPA":"Zbyt wiele osób bez auta nie może dojechać do podstawowych usług według jawnego standardu dostępności.","CP":"Nadmierne narażenie mieszkańców na PM2,5. Trzeba wskazać grupę, okres oraz podstawę oceny poziomu jako nadmiernego.","BK2":"Zbyt duże obciążenie dochodów kosztami odpowiedniego mieszkania. Własność nie musi być jedynym sposobem zaspokojenia potrzeby.","SCT":"Nadmierne narażenie mieszkańców określonych ulic na NO₂. Granica strefy nie wyznacza automatycznie granicy problemu.","BO":"Zbyt mały wpływ określonych grup na wydatki wobec jawnego standardu równości możliwości uczestnictwa."}},{"id":"rhetoric","name":"Retoryka kwestii","en":"Issue rhetoric","pages":"4–6","definition":"Język debaty i skarg dostarcza materiału do roboczej definicji. Może łączyć ocenę, etykietę, domniemaną przyczynę i rozwiązanie; wymaga analitycznego uporządkowania.","examples":{"GPA":"Zdanie „autobusy jeżdżą donikąd” wymaga przełożenia na konkretne trudności podróży, grupy i godziny.","CP":"Hasło „program stoi, bo tonie w papierach” łączy ocenę realizacji z hipotezą o barierze administracyjnej.","BK2":"Hasło „młodych nie stać na własne M” wymaga rozdzielenia potrzeb mieszkaniowych, dostępu do własności i grupy adresatów.","SCT":"Hasło „miasto dusi się w spalinach” wymaga ustalenia narażenia, obszaru i udziału różnych źródeł.","BO":"Hasło „budżet przejęli aktywiści” jest punktem wyjścia do badania wpływu i reprezentacji, a nie gotowym ustaleniem."}},{"id":"scale","name":"Skala problemu i kwantyfikacja","en":"Quantify if possible","pages":"6–7","definition":"W miarę możliwości określ wielkość niedoboru lub nadmiaru. Podaj miernik, zakres i niepewność; brak dokładnej liczby nie zwalnia z operacyjnego opisu.","examples":{"GPA":"Odsetek osób bez auta niemogących odbyć potrzebnej podróży i wrócić w określonym czasie i koszcie.","CP":"Liczba mieszkańców narażonych ponad przyjęty poziom w określonym okresie; same odczyty jednej stacji nie ustalają tego automatycznie.","BK2":"Odsetek gospodarstw przekraczających określony próg obciążenia dochodu zdefiniowanymi kosztami mieszkaniowymi.","SCT":"Rozkład stężeń NO₂ i liczba narażonych mieszkańców w badanym obszarze, z okresem i sposobem pomiaru.","BO":"Udział osób deklarujących brak wpływu oraz reprezentacja potrzeb poszczególnych grup w wydatkach; frekwencja opisuje tylko część sytuacji."}},{"id":"cause","name":"Definicja diagnostyczna i twierdzenie przyczynowe","en":"Diagnose conditions that cause problems","pages":"7, 9, 12","definition":"Można zdefiniować jako problem stan powodujący inne szkody. Jego związek przyczynowy trzeba sprawdzić; samo nazwanie przyczyny nie czyni jej prawdziwą.","examples":{"GPA":"„Nieznajomość rozkładu powoduje trudności dojazdu” to hipoteza. Trzeba sprawdzić także dopasowanie godzin i możliwość powrotu.","CP":"„Emisje z ogrzewania powodują narażenie” wymaga oceny ich udziału obok innych źródeł i warunków rozprzestrzeniania.","BK2":"„Wysokie raty powodują niezaspokojenie potrzeb” wymaga odróżnienia kosztu finansowania od dochodów, cen i podaży.","SCT":"„Starsze pojazdy odpowiadają za narażenie” wymaga sprawdzenia składu ruchu, emisji i innych czynników.","BO":"„Niewiedza powoduje nieuczestnictwo” trzeba sprawdzić obok braku czasu, barier reguł i przekonania o małym wpływie."}},{"id":"context","name":"Kontekst problemu","en":"Context of the problem","pages":"12","definition":"Warunki występowania problemu mogą zmieniać znaczenie przyczyn i skuteczność działań. Definicja powinna uwzględniać te różnice, jeśli są istotne.","examples":{"GPA":"Godziny pracy zmianowej, odległość przystanku i dostępność usług zmieniają charakter trudności dojazdu.","CP":"Typ zabudowy, sposób ogrzewania i lokalne warunki rozprzestrzeniania zanieczyszczeń różnicują sytuację mieszkańców.","BK2":"Warunki rynku mieszkaniowego i możliwości najmu różnią się między lokalizacjami i grupami dochodowymi.","SCT":"Natężenie ruchu, zabudowa ulic i alternatywy podróży mogą różnicować problem oraz skutki ograniczeń wjazdu.","BO":"Zasoby organizacyjne, lokalizacja i bariery udziału różnicują możliwości oddziaływania mieszkańców na wydatki."}},{"id":"data","name":"Dane","en":"Data","pages":"15","definition":"Fakty o świecie lub ich reprezentacje. Obejmują liczby i materiały jakościowe; sama dostępność danych nie przesądza ich znaczenia dla zadania.","examples":{"GPA":"Godziny odjazdów, ceny biletów i zapis wypowiedzi mieszkańca o potrzebnej godzinie powrotu.","CP":"Odczyt stężenia, data zakończenia inwestycji i wypowiedź osoby, która nie wymieniła ogrzewania.","BK2":"Dochód gospodarstwa, wysokość raty, czynsz i opis dotychczasowych warunków mieszkaniowych.","SCT":"Odczyty NO₂, liczba pojazdów, parametry pogody i wypowiedź mieszkańca ulicy.","BO":"Liczba głosów, lokalizacja projektu i wypowiedź osoby, która nie uczestniczyła w głosowaniu."}},{"id":"information","name":"Informacja","en":"Information","pages":"15","definition":"Dane nabierające znaczenia dzięki uporządkowaniu w kategorie lub relacje. Pomagają rozróżniać sytuacje, lecz ich rola jako dowodu zależy od pytania.","examples":{"GPA":"Zestawienie godzin powrotu z pracy z ostatnim kursem ujawnia, gdzie oferta nie odpowiada potrzebie.","CP":"Zestawienie stężeń według sezonów i obszarów wskazuje różnice narażenia wymagające wyjaśnienia.","BK2":"Porównanie obciążenia kosztami mieszkania w grupach dochodowych pokazuje rozkład trudności.","SCT":"Zestawienie zmian NO₂ wewnątrz i poza strefą pokazuje podobieństwa i różnice przebiegu zmian.","BO":"Zestawienie zgłoszeń i wybranych projektów według obszarów pokazuje przestrzenny rozkład uczestnictwa i wydatków."}},{"id":"evidence","name":"Dowody","en":"Evidence","pages":"15","definition":"Informacje wpływające na przekonania istotnych odbiorców, także analityka, o problemie i możliwościach jego ograniczenia. Nie oznaczają automatycznie pewności ani dowodu przyczynowego.","examples":{"GPA":"Znajomość linii przy braku kursu powrotnego osłabia hipotezę, że jedyną barierą jest niewiedza.","CP":"Powtarzalny wzorzec stężeń i dane o źródłach mogą zmienić ocenę udziału emisji lokalnych; sam wzorzec nie rozstrzyga przyczyn.","BK2":"Informacja o zakupach planowanych przed dopłatą podważa założenie, że każdy kredyt oznacza dodatkowy zakup.","SCT":"Spadek NO₂ także poza strefą podważa przypisanie całej poprawy strefie, ale nie dowodzi braku jej wpływu.","BO":"Wzrost frekwencji przy trwałym pomijaniu potrzeb części grup osłabia utożsamienie uczestnictwa z reprezentacją."}},{"id":"value","name":"Wartość dowodów","en":"The value of evidence","pages":"16","definition":"Zależy od szansy zmiany decyzji na lepszą i wielkości oczekiwanej poprawy skutków. Porównuj tę wartość z kosztem pozyskania; taniość nie wystarcza.","examples":{"GPA":"Badanie barier nieużytkowników może bardziej zmienić kierunek pracy niż łatwo dostępna liczba wyświetleń rozkładu.","CP":"Rozpoznanie źródeł i barier inwestycji może być cenniejsze dla decyzji niż kolejny raport o liczbie obsłużonych wniosków.","BK2":"Kosztowne porównanie dodatkowych skutków dopłat może być zasadne przed decyzją o dużych wydatkach.","SCT":"Dane o ruchu i pogodzie pomagają ocenić interpretację spadku stężeń; ranking popularności stref rozstrzyga inne pytanie.","BO":"Rozmowy z nieuczestniczącymi mogą ujawnić bariery pomijane przez łatwo dostępne ankiety zwycięskich projektodawców."}},{"id":"independence","name":"Uwolnienie umysłu od zależności od informatora","en":"Free the captive mind","pages":"21","definition":"Dostęp do danych i gotowej perspektywy nie usprawiedliwia bezkrytycznego przejęcia diagnozy informatora lub klienta. Konfrontuj ją z ostrymi krytykami i ich argumentami.","examples":{"GPA":"Rozmawiaj z organizatorem oraz z osobami pomijanymi przez ofertę. Dostęp do rozkładów nie zobowiązuje do poparcia kampanii.","CP":"Dane operatora zestaw z doświadczeniami osób rezygnujących z inwestycji i krytyką sposobu udzielania wsparcia.","BK2":"Analizę banków i beneficjentów skonfrontuj z sytuacją niebeneficjentów i argumentami krytyków dopłat.","SCT":"Sprawdź argumenty zarządcy strefy i krytyków, w tym dotyczące przeniesienia ruchu oraz kosztów dostosowania.","BO":"Obok zwycięskich projektodawców uwzględnij nieuczestników, autorów odrzuconych propozycji i krytyków zasad."}},{"id":"hypothetical","name":"Problem hipotetyczny","en":"Hypothetical problem","pages":"8","definition":"Domniemany niepożądany stan można badać bez przesądzania, że istnieje. Jego istnienie trzeba sprawdzić. „Hipotetyczny” w tym znaczeniu nie oznacza fikcyjnego scenariusza gry.","examples":{"GPA":"Sugestia „potrzebujemy aplikacji” może oznaczać możliwą stratę czasu przy planowaniu podróży. Najpierw sprawdź jej występowanie.","CP":"Pomysł nowego punktu obsługi może odpowiadać domniemanym kosztom i rezygnacjom wynikającym z trudnych procedur.","BK2":"Postulat większych dopłat zakłada określone bariery potrzeb mieszkaniowych. Trzeba sprawdzić ich występowanie i skalę.","SCT":"Postulat przesunięcia granicy może zakładać istotne narażenie poza nią. Diagnoza tego narażenia pozostaje otwarta.","BO":"Pomysł dodatkowego głosowania może zakładać niewykorzystane możliwości wpływu; ich istnienia nie dowodzi sam pomysł."}},{"id":"opportunity","name":"Niewykorzystana możliwość poprawy","en":"Latent opportunity","pages":"8–11","definition":"Analiza może szukać możliwych korzyści, których nie ujawniły skargi. Przedmiotem pracy bywa utracona możliwość poprawy, a nie tylko już odczuwana szkoda.","examples":{"GPA":"Możliwe lepsze skoordynowanie przesiadek bez zwiększania liczby kursów wymaga sprawdzenia rozkładów i potrzeb.","CP":"Połączenie doradztwa z istniejącym kontaktem z mieszkańcami może ułatwić inwestycje, jeśli mechanizm i warunki to potwierdzą.","BK2":"Wykorzystanie dostępnych zasobów mieszkaniowych może otwierać inną drogę poprawy niż zwiększanie dopłat do zakupu.","SCT":"Lepsze skoordynowanie transportu zbiorowego może umożliwić ograniczenie narażenia przy mniejszych trudnościach dostosowania.","BO":"Istniejące miejsca spotkań mogą ułatwić udział dotąd pomijanych grup bez tworzenia osobnej struktury organizacyjnej."}},{"id":"purposes","name":"Trzy zastosowania dowodów","en":"Three principal purposes","pages":"15","definition":"Dowody pomagają określić naturę i rozmiar problemu, cechy konkretnej sytuacji polityki oraz doświadczenia podobnych rozwiązań. Ich znaczenie zmienia się w toku analizy.","examples":{"GPA":"Trudności dojazdu; zasoby i kompetencje organizatora; doświadczenia porównywalnego systemu przewozów.","CP":"Narażenie mieszkańców; zdolność gminy i gospodarstw do inwestycji; doświadczenia wsparcia w podobnych warunkach.","BK2":"Potrzeby mieszkaniowe; warunki rynku i możliwości działania; doświadczenia podobnych instrumentów wsparcia.","SCT":"Narażenie przy ulicach; ruch, kompetencje i możliwości dostosowania; doświadczenia innych stref.","BO":"Wpływ i potrzeby grup; reguły oraz zdolność realizacji projektów; doświadczenia innych miast."}},{"id":"estimate","name":"Uzasadniony szacunek","en":"Educated guess; guesstimate","pages":"6, 18–19","definition":"Przybliżenie oparte na wiedzy może oszczędzać zasoby. Ujawnij podstawę i niepewność; gdy lepsze dane mogą istotnie poprawić decyzję, warto je zdobyć.","examples":{"GPA":"Wstępnie oszacuj grupę bez auta z dostępnych danych, zaznacz zakres błędu i sprawdź, czy wpływa na wybór dalszych badań.","CP":"Przybliż liczbę narażonych na podstawie ludności i map pomiarów, ujawniając ograniczenia pokrycia.","BK2":"Oszacuj zakres obciążenia kosztami przy kilku założeniach o dochodach; nie przedstawiaj go jako zmierzonego skutku dopłaty.","SCT":"Wstępny szacunek narażonych może służyć planowaniu pomiarów, jeśli jasno opisano braki danych przestrzennych.","BO":"Przybliż zasięg potrzeb z istniejących badań, podając, których grup nie reprezentują."}},{"id":"quality","name":"Ocena badań i trafności","en":"Research design; internal and external validity","pages":"19","definition":"Sprawdzaj metodę, ograniczenia i przydatność do zadania. Trafność wewnętrzna dotyczy uzasadnienia wniosku w badaniu, zewnętrzna możliwości jego przeniesienia poza badane warunki.","examples":{"GPA":"Ankieta pasażerów może opisać ich doświadczenia, lecz pomija osoby niekorzystające; nie wyjaśnia automatycznie sytuacji całej gminy.","CP":"Spadek stężeń po inwestycjach wymaga uwzględnienia innych zmian; wynik jednej gminy nie przenosi się automatycznie na inną.","BK2":"Beneficjenci i niebeneficjenci mogą się różnić przed programem; proste porównanie nie usuwa tej selekcji.","SCT":"Obszar poza strefą może odczuwać jej skutki, co komplikuje użycie go jako porównania.","BO":"Opinie zwycięskich projektodawców nie reprezentują wszystkich mieszkańców; wzrost poczucia wpływu może mieć także inne przyczyny."}},{"id":"analogy","name":"Dobre praktyki i analogie","en":"Best practices; use analogies","pages":"19–20","definition":"Doświadczenia innych miejsc oraz podobne mechanizmy w odmiennych dziedzinach mogą inspirować. Trzeba sprawdzić działanie mechanizmu i warunki transferu, zamiast kopiować etykietę sukcesu.","examples":{"GPA":"Sukces informacji pasażerskiej w gminie Y nie rozstrzyga jej wartości tam, gdzie główną barierą są godziny kursów.","CP":"Rozwiązanie upraszczające wnioski gdzie indziej wymaga podobnych barier, zasobów obsługi i możliwości inwestowania.","BK2":"Doświadczenie dopłat w innym kraju zależy m.in. od podaży, zasad kredytowania i struktury potrzeb.","SCT":"Wynik innego miasta wymaga sprawdzenia ruchu, składu pojazdów, alternatyw podróży i sposobu pomiaru.","BO":"Wysoka frekwencja gdzie indziej nie dowodzi, że przeniesienie reguł poprawi reprezentację potrzeb w Warszawie."}},{"id":"iteration","name":"Iteracja","en":"Iterate","pages":"1, 12–14","definition":"Wracaj do definicji wraz ze zmianą wiedzy i rozumienia zadania. Rewizja może dotyczyć zakresu, przyczyn lub oceny; wymaga uzasadnienia, nie automatycznej zmiany zdania.","examples":{"GPA":"Nowe dane o powrotach mogą przesunąć uwagę z informacji na godziny, przy zachowaniu problemu dostępności.","CP":"Dane o napływie zanieczyszczeń mogą poszerzyć diagnozę przyczyn bez wykluczania znaczenia lokalnego ogrzewania.","BK2":"Rozpoznanie potrzeb osób niekwalifikujących się do kredytu może zmienić zakres diagnozy mieszkaniowej.","SCT":"Nowe pomiary poza granicą mogą wymagać poszerzenia obszaru diagnozy, bez przesądzania rozszerzenia instrumentu.","BO":"Dane o pomijanych potrzebach mogą przesunąć nacisk z ogólnej frekwencji na możliwości wpływu konkretnych grup."}},{"id":"evaluation","name":"Niepewność jako problem ewaluacji","en":"Uncertainty is the problem that evaluation addresses","pages":"6","definition":"Gdy zlecenie dotyczy oceny programu, problemem analitycznym jest nadmierna niepewność o wynikach i ich uwarunkowaniach. Wiedza o przeszłości ma służyć przyszłym działaniom.","examples":{"GPA":"Nie wiemy, na ile zmiana organizacji przewozów poprawiła dostęp do usług; ta luka ma znaczenie dla dalszych decyzji.","CP":"Nie wiemy, jaką zmianę narażenia przyniosło wsparcie inwestycji ani od czego zależały wyniki.","BK2":"Nie wiemy, jaka poprawa warunków mieszkaniowych nastąpiła dzięki dopłatom i jakie wywołały skutki poza programem.","SCT":"Nie wiemy, jaka część zmiany narażenia wynika ze strefy; ocena ma pomóc w przyszłych decyzjach.","BO":"Nie wiemy, czy BO zwiększa wpływ pomijanych grup; ocena konkretnej zmiany reguł jest węższym zadaniem."}},{"id":"mechanism","name":"Rola programu i mechanizm interwencji","en":"Pojęcie pomocnicze w grze","pages":null,"definition":"Zakładany ciąg od działania programu przez zmianę zachowań lub warunków do ograniczenia problemu. To schemat dydaktyczny, a nie osobna definicja Bardacha z tych rozdziałów.","examples":{"GPA":"Koordynacja połączeń → możliwa podróż i powrót → lepszy dostęp do pracy i usług. Każde przejście wymaga sprawdzenia.","CP":"Wsparcie inwestycji → zmiana ogrzewania → zmiana emisji i narażenia. Wniosek o dotację nie jest końcowym rezultatem.","BK2":"Dopłata → zmiana obciążenia i możliwości zakupu → zmiana warunków mieszkaniowych. Trzeba uwzględnić reakcję rynku.","SCT":"Reguły wjazdu → zmiana ruchu lub składu pojazdów → zmiana emisji i narażenia, także poza granicą.","BO":"Udział w zgłaszaniu i wyborze → realizacja projektów → zmiana wpływu mieszkańców i uwzględnienia ich potrzeb."}},{"id":"impact","name":"Zmiana obserwowana i wpływ programu","en":"Pojęcie pomocnicze z ewaluacji","pages":null,"definition":"Zmiana opisuje różnicę między pomiarami. Wpływ dotyczy różnicy wobec wiarygodnie oszacowanej sytuacji bez interwencji. Ocena wymaga określenia interwencji, wyniku i porównania.","examples":{"GPA":"Spadek trudności dojazdu po zmianie sieci nie ustala, jaka poprawa nastąpiłaby bez tej zmiany.","CP":"Spadek stężeń po inwestycjach może współwystępować ze zmianą pogody i innych emisji.","BK2":"Poprawa warunków beneficjentów nie pokazuje, ilu kupiłoby odpowiednie mieszkanie bez dopłaty.","SCT":"Spadek NO₂ po wdrożeniu trzeba odróżnić od wpływu samej strefy względem sytuacji bez niej.","BO":"Porównanie dwóch edycji może badać zmianę reguł. Wpływ istnienia BO wymaga porównania z sytuacją bez BO."}},{"id":"client","name":"Zleceniodawca i sytuacja decyzyjna","en":"Client; political and institutional means","pages":"1, 4–5, 14–15","definition":"Klient wnosi cel, język oceny i kontekst działania. Rozpoznaj, jaką decyzję przygotowuje, co może zmienić i od kogo zależy. Jego diagnoza jest materiałem do analizy, nie automatycznie jej wynikiem. Hasło łączy wskazówki podręcznika.","examples":{"GPA":"Zarząd GPA oraz Wójt gminy X potrzebują wiedzy do różnych decyzji.","CP":"Wójt — narażenie mieszkańców oraz Fundusz — obsługa płatności potrzebują wiedzy do różnych decyzji.","BK2":"Minister — doświadczenia dopłat oraz Prezydent — gospodarstwa poza kredytem potrzebują wiedzy do różnych decyzji.","SCT":"Prezydent — kierunek prac nad SCT oraz Dyrektor ZDM — obsługa wyłączeń potrzebują wiedzy do różnych decyzji.","BO":"Dyrektor CKS — możliwości wpływu oraz Burmistrz — realizacja projektów potrzebują wiedzy do różnych decyzji."}},{"id":"working","name":"Robocza definicja i rewizja","en":"Provisional problem definition; Iterate","pages":"4–7, 12–14","definition":"Sformułuj niepożądany stan, zakres i podstawę oceny. Zaznacz nieustalone wielkości i hipotezy. Po dowodach możesz definicję zmienić lub podtrzymać; w obu przypadkach wyjaśnij dlaczego.","examples":{"GPA":"Niepewność i rozbieżności planowania wkładu gminy, z uwzględnieniem konsekwencji dla usług.","CP":"Czas i uciążliwość obsługi płatności przy zachowaniu poprawności kontroli.","BK2":"Dostęp do odpowiedniego lokalu w wybranej grupie objętej pomocą miejską.","SCT":"Czas i dostępność rzetelnej obsługi, z poszanowaniem reguł wyłączeń.","BO":"Terminowa realizacja wybranych projektów i konkretne miejsca powstawania zwłoki."}},{"id":"commission","name":"Wąskie zlecenie i problem publiczny","en":"Context-specific analysis; evaluation","pages":"1, 4, 6–7, 14","definition":"Zakres może dotyczyć skutków społecznych, działania organizacji albo niepewności ewaluacyjnej. Uzasadnij publiczne znaczenie i dopasowanie do decyzji. Szersza definicja nie jest automatycznie lepsza. To synteza dydaktyczna wskazówek autora.","examples":{"GPA":"Przewidywalność wkładu gminy może być właściwym problemem obok dostępności podróży.","CP":"Czas obsługi płatności może być właściwym problemem funduszu; nie musi być zastąpiony stężeniem PM2,5.","BK2":"Resort bada niepewność skutków dopłat, a miasto czas dostępu do lokalu w wybranej grupie.","SCT":"Jakość obsługi wyłączeń ma znaczenie publiczne obok ochrony przed NO₂.","BO":"Opóźnienie realizacji wybranego projektu może być właściwym problemem obok reprezentacji potrzeb."}}],"initialFields":[{"id":"problem","label":"1. Moja robocza definicja problemu","prompt":"Napisz 1–2 zdania: co wymaga poprawy, dla kogo, gdzie lub kiedy i względem jakiego standardu. Powiąż zakres z decyzją tego klienta. Nieznaną skalę oznacz jako nieustaloną.","helper":"„W [grupie i zakresie] występuje lub może występować [stan], oceniany względem [standardu]. Jest to ważne dla decyzji o […]”. Możesz zachować dobrze uzasadnioną diagnozę klienta."},{"id":"hypothesis","label":"2. Hipoteza do sprawdzenia","prompt":"Wskaż jedno możliwe wyjaśnienie lub niepewność z wypowiedzi klienta. Napisz, co je wspiera, a czego jeszcze nie wiadomo. Przy zleceniu ewaluacyjnym wskaż, jaki skutek pozostaje nieustalony.","helper":"„Klient przypuszcza […]. Na razie wiemy […], ale trzeba sprawdzić […]”. Cel i standard oceny uzasadniamy; twierdzenie o przyczynie sprawdzamy dowodami."}],"finalFields":[{"id":"problem","label":"1. Obecna definicja i decyzja klienta","prompt":"W 1–3 zdaniach podaj obecną definicję problemu i jej znaczenie dla decyzji klienta. Wskaż właściwą grupę, zakres i standard. Użyj konkretnego materiału D1–D6 lub jawnie zaznacz brak wiedzy.","helper":"Definicja może pozostać taka sama. Nie rozszerzaj jej automatycznie do całego problemu społecznego programu."},{"id":"revision","label":"2. Co zmieniam lub podtrzymuję po dowodach?","prompt":"Przywołaj jeden fragment swojej roboczej notatki. Wyjaśnij, co zmieniasz lub podtrzymujesz na podstawie konkretnej karty D1–D6. Dodaj jedną granicę wniosku.","helper":"„Wcześniej napisałem/am […]. Po D… zmieniam/podtrzymuję […], ponieważ […]. Nadal nie można stwierdzić […]”. Podtrzymanie i zmiana są równorzędne, gdy mają uzasadnienie."},{"id":"next","label":"3. Jedna następna informacja","prompt":"Wskaż jedno pytanie, potrzebną informację i możliwe źródło. Wyjaśnij, co odpowiedź mogłaby zmienić w analizie lub przygotowaniu decyzji. Zaznacz, czy potrzebna jest przed tą decyzją, czy później.","helper":"„Aby sprawdzić […], potrzebuję […] z […]. Wynik może zmienić […]. Warto zdobyć go [teraz/później], ponieważ […]”. Nie zamawiaj po prostu „więcej badań”."}],"compareFields":[{"id":"scope","label":"1. Co zmieniło się w definicji problemu?","prompt":"Wskaż jedną konkretną różnicę między swoimi definicjami. Wyjaśnij ją decyzją, odpowiedzialnością lub ograniczeniami klientów.","helper":"„Dla [klient] skupiłem/am się na […], a dla [klient] na […], ponieważ […]”. Jeśli definicje są podobne, uzasadnij, dlaczego mimo różnych zleceń."},{"id":"evidence","label":"2. Co zmieniło się w doborze dowodów?","prompt":"Wskaż jedną kartę D1–D6 i porównaj jej znaczenie dla obu zleceń. Wyjaśnij, na jakie pytanie odpowiada w każdej ścieżce. Możesz uzasadnić wybór tej samej karty.","helper":"„D… było ważniejsze dla […], bo […]. Dla drugiego klienta […]”. Zmiana priorytetu nie zmienia prawdziwości informacji."},{"id":"constant","label":"3. Co pozostaje wspólne?","prompt":"Wskaż jeden wspólny fakt lub ograniczenie dowodu oraz jedną wskazówkę Bardacha, którą zastosowałeś/aś w obu ścieżkach. Wyjaśnij krótko, jak.","helper":"Możesz odwołać się do jawnego standardu, oddzielenia hipotezy, Think before you collect, wartości informacji lub Iterate. Samo wymienienie nazwy nie wystarczy."}],"source":"E. Bardach i E. M. Patashnik, A Practical Guide for Policy Analysis, wyd. 6, 2020, s. 1–21. Etapy interfejsu gry, dwa zlecenia, karty D1–D6 i formularze notatek są autorską pomocą dydaktyczną. Nie stanowią dodatkowych kroków Bardacha. Konstruowanie alternatyw to następny krok (od s. 21).","fictional":"Wszystkie zlecenia, rozmowy, liczby, progi i problemy opisane w scenariuszu są fikcyjne. Nazwy programów i instytucji są rzeczywiste; gmina/miasto/dzielnica X są umowne. Nie przypisuj tych wypowiedzi rzeczywistym osobom. Źródła instytucjonalne służą tylko osadzeniu ról, nie potwierdzają danych gry."};
/* Pure state, validation and export logic shared by the game and the lecturer's decoder. */
function createEngine(DATA) {
  const program = id => DATA.programs.find(p => p.id === id);
  const fields = fs => Object.fromEntries(fs.map(f => [f.id, '']));
  const filled = obj => Object.values(obj).every(v => typeof v === 'string' && v.trim().length > 0);
  const now = () => new Date().toISOString();
  function shuffle(a) {
    a = [...a];
    for (let i = a.length - 1; i > 0; i--) { const n = new Uint32Array(1); crypto.getRandomValues(n); const j = n[0] % (i + 1); [a[i], a[j]] = [a[j], a[i]]; }
    return a;
  }
  function route() {
    return {stage:0, unlocked:0, read:[], started:false, knewPacket:false,
      answers:[0,1].map(() => ({order:shuffle(['a','b','c']), selected:null, history:[], help:false, helpBefore:false})),
      initial:fields(DATA.initialFields), initialLocked:false, selected:[], plan:'', planLocked:false,
      final:fields(DATA.finalFields), complete:false};
  }
  function fresh(id) {
    if (!program(id)) throw Error('Nieznany program.');
    return {kind:'BARDACH2',version:DATA.version,key:DATA.key,program:id,session:crypto.randomUUID(),created:now(),savedAt:now(),
      active:'a', screen:'overview', order:[], routes:{a:route(),b:route()},comparison:fields(DATA.compareFields),compared:false};
  }
  const checked = a => !!a.history.length && a.selected === a.history.at(-1).choice;
  function planStatus(p, ids) {
    const cards = ids.map(id => p.cards.find(c => c.id === id)).filter(Boolean);
    return {count:cards.length,cost:cards.reduce((a,c)=>a+c.cost,0),wait:Math.max(0,...cards.map(c=>c.wait)),
      valid:cards.length===2 && new Set(ids).size===2 && cards.reduce((a,c)=>a+c.cost,0)<=3 && cards.every(c=>c.wait<=5)};
  }
  function validate(raw) {
    const fail = () => { throw Error('Niepoprawny lub niezgodny zapis wersji 2.0. Zapis v1 otwórz w starej grze albo w nowym dekoderze prowadzącego.'); };
    if (!raw || raw.kind!=='BARDACH2' || raw.version!==DATA.version || raw.key!==DATA.key || !program(raw.program)) fail();
    if (typeof raw.session!=='string' || !raw.session.length || raw.session.length>100 || !['a','b'].includes(raw.active) || !['overview','path','compare','finish'].includes(raw.screen)) fail();
    for (const k of ['created','savedAt']) if (typeof raw[k]!=='string'||Number.isNaN(Date.parse(raw[k]))) fail();
    if (!Array.isArray(raw.order)||raw.order.length>2||new Set(raw.order).size!==raw.order.length||raw.order.some(x=>!['a','b'].includes(x))) fail();
    const notes = (o,fs) => Object.fromEntries(fs.map(f=>{if(!o||typeof o[f.id]!=='string'||o[f.id].length>1000)fail();return [f.id,o[f.id]];}));
    const routes = {};
    for (const id of ['a','b']) {
      const r=raw.routes?.[id];
      if(!r||!Number.isInteger(r.stage)||!Number.isInteger(r.unlocked)||r.stage<0||r.stage>r.unlocked||r.unlocked>3)fail();
      for(const k of ['started','knewPacket','initialLocked','planLocked','complete'])if(typeof r[k]!=='boolean')fail();
      if(!Array.isArray(r.read)||new Set(r.read).size!==r.read.length||r.read.some(i=>![0,1,2].includes(i)))fail();
      if(!Array.isArray(r.answers)||r.answers.length!==2)fail();
      const answers=r.answers.map(a=>{
        if(!a||!Array.isArray(a.order)||[...a.order].sort().join('')!=='abc'||a.selected!==null&&!['a','b','c'].includes(a.selected)||!Array.isArray(a.history)||a.history.length>100)fail();
        if(typeof a.help!=='boolean'||typeof a.helpBefore!=='boolean')fail();
        const history=a.history.map((h,i)=>{if(!h||!['a','b','c'].includes(h.choice)||typeof h.at!=='string'||Number.isNaN(Date.parse(h.at))||i>0&&h.choice===a.history[i-1].choice)fail();return {choice:h.choice,at:h.at};});
        return {order:[...a.order],selected:a.selected,history,help:a.help,helpBefore:a.helpBefore};
      });
      if(!Array.isArray(r.selected)||r.selected.length>2||new Set(r.selected).size!==r.selected.length||r.selected.some(x=>!program(raw.program).cards.some(c=>c.id===x)))fail();
      if(typeof r.plan!=='string'||r.plan.length>1000)fail();
      const initial=notes(r.initial,DATA.initialFields),final=notes(r.final,DATA.finalFields);
      if(r.started!==raw.order.includes(id)||!r.started&&(r.unlocked>0||r.read.length>0||r.knewPacket))fail();
      if(r.unlocked>=1&&r.read.length!==3)fail();
      if(r.initialLocked!==(r.unlocked>=2)||r.initialLocked&&(!filled(initial)||!checked(answers[0])))fail();
      if(r.planLocked!==(r.unlocked>=3)||r.planLocked&&(!r.plan.trim()||!planStatus(program(raw.program),r.selected).valid))fail();
      if(r.complete&&(!r.planLocked||!filled(final)||!checked(answers[1])))fail();
      routes[id]={stage:r.stage,unlocked:r.unlocked,read:[...r.read],started:r.started,knewPacket:r.knewPacket,answers,initial,initialLocked:r.initialLocked,selected:[...r.selected],plan:r.plan,planLocked:r.planLocked,final,complete:r.complete};
    }
    const comparison=notes(raw.comparison,DATA.compareFields);
    if(typeof raw.compared!=='boolean'||raw.compared&&(!routes.a.complete||!routes.b.complete||!filled(comparison)))fail();
    if(['compare','finish'].includes(raw.screen)&&(!routes.a.complete||!routes.b.complete)||raw.screen==='finish'&&!raw.compared||raw.screen==='path'&&!routes[raw.active].started)fail();
    return {kind:raw.kind,version:raw.version,key:raw.key,program:raw.program,session:raw.session,created:raw.created,savedAt:raw.savedAt,active:raw.active,screen:raw.screen,order:[...raw.order],routes,comparison,compared:raw.compared};
  }
  function scores(s) {
    const p=program(s.program);let first=0,last=0,count=0;
    p.clients.forEach(c=>s.routes[c.id].answers.forEach((a,i)=>{if(a.history.length){count++;first+=a.history[0].choice===c.questions[i].correct;last+=a.history.at(-1).choice===c.questions[i].correct;}}));
    return {first,last,checked:count,total:4};
  }
  function crc(text) {let c=0xffffffff;for(const b of new TextEncoder().encode(text)){c^=b;for(let i=0;i<8;i++)c=c&1?0xedb88320^(c>>>1):c>>>1;}return ((c^0xffffffff)>>>0).toString(16).padStart(8,'0');}

    for(const c of p.clients){const r=s.routes[c.id];out.push('\nKLIENT '+c.id.toUpperCase()+': '+c.title,'Zlecenie: '+c.mandate,'Decyzja: '+c.decision,'Może: '+c.powers,'Zależności: '+c.limits,

      ...c.talk.flatMap(t=>['Pytanie: '+t.question,'Odpowiedź: '+t.answer]),

      'Dla wybranego klienta przygotujesz różne sposoby działania na podstawie definicji i dowodów. Uwzględnisz kontynuację obecnych działań i trendów, potrzebne uzgodnienia oraz możliwość łączenia działań. Ta gra nie wymaga jeszcze wyboru rekomendowanego wariantu.',

if(typeof module!=='undefined')module.exports=createEngine;

/* Browser interface. All student work stays local until the student submits the Google Form. */
const E=createEngine(DATA), KEY='bardach-advisor-v2-', memory=new Map();
let S=null, home=true, storageError='', corrupt=null, glossaryFocus=null;
const $=s=>document.querySelector(s), esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const p=()=>E.program(S.program), c=()=>p().clients.find(x=>x.id===S.active), r=()=>S.routes[S.active];
const btn=(label,action,extra='',cls='')=>`<button type="button" data-action="${action}" ${extra} class="${cls}">${label}</button>`;
const link=(label,url)=>`<a href="${esc(url)}" target="_blank" rel="noopener">${label} <span class="sr-only">(nowa karta)</span></a>`;
function save(){
  if(!S)return;
  S.savedAt=E.now(); S=E.validate(S); memory.set(S.program,S);
  try{localStorage.setItem(KEY+S.program,JSON.stringify(S));storageError='';}catch{storageError='Przeglądarka nie zapisuje postępu. Pobierz zapis JSON przed zamknięciem karty.';}
  const el=$('#storage');if(el)el.textContent=storageError||'Postęp zapisany w tej przeglądarce. Kopię pobierzesz jako JSON.';
}
function message(text,error=false){const el=$('#message');el.textContent=text;el.className='notice '+(error?'warn':'');el.hidden=false;el.setAttribute('role',error?'alert':'status');el.focus();}
function commit(focus=true){save();render(focus);}
function download(name,text,type='text/plain;charset=utf-8'){
  const url=URL.createObjectURL(new Blob([text],{type})),a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);
}
function filename(suffix){return `Bardach_v2_${S.program}_${S.session.slice(0,8)}.${suffix}`;}
function selectProgram(id){
  corrupt=null;S=memory.get(id)||null;
  if(!S){let raw=null;try{raw=localStorage.getItem(KEY+id);}catch{storageError='Zapis w przeglądarce jest niedostępny. Pobieraj kopię JSON.';}
    if(raw){try{S=E.validate(JSON.parse(raw));if(S.program!==id)throw Error('Program');}catch{corrupt={id,raw};S=null;home=true;render();return;}}
    else S=E.fresh(id);

}
function startClient(id){
  S.active=id;const rt=r();
  if(!rt.started){rt.knewPacket=Object.values(S.routes).some(x=>x.planLocked);rt.started=true;S.order.push(id);}
  S.screen='path';home=false;commit();
}
function guide(title,text,pages){return `<div class="guide"><strong>${title}</strong>${text}<small>Bardach, s. ${pages}. ${link('Otwórz lekturę',DATA.reading)}</small></div>`;}
function field(f,group,value,locked=false){return `<div class="field"><label for="${group}-${f.id}">${esc(f.label)}</label><p id="help-${group}-${f.id}" class="prompt">${esc(f.prompt)}</p><textarea id="${group}-${f.id}" data-group="${group}" data-field="${f.id}" maxlength="1000" aria-describedby="help-${group}-${f.id}" ${locked?'readonly':''}>${esc(value)}</textarea><small>Do 1000 znaków. Krótka, konkretna notatka wystarczy.${locked?' Zapis roboczy zachowujemy do porównania.':''}</small><details><summary>Pomoc w sformułowaniu odpowiedzi</summary><div class="inside">${esc(f.helper)}</div></details></div>`;}
function question(i){
  const q=c().questions[i],a=r().answers[i],locked=i===0&&r().initialLocked,checked=E.checked(a),last=a.history.at(-1),option=last&&q.options.find(x=>x.id===last.choice);
  return `<section class="question" aria-label="Sprawdzenie rozumienia"><p class="eyebrow">Krótka decyzja analityczna · ${i===0?'przed dowodami':'po dowodach'}</p><fieldset ${locked?'disabled':''}><legend>${esc(q.prompt)}</legend>${a.order.map((id,j)=>{const o=q.options.find(x=>x.id===id);return `<label class="option"><input type="radio" name="question-${i}" value="${id}" data-question="${i}" ${a.selected===id?'checked':''}><span><span class="letter">${'ABC'[j]}.</span>${esc(o.text)}</span></label>`;}).join('')}</fieldset><div class="actions">${btn('Sprawdź i przeczytaj wyjaśnienie','check',`data-index="${i}" ${locked?'disabled':''}`)}${btn('Wskazówka z lektury','hint',`data-index="${i}"`)}</div>${a.help?`<div class="notice">${esc(q.hint)} <small>Bardach, s. ${esc(q.pages)}.</small></div>`:''}${last?`<div class="feedback ${last.choice===q.correct?'':'bad'}" role="status"><strong>${last.choice===q.correct?'Trafne rozumowanie.':'Ten wybór wymaga korekty.'}</strong>${!checked?'<p>Zmieniłeś/aś wybór. Sprawdź nową odpowiedź przed przejściem dalej.</p>':''}<p><b>Dlaczego:</b> ${esc(option.why)}</p><p><b>Podstawa w materiale:</b> ${esc(q.basis)}</p><p><b>Pułapka (pitfall):</b> ${esc(q.pitfall)}</p><p><b>Jak jej uniknąć (remedy):</b> ${esc(q.remedy)}</p><p class="source">Bardach, s. ${esc(q.pages)}. ${link('Lektura',DATA.reading)}</p>${last.choice!==q.correct?`<details><summary>Zobacz uzasadnioną odpowiedź</summary><div class="inside">${esc(q.options.find(x=>x.id===q.correct).text)}</div></details>`:''}</div>`:''}<p class="meta">Możesz poprawić wybór. Zapisujemy pierwszą i ostatnią sprawdzoną odpowiedź; wynik nie blokuje dalszej pracy. Notatki ocenia prowadzący.</p></section>`;

function packet(client=c(),openSelected=true){return `<p class="meta">Wspólny pakiet szkoleniowy dla obu klientów. Liczby są fikcyjne. Po zapisaniu planu udostępniamy wszystkie karty, żeby porównanie opierało się na tych samych faktach — także kartę D6 dostępną poza terminem zlecenia.</p>${p().cards.map((card,i)=>`<details class="evidence" ${openSelected&&S.routes[client.id].selected.includes(card.id)?'open':''}><summary>${card.id} · ${esc(card.title)} ${S.routes[client.id].selected.includes(card.id)?'<span class="tag">w moim planie</span>':''}</summary><div class="inside"><p><b>Zakres:</b> ${esc(card.scope)}</p><p><b>Wynik:</b> ${esc(card.result)}</p><p><b>Granica wniosku:</b> ${esc(card.limit)}</p><p class="notice"><b>Znaczenie dla tego klienta:</b> ${esc(client.uses[i])}</p></div></details>`).join('')}`;}
function sources(){return `<details><summary>Podstawa i źródła ról instytucjonalnych</summary><div class="inside"><p>${esc(DATA.source)}</p><p>${link('Lektura do gry',DATA.reading)}</p>${S?p().sources.map(([t,u])=>`<p>${link(esc(t),u)}</p>`).join(''):''}<p class="meta">Podział kompetencji w scenariuszu jest uproszczony. We własnej analizie K3 sprawdź aktualny zakres uprawnień i zależności wybranego klienta.</p></div></details>`;}
function renderHome(){return `<section class="card hero"><p class="eyebrow">Bardach · kroki 1 i 2 · wersja 2.0</p><h1>Zlecenie dla doradcy</h1><p class="lead">Jeden program. Dwóch klientów. Dwie perspektywy decyzji.</p><p>Znasz już swój program z analizy procesu polityki publicznej. Teraz pracujesz jako niezależny doradca: ustalasz, jaki problem wymaga rozpoznania dla konkretnej decyzji i jakie dowody są do tego potrzebne.</p><div class="flow"><div><strong>Zrozum zlecenie</strong>Odróżnij cel klienta od jego przypuszczeń.</div><div><strong>Zdefiniuj i sprawdź</strong>Zapisz problem, zaplanuj dowody i przemyśl definicję.</div><div><strong>Porównaj klientów</strong>Wyjaśnij zmianę zakresu i priorytetów dowodowych.</div></div><p class="meta">Te etapy gry ćwiczą kroki 1 i 2 Bardacha. Porównanie klientów jest ćwiczeniem dydaktycznym; krok 3 — konstruowanie alternatyw — będzie następnym zadaniem.</p><div class="notice"><strong>Wypowiedź klienta jest punktem wyjścia.</strong><p>Możesz jego diagnozę doprecyzować, zakwestionować lub podtrzymać. Uzasadnij to dowodami i sytuacją decyzyjną. Właściwy problem może dotyczyć skutków społecznych, obsługi programu albo niepewności co do jego wpływu.</p></div><p>${link('Przed grą i podczas pracy: Bardach, kroki 1 i 2 (s. 1–21)',DATA.reading)}. Wskazówki przy zadaniach prowadzą do konkretnych stron; słowniczek zawiera przykłady dla wybranego programu.</p><label for="program"><b>Wybierz program swojego zespołu</b></label><select id="program" style="display:block;width:100%;margin-top:10px">${DATA.programs.map(x=>`<option value="${x.id}" ${S?.program===x.id?'selected':''}>${esc(x.name)}</option>`).join('')}</select><div class="actions">${btn('Otwórz program / wznów pracę','choose','','primary')}${btn('Wczytaj zapis JSON','import')}</div>${corrupt?`<div class="notice warn" role="alert"><p>Zapis programu ${esc(corrupt.id)} jest uszkodzony lub pochodzi z innej wersji. Nie został nadpisany.</p><div class="actions">${btn('Pobierz zapis do odzyskania','recover')}${btn('Rozpocznij nową sesję tego programu','replace-corrupt')}</div></div>`:''}<p class="meta" style="margin-top:22px">Przejdź obie ścieżki w wybranej kolejności. Rozgrywkę można przerwać i wznowić. Nie wpisuj danych osobowych ani rzeczywistych danych wrażliwych. Zapis jest lokalny; nic nie wysyła się automatycznie.</p></section><section class="card"><h2>Jak pracować</h2><p>W każdej ścieżce przeczytasz zlecenie i trzy odpowiedzi klienta. Następnie zapiszesz roboczą definicję oraz plan dwóch źródeł, przeczytasz dowody i przygotujesz krótką rewizję. Na końcu porównasz obie ścieżki i pobierzesz raport do pracy nad K3.</p><p>Pytania zamknięte dają natychmiastowe wyjaśnienie: podstawa, pułapka i sposób poprawy. Notatki otwarte służą dyskusji i ocenie przez prowadzącego. Gra sprawdza ich obecność, nie jakość.</p><div class="notice warn">${esc(DATA.fictional)}</div><p>${link('Masz zapis starej wersji? Otwórz grę v1', 'v1.html')} — zachowaliśmy ją osobno. Wersja 2 zapisuje postęp pod nową nazwą.</p>${sources()}</section>`;}
function overview(){return `<section class="card"><p class="eyebrow">${esc(p().short)} · wybierz kolejność</p><h1>Dwa zlecenia</h1><p>${esc(p().context)}</p><p>${esc(p().background)}</p><div class="guide"><strong>To samo tło, różne zadania.</strong>Ustal, do jakiej decyzji klient potrzebuje wiedzy. Nie zakładaj, że szerszy problem jest zawsze lepszy albo że klient ma rację w sprawie przyczyn. <small>Bardach, s. 1, 4–9, 12–16.</small></div><div class="grid">${p().clients.map(client=>{const rt=S.routes[client.id];return `<article class="card"><span class="tag">Klient ${client.id.toUpperCase()} · ${rt.complete?'ukończono':rt.started?'w toku':'do wykonania'}</span><h2 style="margin-top:14px">${esc(client.short)}</h2><p><b>Decyzja:</b> ${esc(client.decision)}</p><p>${esc(client.mandate)}</p>${btn(rt.complete?'Otwórz ścieżkę':rt.started?'Kontynuuj ścieżkę':'Rozpocznij od tego klienta','client',`data-client="${client.id}"`,'primary')}</article>`;}).join('')}</div><div class="actions">${btn('Porównaj obie ścieżki','compare',`${Object.values(S.routes).every(x=>x.complete)?'':'disabled'}`,'primary')}${S.compared?btn('Raport i oddawanie pracy','finish'):''}</div><p class="meta" style="margin-top:16px">W drugiej ścieżce znasz już wspólne materiały. Korzystaj z tej wiedzy; porównujesz jej przydatność dla innego zlecenia. To nie jest niezależny test „przed i po”.</p></section>${sources()}`;}
function brief(){return `<section class="card"><p class="eyebrow">1 / 4 · poznaj klienta</p><h2>Zlecenie i rozmowa</h2><p><b>${esc(c().title)}</b></p><blockquote>${esc(c().mandate)}</blockquote><dl class="brief-dl"><dt>Decyzja</dt><dd>${esc(c().decision)}</dd><dt>Możliwości</dt><dd>${esc(c().powers)}</dd><dt>Zależności</dt><dd>${esc(c().limits)}</dd><dt>Termin i zasoby</dt><dd>W symulacji: krótka notatka dla klienta (brief) za 5 dni. Możesz przeznaczyć łącznie 3 dni pracy na przygotowanie dwóch źródeł. To ograniczenia analizy, nie zegar odliczający czas gry.</dd></dl>${guide('Posłuchaj klienta, a potem samodzielnie sformułuj problem.','Oddziel to, co klient chce poprawić, od przypuszczenia o przyczynie i preferowanego rozwiązania. Jego cele i standardy oceny też wymagają jawnego uzasadnienia.','4–9, 12–14')}<h3>Trzy pytania doradcy</h3><p>Otwórz każdą odpowiedź. Zapamiętaj: decyzję, zakres i to, czego klient jeszcze nie wie.</p>${c().talk.map((t,i)=>`<div class="talk">${btn(esc(t.question),'talk',`data-index="${i}" aria-expanded="${r().read.includes(i)}" aria-controls="talk-${i}"`)}${r().read.includes(i)?`<p id="talk-${i}"><b>Klient:</b> ${esc(t.answer)}</p>`:`<div id="talk-${i}" hidden></div>`}</div>`).join('')}<details><summary>Uporządkuj punkt wyjścia</summary><div class="inside">${esc(c().seed)}</div></details>${r().knewPacket?'<div class="notice">To kolejna ścieżka. Wspólny pakiet był już dostępny podczas wcześniejszej pracy; możesz się do niego odwoływać także w roboczej notatce.</div>':''}<div class="actions">${btn('Przejdź do roboczej definicji','next-brief','','primary')}</div></section>`;}
function initial(){return `<section class="card"><p class="eyebrow">2 / 4 · krok 1 Bardacha</p><h2>Robocza definicja problemu</h2>${guide('Zlecenie jest materiałem do analizy.','Nazwij niepożądany stan, grupę, zakres i standard oceny. Nie wpisuj niepotwierdzonej przyczyny ani wybranego rozwiązania do definicji. Zaznacz to, czego jeszcze nie wiesz.','4–9, 12–14')}${question(0)}<h3>Teraz zapisz własną notatkę</h3><p>Nie trzeba przepisywać odpowiedzi z pytania zamkniętego. Sformułuj problem konkretnie dla tego klienta.</p>${DATA.initialFields.map(f=>field(f,'initial',r().initial[f.id],r().initialLocked)).join('')}<div class="actions">${btn(r().initialLocked?'Przejdź do zapisanego planu':'Zachowaj wersję roboczą i zaplanuj dowody','next-initial','','primary')}</div><p class="meta" style="margin-top:16px">Po przejściu dalej zachowamy tę wersję do porównania. Nową definicję wpiszesz po zapoznaniu się z dowodami.</p></section>`;}
function plan(){const ps=E.planStatus(p(),r().selected);return `<section class="card"><p class="eyebrow">3 / 4 · krok 2 Bardacha</p><h2>Zaplanuj zbieranie dowodów</h2>${guide('Think before you collect — pomyśl, zanim zaczniesz zbierać.','Wybierz informacje, które mogą zmienić rozpoznanie problemu lub przygotowanie decyzji. Ustal pytanie, źródło i wartość informacji wobec czasu i kosztu jej zdobycia.','15–16, 19–21')}<details><summary>Moja robocza definicja i hipoteza</summary><div class="inside"><p class="note">${esc(r().initial.problem)}</p><p class="note">${esc(r().initial.hypothesis)}</p></div></details><p><b>Wybierz dokładnie 2 źródła.</b> Łączny nakład nie może przekroczyć 3 dni pracy, a oba źródła muszą być dostępne najpóźniej w dniu 5. Dostępność liczona jest od dziś; prace mogą toczyć się równolegle. Źródło D6 możesz rozważyć w dalszym zadaniu.</p><div class="budget" id="budget" role="status">${budgetText(ps)}</div><div class="evidence-grid">${p().cards.map(card=>`<label class="evidence-choice"><input type="checkbox" data-card="${card.id}" ${r().selected.includes(card.id)?'checked':''} ${r().planLocked?'disabled':''}><span><strong>${card.id} · ${esc(card.title)}</strong><p>${esc(card.scope)}</p><small>Nakład: ${card.cost} ${card.cost===1?'dzień':'dni'} pracy. Dostępność: dzień ${card.wait}.</small></span></label>`).join('')}</div><div class="field"><label for="plan">Dlaczego te dwa źródła?</label><p id="plan-help">Dla każdego podaj pytanie, na które może odpowiedzieć, i wyjaśnij znaczenie odpowiedzi dla decyzji klienta. Pokaż związek z definicją lub hipotezą. Wystarczą 2–4 zdania.</p><textarea id="plan" maxlength="1000" data-group="plan" aria-describedby="plan-help" ${r().planLocked?'readonly':''}>${esc(r().plan)}</textarea><small>Do 1000 znaków. Nie punktujemy automatycznie zestawu kart; liczy się uzasadnienie.</small><details><summary>Pomoc w uzasadnieniu</summary><div class="inside">„D… pozwoli ustalić […]. To ważne, bo klient ma zdecydować […]. D… pomoże sprawdzić […], co może zmienić […]”. Możesz potrzebować danych o skali, przyczynach, wpływie programu albo możliwościach działania klienta — zależnie od zlecenia.</div></details></div><div class="actions">${btn(r().planLocked?'Otwórz pakiet i rewizję':'Zapisz plan i otwórz dowody','next-plan','','primary')}</div><p class="meta" style="margin-top:16px">Po zapisaniu plan pozostanie widoczny. Dla celów szkoleniowych otrzymasz cały pakiet, dzięki czemu obie ścieżki będą porównywalne. Potem wskażesz, czego jeszcze warto się dowiedzieć.</p></section>`;}
function budgetText(ps){return `Wybrane źródła: ${ps.count}/2 · Nakład: ${ps.cost}/3 dni pracy · Najpóźniejsza dostępność: dzień ${ps.wait}/5. ${ps.valid?'Plan mieści się w ograniczeniach.':''}`;}
function revision(){return `<section class="card"><p class="eyebrow">4 / 4 · wróć do kroku 1 po kroku 2</p><h2>Dowody i rewizja definicji</h2>${guide('Iterate — wracaj do definicji w świetle materiału.','Sprawdź, co dowody mówią o skali, możliwych przyczynach, skutkach programu i kontekście działania. Możesz zmienić albo podtrzymać definicję. Wskaż podstawę i granicę wniosku.','12–16, 19–21')}<details><summary>Mój zachowany plan</summary><div class="inside"><p>${esc(r().selected.join(' + '))}</p><p class="note">${esc(r().plan)}</p></div></details>${packet()}<p class="notice">Przed odpowiedzią na pytanie niżej przeczytaj karty, do których się ono odwołuje — także wtedy, gdy nie były w Twoim planie.</p>${question(1)}<h3>Krótki brief dla klienta</h3><details open><summary>Moja wersja robocza — punkt odniesienia</summary><div class="inside"><p class="note">${esc(r().initial.problem)}</p><p class="note">${esc(r().initial.hypothesis)}</p></div></details>${DATA.finalFields.map(f=>field(f,'final',r().final[f.id])).join('')}<div class="actions">${btn('Zapisz brief i zakończ tę ścieżkę','complete-client','','primary')}</div><p class="meta" style="margin-top:16px">Zakończenie sprawdza obecność odpowiedzi, nie jakość argumentacji. Tę omówicie z prowadzącym.</p></section>`;}
function compare(){
  const cols=p().clients, rows=[['Decyzja klienta',x=>x.decision],['Definicja robocza',x=>S.routes[x.id].initial.problem],['Definicja po dowodach',x=>S.routes[x.id].final.problem],['Co zmieniam lub podtrzymuję',x=>S.routes[x.id].final.revision],['Plan źródeł',x=>S.routes[x.id].selected.join(' + ')+': '+S.routes[x.id].plan],['Dalsza informacja',x=>S.routes[x.id].final.next]];
  return `<section class="card"><p class="eyebrow">Porównanie · jeden program, dwie decyzje</p><h2>Co zmienił klient?</h2><p>Porównaj własne notatki. Klient wpływa na zakres analizy i wartość informacji. Nie zmienia prawdziwości danych ani obowiązku sprawdzania hipotez.</p><div class="compare"><table><caption class="sr-only">Porównanie obu ścieżek</caption><thead><tr><th scope="col">Element</th>${cols.map(x=>`<th scope="col">${esc(x.short)}</th>`).join('')}</tr></thead><tbody>${rows.map(([label,fn])=>`<tr><th scope="row">${label}</th>${cols.map(x=>`<td data-label="${esc(x.short)}" style="white-space:pre-wrap">${esc(fn(x))}</td>`).join('')}</tr>`).join('')}</tbody></table></div>${DATA.compareFields.map(f=>field(f,'comparison',S.comparison[f.id])).join('')}<div class="actions">${btn('Zapisz porównanie i przygotuj raport','complete-compare','','primary')}</div></section>`;
}
function finish(){const sc=E.scores(S);return `<section class="card"><p class="eyebrow">Obie ścieżki i porównanie zapisane</p><h1>Raport dla doradcy</h1><p>Masz dwa briefy dla programu <b>${esc(p().name)}</b> i porównanie perspektyw. Wróć do nich na ćwiczeniach i wykorzystaj do próbnego wypełnienia części K3 dotyczącej definiowania problemu i zbierania dowodów.</p><div class="score"><div>Poprawne pierwsze wybory<strong>${sc.first} / 4</strong></div><div>Poprawne ostatnie wybory<strong>${sc.last} / 4</strong></div></div><p class="meta">To informacja o czterech pytaniach zamkniętych, nie ocena całej pracy. Druga ścieżka korzysta z wcześniejszej wiedzy; zmiana wyniku nie jest niezależnym pomiarem uczenia się.</p><h2>Oddaj wyniki według ustaleń prowadzącego</h2><ol><li>Pobierz raport TXT i kopię JSON.</li><li>Skopiuj cały kod z pola poniżej.</li><li>Otwórz formularz, wklej kod w pole „Kod rozgrywki BD1”, podaj numer zespołu i pytanie lub trudność. Kliknij „Prześlij” w formularzu.</li></ol><label for="submission-code"><b>Kod do formularza (format BD1, zawartość wersji 2.0)</b></label><textarea id="submission-code" class="code" readonly spellcheck="false">${esc(E.encode(S))}</textarea><div class="actions">${btn('Kopiuj kod','copy-code','','primary')}<a class="button" target="_blank" rel="noopener" href="${esc(DATA.formUrl)}">Otwórz formularz Google ↗</a></div><p class="meta" style="margin-top:16px">Formularz wymaga logowania kontem UW i zbiera adres e-mail. Kod zawiera zapis obu ścieżek oraz porównanie. Samo otwarcie formularza nie wysyła pracy. Zachowaj potwierdzenie wysłania.</p><div class="actions">${btn('Pobierz raport TXT','txt')}${btn('Pobierz kopię JSON','json')}${btn('Drukuj / zapisz PDF','print')}${btn('Wróć do porównania','compare')}</div><details><summary>Podgląd pełnego raportu</summary><div class="inside"><pre class="report">${esc(E.reportText(S))}</pre></div></details></section><section class="card"><p class="eyebrow">Dalej · krok 3 Bardacha</p><h2>Konstruowanie alternatyw</h2><p>Dla wybranego klienta przygotujesz różne sposoby działania na podstawie definicji problemu i dowodów. Uwzględnisz kontynuację obecnych działań i trendów, potrzebne uzgodnienia oraz możliwość łączenia działań.</p><p>Nie musisz jeszcze wskazywać zwycięskiego wariantu. Sprawdź, czy Twoja definicja zostawia miejsce na kilka możliwości i czy nie wpisałeś/aś preferowanego rozwiązania do opisu problemu.</p><p class="meta">Bardach, od s. 21. Konstruowanie alternatyw będzie następnym zadaniem policy analysis.</p></section>${sources()}`;}
function sidebar(){return `<aside aria-label="Nawigacja i zapis"><nav class="steps" aria-label="Etapy pracy">${btn('Dwa zlecenia','overview',` ${S.screen==='overview'?'aria-current="step"':''}`)}${S.screen==='path'?['Zlecenie i rozmowa','Robocza definicja','Plan dowodów','Dowody i rewizja'].map((t,i)=>btn(`<span class="stepnum">${i+1}</span>${t}`,'stage',`data-index="${i}" ${r().stage===i?'aria-current="step"':''} ${r().unlocked<i?'disabled':''}`)).join(''):''}${btn('Porównanie','compare',`${S.screen==='compare'?'aria-current="step"':''} ${!Object.values(S.routes).every(x=>x.complete)?'disabled':''}`)}${S.compared?btn('Raport i formularz','finish',S.screen==='finish'?'aria-current="step"':''):''}<p id="storage" class="storage">${esc(storageError||'Postęp zapisuje się w tej przeglądarce. Pobierz także kopię JSON.')}</p><div class="toolbar">${btn('Zapis JSON','json')}${btn('Raport TXT','txt')}${btn('Wczytaj JSON','import')}${btn('Nowa sesja','new')}</div></nav></aside>`;}
function render(focus=true){
  const focused=document.activeElement;
  const remember=focused?.id?{id:focused.id}:focused?.name?{name:focused.name,value:focused.value}:focused?.dataset.action?{action:focused.dataset.action,index:focused.dataset.index,client:focused.dataset.client}:null;
  $('#app').innerHTML=home?`<main id="main" tabindex="-1">${renderHome()}</main>`:`<div class="layout">${sidebar()}<main id="main" tabindex="-1">${S.screen==='path'?`<section class="card compact"><p class="eyebrow">${esc(p().short)} · klient ${S.active.toUpperCase()}</p><strong>${esc(c().title)}</strong><p><b>Decyzja:</b> ${esc(c().decision)}</p></section>`:''}${S.screen==='overview'?overview():S.screen==='compare'?compare():S.screen==='finish'?finish():[brief,initial,plan,revision][r().stage]()}${S.screen==='path'&&r().stage<3&&Object.values(S.routes).some(x=>x.planLocked)?`<details><summary>Wspólny pakiet znany z wcześniejszej pracy</summary><div class="inside">${packet(c(),false)}</div></details>`:''}${S.screen==='path'?`<details><summary>Rozpocznij tę ścieżkę ponownie</summary><div class="inside"><p>Usunie to notatki i historię tylko tego klienta. Porównanie pozostanie jako szkic do ponownego zatwierdzenia. Wiedzy poznanej w poprzednim przebiegu nie można cofnąć.</p>${btn('Wyzeruj ścieżkę tego klienta','reset-client')}</div></details>`:''}<p class="foot">Wersja 2.0 · fikcyjny materiał dydaktyczny · ${link('Bardach, kroki 1 i 2',DATA.reading)}</p></main></div>`;
  $('#message').hidden=true;
  if(focus){$('#main').focus({preventScroll:true});window.scrollTo({top:0,behavior:'instant'});}
  else if(remember){const target=remember.id?document.getElementById(remember.id):remember.name?[...document.querySelectorAll('[name]')].find(x=>x.name===remember.name&&x.value===remember.value):[...document.querySelectorAll('[data-action]')].find(x=>x.dataset.action===remember.action&&x.dataset.index===remember.index&&x.dataset.client===remember.client);target?.focus({preventScroll:true});}
}
function invalidate(){r().complete=false;S.compared=false;}
function renderTerms(){const query=$('#term-search').value.toLocaleLowerCase('pl');const list=DATA.terms.filter(t=>[t.name,t.en,t.definition,S?t.examples[S.program]:''].join(' ').toLocaleLowerCase('pl').includes(query));$('#terms').innerHTML=list.map(t=>`<article class="term"><h3>${esc(t.name)}</h3><p class="meta">${esc(t.en)} · Bardach, s. ${esc(t.pages)}</p><p>${esc(t.definition)}</p>${S?`<p class="example"><b>${esc(p().short)}:</b> ${esc(t.examples[S.program])}</p>`:'<p class="meta">Wybierz program, aby zobaczyć przykład.</p>'}</article>`).join('')||'<p>Brak pasujących haseł. Spróbuj innego słowa.</p>';}
async function act(action,el){
  if(action==='home'){home=true;render();return;}
  if(action==='glossary'){glossaryFocus=document.activeElement;$('#term-search').value='';renderTerms();$('#glossary').showModal();$('#term-search').focus();return;}
  if(action==='close-glossary'){$('#glossary').close();return;}
  if(action==='choose'){selectProgram($('#program').value);return;}
  if(action==='import'){$('#import-file').click();return;}
  if(action==='recover'){download(`Bardach_v2_${corrupt.id}_odzyskanie.txt`,corrupt.raw);return;}
  if(action==='replace-corrupt'){if(confirm('Zachowaj kopię uszkodzonego zapisu, jeśli chcesz go odzyskać. Zastąpić go nową sesją?')){S=E.fresh(corrupt.id);corrupt=null;home=false;commit();}return;}
  if(!S)return;
  if(action==='json'){save();download(filename('json'),JSON.stringify(S,null,2),'application/json');return;}
  if(action==='txt'){save();download(filename('txt'),E.reportText(S));return;}
  if(action==='print'){$('#print-report').textContent=E.reportText(S);window.print();return;}
  if(action==='copy-code'){const box=$('#submission-code');box.focus();box.select();try{await navigator.clipboard.writeText(box.value);message('Kod skopiowany. Wklej go w formularzu Google.');}catch{message('Kod jest zaznaczony. Skopiuj go skrótem Ctrl+C (na Macu ⌘C), a następnie wklej w formularzu.');}return;}
  if(action==='new'){if(confirm('Rozpocząć nową sesję tego programu? Zastąpi to lokalny postęp. Najpierw pobierz JSON, jeśli chcesz go zachować.')){S=E.fresh(S.program);home=false;commit();}return;}
  if(action==='overview'){S.screen='overview';commit();return;}
  if(action==='client'){startClient(el.dataset.client);return;}
  if(action==='stage'){const i=Number(el.dataset.index);if(i<=r().unlocked){r().stage=i;S.screen='path';commit();}return;}
  if(action==='talk'){const i=Number(el.dataset.index);if(!r().read.includes(i))r().read.push(i);commit(false);return;}
  if(action==='next-brief'){if(r().read.length<3){message('Otwórz wszystkie trzy odpowiedzi klienta przed sformułowaniem problemu.',true);return;}r().unlocked=Math.max(r().unlocked,1);r().stage=1;commit();return;}
  if(action==='hint'){const a=r().answers[Number(el.dataset.index)];a.help=true;if(!a.history.length)a.helpBefore=true;commit(false);return;}
  if(action==='check'){const i=Number(el.dataset.index),a=r().answers[i];if(i===0&&r().initialLocked)return;if(!a.selected){message('Najpierw wybierz jedną odpowiedź.',true);return;}if(!E.checked(a)){if(a.history.length>=100){message('Osiągnięto limit 100 zmian odpowiedzi. Zachowaj ostatni sprawdzony wybór.',true);return;}a.history.push({choice:a.selected,at:E.now()});}commit(false);return;}
  if(action==='next-initial'){if(!E.checked(r().answers[0])||!E.filled(r().initial)){message('Sprawdź odpowiedź zamkniętą i uzupełnij obie krótkie notatki. Poprawny wynik pytania zamkniętego nie jest warunkiem przejścia.',true);return;}r().initialLocked=true;r().unlocked=Math.max(r().unlocked,2);r().stage=2;commit();return;}
  if(action==='next-plan'){if(!E.planStatus(p(),r().selected).valid||!r().plan.trim()){message('Wybierz dokładnie 2 źródła: do 3 dni pracy łącznie, oba dostępne do dnia 5. Dodaj uzasadnienie wyboru.',true);return;}r().planLocked=true;r().unlocked=3;r().stage=3;commit();return;}
  if(action==='complete-client'){if(!E.checked(r().answers[1])||!E.filled(r().final)){message('Sprawdź odpowiedź zamkniętą i uzupełnij trzy pola briefu. Każde pole może zawierać krótką odpowiedź.',true);return;}r().complete=true;S.screen='overview';commit();return;}
  if(action==='compare'){if(!Object.values(S.routes).every(x=>x.complete)){message('Najpierw zakończ obie ścieżki.',true);return;}S.screen='compare';commit();return;}
  if(action==='complete-compare'){if(!E.filled(S.comparison)){message('Uzupełnij trzy krótkie odpowiedzi porównujące ścieżki.',true);return;}S.compared=true;S.screen='finish';commit();return;}
  if(action==='finish'){if(S.compared){S.screen='finish';commit();}return;}
  if(action==='reset-client'){if(confirm('Usunąć lokalne odpowiedzi tylko tego klienta i ponownie otworzyć porównanie?')){const id=S.active,known=Object.values(S.routes).some(x=>x.planLocked);S.routes[id]=E.route();S.order=S.order.filter(x=>x!==id);S.compared=false;startClient(id);r().knewPacket=known;commit();}return;}
}
document.addEventListener('click',e=>{const el=e.target.closest('[data-action]');if(el&&!el.disabled)Promise.resolve(act(el.dataset.action,el)).catch(err=>message('Nie udało się wykonać operacji: '+err.message,true));});
document.addEventListener('input',e=>{const el=e.target;if(el.id==='term-search'){renderTerms();return;}if(!S||!el.dataset.group||el.readOnly)return;const group=el.dataset.group;if(group==='comparison'){S.comparison[el.dataset.field]=el.value;S.compared=false;}else if(group==='plan')r().plan=el.value;else{r()[group][el.dataset.field]=el.value;if(group==='final')invalidate();}save();});
document.addEventListener('change',e=>{const el=e.target;if(!S)return;if(el.dataset.question!==undefined){const i=Number(el.dataset.question);if(i===0&&r().initialLocked)return;r().answers[i].selected=el.value;if(i===1)invalidate();commit(false);}if(el.dataset.card){if(r().planLocked)return;const id=el.dataset.card;if(el.checked&&r().selected.length>=2){el.checked=false;message('Wybrano już dwa źródła. Odznacz jedno, aby wybrać inne.',true);return;}r().selected=el.checked?[...r().selected,id]:r().selected.filter(x=>x!==id);save();$('#budget').textContent=budgetText(E.planStatus(p(),r().selected));}});
$('#glossary').addEventListener('close',()=>glossaryFocus?.focus());
$('#glossary').addEventListener('keydown',e=>{if(e.key==='Escape'){e.preventDefault();$('#glossary').close();}});
$('#import-file').addEventListener('change',async e=>{const f=e.target.files[0];e.target.value='';if(!f)return;try{if(f.size>300000)throw Error('Plik jest za duży. Wybierz pojedynczy zapis JSON gry.');const next=E.validate(JSON.parse(await f.text()));if(!confirm(`Wczytać zapis programu ${E.program(next.program).name}? Zastąpi to lokalny postęp tego programu.`))return;S=next;home=false;corrupt=null;commit();message('Wczytano zapis. Możesz kontynuować pracę.');}catch(err){message('Nie wczytano pliku: '+err.message,true);}});
render(false);

</script></body></html>
