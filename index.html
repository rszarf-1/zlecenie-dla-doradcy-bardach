<!doctype html><html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Gra edukacyjna o definiowaniu problemu i gromadzeniu dowodów w podejściu Bardacha."><title>Zlecenie dla doradcy · Bardach 1–2</title><style>:root{color-scheme:light dark;--bg:#f3f1eb;--paper:#fffefa;--ink:#21383e;--muted:#53666b;--line:#d5ddd9;--brand:#155f64;--soft:#e8f2ef;--accent:#ad6730;--warn:#fff0df;--bad:#8e342c;--good:#216244;--shadow:0 10px 35px #243f3a0c}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.6 system-ui,-apple-system,'Segoe UI',sans-serif}button,input,select,textarea{font:inherit;color:inherit}button,select{cursor:pointer}a{color:var(--brand);text-underline-offset:3px}button,.button{border:1px solid var(--line);background:var(--paper);border-radius:8px;padding:10px 16px;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:8px;font-weight:600;min-height:44px}button:hover,.button:hover{border-color:var(--brand);background:var(--soft)}button.primary{background:var(--brand);color:#fff;border-color:var(--brand)}button:disabled{opacity:.5;cursor:not-allowed}button:focus-visible,a:focus-visible,input:focus-visible,summary:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid #dc9746;outline-offset:3px}input,select,textarea{border:1px solid var(--line);background:var(--paper);border-radius:7px;padding:10px;max-width:100%}textarea{display:block;width:100%;resize:vertical;min-height:125px;line-height:1.6}h1,h2,h3{line-height:1.2;letter-spacing:-.025em}h1{font-size:clamp(2.2rem,5vw,3.6rem);margin:.4em 0}h2{font-size:1.75rem;margin:0 0 18px}h3{font-size:1.17rem;margin:0 0 10px}p{margin:0 0 16px}small,.muted{color:var(--muted)}small{font-size:.86rem}.eyebrow{font-size:.76rem;letter-spacing:.13em;text-transform:uppercase;font-weight:750;color:var(--brand)}.mast{max-width:1200px;margin:auto;padding:24px 26px 14px;display:flex;align-items:center;justify-content:space-between;gap:16px}.wordmark{font-weight:800;line-height:1.2}.wordmark small{display:block;font-weight:450;margin-top:5px}.wrap{max-width:1200px;margin:auto;padding:10px 26px 50px}.layout{display:grid;grid-template-columns:230px minmax(0,1fr);gap:28px}.main{min-width:0}aside nav{position:sticky;top:20px}.steps{list-style:none;margin:0;padding:0}.steps button{border:0;width:100%;text-align:left;justify-content:flex-start;background:transparent;font-size:.9rem;font-weight:500;margin-bottom:4px}.steps button[aria-current=step]{background:var(--brand);color:white}.step-n{display:inline-grid;place-items:center;min-width:24px;height:24px;border:1px solid currentColor;border-radius:50%;font-size:.75rem}.card{background:var(--paper);border:1px solid var(--line);padding:28px;border-radius:16px;box-shadow:var(--shadow);margin-bottom:20px}.hero{padding:36px;position:relative}.hero .lead{font-size:1.15rem;max-width:760px}.hero-grid{display:grid;grid-template-columns:1.4fr 1fr;gap:24px}.flow{display:flex;align-items:stretch;gap:9px;margin:24px 0}.flow>div{flex:1;padding:14px;background:var(--soft);border-left:3px solid var(--brand);font-size:.9rem}.flow strong{display:block}.flow .future{background:transparent;border:1px dashed var(--line);border-left:3px solid var(--accent)}.actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:20px;align-items:center}.label{display:block;font-weight:650;margin:12px 0 7px}.meta{font-size:.85rem;color:var(--muted);margin-bottom:14px}.tag{display:inline-block;padding:4px 9px;border-radius:5px;background:var(--soft);color:var(--brand);font-size:.78rem;font-weight:700}.notice{background:var(--soft);border-left:4px solid var(--brand);padding:14px 18px;margin:18px 0}.notice.warn{background:var(--warn);border-color:var(--accent)}blockquote{border-left:3px solid var(--accent);padding:0 0 0 18px;margin:16px 0;font-size:1.07rem}details{border:1px solid var(--line);border-radius:10px;background:var(--paper);margin:12px 0}summary{cursor:pointer;padding:13px 16px;font-weight:600}.inside{padding:0 18px 18px}.material{border-top:1px solid var(--line);padding-top:16px;margin-top:16px}.material p{font-size:.96rem}.material h3{color:var(--brand);font-size:.98rem}fieldset{border:0;margin:0;padding:0;min-width:0}legend{font-size:1.19rem;font-weight:650;line-height:1.5;margin-bottom:20px;width:100%}.option{display:flex;align-items:flex-start;gap:12px;border:1px solid var(--line);border-radius:10px;padding:16px;margin:10px 0;cursor:pointer;background:var(--paper);font-weight:450}.option:has(input:checked){background:var(--soft);border-color:var(--brand)}.option input{margin:5px 0 0;width:20px;height:20px;flex:none;accent-color:var(--brand)}.letter{font-weight:700;color:var(--muted);margin-right:8px}.feedback{margin-top:24px;padding:24px;background:var(--soft);border-radius:12px}.feedback.bad{background:var(--warn)}.feedback h3{font-size:1.3rem}.feedback dl{margin:20px 0}.feedback dt{font-weight:700}.feedback dd{margin:0 0 12px}.feedback .source{font-size:.85rem}.error{color:var(--bad);font-weight:600}.field{margin:25px 0}.field label{font-weight:700;display:block;margin-bottom:7px}.field .prompt{margin:0 0 10px;font-size:.96rem}.field details{background:transparent;font-size:.88rem}.note-read{white-space:pre-wrap;overflow-wrap:anywhere;padding:15px;background:var(--soft);border-radius:7px}.score-row{display:grid;grid-template-columns:1fr 1fr;gap:16px}.score{padding:20px;background:var(--soft);border-radius:12px}.score b{display:block;font-size:2.5rem;line-height:1.2}.evidence{display:grid;gap:12px}.evidence>div{border-left:3px solid var(--brand);padding:10px 16px;background:var(--soft)}.evidence strong{display:block}.footer{border-top:1px solid var(--line);padding-top:22px;font-size:.82rem;color:var(--muted);margin-top:28px}.storage{font-size:.8rem;color:var(--muted);margin:18px 0;overflow-wrap:anywhere}.skip{position:absolute;left:-9999px}.skip:focus{left:10px;top:10px;background:var(--paper);padding:12px;z-index:9}dialog{color:var(--ink);background:var(--paper);border:1px solid var(--line);border-radius:14px;width:min(850px,94vw);max-height:90vh;padding:24px}dialog::backdrop{background:#112e39aa}.dialog-head{display:flex;justify-content:space-between;gap:16px;align-items:center}.dialog-head h2{margin:0}#term-search{width:100%;margin:18px 0}.term{padding:18px 0;border-bottom:1px solid var(--line)}.term h3{font-size:1.1rem}.term .en{font-size:.82rem;color:var(--muted)}.term .example{padding:12px;background:var(--soft);border-radius:6px}.term p{margin:10px 0}.badge{display:inline-block;padding:2px 7px;background:var(--soft);border-radius:4px;font-size:.8rem}pre.report{white-space:pre-wrap;overflow-wrap:anywhere;font:15px/1.65 system-ui}.toolbar{display:flex;gap:8px;flex-wrap:wrap}.two{display:grid;grid-template-columns:1fr 1fr;gap:20px}.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}.counts{font-size:.8rem;color:var(--muted)}table{border-collapse:collapse;width:100%;font-size:.9rem}td,th{border-bottom:1px solid var(--line);padding:10px;text-align:left;vertical-align:top}.table-scroll{overflow-x:auto}.code{min-height:140px;font:12px/1.5 monospace;overflow-wrap:anywhere}hr{border:0;border-top:1px solid var(--line);margin:26px 0}.print-only{display:none}

</style></head><body><a class="skip" href="#main">Przejdź do treści</a><header class="mast"><button id="home-button" class="wordmark" aria-label="Wróć do wyboru programu">Zlecenie dla doradcy</button><div><small id="program-label"></small><br><button id="glossary-button">Słowniczek</button></div></header><div class="wrap" id="app"></div><input id="import-file" type="file" accept=".json,application/json" hidden><dialog id="glossary" aria-labelledby="glossary-name"><div class="dialog-head"><h2 id="glossary-name">Słowniczek</h2><button id="glossary-close">Zamknij</button></div><label for="term-search" class="sr-only">Szukaj pojęcia lub przykładu</label><input id="term-search" type="search" placeholder="Szukaj pojęcia lub przykładu…"><div id="terms"></div></dialog><dialog id="confirm" aria-label="Zarządzanie zapisem"><div id="confirm-body"></div></dialog><div class="print-only"><h1>Zlecenie dla doradcy</h1><pre id="print-report"></pre></div><noscript>Włącz JavaScript, aby uruchomić grę. Plik działa bez połączenia z internetem, z wyjątkiem lektury i oddania wyniku przez formularz.</noscript><script>const DATA={"version":"1.0.0","keyVersion":"BD1-20261107","reading":"https://drive.google.com/file/d/1qRgdHdTwusO55uDVtkpzWo6rPDevOlG4/view?usp=sharing","terms":[{"id":"problem","name":"Problem publiczny i oceniająca definicja","en":"Define the problem; make the definition evaluative","pages":"2–4","definition":"Opis niepożądanego stanu zawiera ocenę, co jest niewłaściwe i dlaczego. Uzasadnienie działania publicznego wymaga namysłu; niesprawność rynku nie gwarantuje skutecznej interwencji.","examples":{"GPA":"Zbyt wiele osób bez auta nie może dojechać do podstawowych usług według jawnego standardu dostępności.","CP":"Nadmierne narażenie mieszkańców na PM2,5. Trzeba wskazać grupę, okres oraz podstawę oceny poziomu jako nadmiernego.","BK2":"Zbyt duże obciążenie dochodów kosztami odpowiedniego mieszkania. Własność nie musi być jedynym sposobem zaspokojenia potrzeby.","SCT":"Nadmierne narażenie mieszkańców określonych ulic na NO₂. Granica strefy nie wyznacza automatycznie granicy problemu.","BO":"Zbyt mały wpływ określonych grup na wydatki wobec jawnego standardu równości możliwości uczestnictwa."}},{"id":"rhetoric","name":"Retoryka kwestii","en":"Issue rhetoric","pages":"4–6","definition":"Język debaty i skarg dostarcza materiału do roboczej definicji. Może łączyć ocenę, etykietę, domniemaną przyczynę i rozwiązanie; wymaga analitycznego uporządkowania.","examples":{"GPA":"Zdanie „autobusy jeżdżą donikąd” wymaga przełożenia na konkretne trudności podróży, grupy i godziny.","CP":"Hasło „program stoi, bo tonie w papierach” łączy ocenę realizacji z hipotezą o barierze administracyjnej.","BK2":"Hasło „młodych nie stać na własne M” wymaga rozdzielenia potrzeb mieszkaniowych, dostępu do własności i grupy adresatów.","SCT":"Hasło „miasto dusi się w spalinach” wymaga ustalenia narażenia, obszaru i udziału różnych źródeł.","BO":"Hasło „budżet przejęli aktywiści” jest punktem wyjścia do badania wpływu i reprezentacji, a nie gotowym ustaleniem."}},{"id":"scale","name":"Skala problemu i kwantyfikacja","en":"Quantify if possible","pages":"6–7","definition":"W miarę możliwości określ wielkość niedoboru lub nadmiaru. Podaj miernik, zakres i niepewność; brak dokładnej liczby nie zwalnia z operacyjnego opisu.","examples":{"GPA":"Odsetek osób bez auta niemogących odbyć potrzebnej podróży i wrócić w określonym czasie i koszcie.","CP":"Liczba mieszkańców narażonych ponad przyjęty poziom w określonym okresie; same odczyty jednej stacji nie ustalają tego automatycznie.","BK2":"Odsetek gospodarstw przekraczających określony próg obciążenia dochodu zdefiniowanymi kosztami mieszkaniowymi.","SCT":"Rozkład stężeń NO₂ i liczba narażonych mieszkańców w badanym obszarze, z okresem i sposobem pomiaru.","BO":"Udział osób deklarujących brak wpływu oraz reprezentacja potrzeb poszczególnych grup w wydatkach; frekwencja opisuje tylko część sytuacji."}},{"id":"cause","name":"Definicja diagnostyczna i twierdzenie przyczynowe","en":"Diagnose conditions that cause problems","pages":"7, 9, 12","definition":"Można zdefiniować jako problem stan powodujący inne szkody. Jego związek przyczynowy trzeba sprawdzić; samo nazwanie przyczyny nie czyni jej prawdziwą.","examples":{"GPA":"„Nieznajomość rozkładu powoduje trudności dojazdu” to hipoteza. Trzeba sprawdzić także dopasowanie godzin i możliwość powrotu.","CP":"„Emisje z ogrzewania powodują narażenie” wymaga oceny ich udziału obok innych źródeł i warunków rozprzestrzeniania.","BK2":"„Wysokie raty powodują niezaspokojenie potrzeb” wymaga odróżnienia kosztu finansowania od dochodów, cen i podaży.","SCT":"„Starsze pojazdy odpowiadają za narażenie” wymaga sprawdzenia składu ruchu, emisji i innych czynników.","BO":"„Niewiedza powoduje nieuczestnictwo” trzeba sprawdzić obok braku czasu, barier reguł i przekonania o małym wpływie."}},{"id":"context","name":"Kontekst problemu","en":"Context of the problem","pages":"12","definition":"Warunki występowania problemu mogą zmieniać znaczenie przyczyn i skuteczność działań. Definicja powinna uwzględniać te różnice, jeśli są istotne.","examples":{"GPA":"Godziny pracy zmianowej, odległość przystanku i dostępność usług zmieniają charakter trudności dojazdu.","CP":"Typ zabudowy, sposób ogrzewania i lokalne warunki rozprzestrzeniania zanieczyszczeń różnicują sytuację mieszkańców.","BK2":"Warunki rynku mieszkaniowego i możliwości najmu różnią się między lokalizacjami i grupami dochodowymi.","SCT":"Natężenie ruchu, zabudowa ulic i alternatywy podróży mogą różnicować problem oraz skutki ograniczeń wjazdu.","BO":"Zasoby organizacyjne, lokalizacja i bariery udziału różnicują możliwości oddziaływania mieszkańców na wydatki."}},{"id":"data","name":"Dane","en":"Data","pages":"15","definition":"Fakty o świecie lub ich reprezentacje. Obejmują liczby i materiały jakościowe; sama dostępność danych nie przesądza ich znaczenia dla zadania.","examples":{"GPA":"Godziny odjazdów, ceny biletów i zapis wypowiedzi mieszkańca o potrzebnej godzinie powrotu.","CP":"Odczyt stężenia, data zakończenia inwestycji i wypowiedź osoby, która nie wymieniła ogrzewania.","BK2":"Dochód gospodarstwa, wysokość raty, czynsz i opis dotychczasowych warunków mieszkaniowych.","SCT":"Odczyty NO₂, liczba pojazdów, parametry pogody i wypowiedź mieszkańca ulicy.","BO":"Liczba głosów, lokalizacja projektu i wypowiedź osoby, która nie uczestniczyła w głosowaniu."}},{"id":"information","name":"Informacja","en":"Information","pages":"15","definition":"Dane nabierające znaczenia dzięki uporządkowaniu w kategorie lub relacje. Pomagają rozróżniać sytuacje, lecz ich rola jako dowodu zależy od pytania.","examples":{"GPA":"Zestawienie godzin powrotu z pracy z ostatnim kursem ujawnia, gdzie oferta nie odpowiada potrzebie.","CP":"Zestawienie stężeń według sezonów i obszarów wskazuje różnice narażenia wymagające wyjaśnienia.","BK2":"Porównanie obciążenia kosztami mieszkania w grupach dochodowych pokazuje rozkład trudności.","SCT":"Zestawienie zmian NO₂ wewnątrz i poza strefą pokazuje podobieństwa i różnice przebiegu zmian.","BO":"Zestawienie zgłoszeń i wybranych projektów według obszarów pokazuje przestrzenny rozkład uczestnictwa i wydatków."}},{"id":"evidence","name":"Dowody","en":"Evidence","pages":"15","definition":"Informacje wpływające na przekonania istotnych odbiorców, także analityka, o problemie i możliwościach jego ograniczenia. Nie oznaczają automatycznie pewności ani dowodu przyczynowego.","examples":{"GPA":"Znajomość linii przy braku kursu powrotnego osłabia hipotezę, że jedyną barierą jest niewiedza.","CP":"Powtarzalny wzorzec stężeń i dane o źródłach mogą zmienić ocenę udziału emisji lokalnych; sam wzorzec nie rozstrzyga przyczyn.","BK2":"Informacja o zakupach planowanych przed dopłatą podważa założenie, że każdy kredyt oznacza dodatkowy zakup.","SCT":"Spadek NO₂ także poza strefą podważa przypisanie całej poprawy strefie, ale nie dowodzi braku jej wpływu.","BO":"Wzrost frekwencji przy trwałym pomijaniu potrzeb części grup osłabia utożsamienie uczestnictwa z reprezentacją."}},{"id":"value","name":"Wartość dowodów","en":"The value of evidence","pages":"16","definition":"Zależy od szansy zmiany decyzji na lepszą i wielkości oczekiwanej poprawy skutków. Porównuj tę wartość z kosztem pozyskania; taniość nie wystarcza.","examples":{"GPA":"Badanie barier nieużytkowników może bardziej zmienić kierunek pracy niż łatwo dostępna liczba wyświetleń rozkładu.","CP":"Rozpoznanie źródeł i barier inwestycji może być cenniejsze dla decyzji niż kolejny raport o liczbie obsłużonych wniosków.","BK2":"Kosztowne porównanie dodatkowych skutków dopłat może być zasadne przed decyzją o dużych wydatkach.","SCT":"Dane o ruchu i pogodzie pomagają ocenić interpretację spadku stężeń; ranking popularności stref rozstrzyga inne pytanie.","BO":"Rozmowy z nieuczestniczącymi mogą ujawnić bariery pomijane przez łatwo dostępne ankiety zwycięskich projektodawców."}},{"id":"independence","name":"Uwolnienie umysłu od zależności od informatora","en":"Free the captive mind","pages":"21","definition":"Dostęp do danych i gotowej perspektywy nie usprawiedliwia bezkrytycznego przejęcia diagnozy informatora lub klienta. Konfrontuj ją z ostrymi krytykami i ich argumentami.","examples":{"GPA":"Rozmawiaj z organizatorem oraz z osobami pomijanymi przez ofertę. Dostęp do rozkładów nie zobowiązuje do poparcia kampanii.","CP":"Dane operatora zestaw z doświadczeniami osób rezygnujących z inwestycji i krytyką sposobu udzielania wsparcia.","BK2":"Analizę banków i beneficjentów skonfrontuj z sytuacją niebeneficjentów i argumentami krytyków dopłat.","SCT":"Sprawdź argumenty zarządcy strefy i krytyków, w tym dotyczące przeniesienia ruchu oraz kosztów dostosowania.","BO":"Obok zwycięskich projektodawców uwzględnij nieuczestników, autorów odrzuconych propozycji i krytyków zasad."}},{"id":"hypothetical","name":"Problem hipotetyczny","en":"Hypothetical problem","pages":"8","definition":"Domniemany niepożądany stan można badać bez przesądzania, że istnieje. Jego istnienie trzeba sprawdzić. „Hipotetyczny” w tym znaczeniu nie oznacza fikcyjnego scenariusza gry.","examples":{"GPA":"Sugestia „potrzebujemy aplikacji” może oznaczać możliwą stratę czasu przy planowaniu podróży. Najpierw sprawdź jej występowanie.","CP":"Pomysł nowego punktu obsługi może odpowiadać domniemanym kosztom i rezygnacjom wynikającym z trudnych procedur.","BK2":"Postulat większych dopłat zakłada określone bariery potrzeb mieszkaniowych. Trzeba sprawdzić ich występowanie i skalę.","SCT":"Postulat przesunięcia granicy może zakładać istotne narażenie poza nią. Diagnoza tego narażenia pozostaje otwarta.","BO":"Pomysł dodatkowego głosowania może zakładać niewykorzystane możliwości wpływu; ich istnienia nie dowodzi sam pomysł."}},{"id":"opportunity","name":"Niewykorzystana możliwość poprawy","en":"Latent opportunity","pages":"8–11","definition":"Analiza może szukać możliwych korzyści, których nie ujawniły skargi. Przedmiotem pracy bywa utracona możliwość poprawy, a nie tylko już odczuwana szkoda.","examples":{"GPA":"Możliwe lepsze skoordynowanie przesiadek bez zwiększania liczby kursów wymaga sprawdzenia rozkładów i potrzeb.","CP":"Połączenie doradztwa z istniejącym kontaktem z mieszkańcami może ułatwić inwestycje, jeśli mechanizm i warunki to potwierdzą.","BK2":"Wykorzystanie dostępnych zasobów mieszkaniowych może otwierać inną drogę poprawy niż zwiększanie dopłat do zakupu.","SCT":"Lepsze skoordynowanie transportu zbiorowego może umożliwić ograniczenie narażenia przy mniejszych trudnościach dostosowania.","BO":"Istniejące miejsca spotkań mogą ułatwić udział dotąd pomijanych grup bez tworzenia osobnej struktury organizacyjnej."}},{"id":"purposes","name":"Trzy zastosowania dowodów","en":"Three principal purposes","pages":"15","definition":"Dowody pomagają określić naturę i rozmiar problemu, cechy konkretnej sytuacji polityki oraz doświadczenia podobnych rozwiązań. Ich znaczenie zmienia się w toku analizy.","examples":{"GPA":"Trudności dojazdu; zasoby i kompetencje organizatora; doświadczenia porównywalnego systemu przewozów.","CP":"Narażenie mieszkańców; zdolność gminy i gospodarstw do inwestycji; doświadczenia wsparcia w podobnych warunkach.","BK2":"Potrzeby mieszkaniowe; warunki rynku i możliwości działania; doświadczenia podobnych instrumentów wsparcia.","SCT":"Narażenie przy ulicach; ruch, kompetencje i możliwości dostosowania; doświadczenia innych stref.","BO":"Wpływ i potrzeby grup; reguły oraz zdolność realizacji projektów; doświadczenia innych miast."}},{"id":"estimate","name":"Uzasadniony szacunek","en":"Educated guess; guesstimate","pages":"6, 18–19","definition":"Przybliżenie oparte na wiedzy może oszczędzać zasoby. Ujawnij podstawę i niepewność; gdy lepsze dane mogą istotnie poprawić decyzję, warto je zdobyć.","examples":{"GPA":"Wstępnie oszacuj grupę bez auta z dostępnych danych, zaznacz zakres błędu i sprawdź, czy wpływa na wybór dalszych badań.","CP":"Przybliż liczbę narażonych na podstawie ludności i map pomiarów, ujawniając ograniczenia pokrycia.","BK2":"Oszacuj zakres obciążenia kosztami przy kilku założeniach o dochodach; nie przedstawiaj go jako zmierzonego skutku dopłaty.","SCT":"Wstępny szacunek narażonych może służyć planowaniu pomiarów, jeśli jasno opisano braki danych przestrzennych.","BO":"Przybliż zasięg potrzeb z istniejących badań, podając, których grup nie reprezentują."}},{"id":"quality","name":"Ocena badań i trafności","en":"Research design; internal and external validity","pages":"19","definition":"Sprawdzaj metodę, ograniczenia i przydatność do zadania. Trafność wewnętrzna dotyczy uzasadnienia wniosku w badaniu, zewnętrzna możliwości jego przeniesienia poza badane warunki.","examples":{"GPA":"Ankieta pasażerów może opisać ich doświadczenia, lecz pomija osoby niekorzystające; nie wyjaśnia automatycznie sytuacji całej gminy.","CP":"Spadek stężeń po inwestycjach wymaga uwzględnienia innych zmian; wynik jednej gminy nie przenosi się automatycznie na inną.","BK2":"Beneficjenci i niebeneficjenci mogą się różnić przed programem; proste porównanie nie usuwa tej selekcji.","SCT":"Obszar poza strefą może odczuwać jej skutki, co komplikuje użycie go jako porównania.","BO":"Opinie zwycięskich projektodawców nie reprezentują wszystkich mieszkańców; wzrost poczucia wpływu może mieć także inne przyczyny."}},{"id":"analogy","name":"Dobre praktyki i analogie","en":"Best practices; use analogies","pages":"19–20","definition":"Doświadczenia innych miejsc oraz podobne mechanizmy w odmiennych dziedzinach mogą inspirować. Trzeba sprawdzić działanie mechanizmu i warunki transferu, zamiast kopiować etykietę sukcesu.","examples":{"GPA":"Sukces informacji pasażerskiej w gminie Y nie rozstrzyga jej wartości tam, gdzie główną barierą są godziny kursów.","CP":"Rozwiązanie upraszczające wnioski gdzie indziej wymaga podobnych barier, zasobów obsługi i możliwości inwestowania.","BK2":"Doświadczenie dopłat w innym kraju zależy m.in. od podaży, zasad kredytowania i struktury potrzeb.","SCT":"Wynik innego miasta wymaga sprawdzenia ruchu, składu pojazdów, alternatyw podróży i sposobu pomiaru.","BO":"Wysoka frekwencja gdzie indziej nie dowodzi, że przeniesienie reguł poprawi reprezentację potrzeb w Warszawie."}},{"id":"iteration","name":"Iteracja","en":"Iterate","pages":"1, 12–14","definition":"Wracaj do definicji wraz ze zmianą wiedzy i rozumienia zadania. Rewizja może dotyczyć zakresu, przyczyn lub oceny; wymaga uzasadnienia, nie automatycznej zmiany zdania.","examples":{"GPA":"Nowe dane o powrotach mogą przesunąć uwagę z informacji na godziny, przy zachowaniu problemu dostępności.","CP":"Dane o napływie zanieczyszczeń mogą poszerzyć diagnozę przyczyn bez wykluczania znaczenia lokalnego ogrzewania.","BK2":"Rozpoznanie potrzeb osób niekwalifikujących się do kredytu może zmienić zakres diagnozy mieszkaniowej.","SCT":"Nowe pomiary poza granicą mogą wymagać poszerzenia obszaru diagnozy, bez przesądzania rozszerzenia instrumentu.","BO":"Dane o pomijanych potrzebach mogą przesunąć nacisk z ogólnej frekwencji na możliwości wpływu konkretnych grup."}},{"id":"evaluation","name":"Niepewność jako problem ewaluacji","en":"Uncertainty is the problem that evaluation addresses","pages":"6","definition":"Gdy zlecenie dotyczy oceny programu, problemem analitycznym jest nadmierna niepewność o wynikach i ich uwarunkowaniach. Wiedza o przeszłości ma służyć przyszłym działaniom.","examples":{"GPA":"Nie wiemy, na ile zmiana organizacji przewozów poprawiła dostęp do usług; ta luka ma znaczenie dla dalszych decyzji.","CP":"Nie wiemy, jaką zmianę narażenia przyniosło wsparcie inwestycji ani od czego zależały wyniki.","BK2":"Nie wiemy, jaka poprawa warunków mieszkaniowych nastąpiła dzięki dopłatom i jakie wywołały skutki poza programem.","SCT":"Nie wiemy, jaka część zmiany narażenia wynika ze strefy; ocena ma pomóc w przyszłych decyzjach.","BO":"Nie wiemy, czy BO zwiększa wpływ pomijanych grup; ocena konkretnej zmiany reguł jest węższym zadaniem."}},{"id":"mechanism","name":"Rola programu i mechanizm interwencji","en":"Pojęcie pomocnicze w grze","pages":null,"definition":"Zakładany ciąg od działania programu przez zmianę zachowań lub warunków do ograniczenia problemu. To schemat dydaktyczny, a nie osobna definicja Bardacha z tych rozdziałów.","examples":{"GPA":"Koordynacja połączeń → możliwa podróż i powrót → lepszy dostęp do pracy i usług. Każde przejście wymaga sprawdzenia.","CP":"Wsparcie inwestycji → zmiana ogrzewania → zmiana emisji i narażenia. Wniosek o dotację nie jest końcowym rezultatem.","BK2":"Dopłata → zmiana obciążenia i możliwości zakupu → zmiana warunków mieszkaniowych. Trzeba uwzględnić reakcję rynku.","SCT":"Reguły wjazdu → zmiana ruchu lub składu pojazdów → zmiana emisji i narażenia, także poza granicą.","BO":"Udział w zgłaszaniu i wyborze → realizacja projektów → zmiana wpływu mieszkańców i uwzględnienia ich potrzeb."}},{"id":"impact","name":"Zmiana obserwowana i wpływ programu","en":"Pojęcie pomocnicze z ewaluacji","pages":null,"definition":"Zmiana opisuje różnicę między pomiarami. Wpływ dotyczy różnicy wobec wiarygodnie oszacowanej sytuacji bez interwencji. Ocena wymaga określenia interwencji, wyniku i porównania.","examples":{"GPA":"Spadek trudności dojazdu po zmianie sieci nie ustala, jaka poprawa nastąpiłaby bez tej zmiany.","CP":"Spadek stężeń po inwestycjach może współwystępować ze zmianą pogody i innych emisji.","BK2":"Poprawa warunków beneficjentów nie pokazuje, ilu kupiłoby odpowiednie mieszkanie bez dopłaty.","SCT":"Spadek NO₂ po wdrożeniu trzeba odróżnić od wpływu samej strefy względem sytuacji bez niej.","BO":"Porównanie dwóch edycji może badać zmianę reguł. Wpływ istnienia BO wymaga porównania z sytuacją bez BO."}}],"programs":[{"id":"GPA","name":"Grodziskie Przewozy Autobusowe","short":"GPA","client":"Zarząd organizatora przewozów","mandate":"Przygotuj diagnozę trudności mieszkańców bez auta w dojeździe do pracy i usług. Za pięć umownych dni potrzebujemy notatki, która wskaże zakres problemu oraz najważniejsze luki w danych przed porównaniem działań.","a":[["A1 · Potrzeby podróży","W gminie X wylosowano i zbadano 200 dorosłych mieszkańców bez auta. W badanym tygodniu 80 osób nie mogło odbyć potrzebnej podróży do pracy lub podstawowej usługi i wrócić tego samego dnia. Przyjęty na potrzeby zlecenia standard to do 60 minut w każdą stronę i koszt do 10% dziennego dochodu. Wynik dotyczy próby; nie podano przedziału niepewności."],["A2 · Działanie programu","Organizator dodał 20% kursów, a liczba podróży pasażerów wzrosła o 12%. Nie zestawiono tych danych z potrzebami osób bez auta. W ankiecie w autobusach 70% pasażerów dobrze oceniło informację o rozkładzie."],["A3 · Stanowisko zleceniodawcy","Zleceniodawca uważa, że niekorzystający z autobusów za mało wiedzą o ofercie. Proponuje kampanię. W zleceniu prosi jednak o diagnozę dostępności, a nie o przygotowanie uzasadnienia gotowej decyzji."]],"b":[["B1 · Rozpoznanie bariery","W rozmowach z 20 celowo dobranymi osobami mającymi trudności z podróżą 14 wskazało brak kursu powrotnego po późnej zmianie. Rozkład potwierdził ten brak dla wskazanych połączeń. Rozmowy nie służą oszacowaniu odsetka wszystkich mieszkańców z taką barierą."],["B2 · Porównanie po pilotażu","Po dodaniu kursów powrotnych odsetek osób z trudnościami w badanej grupie spadł z 70% do 50%. W porównywalnej grupie bez tej zmiany spadł z 70% do 60%. Na potrzeby zadania przyjmij, że bez pilotażu obie grupy miałyby taki sam trend, skład grup jest stały i nie ma oddziaływania pilotażu na grupę porównawczą. Różnice odsetków podajemy w punktach procentowych (p.p.)."],["B3 · Spór o interpretację","Organizator udostępnia dokumentację. Krytycy wskazują pomijane podróże weekendowe. Ich zastrzeżenia dotyczą innego czasu niż objęty pilotażem. Ani dokumentacja organizatora, ani status krytyka nie zastępują oceny argumentów."]],"bridge":"Z diagnozy godzin powrotów mogą wynikać m.in. warianty koordynacji połączeń i zmian godzin kursów. Z hipotezy o braku informacji — inne działania. Sprawdź też, co zmieni się przy kontynuacji obecnej oferty i trendów. To pomysły do analizy, nie rekomendacje.","evidence":[["Skala","Badanie potrzeb podróży w próbie mieszkańców, także niepasażerów; licznik osób bez możliwej podróży i powrotu, właściwy mianownik, czas i koszt."],["Przyczyny","Dzienniczki podróży, rozkłady i rozmowy o rezygnacjach: godziny, powroty, cena, informacja. Zestawiaj deklaracje z dostępną ofertą."],["Wpływ","Wynik dostępności przed i po konkretnej zmianie sieci oraz wiarygodne porównanie bez tej zmiany; oceń trendy, skład grup i skutki między obszarami."]],"questions":[{"title":"Ustal zakres zlecenia","prompt":"Która odpowiedź najlepiej zachowuje cel zlecenia z A3?","options":[{"id":"a","text":"Zbadam zasięg kampanii wśród mieszkańców i zaproponuję kanały dotarcia do osób niekorzystających z autobusów.","why":"To przydatna analiza kampanii, ale przyjmuje już instrument i zawęża diagnozę do informacji."},{"id":"b","text":"Zbadam trudności podróży mieszkańców i porównam znaczenie informacji, godzin kursów oraz kosztów dla dostępności.","why":"Utrzymujesz cel dostępności i traktujesz domniemaną przyczynę jako sprawdzalną hipotezę."},{"id":"c","text":"Zbadam opinie pasażerów o rozkładzie i określę ich zadowolenie z informacji po dodaniu kursów.","why":"Opinie pasażerów są użyteczne, lecz zlecenie dotyczy też osób, które potrzebnej podróży nie mogą odbyć."}],"correct":"b","basis":"A3 określa diagnozę dostępności; A2 opisuje tylko korzystających.","pitfall":"Przejęcie rozwiązania i perspektywy informatora.","remedy":"Ustal cel, a propozycję klienta potraktuj jako pomysł wymagający analizy.","pages":"9, 21","hint":"Oddziel cel zlecenia od proponowanego sposobu jego osiągnięcia."},{"title":"Zdefiniuj problem","prompt":"Które zdanie najlepiej operacjonalizuje problem publiczny z A1?","options":[{"id":"a","text":"W badanym tygodniu 80 z 200 osób bez auta nie mogło odbyć potrzebnej podróży i powrotu według przyjętego standardu.","why":"Wskazujesz niepożądany stan, grupę, okres, licznik, mianownik i jawny standard; wynik pozostaje wynikiem próby."},{"id":"b","text":"W badanym okresie liczba kursów wzrosła o 20%, lecz wzrost liczby podróży pasażerów był niższy i wyniósł 12%.","why":"To zestawienie aktywności i wykorzystania programu, a nie miara niezaspokojonej potrzeby podróży."},{"id":"c","text":"W badaniu pasażerów 30% osób nie oceniło dobrze informacji o rozkładzie, co wskazuje zakres niezadowolenia w tej grupie.","why":"To wynik o opinii pasażerów, nie o dostępności podróży mieszkańców bez auta."}],"correct":"a","basis":"A1 podaje potrzebę i standard; A2 opisuje kursy, przejazdy i opinie.","pitfall":"Zastąpienie problemu wskaźnikiem działania programu.","remedy":"Nazwij szkodę i określ, kogo oraz w jakich warunkach dotyczy.","pages":"2–7","hint":"Co w życiu mieszkańców ma ulec poprawie?"},{"title":"Oddziel ustalenie od hipotezy","prompt":"Co wynika z ankiety pasażerów opisanej w A2?","options":[{"id":"a","text":"Niekorzystający z autobusów mają gorszą wiedzę o ofercie niż osoby podróżujące, co wyjaśnia różnicę udziału.","why":"Ankieta nie obejmuje niekorzystających i nie mierzy przyczyn różnicy udziału."},{"id":"b","text":"Informacja o ofercie ma mniejsze znaczenie dla dostępności mieszkańców niż dopasowanie godzin kursowania autobusów.","why":"Nie porównano znaczenia barier. Taki wniosek wymaga innych danych niż opinia pasażerów."},{"id":"c","text":"70% ankietowanych pasażerów dobrze ocenia informację o rozkładzie; jest to deklaracja zadowolenia tej badanej grupy.","why":"To poprawny zakres ustalenia: ocena badanych pasażerów, bez dopisywania wiedzy i przyczyn w innej grupie."}],"correct":"c","basis":"A2: 70% ankietowanych pasażerów dobrze ocenia informację.","pitfall":"Uogólnienie na pominiętą grupę i dopisanie przyczyny.","remedy":"Oddziel to, co zmierzono, od hipotezy wymagającej nowych danych.","pages":"7, 12, 19","hint":"Sprawdź, kogo ankietowano i o co pytano."},{"title":"Wybierz dowody","prompt":"Masz pięć dni do briefu. Co najtrafniej sprawdzi hipotezę o niedopasowaniu godzin podróży?","options":[{"id":"a","text":"Zestawienie rozkładów z dzienniczkami potrzebnych podróży osób bez auta; dwa dni pracy, materiały dostępne w czwartym dniu.","why":"Dane łączą potrzebę z ofertą i mogą zmienić diagnozę bariery. Mieszczą się w terminie."},{"id":"b","text":"Zestawienie liczby kursów z liczbą sprzedanych biletów na liniach; dwa dni pracy, materiały dostępne w czwartym dniu.","why":"Pokazują wykorzystanie podaży, lecz pomijają potrzebne podróże, których oferta nie umożliwia."},{"id":"c","text":"Zestawienie kosztów przewozów z planem wydatków organizatora na kampanię; dwa dni pracy, materiały dostępne w czwartym dniu.","why":"Opisują zasoby i wykonalność działań, lecz nie sprawdzają dopasowania godzin."}],"correct":"a","basis":"Pytanie dotyczy godzin potrzebnych podróży, nie ogólnej popularności czy budżetu.","pitfall":"Zbieranie łatwo dostępnych danych bez związku z pytaniem.","remedy":"Wybierz dane, które mogą zmienić odpowiedź na ważne pytanie w dostępnym czasie.","pages":"15–16, 20","hint":"Przy takim samym koszcie porównaj wartość informacji dla tego konkretnego pytania."},{"title":"Oceń wpływ","prompt":"Jakie zmniejszenie trudności można przypisać pilotażowi przy założeniach B2?","options":[{"id":"a","text":"Zmniejszenie o 20 punktów procentowych w wyniku dodania kursów powrotnych w pilotażu.","why":"20 p.p. to cała zmiana w grupie; część poprawy wystąpiłaby według przyjętych założeń również bez pilotażu."},{"id":"b","text":"Zmniejszenie o 10 punktów procentowych w wyniku dodania kursów powrotnych w pilotażu.","why":"Spadek 20 p.p. minus spadek 10 p.p. daje 10 p.p. związanych z pilotażem przy jawnych założeniach."},{"id":"c","text":"Zmniejszenie o 30 punktów procentowych w wyniku dodania kursów powrotnych w pilotażu.","why":"Dodanie zmian nie tworzy porównania z sytuacją bez interwencji."}],"correct":"b","basis":"B2: zmiana 70→50 wobec 70→60; przyjęto wspólny trend i brak oddziaływań między grupami.","pitfall":"Utożsamienie całej zmiany z wpływem programu.","remedy":"Porównaj z wiarygodną zmianą bez interwencji i ujawnij założenia.","pages":"19; uzupełnienie: ewaluacja wpływu","hint":"Oblicz zmianę w każdej grupie. Potem porównaj zmiany, zamiast je sumować."},{"title":"Zachowaj niezależność","prompt":"Jak wykorzystać zastrzeżenie o weekendach z B3 w briefie?","options":[{"id":"a","text":"Przenieść wniosek o poprawie z dni roboczych na weekendy, ponieważ za oba rozkłady odpowiada ten sam organizator.","why":"Wspólny organizator nie zapewnia podobnych warunków dojazdu w różnych dniach."},{"id":"b","text":"Zastąpić wniosek o poprawie opisem trudności weekendowych, ponieważ wskazuje go grupa pomijana przez organizatora.","why":"Krytyka wskazuje ważny inny zakres, lecz nie unieważnia wyniku dotyczącego badanych podróży."},{"id":"c","text":"Zachować wniosek o badanych podróżach i osobno sprawdzić weekendy, ponieważ dotychczasowy pomiar ich nie obejmuje.","why":"Oceniasz argument według jego treści: zachowujesz ustalenie i ujawniasz niezbadaną część problemu."}],"correct":"c","basis":"B3 rozróżnia czas objęty pilotażem i weekendy.","pitfall":"Zależność od autorytetu informatora albo automatyczne przyjęcie krytyki.","remedy":"Skonfrontuj perspektywy i sprawdzaj, do jakiego zakresu odnoszą się dowody.","pages":"12, 21","hint":"Niezależność wymaga oceny argumentu, a nie wyboru ulubionego informatora."}]},{"id":"CP","name":"Czyste Powietrze","short":"Czyste Powietrze","client":"Decydent odpowiedzialny za lokalną politykę środowiskową","mandate":"Rozpoznaj narażenie mieszkańców gminy X na zanieczyszczenie powietrza oraz potrzebne dowody o jego źródłach. Za pięć umownych dni przedstaw notatkę do ustalenia dalszych prac nad działaniami gminy i wykorzystaniem programu.","a":[["A1 · Narażenie","W umownym sezonie grzewczym model oparty na pomiarach i rozmieszczeniu ludności wskazał 600 z 2000 mieszkańców obszaru X powyżej przyjętego w zleceniu poziomu odniesienia T dla PM2,5. T jest progiem scenariusza, nie informacją o obowiązującej normie. Model ma niepewność, której jeszcze nie oszacowano."],["A2 · Inwestycje","Zawarto 80 umów wsparcia; zakończono 30 inwestycji. Ankieta w punkcie obsługi obejmuje 40 wnioskodawców, z których 24 uznało formalności za trudne. Nie badano gospodarstw, które nie złożyły wniosku."],["A3 · Stanowisko zleceniodawcy","Zleceniodawca proponuje dodatkowy punkt obsługi, bo wpłynęło mało wniosków. Zlecenie dotyczy jednak diagnozy narażenia i dowodów o jego źródłach, z uwzględnieniem roli programu."]],"b":[["B1 · Źródła i bariery","Analiza źródeł sugeruje istotny udział lokalnego ogrzewania, ale także napływu spoza gminy. W 15 celowo dobranych rozmowach z osobami rezygnującymi z inwestycji 9 wskazało trudność pokrycia kosztu przed wypłatą wsparcia. Liczby z rozmów nie są estymacją dla całej populacji."],["B2 · Porównanie stężeń","Po pakiecie zakończonych inwestycji średnie PM2,5 na obszarze badania spadło z 20 do 15 µg/m³. Na porównywalnym obszarze bez pakietu spadło z 20 do 18 µg/m³. Dla tego zadania przyjmij ten sam trend bez interwencji, porównywalną zmianę pogody i innych emisji oraz brak przenoszenia skutków między obszarami."],["B3 · Plan pracy","Przed briefem zostały dwa dni. Można dostać rozkład sezonowych pomiarów i opis modelu niepewności za jeden dzień pracy. Zamówienie pełnego nowego badania źródeł zajmie miesiąc. Decydent ma teraz zdecydować o zakresie dalszej analizy, nie o wieloletnim budżecie inwestycji."]],"bridge":"Oddziel działania dotyczące źródeł emisji od działań usuwających bariery inwestycji. Pomysły mogą obejmować sposób finansowania inwestycji, wsparcie administracyjne i współpracę między obszarami. Powiąż każdy z rozpoznaną przyczyną; uwzględnij kontynuację działań i trendów.","evidence":[["Skala","Pomiary PM2,5, model przestrzenny i liczba mieszkańców; okres, przyjęty próg oraz niepewność oszacowania narażonych."],["Przyczyny","Inwentaryzacja emisji, pogoda, napływ i model źródeł. Osobno: bariery inwestycji u wnioskodawców, rezygnujących i osób bez wniosku."],["Wpływ","Zakończenie i użytkowanie inwestycji, emisje i narażenie przed/po oraz wiarygodne porównanie bez wsparcia; oddziel pogodę, inne emisje i selekcję."]],"questions":[{"title":"Ustal zakres zlecenia","prompt":"Która odpowiedź najlepiej odpowiada zakresowi zlecenia z A3?","options":[{"id":"a","text":"Porównam koszty dodatkowego punktu z obsługą zdalną i wskażę dogodną formę pomocy osobom składającym wniosek.","why":"To analiza wariantów obsługi; zakłada jej znaczenie, zanim ustalono problem i bariery."},{"id":"b","text":"Porównam liczbę umów z liczbą inwestycji i określę opóźnienia wykonawców odpowiadających za zmianę ogrzewania.","why":"To użyteczna diagnoza realizacji, ale nie obejmuje narażenia ani udziału źródeł wskazanych w zleceniu."},{"id":"c","text":"Porównam narażenie i źródła emisji, a bariery inwestycji zbadam jako możliwe ograniczenie działania wsparcia.","why":"Łączysz problem publiczny, jego przyczyny i działanie instrumentu bez utożsamiania ich ze sobą."}],"correct":"c","basis":"A3 dotyczy narażenia i źródeł; mała liczba wniosków jest sugestią klienta.","pitfall":"Zawężenie problemu do łatwo widocznego etapu programu.","remedy":"Ustal problem, a barierę wdrażania umieść w hipotezie działania instrumentu.","pages":"4–9, 21","hint":"Jaki wynik dla mieszkańców ma ostatecznie zmienić program?"},{"title":"Zdefiniuj problem","prompt":"Które zdanie najtrafniej ujmuje problem publiczny na podstawie A1–A2?","options":[{"id":"a","text":"W obszarze X zakończono 30 z 80 zakontraktowanych inwestycji, więc głównym niedoborem jest tempo wykonywania umów.","why":"Wykonanie umów jest etapem programu. Nie określa skali narażenia ani udziału przyczyn."},{"id":"b","text":"W obszarze X oszacowano 600 z 2000 mieszkańców powyżej poziomu T w sezonie; trzeba określić niepewność tego oszacowania.","why":"Definicja zawiera narażenie, grupę, okres i podstawę oceny; oznacza wynik modelu i jego ograniczenie."},{"id":"c","text":"W punkcie obsługi 24 z 40 badanych uznało formalności za trudne, więc głównym niedoborem jest dostępność doradztwa.","why":"Ankieta opisuje formalności w wybranej grupie. Nie dowodzi, że brak doradztwa jest główną barierą."}],"correct":"b","basis":"A1 dotyczy narażenia; A2 dotyczy realizacji i doświadczeń wnioskodawców.","pitfall":"Pomylenie problemu publicznego z aktywnością lub barierą programu.","remedy":"Określ niepożądany stan i status jego pomiaru.","pages":"2–7","hint":"Wskaźnik procesu może być ważny, ale odpowiada na inne pytanie niż narażenie."},{"title":"Oddziel ustalenie od hipotezy","prompt":"Jakiego ustalenia dostarcza ankieta z A2?","options":[{"id":"a","text":"Trudne formalności są częstym doświadczeniem badanych wnioskodawców, wymagającym dalszego rozpoznania przy analizie obsługi.","why":"24 z 40 badanych zgłasza to doświadczenie. Można je uwzględnić bez przypisywania mu niezbadanego skutku."},{"id":"b","text":"Trudne formalności są główną przyczyną rezygnacji gospodarstw, które nie wystąpiły dotąd o wsparcie inwestycji.","why":"Nie badano osób bez wniosku; nie zmierzono przyczyn ich decyzji."},{"id":"c","text":"Trudne formalności odpowiadają za większość opóźnionych inwestycji, bo dotyczą osób uczestniczących w programie wsparcia.","why":"Nie powiązano odpowiedzi ankietowych z terminami wykonania ani innymi przyczynami opóźnień."}],"correct":"a","basis":"A2 określa próbę i pytanie o doświadczenie formalności.","pitfall":"Dopisanie przyczyny do opisowej odpowiedzi ankietowej.","remedy":"Oddziel doświadczenie badanych od przyczyn rezygnacji i opóźnień.","pages":"7, 12, 19","hint":"Co rzeczywiście deklarowały osoby, które odpowiedziały na ankietę?"},{"title":"Wybierz dowody","prompt":"Jaki pakiet najtrafniej rozpozna udział lokalnego ogrzewania w narażeniu przed briefem za pięć dni?","options":[{"id":"a","text":"Liczba wniosków, umów i zakończonych inwestycji według ulic; dwa dni pracy, dane w czwartym dniu.","why":"Wskazuje aktywność programu, ale nie rozdziela udziału ogrzewania i innych źródeł w stężeniu."},{"id":"b","text":"Oceny obsługi, czas wypełniania wniosków i liczba porad telefonicznych; dwa dni pracy, dane w czwartym dniu.","why":"Pomaga analizować bariery obsługi, nie udział źródeł emisji w narażeniu."},{"id":"c","text":"Inwentaryzacja emisji, pomiary, pogoda i model napływu spoza gminy; dwa dni pracy, dane w czwartym dniu.","why":"Łączy źródła, stężenia i warunki rozprzestrzeniania; pozwala sprawdzić hipotezę w terminie."}],"correct":"c","basis":"Pytanie dotyczy źródeł zanieczyszczenia. Koszt i dostępność pakietów są jednakowe.","pitfall":"Wybór danych o programie zamiast danych o mechanizmie problemu.","remedy":"Dopasuj źródła do hipotezy; zachowaj osobny plan analizy barier inwestycji.","pages":"15–16, 20","hint":"Liczba inwestycji nie jest tym samym co udział źródła w stężeniu."},{"title":"Oceń wpływ","prompt":"Jaki spadek PM2,5 można przypisać pakietowi przy założeniach B2?","options":[{"id":"a","text":"Spadek o 3 µg/m³ przypisany pakietowi zakończonych inwestycji na badanym obszarze.","why":"Spadek 5 minus spadek 2 daje 3 µg/m³ przy przyjętym porównaniu i założeniach."},{"id":"b","text":"Spadek o 5 µg/m³ przypisany pakietowi zakończonych inwestycji na badanym obszarze.","why":"To zmiana całkowita, obejmująca również czynniki działające bez pakietu."},{"id":"c","text":"Spadek o 2 µg/m³ przypisany pakietowi zakończonych inwestycji na badanym obszarze.","why":"To oszacowanie zmiany bez pakietu, a nie dodatkowego wpływu pakietu."}],"correct":"a","basis":"B2: 20→15 wobec 20→18, przy jawnie przyjętych warunkach porównania.","pitfall":"Przypisanie interwencji całej obserwowanej zmiany.","remedy":"Porównaj zmiany i sprawdź założenia identyfikacji wpływu.","pages":"19; uzupełnienie: ewaluacja wpływu","hint":"Która część zmiany wykracza poza przyjęty przebieg bez interwencji?"},{"title":"Zdecyduj, czego dowiedzieć się teraz","prompt":"Który plan najlepiej wykorzysta pozostałe dwa dni w sytuacji B3?","options":[{"id":"a","text":"Przeznaczyć dwa dni na zebranie podobnych raportów o sukcesie programu i na tej podstawie zamknąć diagnozę źródeł.","why":"Powielanie podobnych raportów nie usuwa konkretnej luki dotyczącej modelu i lokalnych źródeł."},{"id":"b","text":"Sprawdzić model i pomiary w jeden dzień, opisać niepewność, a większe badanie zaplanować przed decyzją inwestycyjną.","why":"Dopasowujesz zakres dowodów do bieżącej decyzji, terminu i znaczenia niepewności; nie rezygnujesz z wartościowego badania później."},{"id":"c","text":"Zamówić miesięczne badanie źródeł jako warunek przygotowania briefu i przesunąć diagnozę do czasu uzyskania wyników.","why":"Badanie może być wartościowe, lecz nie odpowiada terminowi i obecnej decyzji o planie analizy."}],"correct":"b","basis":"B3: obecna decyzja dotyczy zakresu prac, szybki opis modelu jest osiągalny, nowe badanie trwa miesiąc.","pitfall":"Gromadzenie dla objętości albo odkładanie decyzji do pełnej wiedzy.","remedy":"Oceń wartość dodatkowej informacji wobec kosztu, terminu i decyzji.","pages":"16, 18–20","hint":"Czy lepsze dane mogą zmienić decyzję podejmowaną właśnie teraz?"}]},{"id":"BK2","name":"Bezpieczny Kredyt 2 procent","short":"Bezpieczny Kredyt 2%","client":"Decydent odpowiedzialny za politykę mieszkaniową","mandate":"Przygotuj diagnozę niezaspokojonych potrzeb i obciążeń mieszkaniowych gospodarstw w określonej grupie. Za pięć umownych dni przedstaw wiedzę potrzebną do dalszych decyzji o wsparciu, wykorzystując doświadczenia instrumentu dopłat do kredytu.","a":[["A1 · Warunki mieszkaniowe","W umownej analizie doświadczeń programu zbadano losową próbę 200 gospodarstw w mieście X, w których główna osoba uzyskująca dochód miała najwyżej 35 lat, niezależnie od korzystania z dopłat. W 70 gospodarstwach koszty mieszkania przekraczały 40% dochodu rozporządzalnego. W zleceniu przyjęto ten próg jako roboczy standard nadmiernego obciążenia. Nie jest to prawna definicja uprawnień."],["A2 · Instrument","Banki odnotowały 120 kredytów z dopłatą. W badaniu beneficjentów 80% deklaruje poprawę warunków mieszkaniowych po zakupie. Nie wiadomo, ilu dokonałoby podobnego zakupu bez dopłaty."],["A3 · Stanowisko zleceniodawcy","Zleceniodawca proponuje większe dopłaty, powołując się na liczbę kredytów. Zleca diagnozę niezaspokojonych potrzeb i obciążeń mieszkaniowych, aby przygotować przyszłe warianty wsparcia. Scenariusz nie zakłada, że historyczny program obecnie przyjmuje wnioski."]],"b":[["B1 · Kto pozostaje poza instrumentem","W 20 celowo dobranych rozmowach z gospodarstwami nadmiernie obciążonymi kosztami 12 nie spełniało bankowych warunków uzyskania kredytu. Część wynajmowała mieszkanie. Ta próba nie pozwala oszacować udziału takich gospodarstw w całym mieście."],["B2 · Porównanie beneficjentów","Beneficjenci przed programem mieli przeciętnie wyższy dochód i stabilniejsze zatrudnienie niż zbadani niebeneficjenci. Po zakupie 80% beneficjentów deklaruje poprawę warunków; w grupie niebeneficjentów odsetek wynosi 50%. Brakuje modelu porównania uwzględniającego różnice sprzed programu."],["B3 · Analogia","Raport o dopłatach w mieście Y opisuje poprawę warunków odbiorców. W Y podaż nowych mieszkań szybko rosła. W mieście X podaż jest mało elastyczna: wzrost cen wywołuje niewielki wzrost liczby dostępnych mieszkań. Oba miasta mają podobną liczbę ludności, lecz nie porównano reakcji cen ani potrzeb osób poza programem."]],"bridge":"Diagnoza obciążeń mieszkaniowych otwiera analizę działań po stronie finansowania, najmu i dostępności mieszkań. Warianty powinny określać adresatów oraz reakcje rynku, także poza grupą odbiorców. Zachowaj wariant kontynuacji obecnych działań i trendów.","evidence":[["Skala","Badanie potrzeb, kosztów, dochodów i jakości mieszkania w określonej populacji, także poza beneficjentami; próg i rozkład obciążeń, nie tylko liczba kredytów."],["Przyczyny","Dochody, ceny i czynsze, dostępna podaż, warunki finansowania oraz historia gospodarstw. Oddziel bariery kredytu od innych źródeł potrzeb."],["Wpływ","Warunki odbiorców względem wiarygodnej sytuacji bez dopłaty, z kontrolą selekcji; dodatkowo ceny, najem i skutki dla niebeneficjentów."]],"questions":[{"title":"Ustal zakres zlecenia","prompt":"Która odpowiedź najlepiej zachowuje cel zlecenia z A3?","options":[{"id":"a","text":"Rozpoznam potrzeby i obciążenia różnych gospodarstw oraz sprawdzę, jak dopłata może zmieniać ich warunki mieszkaniowe.","why":"Utrzymujesz problem mieszkaniowy i otwarte pytanie o rolę instrumentu, także wobec innych grup."},{"id":"b","text":"Rozpoznam oczekiwania kredytobiorców wobec dopłaty oraz obliczę wysokość wsparcia pozwalającą sfinansować więcej umów kredytowych.","why":"Przyjmujesz większe dopłaty i wzrost liczby umów jako kierunek, zanim oceniono potrzeby i wpływ."},{"id":"c","text":"Rozpoznam procedury współpracy z bankami oraz obliczę koszt szybszego udzielania dopłat zainteresowanym gospodarstwom domowym.","why":"Analiza procedur może się przydać, lecz nie zastępuje zleconej diagnozy potrzeb i obciążeń."}],"correct":"a","basis":"A3 dotyczy potrzeb i obciążeń, a zwiększenie dopłat jest propozycją.","pitfall":"Utożsamienie celu z rozwojem wybranego instrumentu.","remedy":"Zachowaj cel publiczny, a instrument poddaj analizie.","pages":"4–9, 21","hint":"Czy zakres obejmuje także osoby, których instrument nie dosięga?"},{"title":"Zdefiniuj problem","prompt":"Które zdanie operacyjnie opisuje problem z A1?","options":[{"id":"a","text":"W mieście X udzielono 120 kredytów z dopłatą, a liczba zainteresowanych może uzasadniać zwiększenie środków w kolejnym okresie.","why":"To miara wykorzystania instrumentu i sugestia jego rozszerzenia, nie miara niezaspokojonej potrzeby."},{"id":"b","text":"W badaniu beneficjentów 80% osób zgłosiło poprawę warunków, co pozwala określić stopień rozwiązania problemu mieszkaniowego w mieście X.","why":"Wynik wśród beneficjentów nie określa stanu wszystkich gospodarstw ani wpływu dopłaty."},{"id":"c","text":"W badanej próbie 70 z 200 gospodarstw przekracza próg kosztów 40% dochodu, przyjęty jako roboczy standard nadmiernego obciążenia.","why":"Określasz grupę, licznik, mianownik i jawny standard. Obejmuje to aspekt kosztów, nie wszystkie wymiary potrzeb mieszkaniowych."}],"correct":"c","basis":"A1 obejmuje gospodarstwa niezależnie od udziału w programie i podaje roboczy próg.","pitfall":"Zamknięcie problemu w populacji odbiorców programu.","remedy":"Zdefiniuj populację problemu i wybrany wymiar potrzeby.","pages":"2–7, 12","hint":"Miara obciążenia kosztami i liczba kredytów opisują różne rzeczy."},{"title":"Oddziel ustalenie od hipotezy","prompt":"Jak interpretować deklaracje 80% beneficjentów z A2?","options":[{"id":"a","text":"Opisują odsetek gospodarstw, które dzięki dopłacie uzyskały warunki niedostępne przy zakupie mieszkania bez wsparcia.","why":"Dodajesz przypisanie przyczynowe. Nie wiadomo, co nastąpiłoby bez wsparcia."},{"id":"b","text":"Opisują deklarowaną poprawę po zakupie; nie ustalają odsetka gospodarstw, które podobnie poprawiłyby warunki bez dopłaty.","why":"Zachowujesz informację o doświadczeniu badanych, a dodatkowość dopłaty pozostawiasz do zbadania."},{"id":"c","text":"Opisują odsetek wszystkich młodych gospodarstw, których potrzeby zostały zaspokojone po uruchomieniu instrumentu dopłat mieszkaniowych.","why":"Beneficjenci nie stanowią całej populacji młodych gospodarstw; nie uzyskano takiego oszacowania."}],"correct":"b","basis":"A2 wyraźnie wskazuje brak wiedzy o podobnym zakupie bez dopłaty.","pitfall":"Zamiana obserwacji beneficjentów w dowód wpływu.","remedy":"Określ wynik, populację i wiarygodne porównanie bez interwencji.","pages":"19; uzupełnienie: ewaluacja wpływu","hint":"Co musielibyśmy wiedzieć o sytuacji tych gospodarstw bez dopłaty?"},{"title":"Wybierz dowody","prompt":"Co najtrafniej zbada hipotezę, że źródłem obciążeń są warunki finansowania, a nie głównie niskie dochody i wysokie ceny?","options":[{"id":"a","text":"Liczba kredytów i wartość dopłat w bankach uczestniczących w programie; dwa dni pracy, dane w czwartym dniu.","why":"Opisuje wykorzystanie instrumentu, lecz nie rozdziela możliwych przyczyn obciążeń."},{"id":"b","text":"Opinie doradców i oceny obsługi w bankach uczestniczących w programie; dwa dni pracy, dane w czwartym dniu.","why":"Może ujawnić problemy obsługi, ale nie daje porównania ekonomicznych barier gospodarstw."},{"id":"c","text":"Dane gospodarstw o dochodach, kosztach, cenach i warunkach kredytu, także poza programem; dwa dni pracy, dane w czwartym dniu.","why":"Pozwala porównać konkurencyjne wyjaśnienia w populacji problemu. Sam zbiór danych nie zastępuje projektu analizy przyczynowej."}],"correct":"c","basis":"W zleceniu chodzi o przyczyny obciążeń, nie tylko korzystanie z dopłat. Termin wynosi pięć dni.","pitfall":"Gromadzenie danych według dostępności instytucjonalnej.","remedy":"Dobierz dane do konkurencyjnych hipotez i uwzględnij pominiętych.","pages":"15–16, 19–21","hint":"Czy pakiet zawiera informacje pozwalające odróżnić wskazane przyczyny?"},{"title":"Oceń wpływ","prompt":"Co ustala różnica 80% wobec 50% w B2?","options":[{"id":"a","text":"Różnicę deklarowanej poprawy między grupami, które już przed programem różniły się dochodem i zatrudnieniem.","why":"Różnica opisowa wynosi 30 p.p. Selekcja nie pozwala przypisać jej samej dopłacie ani samemu dochodowi."},{"id":"b","text":"Wpływ dopłaty równy różnicy poprawy między grupami, ponieważ badanie obejmuje beneficjentów i niebeneficjentów.","why":"Samo istnienie grupy porównawczej nie zapewnia wiarygodnego przebiegu bez programu."},{"id":"c","text":"Wpływ wyższych dochodów równy różnicy poprawy między grupami, ponieważ dochody różniły się przed programem.","why":"Wykryta różnica dochodów jest konkurencyjnym wyjaśnieniem, ale nie oszacowano jej wpływu."}],"correct":"a","basis":"B2 dokumentuje różnice sprzed programu i brak odpowiedniego modelu porównania.","pitfall":"Uznanie dowolnej grupy niebeneficjentów za wiarygodne porównanie.","remedy":"Zaprojektuj porównanie uwzględniające selekcję i sprawdź jego założenia.","pages":"19; uzupełnienie: ewaluacja wpływu","hint":"Czy grupy różniły się wcześniej w sposób ważny dla wyniku?"},{"title":"Sprawdź analogię","prompt":"Co jest najważniejsze przed wykorzystaniem wyniku miasta Y w mieście X?","options":[{"id":"a","text":"Porównanie liczby udzielonych kredytów i podobieństwa nazw instrumentów, bo określają skalę stosowania wsparcia w miastach.","why":"Nazwa i liczba umów nie wyjaśniają mechanizmu ani warunków przeniesienia efektu."},{"id":"b","text":"Porównanie reakcji podaży, cen i sytuacji grup, bo warunki rynku mogą zmienić skutki tego samego instrumentu.","why":"B3 wskazuje różnicę istotną dla mechanizmu: mało elastyczna podaż może zmienić reakcję cen i skutki dopłat."},{"id":"c","text":"Porównanie liczby mieszkańców i popularności programu, bo określają podobieństwo popytu na wsparcie w obu miastach.","why":"Podobna ludność i popularność nie zapewniają podobnej reakcji rynku ani potrzeb odbiorców."}],"correct":"b","basis":"B3: szybko rosnąca podaż w Y, mało elastyczna podaż w X.","pitfall":"Kopiowanie dobrej praktyki na podstawie powierzchownego podobieństwa.","remedy":"Porównaj mechanizm, populację i warunki jego działania.","pages":"12, 19–20","hint":"Która różnica może zmienić drogę od dopłaty do warunków mieszkaniowych?"}]},{"id":"SCT","name":"Strefa Czystego Transportu w Warszawie","short":"SCT Warszawa","client":"Decydent odpowiedzialny za miejską politykę transportową i środowiskową","mandate":"Rozpoznaj narażenie mieszkańców wybranych ulic na NO₂ i wiedzę potrzebną do decyzji o jego ograniczeniu. Za pięć umownych dni przedstaw diagnozę i plan dowodów dotyczących roli strefy.","a":[["A1 · Narażenie przy ulicach","W umownym kwartale na podstawie pomiarów i mapy ludności oszacowano, że 400 z 1200 mieszkańców badanego zespołu ulic doświadcza stężeń NO₂ powyżej poziomu odniesienia T. To próg przyjęty w scenariuszu, nie opis obowiązującej normy. Nie określono jeszcze niepewności oszacowania."],["A2 · Instrument","Granica strefy obejmuje część ulic. Odsetek pojazdów spełniających reguły wjazdu wzrósł z 60% do 80%. Brakuje rozdzielenia zmian natężenia ruchu, składu pojazdów, pogody i innych emisji."],["A3 · Stanowisko zleceniodawcy","Zleceniodawca uważa, że strefa jest zbyt mała. Prosi o diagnozę narażenia i wiedzę potrzebną do rozważenia działań. W tej grze nie ustalamy aktualnych zasad prawnych wjazdu do Warszawy."]],"b":[["B1 · Różne obszary","Pomiary wskazują podwyższone stężenia także na dwóch ulicach poza granicą strefy. Jedna ma dużą intensywność ruchu, druga słabą wentylację ze względu na zabudowę. Oba fakty uzasadniają analizę, ale nie wyznaczają automatycznie wielkości udziału przyczyn."],["B2 · Porównanie pomiarów","Na ulicach w strefie średnie NO₂ spadło z 32 do 24 µg/m³. Na dobranych ulicach porównawczych spadło z 30 do 27 µg/m³. Dla tego zadania przyjmij, że bez strefy zmiany byłyby takie same, pomiary są porównywalne i nie ma przeniesienia ruchu na ulice porównawcze."],["B3 · Granice transferu","Inne miasto uzyskało spadek NO₂ po wdrożeniu strefy. Miało odmienny skład pojazdów, lepsze możliwości transportu zbiorowego i inny układ ulic. Nie przedstawiono dowodu, że te różnice są nieistotne."]],"bridge":"Z przyczyn narażenia mogą wynikać warianty dotyczące reguł wjazdu, natężenia ruchu i dostępnych sposobów podróży. Określ zakres każdego i możliwość ich łączenia. Osobno opisz kontynuację obecnych działań i trendów; diagnoza poza granicą nie przesądza poszerzenia strefy.","evidence":[["Skala","Pomiary NO₂ o znanym pokryciu i czasie, mapa ludności i narażenia, jawny poziom odniesienia oraz niepewność."],["Przyczyny","Natężenie i skład ruchu, emisje, zabudowa, pogoda i inne źródła. Zestawienie w czasie i przestrzeni do sprawdzenia mechanizmów."],["Wpływ","Pomiar przed/po oraz wiarygodny przebieg bez strefy; uwzględnij wspólne trendy, przeniesienie ruchu, pogodę i skutki poza granicą."]],"questions":[{"title":"Ustal zakres zlecenia","prompt":"Która odpowiedź najlepiej zachowuje cel zlecenia z A3?","options":[{"id":"a","text":"Porównam warianty poszerzenia granicy i wskażę obszar strefy obejmujący największą liczbę mieszkańców przy danym budżecie.","why":"To późniejsza analiza wariantów jednego instrumentu; przyjmuje już kierunek decyzji."},{"id":"b","text":"Porównam narażenie i jego źródła na badanych ulicach, a rozmiar strefy potraktuję jako cechę analizowanego instrumentu.","why":"Utrzymujesz cel zdrowotno-środowiskowy i nie wpisujesz propozycji klienta w definicję problemu."},{"id":"c","text":"Porównam skuteczność kontroli wjazdu i wskażę sposoby zwiększenia zgodności pojazdów z regułami obowiązującymi na badanym obszarze.","why":"Kontrola jest ważnym etapem wdrożenia, ale nie zastępuje diagnozy narażenia i źródeł."}],"correct":"b","basis":"A3 wskazuje diagnozę narażenia, a większą strefę jako propozycję.","pitfall":"Definiowanie problemu jako braku preferowanego rozwiązania.","remedy":"Przełóż propozycję instrumentu na stan, który ma poprawić.","pages":"9, 12, 21","hint":"Czy szersza granica jest szkodą, przyczyną, czy proponowaną zmianą instrumentu?"},{"title":"Zdefiniuj problem","prompt":"Które zdanie najtrafniej operacjonalizuje problem w A1?","options":[{"id":"a","text":"W badanym kwartale oszacowano 400 z 1200 mieszkańców ulic powyżej poziomu T dla NO₂; niepewność wymaga określenia.","why":"Opisujesz narażenie, grupę, okres i próg, ujawniając status oszacowania."},{"id":"b","text":"W badanym kwartale część ulic pozostawała poza strefą; problemem jest niedostateczne pokrycie sieci ulic ustanowioną regulacją.","why":"Brak większej strefy to brak rozwiązania; nie wskazuje jeszcze, kto doświadcza jakiej szkody."},{"id":"c","text":"W badanym okresie 20% pojazdów nie spełniało reguł wjazdu; to wskaźnik luki we wdrożeniu ustanowionego instrumentu.","why":"Zgodność pojazdów jest wskaźnikiem instrumentu, a nie bezpośrednią miarą narażenia."}],"correct":"a","basis":"A1 zawiera oszacowanie narażonych; A2 opisuje granicę i zgodność pojazdów.","pitfall":"Zastąpienie problemu granicą lub wskaźnikiem instrumentu.","remedy":"Oddziel narażenie ludzi od parametrów wdrażania programu.","pages":"2–7, 9","hint":"Co jest jednostką pomiaru problemu: mieszkaniec, pojazd czy kilometr granicy?"},{"title":"Oddziel ustalenie od hipotezy","prompt":"Co ustala wzrost zgodności pojazdów z A2?","options":[{"id":"a","text":"Ruch pojazdów zmalał w stopniu wystarczającym do ograniczenia narażenia mieszkańców badanych ulic na NO₂.","why":"Zmiana udziału zgodnych pojazdów nie mówi, jak zmieniła się liczba przejazdów ani narażenie."},{"id":"b","text":"Pogoda miała mniejszy udział w zmianie NO₂ niż wymiana pojazdów na spełniające reguły wjazdu.","why":"Nie rozdzielono udziału pogody, ruchu i składu pojazdów."},{"id":"c","text":"Udział pojazdów spełniających reguły wzrósł z 60% do 80%; zmieniła się struktura zaobserwowanych pojazdów.","why":"To ustalenie dotyczące etapu mechanizmu; jego przełożenie na narażenie pozostaje pytaniem empirycznym."}],"correct":"c","basis":"A2 podaje wzrost udziału 60→80%, ale nie rozdziela pozostałych czynników.","pitfall":"Przeskok od wskaźnika wdrożenia do końcowego skutku.","remedy":"Wskaż kolejne ogniwa i sprawdź związki między nimi.","pages":"7, 12, 19","hint":"Czy udział pojazdów zgodnych mierzy także natężenie ruchu i stężenie?"},{"title":"Wybierz dowody","prompt":"Który pakiet najlepiej pomoże odróżnić udział ruchu od pogody w zmianie stężeń?","options":[{"id":"a","text":"Pomiary NO₂, ruchu i pogody na tych samych ulicach i w tych samych okresach; dwa dni pracy, dane w czwartym dniu.","why":"Dopasowane obserwacje wyniku i konkurencyjnych czynników są punktem wyjścia do analizy; projekt metody pozostaje niezbędny."},{"id":"b","text":"Mapy granic, liczba kontroli i zestawienie wydanych uprawnień dla pojazdów na badanym obszarze; dwa dni pracy, dane w czwartym dniu.","why":"Opisuje działanie instrumentu, nie daje danych o pogodzie i wyniku potrzebnych do rozdzielenia wyjaśnień."},{"id":"c","text":"Opinie mieszkańców, zgłoszenia skarg i deklaracje kierowców o poparciu dla strefy na badanym obszarze; dwa dni pracy, dane w czwartym dniu.","why":"Dostarcza wiedzy o doświadczeniach i akceptacji, ale nie mierzy udziału ruchu oraz pogody w stężeniu."}],"correct":"a","basis":"Pytanie wymaga danych o wyniku i obu wskazanych wyjaśnieniach. Brief jest za pięć dni.","pitfall":"Dobór źródeł według tematu ogólnego zamiast konkretnego pytania.","remedy":"Połącz pomiar wyniku i czynników w tym samym czasie i miejscu.","pages":"15–16, 19","hint":"Czy można porównać te same okresy i miejsca dla wszystkich badanych czynników?"},{"title":"Oceń wpływ","prompt":"Jaki spadek NO₂ można przypisać strefie przy założeniach B2?","options":[{"id":"a","text":"Spadek o 8 µg/m³ przypisany ustanowieniu strefy na objętych nią ulicach.","why":"8 µg/m³ to cała zmiana, bez odjęcia przyjętej zmiany bez strefy."},{"id":"b","text":"Spadek o 3 µg/m³ przypisany ustanowieniu strefy na objętych nią ulicach.","why":"3 µg/m³ to przyjęta zmiana bez strefy, nie dodatkowy wpływ strefy."},{"id":"c","text":"Spadek o 5 µg/m³ przypisany ustanowieniu strefy na objętych nią ulicach.","why":"Różnica spadków 8−3 wynosi 5 µg/m³ przy założeniach podanych w B2."}],"correct":"c","basis":"B2: spadek 32→24 wobec 30→27, przy wspólnym trendzie bez strefy.","pitfall":"Pomylenie zmiany całkowitej lub porównawczej z wpływem.","remedy":"Porównuj zmiany; przy rzeczywistej analizie sprawdź też oddziaływanie na obszar porównania.","pages":"19; uzupełnienie: ewaluacja wpływu","hint":"Początkowe poziomy mogą się różnić; zadanie podaje założenie o zmianie bez strefy."},{"title":"Sprawdź analogię","prompt":"Co najtrafniej przygotuje wykorzystanie doświadczenia miasta z B3?","options":[{"id":"a","text":"Porównanie wielkości stref i roku ich ustanowienia, aby wybrać miasto o możliwie podobnej konstrukcji formalnej instrumentu.","why":"Parametry formalne mogą być ważne, ale nie wystarczą do oceny mechanizmu i przeniesienia wyniku."},{"id":"b","text":"Porównanie składu ruchu, alternatyw podróży i metody pomiaru, aby ocenić warunki działania i wiarygodność przeniesienia wyniku.","why":"Sprawdzasz warunki mogące zmieniać działanie strefy oraz to, jak ustalono jej wynik."},{"id":"c","text":"Porównanie liczby doniesień o sukcesie i poparcia mieszkańców, aby wybrać miasto o możliwie silnym uznaniu dla instrumentu.","why":"Popularność i liczba doniesień nie zastępują jakości badania ani podobieństwa mechanizmu."}],"correct":"b","basis":"B3 wskazuje różnice w pojazdach, transporcie zbiorowym i układzie ulic.","pitfall":"Przenoszenie etykiety sukcesu bez sprawdzenia kontekstu.","remedy":"Zbadaj mechanizm, warunki i metodę źródłowego badania.","pages":"12, 19–20","hint":"Które podobieństwa są istotne dla skutku, a które tylko powierzchowne?"}]},{"id":"BO","name":"Warszawski budżet obywatelski","short":"Budżet obywatelski","client":"Decydent odpowiedzialny za udział mieszkańców w decyzjach o wydatkach miasta","mandate":"Rozpoznaj, czy i które grupy mają zbyt mały wpływ na wydatki oraz czyje potrzeby są słabo uwzględniane. Za pięć umownych dni przedstaw diagnozę i plan danych przed oceną zmian w budżecie obywatelskim.","a":[["A1 · Wpływ mieszkańców","W fikcyjnym badaniu dzielnicy X wylosowano 200 dorosłych mieszkańców. 90 deklaruje brak możliwości wpływu na wybór lokalnych wydatków. Wśród 50 osób z ograniczoną mobilnością taką odpowiedź wskazało 35. Zlecenie przyjmuje równość możliwości wpływu jako standard; deklaracja jest wskaźnikiem, a nie pełnym pomiarem rzeczywistego wpływu."],["A2 · Uczestnictwo","Frekwencja w głosowaniu wyniosła 12%. Ankietę po głosowaniu wypełnili wyłącznie głosujący; 75% z nich było zadowolonych z możliwości udziału. Nie zbadano niegłosujących ani zgodności zrealizowanych projektów z potrzebami różnych grup."],["A3 · Stanowisko zleceniodawcy","Zleceniodawca wiąże niską frekwencję z brakiem zainteresowania i proponuje kampanię. Zlecenie dotyczy jednak rozpoznania, kto ma ograniczone możliwości wpływu i czyje potrzeby są pomijane."]],"b":[["B1 · Bariery i potrzeby","W 16 celowo dobranych rozmowach z niegłosującymi 10 osób mówiło o niewierze w realizację potrzebnych projektów. Sprawdzono też, że dwa projekty dotyczące dostępności przestrzeni nie zostały dotąd wykonane. Rozmowy nie określają częstości bariery w całej dzielnicy."],["B2 · Pilotaż zmiany reguł","Po pilotażu ułatwień zgłaszania projektów w badanej grupie odsetek osób deklarujących brak wpływu spadł z 50% do 30%. W porównywalnej grupie objętej dotychczasowymi regułami BO spadł z 50% do 40%. Na potrzeby zadania przyjmij wspólny trend bez pilotażu, stały skład i brak oddziaływań między grupami. Różnice odsetków podajemy w punktach procentowych (p.p.)."],["B3 · Perspektywy","Zwycięscy projektodawcy chętnie udostępniają materiały. Osoby nieuczestniczące i autorzy odrzuconych projektów wskazują inne bariery. Zlecenie wymaga diagnozy możliwości wpływu także tych grup, nie tylko oceny satysfakcji zwycięzców."]],"bridge":"Od rozpoznanych barier przejdź do różnych sposobów zwiększania wpływu: reguł udziału, wsparcia zgłaszania i realizacji projektów, a także innych form udziału w decyzjach. Powiąż warianty z potrzebami grup i uwzględnij kontynuację działań i trendów.","evidence":[["Skala","Badanie możliwości wpływu i potrzeb w reprezentatywnej próbie mieszkańców, udział grup oraz zgodność wydatków z potrzebami; frekwencja jest wskaźnikiem częściowym."],["Przyczyny","Rozmowy z nieuczestnikami, historia zgłoszeń i realizacji, reguły, czas, wiedza i zasoby. Oddziel brak zainteresowania od barier udziału i braku oczekiwanego wpływu."],["Wpływ","Dla zmiany reguł: wynik przed/po i wiarygodne porównanie bez tej zmiany. Dla wpływu istnienia BO: porównanie z sytuacją bez BO; frekwencja nie zastępuje wpływu i reprezentacji potrzeb."]],"questions":[{"title":"Ustal zakres zlecenia","prompt":"Która odpowiedź najlepiej odpowiada zleceniu z A3?","options":[{"id":"a","text":"Porównam rozpoznawalność kampanii w grupach wiekowych i ustalę kanały informacji zwiększające liczbę oddanych głosów w edycji.","why":"To analiza kampanii podporządkowana frekwencji, a nie całemu zleceniu dotyczącemu wpływu i potrzeb."},{"id":"b","text":"Porównam satysfakcję zwycięskich projektodawców i ustalę, jak doświadczenie wygranej zmienia ich ocenę procedur udziału w budżecie.","why":"To ważna, ale zawężona perspektywa odbiorców, która pomija grupy wskazane w zleceniu."},{"id":"c","text":"Porównam możliwości wpływu i uwzględnienie potrzeb grup, a przyczyny nieuczestnictwa zbadam także wśród osób niegłosujących w edycji.","why":"Zachowujesz problem wpływu oraz otwarte pytanie o przyczyny. Nie przyjmujesz diagnozy klienta za dowód."}],"correct":"c","basis":"A3 rozróżnia propozycję kampanii i zakres diagnozy.","pitfall":"Przejęcie diagnozy klienta i pominięcie nieuczestników.","remedy":"Zachowaj niezależną ocenę i poszukaj pomijanych perspektyw.","pages":"4–9, 21","hint":"Jakie osoby i potrzeby mogły nie trafić do łatwo dostępnych danych?"},{"title":"Zdefiniuj problem","prompt":"Które zdanie najlepiej określa roboczy problem na podstawie A1?","options":[{"id":"a","text":"Frekwencja w dzielnicy wynosi 12%, co pokazuje skalę braku zainteresowania mieszkańców i potrzebę zwiększenia zasięgu kampanii.","why":"Frekwencja nie ustala przyczyny nieuczestnictwa; definicja wpisuje też rozwiązanie."},{"id":"b","text":"Brak możliwości wpływu deklaruje 90 z 200 badanych, w tym 35 z 50 osób z ograniczoną mobilnością; wymaga to weryfikacji.","why":"Wskazujesz problem, różnicę między grupami i status deklaracji. Dalej trzeba zbadać rzeczywiste możliwości i potrzeby."},{"id":"c","text":"Zadowolenie deklaruje 75% głosujących, co pokazuje, że trzy czwarte mieszkańców ma dostateczny wpływ na wybór lokalnych wydatków.","why":"Głosujący nie są wszystkimi mieszkańcami; satysfakcja nie jest pełną miarą wpływu."}],"correct":"b","basis":"A1 podaje deklaracje i standard równości możliwości; A2 obejmuje głosujących.","pitfall":"Dopisanie przyczyny albo nieuprawnione uogólnienie wskaźnika.","remedy":"Ujawnij grupę, miernik i jego ograniczenie wobec problemu.","pages":"2–7, 12","hint":"Czy opis obejmuje populację problemu i zachowuje znaczenie użytego wskaźnika?"},{"title":"Oddziel ustalenie od hipotezy","prompt":"Co wynika z frekwencji 12% w A2?","options":[{"id":"a","text":"Głosy oddało 12% uprawnionych mieszkańców; wynik opisuje udział uprawnionych w tej konkretnej edycji głosowania.","why":"Frekwencja ustala udział w głosowaniu; nie ustala motywów ani tego, czyje potrzeby zaspokajają projekty."},{"id":"b","text":"Większość uprawnionych nie interesuje się lokalnymi wydatkami; kampania może więc odpowiadać na dominującą barierę uczestnictwa.","why":"Brak zainteresowania jest hipotezą obok czasu, reguł i oczekiwanego wpływu. Frekwencja ich nie rozdziela."},{"id":"c","text":"Potrzeby 12% uprawnionych zostały uwzględnione w wydatkach; pozostali mieszkańcy nie uzyskali korzyści z wybranych projektów.","why":"Z projektów mogą korzystać niegłosujący; udział w głosowaniu nie mierzy zaspokojenia potrzeb."}],"correct":"a","basis":"A2 nie bada niegłosujących ani powiązania projektów z potrzebami.","pitfall":"Uznanie wskaźnika uczestnictwa za wyjaśnienie i końcowy rezultat.","remedy":"Rozdziel udział, jego przyczyny i wpływ na potrzeby.","pages":"7, 12, 15","hint":"Co dokładnie znajduje się w liczniku frekwencji?"},{"title":"Wybierz dowody","prompt":"Który pakiet najlepiej sprawdzi hipotezę o barierach nieuczestnictwa w terminie pięciu dni?","options":[{"id":"a","text":"Ankiety zwycięskich autorów, oceny promocji i zestawienie kosztów głosowania w dzielnicach; dwa dni pracy, dane w czwartym dniu.","why":"Użyteczne do innych pytań, ale zwycięzcy nie zastępują wiedzy o barierach niegłosujących."},{"id":"b","text":"Rozmowy z niegłosującymi, analiza reguł i ścieżek zgłoszeń oraz realizacji projektów; dwa dni pracy, dane w czwartym dniu.","why":"Łączy doświadczenia pominiętej grupy z przebiegiem procedur i realizacji. Celowe rozmowy rozpoznają mechanizmy, nie częstość w populacji."},{"id":"c","text":"Frekwencja w kolejnych edycjach, liczba zgłoszonych projektów i zasięg kampanii internetowej miasta; dwa dni pracy, dane w czwartym dniu.","why":"Opisuje trendy udziału i promocji; sam nie rozdziela przyczyn nieuczestnictwa."}],"correct":"b","basis":"Hipoteza dotyczy barier niegłosujących; koszt i termin pakietów są takie same.","pitfall":"Pozostanie przy danych osób łatwo dostępnych.","remedy":"Docieraj do grupy istotnej dla hipotezy i sprawdzaj jej doświadczenia w innych źródłach.","pages":"15–16, 19–21","hint":"Który pakiet pozwala poznać drogę prowadzącą do nieuczestnictwa?"},{"title":"Oceń wpływ","prompt":"Jaki wniosek jest uzasadniony przy założeniach B2?","options":[{"id":"a","text":"Istnie ,"basis":"B3: dane zwycięzców są dostępne, brak wiedzy od nieuczestników i odrzuconych.","pitfall":"Bezkrytyczne przejęcie obrazu od dostępnych, życzliwych informatorów.","remedy":"Szukaj krytycznych perspektyw i oceniaj ich argumenty tą samą miarą.","pages":"21","hint":"Która istotna perspektywa jest dotąd nieobecna?"}]}],"noteA":[{"id":"problem","label":"1. Co wymaga poprawy?","prompt":"W 1–2 zdaniach opisz niepożądany stan: kogo dotyczy, gdzie lub kiedy i według jakiego standardu. Użyj jednego wyniku z A1. Nie dopisuj niepodanej dokładności.","helper":"Schemat: „W [grupie i zakresie] występuje [stan]. Materiał A1 wskazuje [wynik], oceniany względem [standardu]”."},{"id":"cause","label":"2. Co może powodować ten stan?","prompt":"Podaj jedną hipotezę przyczynową. Napisz, co w materiale ją wspiera, a czego jeszcze nie sprawdzono. Możesz użyć hipotezy klienta lub konkurencyjnego wyjaśnienia.","helper":"Hipoteza nie jest ustaleniem. Napisz: „Podejrzewam…, ponieważ…; nie wiadomo jeszcze…”."},{"id":"role","label":"3. Jak program miałby pomóc?","prompt":"Opisz w jednym ciągu: działanie programu → zmiana zachowania lub sytuacji → ograniczenie problemu. Wskaż jedno przejście, które wymaga dowodów.","helper":"Strzałka oznacza zakładany związek, nie potwierdzony wpływ. Możesz zapisać ten ciąg zwykłymi zdaniami."}],"noteB":[{"id":"problem","label":"1. Aktualna definicja problemu","prompt":"W 1–2 zdaniach podaj stan, grupę, zakres i standard. Wskaż konkretny wynik z A lub B, który uzasadnia tę definicję.","helper":"Nie musisz zmieniać całej definicji. Zachowaj informacje o tym, czy wynik pochodzi z próby, modelu lub deklaracji."},{"id":"revision","label":"2. Co zmieniasz lub podtrzymujesz?","prompt":"Porównaj z notatką A. Wskaż jeden fragment własnej diagnozy, który zmieniasz lub podtrzymujesz, oraz konkretny materiał B1, B2 lub B3 uzasadniający tę decyzję.","helper":"Schemat: „W A napisałem/am… Teraz zmieniam/podtrzymuję…, ponieważ B… pokazuje…”. Podtrzymanie wymaga uzasadnie const byId = id => DATA.programs.find(p => p.id === id);
