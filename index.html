function shuffle(items) {
  const a=[...items];
  for(let i=a.length-1;i>0;i--){const n=new Uint32Array(1);crypto.getRandomValues(n);const j=n[0]%(i+1);[a[i],a[j]]=[a[j],a[i]];}
  return a;
}
function fresh(program){
 return {kind:'BARDACH1',version:DATA.version,key:DATA.keyVersion,program,session:crypto.randomUUID(),created:new Date().toISOString(),savedAt:new Date().toISOString(),stage:0,unlocked:0,complete:false,
  answers:byId(program).questions.map(()=>({order:shuffle(['a','b','c']),selected:null,history:[],help:false,helpBefore:false})),
  noteA:Object.fromEntries(DATA.noteA.map(f=>[f.id,''])),noteB:Object.fromEntries(DATA.noteB.map(f=>[f.id,''])),lockedA:false};
}
function validate(raw){
 const fail=()=>{throw Error('Plik lub kod nie zawiera poprawnego zapisu tej wersji gry (BD1-20261107).');};
 if(!raw||raw.kind!=='BARDACH1'||raw.version!==DATA.version||raw.key!==DATA.keyVersion||!byId(raw.program))fail();
 if(typeof raw.session!=='string'||raw.session.length>100||!Number.isInteger(raw.stage)||raw.stage<0||raw.stage>9||!Number.isInteger(raw.unlocked)||raw.unlocked<raw.stage||raw.unlocked>9)fail();
 if(typeof raw.lockedA!=='boolean'||typeof raw.complete!=='boolean')fail();
 if(!Array.isArray(raw.answers)||raw.answers.length!==6)fail();
 const answers=raw.answers.map(a=>{
  if(!a||!Array.isArray(a.order)||[...a.order].sort().join('')!=='abc'||(a.selected!==null&&!['a','b','c'].includes(a.selected))||!Array.isArray(a.history)||a.history.length>300)fail();
  if(typeof a.help!=='boolean'||typeof a.helpBefore!=='boolean')fail();
  const history=a.history.map((h,i)=>{
   if(!h||!['a','b','c'].includes(h.choice)||typeof h.at!=='string'||Number.isNaN(Date.parse(h.at))||i>0&&h.choice===a.history[i-1].choice)fail();
   return {choice:h.choice,at:h.at};
  });
  return {order:[...a.order],selected:a.selected,history,help:a.help,helpBefore:a.helpBefore};
 });
 const notes=(obj,fields)=>Object.fromEntries(fields.map(f=>{
  if(!obj||typeof obj[f.id]!=='string'||obj[f.id].length>2500)fail();return [f.id,obj[f.id]];
 }));
 const noteA=notes(raw.noteA,DATA.noteA),noteB=notes(raw.noteB,DATA.noteB);
 const filled=n=>Object.values(n).every(v=>v.trim().length>0);
 if(raw.lockedA&&!filled(noteA)||raw.unlocked>=5&&!raw.lockedA||raw.complete!==(raw.unlocked===9)||raw.complete&&!filled(noteB))fail();
 const required=raw.unlocked>=8?6:raw.unlocked>=7?5:raw.unlocked>=6?4:raw.unlocked>=4?3:Math.max(0,raw.unlocked-1);
 if(answers.slice(0,required).some(a=>!a.history.length))fail();
 if(typeof raw.created!=='string'||Number.isNaN(Date.parse(raw.created))||typeof raw.savedAt!=='string'||Number.isNaN(Date.parse(raw.savedAt)))fail();
 return {kind:raw.kind,version:raw.version,key:raw.key,program:raw.program,session:raw.session,created:raw.created,savedAt:raw.savedAt,stage:raw.stage,unlocked:raw.unlocked,complete:raw.complete,answers,noteA,noteB,lockedA:raw.lockedA};
}
function scores(s){const p=byId(s.program);return {first:s.answers.filter((a,i)=>a.history[0]?.choice===p.questions[i].correct).length,last:s.answers.filter((a,i)=>a.history.at(-1)?.choice===p.questions[i].correct).length,checked:s.answers.filter(a=>a.history.length).length};}
function crc(text){let c=0xffffffff;for(const b of new TextEncoder().encode(text)){c^=b;for(let i=0;i<8;i++)c=c&1?0xedb88320^(c>>>1):c>>>1;}return ((c^0xffffffff)>>>0).toString(16).padStart(8,'0');}
function encode(s){const j=JSON.stringify(validate(s));let b='';new TextEncoder().encode(j).forEach(n=>b+=String.fromCharCode(n));return 'BD1.'+btoa(b).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'')+'.'+crc(j);}
function decode(code){
 const m=code.trim().match(/^BD1\.([A-Za-z0-9_-]+)\.([a-f0-9]{8})$/);if(!m||code.length>250000)throw Error('Nieprawidłowy format kodu BD1. Wklej cały kod.');
 let j;try{j=new TextDecoder('utf-8',{fatal:true}).decode(Uint8Array.from(atob(m[1].replace(/-/g,'+').replace(/_/g,'/')),c=>c.charCodeAt(0)));}catch{throw Error('Nie można odczytać kodu.');}
 if(crc(j)!==m[2])throw Error('Kod jest uszkodzony lub niekompletny (suma kontrolna).');return validate(JSON.parse(j));
}
function reportText(s){
 const p=byId(s.program),sc=scores(s);
 const out=['ZLECENIE DLA DORADCY · '+DATA.version,p.name,'Sesja: '+s.session,'Stan: '+(s.complete?'ukończona':'w toku'),`Pierwsze wybory: ${sc.first}/6. Ostatnie sprawdzone: ${sc.last}/6. Sprawdzono: ${sc.checked}/6.`,
 'Wynik pytań nie jest oceną notatek ani samodzielnego opanowania. Pomoc nie obniża wyniku. Dane scenariusza są fikcyjne.','',
 'MATERIAŁY A',...p.a.flatMap(([h,t])=>[h,t,'']),...(s.unlocked>=6?['MATERIAŁY B',...p.b.flatMap(([h,t])=>[h,t,''])]:[]),
 'NOTATKA A'+(s.lockedA?' · zachowana przed materiałem B':' · szkic'),...DATA.noteA.flatMap(f=>[f.label,s.noteA[f.id]||'[puste]','']),
 'BRIEF B',...DATA.noteB.flatMap(f=>[f.label,s.noteB[f.id]||'[puste]','']),
 'DECYZJE I INFORMACJA ZWROTNA'];
 p.questions.forEach((q,i)=>{const a=s.answers[i];out.push(`\n${i+1}. ${q.title}\n${q.prompt}`,`Pomoc przed pierwszym wyborem: ${a.helpBefore?'tak':'nie'}; liczba różnych kolejnych sprawdzeń: ${a.history.length}.`);a.history.forEach((h,j)=>out.push(`${j===0?'Pierwszy wybór':'Kolejny wybór'}: ${q.options.find(o=>o.id===h.choice).text}`));if(a.history.length){out.push('Odpowiedź uzasadniona: '+q.options.find(o=>o.id===q.correct).text,'Podstawa: '+q.basis,'Pułapka: '+q.pitfall,'Sposób poprawy: '+q.remedy);q.options.forEach(o=>out.push(o.text+' → '+o.why));}else out.push('[jeszcze niesprawdzone]');});
 out.push('\nPLAN DOWODÓW',...p.evidence.map(([h,t])=>h+': '+t),'\nNASTĘPNY KROK: KONSTRUOWANIE ALTERNATYW',p.bridge,
 'Na następne zajęcia przygotuj kilka kierunków działania wynikających z definicji i dowodów. Uwzględnij kontynuację obecnych działań i trendów. Dla każdego: adresat → działanie → mechanizm → spodziewany wynik → potrzebny dowód. Określ, które działania się wykluczają, a które można połączyć. Na tym etapie nie wybieraj zwycięzcy.',
 '\nŹRÓDŁA',DATA.sources,DATA.reading);
 return out.join('\n');
}
function download(name,content,type='text/plain;charset=utf-8'){

}

let s=null, program='GPA',home=true,storageOK=true;
const KEY='bardach-advisor-v1-';

function shell(body){
 $('app').innerHTML=`<div class="layout"><aside><nav aria-label="Etapy gry"><ol class="steps">${labels.map((l,i)=>`<li><button data-stage="${i}" ${!s||i>s.unlocked?'disabled':''} ${!home&&s?.stage===i?'aria-current="step"':''}><span class="step-n">${i+1}</span><span class="step-name">${l}</span></button></li>`).join('')}</ol><div class="storage" id="storage"></div><div class="toolbar"><button id="backup" ${!s?'disabled':''}>Zapis JSON</button><button id="import">Wczytaj zapis</button></div></nav></aside><main id="main" class="main" tabindex="-1">${body}<div id="message" role="status" aria-live="polite"></div><div class="footer">Gra 1.0 · niezależny doradca · pięć programów<br>Wszystkie liczby, zlecenia i wypowiedzi w grze są fikcyjne. Nie są wynikami badań rzeczywistych programów.<details><summary>Podstawa merytoryczna</summary><div class="inside">${esc(DATA.sources)}<p><a href="${DATA.reading}" target="_blank" rel="noopener">Lektura: Bardach, kroki 1 i 2 (PDF)</a></p><p>Zapowiedź alternatyw oparta także na rozdziale 3 podręcznika, s. 21–25. Nie wymaga dodatkowej odpowiedzi w tej rozgrywce.</p></div></details></div></main></div>`;
 document.querySelectorAll('[data-stage]').forEach(b=>b.onclick=()=>{s.stage=+b.dataset.stage;home=false;save();render();});

function render(){
 const p=byId(program);$('program-label').textContent=home?'Bardach · kroki 1 i 2':p.short;
 if(home){const existing=load(program);s=existing;
 shell(`<section class="card hero"><span class="eyebrow">Pracownia analizy polityki publicznej</span><h1>Zlecenie<br>dla doradcy</h1><p class="lead">Przygotuj diagnozę, na której można oprzeć decyzję. Nazwij problem, oceń dowody i uzasadnij, czego trzeba dowiedzieć się dalej.</p><div class="flow"><div><strong>01 · Problem</strong>Co wymaga poprawy?</div><div><strong>02 · Dowody</strong>Skąd to wiemy?</div><div class="future"><strong>Potem: alternatywy</strong>Jak można działać?</div></div><div class="hero-grid"><div><label class="label" for="program">Wybierz program swojego zespołu</label><select id="program">${DATA.programs.map(x=>`<option value="${x.id}" ${x.id===program?'selected':''}>${esc(x.name)}</option>`).join('')}</select><p class="meta">Orientacyjnie 35–45 minut po lekturze; czas do sprawdzenia w pilotażu. Pracuj indywidualnie, a raport przynieś na ćwiczenia.</p><div class="actions"><button class="primary" id="start">${existing?'Wznów pracę':'Przyjmij zlecenie'}</button>${existing?'<button id="new">Nowa rozgrywka</button>':''}</div></div><div class="notice"><strong>Lektura przed grą</strong><p>Bardach i Patashnik, kroki 1 i 2. Możesz wracać do tekstu i słowniczka przez całą grę.</p><a href="${DATA.reading}" target="_blank" rel="noopener">Otwórz udostępniony PDF ↗</a></div></div></section><section class="card"><h2>Twoja rola i rezultat pracy</h2><p>Jesteś niezależnym doradcą decydenta. Uwzględniasz jego cel i ograniczenia, a diagnozę i pomysły oceniasz na podstawie dowodów. Niezależność nie wymaga automatycznego sprzeciwu. Decyzję podejmuje zleceniodawca.</p><div class="two"><div><h3>Zmiana perspektywy</h3><p>W poprzedniej części wyjaśnialiście proces polityki: role aktorów, przekonań i narracji. Teraz przygotowujesz wiedzę potrzebną do działania: co jest problemem i co można o nim rzetelnie stwierdzić.</p></div><div><h3>Problem → przyczyny → program</h3><p>Punktem wyjścia jest stan wymagający poprawy. Przyczyny wyjaśniają jego powstawanie. Program ma zmieniać wybrane warunki lub zachowania. Jego słabe działanie może być osobnym przedmiotem diagnozy, ale nie zastępuje problemu publicznego.</p></div></div><p>Gdy zlecenie dotyczy ewaluacji, problemem analitycznym może być niepewność co do działania programu (Bardach, s. 6). W tej grze najpierw rozpoznajesz problem publiczny i dopiero wiążesz go z programem.</p><h3>Jak pracować</h3><ol><li>Podejmij trzy decyzje i zapisz notatkę A.</li><li>Wybierz dowody, przeczytaj nowy materiał B i rozwiąż kolejne zadania.</li><li>Napisz brief B, porównując go z notatką A. Pobierz raport i JSON, a wynik oddaj przez formularz dostępny w zakończeniu gry.</li></ol><p>Po każdej zamkniętej odpowiedzi zobaczysz uzasadnienie, podstawę w materiale, pułapkę i sposób poprawy. Możesz poprawić wybór lub iść dalej. Pierwszy wybór pozostaje w raporcie; pomoc nie obniża wyniku. Notatki ocenia człowiek, nie automat. Nie ma rankingu ani limitu czasu.</p><div class="notice warn">Nazwy programów są rzeczywiste. Materiały gry są fikcyjnym ćwiczeniem metody; w projekcie zastąpisz je autentycznymi źródłami.</div></section>`);
 $('program').onchange=e=>{program=e.target.value;render();};
 $('start').onclick=()=>{s=existing||fresh(program);home=false;save();render();};
 if($('new'))$('new').onclick=()=>newRun();
 }else if(s.stage===0){
 shell(`<section class="card"><span class="eyebrow">Twoje zlecenie · ${esc(p.short)}</span><h1>Za pięć dni:<br>brief dla decydenta</h1><p class="meta">Zleceniodawca: ${esc(p.client)}</p><blockquote>${esc(p.mandate)}</blockquote><p>Pięć dni to termin w fikcyjnym zleceniu, nie zegar gry. Wybieraj dane według pytania, wartości, kosztu i czasu dostępności. Czas pracy analityka i czas oczekiwania na dane to różne ograniczenia; zapytania można rozpoczynać równolegle.</p><div class="notice">Na tym etapie rezultatem jest diagnoza i plan dowodów. Wybór konkretnego działania wymaga kolejnych kroków analizy.</div><p>W każdej decyzji wybierz jedną odpowiedź najlepiej uzasadnioną w podanych warunkach. Zwracaj uwagę na zakres zlecenia i materiał, nie na samo brzmienie odpowiedzi.</p><div class="actions"><button class="primary" id="begin">Otwórz materiały i pierwszą decyzję</button></div></section>`);$('begin').onclick=()=>advance();
 }else if(qAt[s.stage]!==undefined){question(qAt[s.stage]);}
 else if(s.stage===4){note('A');}
 else if(s.stage===8){note('B');}
 else {finish();}
 if(innerWidth<=850)document.querySelector('[aria-current="step"]')?.scrollIntoView({block:'nearest',inline:'center'});
 $('main')?.focus({preventScroll:true});window.scrollTo(0,0);
}
function advance(){s.stage=Math.min(9,s.stage+1);s.unlocked=Math.max(s.unlocked,s.stage);if(s.stage===9)s.complete=true;save();render();}
function question(i){
 const p=byId(program),q=p.questions[i],a=s.answers[i];
 shell(`<section class="card"><div class="meta">Decyzja ${i+1} z 6 · ${i<3?'Definiowanie problemu':'Gromadzenie dowodów'}</div><h2>${esc(q.title)}</h2>${sourcePanel()}<fieldset><legend>${esc(q.prompt)}</legend>${a.order.map((id,j)=>{const o=q.options.find(o=>o.id===id);return `<label class="option"><input type="radio" name="answer" value="${id}" ${a.selected===id?'checked':''}><span><span class="letter">${'ABC'[j]}.</span>${esc(o.text)}</span></label>`;}).join('')}</fieldset><div class="actions"><button class="primary" id="check">Sprawdź odpowiedź</button><button id="hint">Wskazówka</button></div><div id="hint-box" ${a.help?'':'hidden'} class="notice">${esc(q.hint)} Pomoc nie obniża wyniku.</div><div id="feedback" aria-live="polite"></div><div class="actions"><button id="next" class="primary">${s.stage===3?'Przejdź do notatki A':s.stage===5?'Otwórz materiał B':s.stage===7?'Przejdź do briefu B':'Następna decyzja'}</button></div><small id="next-help"></small></section>`);
 document.querySelectorAll('input[name=answer]').forEach(r=>r.onchange=()=>{a.selected=r.value;save();feedback(i);});
 $('check').onclick=()=>{if(!a.selected){status('Wybierz odpowiedź, a następnie ją sprawdź.',true);return;}if(a.history.at(-1)?.choice!==a.selected){if(!a.history.length)a.helpBefore=a.help;a.history.push({choice:a.selected,at:new Date().toISOString()});}save();feedback(i);$('feedback').scrollIntoView({block:'nearest',behavior:'smooth'});};
 $('hint').onclick=()=>{a.help=true;$('hint-box').hidden=false;save();};
 $('next').onclick=()=>{if(!a.history.length||a.history.at(-1).choice!==a.selected){status('Sprawdź aktualnie zaznaczoną odpowiedź przed przejściem dalej.',true);return;}advance();};feedback(i);
}
function feedback(i){
 const q=byId(program).questions[i],a=s.answers[i],last=a.history.at(-1),checked=last&&last.choice===a.selected;
 $('next').disabled=!checked;$('next-help').textContent=checked?'Możesz poprawić wybór albo przejść dalej. Nie trzeba uzyskać 6/6.':'Przejście dalej jest dostępne po sprawdzeniu aktualnego wyboru.';
 if(!last){$('feedback').innerHTML='';return;}
 if(!checked){$('feedback').innerHTML='<p class="notice warn">Zaznaczono nową odpowiedź. Sprawdź ją, aby zapisać poprawkę. Poprzedni sprawdzony wybór pozostaje w historii.</p>';return;}
 const o=q.options.find(o=>o.id===last.choice),ok=last.choice===q.correct;
 $('feedback').innerHTML=`<section class="feedback ${ok?'':'bad'}"><h3>${ok?'Wniosek uzasadniony':'Sprawdź zakres tego wniosku'}</h3><p>${esc(o.why)}</p><dl><dt>Podstawa w materiale</dt><dd>${esc(q.basis)}</dd><dt>Pułapka · pitfall</dt><dd>${esc(q.pitfall)}</dd><dt>Sposób poprawy · remedy</dt><dd>${esc(q.remedy)}</dd></dl><p class="source">Bardach i Patashnik, s. ${esc(q.pages)}. Wyjaśnienie jest zastosowaniem do fikcyjnego scenariusza.</p><details><summary>Porównaj uzasadnienia wszystkich opcji</summary><div class="inside">${a.order.map(id=>{const x=q.options.find(o=>o.id===id);return `<p><strong>${esc(x.text)}</strong><br>${esc(x.why)}</p>`;}).join('')}</div></details><small>Pierwszy wybór zachowany. Sprawdzenia różnych kolejnych wyborów: ${a.history.length}.</small></section>`;
}
function note(which){
 const fields=which==='A'?DATA.noteA:DATA.noteB,obj=which==='A'?s.noteA:s.noteB,locked=which==='A'&&s.lockedA;
 shell(`<section class="card"><div class="meta">${which==='A'?'Przed nowymi dowodami':'Po nowych dowodach'}</div><h2>${which==='A'?'Notatka A · robocza diagnoza':'Brief B · diagnoza dla decydenta'}</h2><p>${which==='A'?'Zapisz własną diagnozę na podstawie materiału A i dotychczasowej informacji zwrotnej. Po przejściu dalej ta wersja pozostanie niezmienna, aby móc porównać ją z briefem B.':'Napisz krótką notatkę dla osoby podejmującej decyzję. Uzasadnij zmianę lub podtrzymanie diagnozy. Powołuj się na oznaczenia A1–A3 i B1–B3; nie przepisuj całych materiałów.'}</p><p class="meta">W każdym polu wystarczą 1–3 zdania. Liczy się jasne uzasadnienie; liczba słów nie jest punktowana. Wypełnij każde pole. Automat sprawdza tylko obecność tekstu, a treść ocenia prowadzący.</p>${sourcePanel()}${which==='B'?`<details><summary>Porównaj z zachowaną notatką A</summary><div class="inside">${DATA.noteA.map(f=>`<h3>${esc(f.label)}</h3><p class="note-read">${esc(s.noteA[f.id])}</p>`).join('')}</div></details>`:''}${locked?'<p class="notice">Notatka A jest zachowana. Rewizję zapisujesz w briefie B.</p>':''}<form id="note-form">${fields.map(f=>`<div class="field"><label for="note-${f.id}">${esc(f.label)}</label><p class="prompt" id="prompt-${f.id}">${esc(f.prompt)}</p>${locked?`<p class="note-read">${esc(obj[f.id])}</p>`:`<textarea id="note-${f.id}" name="${f.id}" maxlength="2500" aria-describedby="prompt-${f.id} count-${f.id}" required>${esc(obj[f.id])}</textarea><small id="count-${f.id}" class="counts">${obj[f.id].length}/2500 znaków · limit techniczny</small><details><summary>Jak sformułować odpowiedź?</summary><div class="inside">${esc(f.helper)}</div></details>`}</div>`).join('')}<div class="actions"><button type="submit" class="primary">${which==='A'?(locked?'Wróć do wyboru dowodów':'Zachowaj A i przejdź do dowodów'):'Zapisz brief i zakończ rozgrywkę'}</button></div></form></section>`);
 if(!locked)fields.forEach(f=>$('note-'+f.id).oninput=e=>{obj[f.id]=e.target.value;if(which==='B'&&s.complete){s.complete=false;s.unlocked=8;}$('count-'+f.id).textContent=obj[f.id].length+'/2500 znaków · limit techniczny';save();});
 $('note-form').onsubmit=e=>{e.preventDefault();const missing=fields.find(f=>!obj[f.id].trim());if(missing){status('Uzupełnij pole: '+missing.label,true);$('note-'+missing.id)?.focus();return;}if(which==='A')s.lockedA=true;advance();};
}
function finish(){
 const p=byId(program),sc=scores(s);
 shell(`<section class="card"><span class="eyebrow">Brief gotowy · analiza trwa dalej</span><h1>Od diagnozy<br>do alternatyw</h1><p>Masz roboczą definicję, rozróżnienie ustaleń i hipotez oraz plan dowodów. Następnym zadaniem będzie <strong>konstruowanie alternatyw</strong>: różnych sposobów zmniejszenia problemu.</p><div class="flow"><div><strong>Twoja definicja</strong>Stan, grupa i standard</div><div><strong>Twoje dowody</strong>Przyczyny i niepewność</div><div class="future"><strong>Możliwe działania</strong>Różne mechanizmy poprawy</div></div><p>${esc(p.bridge)}</p><h2>Na następne zadanie</h2><ol><li>Przenieś diagnozę na rzeczywisty program i zastąp fikcyjne dane autentycznymi źródłami.</li><li>Zbuduj wstępną, szeroką listę działań. Uwzględnij kontynuację obecnych działań i trendów — sytuacja bez nowej decyzji także się zmienia.</li><li>Dla każdego wariantu zapisz: <strong>adresat → działanie → mechanizm → spodziewany wynik → potrzebny dowód</strong>.</li><li>Wskaż, które działania można łączyć, a które się wykluczają. Zawężanie listy i wybór wymagają dalszej analizy.</li></ol><p class="meta">Zapowiedź kroku 3, Bardach i Patashnik, s. 21–25. W tej grze nie musisz już wpisywać alternatyw.</p></section><section class="card"><h2>Co pokazuje rozgrywka</h2><div class="score-row"><div class="score"><b>${sc.first}/6</b>Pierwsze sprawdzone wybory</div><div class="score"><b>${sc.last}/6</b>Ostatnie sprawdzone wybory</div></div><p class="meta">Wynik po korektach pokazuje pracę z informacją zwrotną. Nie jest samodzielnym pomiarem opanowania metody. Notatki A i B wymagają oceny prowadzącego.</p><details><summary>Kryteria rozmowy o Twoim briefie</summary><div class="inside"><ul><li>Czy definicja ma stan, grupę, zakres i jawny standard?</li><li>Czy odróżniasz ustalenie, hipotezę i rolę programu?</li><li>Czy dobierasz dane do pytania i wskazujesz granicę wniosku?</li><li>Czy uzasadniasz rewizję lub podtrzymanie notatki konkretnym materiałem?</li></ul></div></details><div class="actions"><button class="primary" id="txt">Pobierz raport TXT</button><button id="print">Drukuj / zapisz PDF</button><button id="show-report">Czytaj raport</button></div><section class="notice" aria-labelledby="submit-title"><h2 id="submit-title">Oddaj wynik gry</h2><p>Formularz zapisze Twoje wybory, notatkę A i brief B zawarte w kodzie. Zaloguj się na konto UW; formularz zbiera zweryfikowany adres e-mail.</p><ol><li><strong>Skopiuj kod</strong> przyciskiem poniżej.</li><li><strong>Otwórz formularz</strong> i wklej cały kod do pola „Kod rozgrywki BD1”.</li><li>Podaj numer zespołu oraz jedno pytanie lub trudność. Kliknij <strong>Prześlij</strong> i poczekaj na komunikat „Wynik gry został zapisany”.</li></ol><div class="actions"><button id="copy" class="primary">1. Kopiuj kod</button><a id="submit-form" class="button" href="${DATA.formUrl}" target="_blank" rel="noopener">2. Otwórz formularz ↗</a></div><p id="copy-status" role="status" aria-live="polite"></p><p class="meta">Samo skopiowanie kodu lub otwarcie formularza nie oddaje pracy. Nie trzeba uzyskać 6/6. Po poprawieniu gry skopiuj nowy kod i prześlij go ponownie. Zachowaj także raport i JSON.</p><details id="submission-code"><summary>Pokaż pełny kod lub pobierz go jako TXT</summary><div class="inside"><label for="code" class="sr-only">Pełny kod rozgrywki</label><textarea id="code" class="code" readonly>${encode(s)}</textarea><div class="actions"><button id="code-download">Pobierz kod TXT</button></div><small>Kod służy przeniesieniu pracy. Nie potwierdza samodzielności.</small></div></details></section><div id="report-content" hidden><pre class="report">${esc(reportText(s))}</pre></div></section><section class="card"><h2>Dane do rzeczywistej analizy programu</h2><p>Użyj tej mapy na ćwiczeniach. To propozycje źródeł i pytań, nie ustalone wyniki.</p><div class="evidence">${p.evidence.map(([h,t])=>`<div><strong>${esc(h)}</strong>${esc(t)}</div>`).join('')}</div></section>`);
 $('txt').onclick=()=>download('Bardach_'+program+'_raport.txt',reportText(s));
 $('print').onclick=()=>{$('print-report').textContent=reportText(s);window.print();};
 $('show-report').onclick=()=>{$('report-content').hidden=!$('report-content').hidden;};
 $('copy').onclick=async()=>{try{await navigator.clipboard.writeText(encode(s));$('copy-status').textContent='Kod skopiowany. Teraz otwórz formularz i wklej go do pola Kod rozgrywki BD1.';}catch{$('submission-code').open=true;$('code').focus();$('code').select();$('copy-status').textContent='Kod zaznaczony. Skopiuj go skrótem Ctrl+C (⌘C na Macu) lub pobierz plik TXT, a potem otwórz formularz.';}};
 $('code-download').onclick=()=>download('Bardach_'+program+'_kod.txt',encode(s));
}
function newRun(){
 $('confirm-body').innerHTML='<h2>Nowa rozgrywka</h2><p>Nowy zapis zastąpi bieżący zapis tego programu w tej przeglądarce. Najpierw możesz pobrać JSON obecnej pracy.</p><div class="actions"><button id="save-old">Pobierz dotychczasowy JSON</button><button id="confirm-new" class="primary">Rozpocznij nową</button><button id="cancel-new">Zachowaj obecną</button></div>';
 $('confirm').showModal();$('save-old').onclick=()=>download('Bardach_'+program+'_poprzedni.json',JSON.stringify(s,null,2),'application/json');$('cancel-new').onclick=()=>$('confirm').close();$('confirm-new').onclick=()=>{$('confirm').close();s=fresh(program);home=false;save();render();};
}
function glossary(){
 $('glossary-name').textContent='Słowniczek · '+byId(program).short;
 $('term-search').value='';filterTerms('');$('glossary').showModal();$('term-search').focus();
}
function filterTerms(query){const needle=query.trim().toLocaleLowerCase('pl');const list=DATA.terms.filter(t=>(t.name+' '+t.en+' '+t.definition+' '+t.examples[program]).toLocaleLowerCase('pl').includes(needle));$('terms').innerHTML=`<p class="meta">${list.length} z 20 haseł. Wspólne pojęcia, przykłady dla Twojego programu. Dwa ostatnie hasła są pomocnicze; objaśnienia trafności rozwijają wskazówkę Bardacha o ocenie badań.</p>`+list.map(t=>`<article class="term"><h3>${esc(t.name)}</h3><div class="en">${esc(t.en)} · ${t.pages?'Bardach, s. '+esc(t.pages):'uzupełnienie dydaktyczne'}</div><p>${esc(t.definition)}</p><p class="example"><strong>${esc(byId(program).short)}:</strong> ${esc(t.examples[program])}</p></article>`).join('');}
async function importFile(file){
 if(!file)return;if(file.size>400000){status('Plik jest zbyt duży. Wybierz zapis JSON pobrany z gry.',true);return;}
 try{const candidate=validate(JSON.parse(await file.text()));
 $('confirm-body').innerHTML=`<h2>Wczytać zapis?</h2><p>${esc(byId(candidate.program).name)} · ${candidate.complete?'ukończona':'w toku'}. Zapis zastąpi bieżącą kopię tego programu w tej przeglądarce.</p><div class="actions"><button id="save-existing">Pobierz obecną kopię</button><button id="confirm-import" class="primary">Wczytaj ten zapis</button><button id="cancel-import">Anuluj</button></div>`;
 $('confirm').showModal();const old=load(candidate.program);$('save-existing').disabled=!old;$('save-existing').onclick=()=>download('Bardach_'+candidate.program+'_przed_importem.json',JSON.stringify(old,null,2),'application/json');$('cancel-import').onclick=()=>$('confirm').close();$('confirm-import').onclick=()=>{$('confirm').close();s=candidate;program=s.program;home=false;save();render();status('Zapis wczytany.');};
 }catch(e){status(e.message||'Nie można odczytać zapisu.',true);}
}
$('import-file').onchange=e=>{importFile(e.target.files[0]);e.target.value='';};
$('glossary-button').onclick=glossary;$('glossary-close').onclick=()=>$('glossary').close();$('term-search').oninput=e=>filterTerms(e.target.value);
$('glossary').onkeydown=e=>{if(e.key==='Escape'){e.preventDefault();$('glossary').close();}};
$('home-button').onclick=()=>{save();home=true;render();};
try{const last=localStorage.getItem(KEY+'last');if(byId(last))program=last;}catch{storageOK=false;}
render();
</script></body></html>
